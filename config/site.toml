# Absolute URL of the site's own domain (a custom domain of the Pages
# project; see docs/deploy.md). It makes the language links and the
# canonical link of every page absolute and keeps search engines off
# <pages_project>.pages.dev, which keeps serving the same files. Empty: the
# site is known only by its pages.dev address and links stay relative.
base_url = "https://volebnamapa.sk"
# The source code repository, linked from the About dialog.
repository = "https://github.com/pbasista/election-map-slovakia"
# Cloudflare Pages project that `release.yml` uploads dist/ to, and `ems
# results deploy` on an election night (docs/results.md).
pages_project = "election-map-slovakia"
# Election day of the 2026 municipal and regional elections.
election = 2026-10-24
# The polls' opening hours that day, Slovak time (decision of the Speaker of
# the National Council no. 145/2026 Coll.; https://www.minv.sk/?volby-samosprava26).
# The search card shows the voting under way between them.
polls_open = 07:00:00
polls_close = 20:00:00
# Whether the app polls the results, i.e. reads them every minute for
# live_days: on for an election night and the days after, off once the
# final results are built into the site and nothing changes any more. Off,
# the app reads them once per page load. Built with EMS_RESULTS_ANYTIME=1
# (for testing), it polls at any time either way.
live = false
# Days after the polls close that the app reads the results every minute
# (dist/results/<election>/status.json, written by `ems results` and the
# results step of `ems make`; docs/results.md). Before the polls close it
# reads nothing; after these days, once per page load, so that a copy of
# the site left open or cached stops polling.
live_days = 7
# Cloudflare Pages allows 20,000 files per deployment on the Free plan
# (https://developers.cloudflare.com/pages/platform/limits/, checked
# 2026-10-18); `check` fails above this, leaving headroom for files added
# outside the build.
file_budget = 19000
# Cloudflare Pages per-file limit: 25 MiB (same page).
max_file_bytes = 26214400
# Images larger than this (512 KiB) are left out of cached copies and keep
# only their link, so a few photo-heavy pages cannot dominate the repository.
cache_image_max_bytes = 524288
