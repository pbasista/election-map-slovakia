# Absolute URL of the site's own domain (a custom domain of the Pages
# project; see docs/deploy.md). It makes the language links and the
# canonical link of every page absolute and keeps search engines off
# <pages_project>.pages.dev, which keeps serving the same files. Empty: the
# site is known only by its pages.dev address and links stay relative.
base_url = "https://volebnamapa.sk"
# The source code repository, linked from the About dialog.
repository = "https://github.com/pbasista/election-map-slovakia"
# Cloudflare Pages project of the app, which `release.yml` deploys
# (docs/deploy.md).
pages_project = "election-map-slovakia"
# The projects of the data parts (src/election_map_slovakia/bundle.py):
# each election's map (geometry, base map, addresses) and its data
# (candidates, research, occupations, About) in projects of their own,
# {slug} its slug; the cached copies of the pages research cites; the
# results, which `ems results deploy` updates on an election night
# (docs/results.md). A release deploys a data part only when its key
# (data/published.toml) is not deployed yet.
map_project = "ems-map-{slug}"
data_project = "ems-data-{slug}"
sources_project = "ems-sources"
results_project = "ems-results"
# The own domains of the sources and results projects: the app links the
# cached copies there and fetches the results from there. A bundle is
# known by the address of the deployment that carries its key instead
# (docs/deploy.md).
sources_url = "https://sources.volebnamapa.sk"
results_url = "https://results.volebnamapa.sk"
# Cloudflare Pages allows 20,000 files per deployment on the Free plan
# (https://developers.cloudflare.com/pages/platform/limits/, checked
# 2026-10-18); `check` fails above this, leaving headroom for files added
# outside the build.
file_budget = 19000
# Cloudflare Pages per-file limit: 25 MiB (same page).
max_file_bytes = 26214400
# Images larger than this (512 KiB) are left out of cached copies and keep
# only their link, so a few photo-heavy pages cannot dominate the repository.
cache_image_max_bytes = 524288
