# Inputs that `ems fetch` downloads to data/raw/<name>/<file>: the official
# election and boundary files, and the country borders around Slovakia.
# A future election only edits this file.
#
# kind decides the integrity check:
#   xlsx  a zip with xl/worksheets/; rows per worksheet are reported
#   zip   a zip containing every name in `members`
#   csv   rows are counted; a drop of more than 1 % against the previous
#         download is rejected unless --force; `expect` = start of the header
#   pdf   starts with %PDF
#   html  UTF-8 text containing `expect`; `volatile` is a regex for parts that
#         differ between otherwise identical responses, ignored when deciding
#         whether the page changed
#   geojson  a GeoJSON FeatureCollection with at least one feature
#
# `sha256`, for any kind, pins the file's digest: for a release that never
# changes, any other content is rejected. When the server of a pinned input
# fails, `ems fetch` takes a copy with that digest, on disk or committed in
# data/fallback/<name>/<file> (with its entry in data/fallback/manifest.json).
#
# `optional = true` marks an input no step reads, kept as a record of a
# source: if it fails, `ems fetch` warns and still succeeds, so a release
# does not stop on it. A step that reads one fails.

# Named in the User-Agent so server operators can reach us: the repository,
# where they can open an issue.
contact = "https://github.com/pbasista/election-map-slovakia"

# Extra CA certificates (relative to this directory) for servers that do not
# send their intermediate certificate. Each still has to chain to a system
# root.
#   www.bbsk.sk omits GeoTrust TLS RSA CA G1; www.karlovaves.sk (a council
#   obvod document) omits RapidSSL TLS RSA CA G1.
ca_certificates = [
    "certs/geotrust-tls-rsa-ca-g1.pem",
    "certs/rapidssl-tls-rsa-ca-g1.pem",
]

# Candidate lists, MV SR: https://www.minv.sk/?samosprava26-info10

[input.candidates-starosta]
url = "https://www.minv.sk/swift_data/source/verejna_sprava/volby_a_referendum/150_oso/OSO26_ZZK-Starosta.xlsx"
