# Inputs that `ems fetch` downloads to data/raw/<name>/<file>: the official
# election and boundary files, and the country borders around Slovakia.
# Which steps read them for which election is in elections.toml: a future
# election adds its inputs here and names them there.
#
# An input's name ends in the year its data are of (for an election's own
# files, the election's year: candidates-oz-2026, zbgis-0-2026), so a later
# election adds inputs beside them without renaming any.
#
# kind decides the integrity check:
#   xlsx  a zip with xl/worksheets/; rows per worksheet are reported
#   zip   a zip containing every name in `members`
#   csv   rows are counted; a drop of more than 1 % against the previous
#         download is rejected unless --force; `expect` = start of the header
#   pdf   starts with %PDF
#   html  UTF-8 text containing `expect`; `volatile` is a regex for parts that
#         differ between otherwise identical responses, ignored when deciding
#         whether the page changed
#   geojson  a GeoJSON FeatureCollection with at least one feature
#   pbf   an OpenStreetMap PBF file, starting with its OSMHeader block
#
# `sha256` pins the file's digest, and `retrieved` the day that file was
# downloaded (About names it); `ems inputs update` writes both. Any other
# content is rejected. Every input is pinned, so that every machine builds
# an election from the same files and the published data can be told
# current from the repository alone (`ems data lock`, docs/deploy.md).
# `ems fetch` takes a pinned file from data/raw/ where it is there, else
# from the store below, else from its source.
#
# `optional = true` marks an input no step reads, kept as a record of a
# source: if it fails, `ems fetch` warns and still succeeds, so a release
# does not stop on it. A step that reads one fails.
#
# `as_of` (YYYY-MM-DD or YYYY-MM) is the date the data are of, for an input
# of an earlier election shown on its pages (the map's credits and About):
# the base maps' extracts of 2019, 2022 and 2024, and the address register
# of 2022.

# Named in the User-Agent so server operators can reach us: the repository,
# where they can open an issue.
contact = "https://github.com/pbasista/election-map-slovakia"

# Extra CA certificates (relative to this directory) for servers that do not
# send their intermediate certificate. Each still has to chain to a system
# root.
#   www.bbsk.sk omits GeoTrust TLS RSA CA G1; www.karlovaves.sk (a council
#   obvod document) omits RapidSSL TLS RSA CA G1.
ca_certificates = [
    "certs/geotrust-tls-rsa-ca-g1.pem",
    "certs/rapidssl-tls-rsa-ca-g1.pem",
]

# The store of the pinned files: the release `release` of the repository
# `repository`, the project's own, whose assets are named <sha256>-<file>
# and never replaced. A pre-release, so that it never shows as the latest
# release, and its tag is no version (v*), so that it deploys nothing.
# `ems inputs publish` uploads the pinned files it lacks; anyone downloads
# them without logging in.
[store]
repository = "pbasista/election-map-slovakia"
release = "inputs"

