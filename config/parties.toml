# Political parties of the candidate lists, for compact candidate rows.
#
# Keys are the party names exactly as the candidate lists write them (the
# source capitalisation is mangled, e.g. "Kdh - kresťanskodemokratické hnutie");
# `build` fails when a 2026 candidacy names a party missing here.
#   short         form Slovak media use; small parties without an established
#                 abbreviation get their first word(s), never an invented acronym;
#                 unique, as a shared link's candidate filter names parties by it
#   name          official name as in the Ministry of Interior's register,
#                 https://rez.vs.minv.sk/PolitickeStrany/Vyber?full=1 (checked
#                 2026-10-19), spelled exactly as registered
#   logo          optional file in web/img/parties/; only with a license that
#                 allows redistribution on a public site, and then with
#   logo_source   the page the file was taken from
#   logo_license  its license (and author where it requires attribution)
#
# Logo files are reduced copies for 16-20 px rows: SVGs minified (editor
# metadata dropped, coordinates rounded), cropped to the party's symbol where
# noted; raster images cropped and scaled to 40 px height as WebP.

