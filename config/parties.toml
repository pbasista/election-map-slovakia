# Political parties of the candidate lists, for compact candidate rows.
#
# Keys are the party names exactly as the candidate lists write them (the
# MV SR lists of 2026 mangle their capitalisation, e.g. "Kdh -
# kresťanskodemokratické hnutie"; ŠÚ SR's tables of 2022 do not), so one
# party can have an entry per election; `build` fails when a candidacy
# names a party missing here.
#   short         form Slovak media use; small parties without an established
#                 abbreviation get their first word(s), never an invented
#                 acronym; the same for every entry of one party, and
#                 unique among the parties of an election (`build` checks),
#                 as a shared link's candidate filter names parties by it
#   name          official name as in the Ministry of Interior's register,
#                 https://rez.vs.minv.sk/PolitickeStrany/Vyber?full=1 (checked
#                 2026-10-19), spelled exactly as registered
#
# and, in a table [party."…".logo.<slug>] per election (its slug in
# elections.toml), the party's logo as it was at that election, which its
# pages show; parties change their logos, so each is of its election, and
# a party without one for an election is shown by its short form there:
#   file          a file in web/img/parties/; only with a license that allows
#                 redistribution on a public site, and then with
#   source        the page the file was taken from (for an earlier version
#                 of a Commons file, that version)
#   license       its license (and author where it requires attribution)
#
# Logo files are reduced copies for 16-20 px rows: SVGs minified (editor
# metadata dropped, coordinates rounded), cropped to the party's symbol where
# noted; raster images cropped and scaled to 40 px height as WebP. A logo
# that an election's party used no longer is named <file>-<slug>.

