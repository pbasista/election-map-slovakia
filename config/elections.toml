# The referendums since 2019, ŠÚ SR's packages (inputs.toml). As every
# election before 2026, drawn on the 2026 boundaries (boundaries.toml in
# their curated data compares those of the nearest surviving date); the
# OpenStreetMap extract of their year, the address register nearest them.

[election.2023-referendum]
day = 2023-01-21
kind = "referendum"
# Decision of the President no. 362/2022 Coll.; polls 7:00
# to 22:00 (Act No. 180/2014 Coll.)
polls_open = 07:00:00
polls_close = 22:00:00
live = false
live_days = 7
addresses = "addresses-2022"
zbgis = ["zbgis-0-2026", "zbgis-1-2026", "zbgis-2-2026"]
osm = "osm-slovakia-2023"
records = ["zbgis-2022"]
# tab0c declares the COVID-19 special okrsky (Act No. 395/2022 Coll.;
# src/election_map_slovakia/special.py).
units = { format = "volbysr", input = "results-ref2023", table = "tab0b", special = "tab0c" }
results = { format = "volbysr", inputs = ["results-ref2023"] }
# As tab0a of the package words them.
questions = [
    "Súhlasíte s tým, že predčasné skončenie volebného obdobia Národnej rady Slovenskej republiky je možné uskutočniť referendom alebo uznesením Národnej rady Slovenskej republiky, a to zmenou Ústavy Slovenskej republiky tak, že: - v Čl. 73 ods. 1 sa na konci pripája čiarka a tieto slová: „ak v súlade s touto ústavou nedôjde k predčasnému skončeniu volebného obdobia Národnej rady Slovenskej republiky.“; - v Čl. 81a sa za písmeno a) vkladá nové písmeno b), ktoré znie: „b) predčasným skončením volebného obdobia,“. Doterajšie písmená b) až f) sa označujú ako písmená c) až g); - v Čl. 82 ods. 5 sa za slová „volebného obdobia“ vkladá čiarka a slová „predčasným skončením volebného obdobia“; - v Čl. 84 ods. 3 sa za slová „s medzinárodnou zmluvou podľa čl. 7 ods. 3 a 4“ vkladá čiarka a tieto slová: „na prijatie uznesenia o predčasnom skončení volebného obdobia Národnej rady Slovenskej republiky podľa čl. 86 písm. n)“; - v Čl. 86 sa dopĺňa písmeno n),ktoré znie: „n) uznášať sa na predčasnom skončení volebného obdobia Národnej rady Slovenskej republiky; prijaté uznesenie je všeobecne záväzné a vyhlasuje sa rovnako ako zákon.“; - v Čl. 93 ods. 2 sa na konci pripájajú tieto slová: „vrátane predčasného skončenia volebného obdobia Národnej rady Slovenskej republiky.“; - Čl. 98 odsek 2 znie: „Návrhy prijaté v referende vyhlási predseda Národnej rady Slovenskej republiky ako ústavný zákon.“?",
]

