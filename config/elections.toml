# The elections the site shows, one table each, named by the election's
# slug: its name in URLs, a digit (the year), then lowercase letters, digits
# and dashes: "2026" for regular elections, "<year>-<month>" for
# by-elections ("2026-03"), "<year>-<word>" for the others ("2024-prezident",
# "2023-referendum", "2023-nrsr", "2024-ep"). Each election has its own
# pages, /<lang>/<slug>/, its data bundle (the Pages project
# ems-data-<slug>, see site.toml) and results, /<day>/ of the results;
# its curated data in data/curated/elections/<day>/ and
# what the steps make of it in data/build/<day>/, so no two may share a
# day. The newest that is not a by-election is also shown at /<lang>/; the
# jobs and research work on the newest regular one, of which there must be
# one. Adding an election is adding a table here and the inputs it names
# to inputs.toml.
#
#   kind           the kind of election, as the list of elections groups
#                  them: "municipal-regional", the regular municipal and
#                  regional elections held together; "by-election",
#                  municipal (or regional) by-elections and new elections
#                  held on one day in some areas only; "presidential",
#                  "referendum", "parliament" (National Council) and
#                  "european" (European Parliament), country-wide
#   day            the election day (of a presidential election, round 1)
#   polls_open, polls_close
#                  the polls' opening hours that day, Slovak time; the
#                  search card shows the voting under way between them
#   live           whether the app reads the live results of the election
#                  night (live/<day>/, which `ems results poll --deploy`
#                  deploys) where the final results (results/<day>/, written
#                  by the results step of `ems make` from the `results`
#                  inputs) are not there yet, every minute for live_days: on
#                  for an election night and the days after, off once the
#                  final results are built into the site. Off, the app reads
#                  the final results alone, once per page load. Built with
#                  EMS_RESULTS_ANYTIME=1 (for testing), it reads the live
#                  results at any time either way.
#   live_days      days after the polls close that the app reads the results
#                  every minute (docs/results.md). Before the polls close it
#                  reads nothing; after these days, the final results once
#                  per page load, so that a copy of the site left open or
#                  cached stops polling.
#
# what only some kinds have:
#
#   second_round   (presidential, optional) the day of round 2, polls open
#                  the same hours; its contest exists once its candidate
#                  list does (`round2`, or round 2 in candidates.toml)
#   questions      (referendum) the questions' wording, in order, as the
#                  President's decision has them
#   seats          (parliament, european) the seats the body has: 150, EP 15
#   threshold      (parliament, european) % of the valid votes a party needs
#                  for seats, 5.0
#   coalition_thresholds
#                  (parliament, european, optional) [[parties, %], …], by
#                  ascending parties: what a coalition of at least that many
#                  parties needs instead, NR SR [[2, 7.0], [4, 10.0]]; a
#                  coalition is a ballot subject whose parties.toml entry has
#                  `members`
#   preferences    (parliament, european) how many candidates of the chosen
#                  list a voter may circle: NR SR 4, EP 2
#   preference_quota
#                  (parliament, european) % of its party's valid votes a
#                  candidate's preference votes must reach to move ahead of
#                  the list order: NR SR 3.0, EP 3.0 (Act No. 180/2014
#                  Coll. § 68 ods. 5, § 94 ods. 5)
#
# and the inputs (inputs.toml) its steps read:
#
#   candidates     the candidate lists (none for a referendum): `format`
#                  says which and how they are read
#                  (src/election_map_slovakia/lists.py); "mvsr" (regular)
#                  names the four lists of MV SR by contest kind: starosta,
#                  oz, predseda, zsk; "susr" (regular) the packages of ŠÚ
#                  SR's definitive results of the municipal (oso) and
#                  regional (osk) elections, whose tables list every
#                  candidate (src/election_map_slovakia/statoffice.py);
#                  "susr-by" (by-election) ŠÚ SR's `package` of a municipal
#                  by-election; "volbysr" ŠÚ SR's candidate tables, a table
#                  file or a package holding it: `round1` and optionally
#                  `round2` (presidential, tab0a), or `subjects` (tab0a, the
#                  parties) and `candidates` (tab0b, their lists)
#                  (parliament, european); "curated" (any but referendum)
#                  names nothing: the lists are
#                  data/curated/elections/<day>/candidates.toml
#   incumbents     (optional, regular elections only) the final results the
#                  office holders at the election are rebuilt from: those of
#                  the regular elections of `day` before (`municipal`,
#                  `regional`) and of every municipal by-election since
#                  (`by_elections`, in date order); see
#                  src/election_map_slovakia/incumbents.py. Without it the
#                  election is shown without office holders and without the
#                  candidates' turnouts of the elections before, whose
#                  results (`past`, docs/results.md) still give them where
#                  their okrsky match.
#   units          (optional but for regular elections) the territorial
#                  division (ŠÚ SR tab0dd), okrsky per obec: `input`, read
#                  as `format` says: "xlsx" the table alone, "susr" the
#                  table in the municipal package of ŠÚ SR, "volbysr" the
#                  table `table` of a country-wide election's package
#                  (presidential: tab0c in 2019, tab0b in 2024). Without it
#                  no okrsky are counted or drawn: the map stops at the
#                  obce. A country-wide election's okrsky are those of the
#                  regular elections where they provably match (`ems job
#                  reuse`, src/election_map_slovakia/reuse.py). `special`
#                  ("volbysr", optional): the package's table declaring
#                  special okrsky without territory, okres by okres
#                  (tab0c of the 2023 referendum, the COVID-19 special
#                  okrsky; src/election_map_slovakia/special.py, with
#                  data/curated/elections/<day>/special-okrsky.toml).
#   results        (optional) the definitive results: `inputs`, read as
#                  `format` says, none (or no `results`) until they are
#                  published (the results step of `ems make` reads them;
#                  until then the results stay as `ems results` left them):
#                  regular elections "volbysr", the CSV tables of volbysr.sk
#                  (2026 on), or "susr", the packages of 2022, oso then osk;
#                  by-elections "susr-by", the package; country-wide
#                  elections "volbysr", ŠÚ SR's national tables (packages or
#                  table files; presidential: round 1's, then round 2's)
#   addresses      the address register
#   zbgis          the administrative boundaries, levels of detail 0 to 2
#   osm            the OpenStreetMap extract of the base map
#   records        records of sources no step reads (optional inputs): the
#                  documents the regional obvody in
#                  data/curated/elections/<day>/obvody/ are transcribed
#                  from, the originals of data that stand in for the
#                  election's own

[election.2026]
day = 2026-10-24
kind = "municipal-regional"
# Decision of the Speaker of the National Council no. 145/2026 Coll.;
# https://www.minv.sk/?volby-samosprava26
polls_open = 07:00:00
polls_close = 20:00:00
live = false
live_days = 7
addresses = "addresses-2026"
zbgis = ["zbgis-0-2026", "zbgis-1-2026", "zbgis-2-2026"]
osm = "osm-slovakia-2026"
units = { format = "xlsx", input = "units-oso2026" }
results = { format = "volbysr", inputs = ["results-oso2026", "results-osk2026"] }
records = [
    "zsk-obvody-ba-2026",
    "zsk-obvody-tt-2026",
    "zsk-obvody-tn-2026",
    "zsk-obvody-nr-2026",
    "zsk-obvody-za-2026",
    "zsk-obvody-bb-2026",
    "zsk-obvody-po-2026",
    "zsk-obvody-ke-2026",
]

[election.2026.candidates]
format = "mvsr"
starosta = "candidates-starosta-2026"
oz = "candidates-oz-2026"
predseda = "candidates-predseda-2026"
zsk = "candidates-zsk-2026"
# What is held where: ŠÚ SR's territorial division ("Typ volieb").
units = "units-oso2026"

# By-elections as listed on
# https://volby.statistics.sk/oso/doplnkove2022/sk/index.html; there were
# no regional ones in the 2022–2026 term.
[election.2026.incumbents]
day = 2022-10-29
municipal = "results-oso2022"
regional = "results-osk2022"
by_elections = [
    { input = "results-oso202303", day = 2023-03-25 },
    { input = "results-oso202309", day = 2023-09-09 },
    { input = "results-oso202402", day = 2024-02-10 },
    { input = "results-oso202410", day = 2024-10-05 },
    { input = "results-oso202503", day = 2025-03-15 },
    { input = "results-oso202509", day = 2025-09-06 },
    { input = "results-oso202603", day = 2026-03-21 },
]

