<!DOCTYPE html>
<!-- App shell template: `ems build` writes one copy per language to
     /<lang>/index.html, filling the {{…}} placeholders (see build.py). -->
<!-- biome-ignore lint/a11y/useValidLang: the build writes a language code here -->
<html lang="{{lang}}" dir="{{dir}}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="referrer" content="no-referrer" />
    <title>{{title}}</title>
    <meta name="description" content="{{description}}" />
{{alternates}}{{canonical}}
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M8 1a5 5 0 0 0-5 5c0 4 5 9 5 9s5-5 5-9a5 5 0 0 0-5-5z' fill='%23c8324a'/%3E%3C/svg%3E" />
    <!-- The URLs are exactly those the app fetches (with the data version),
         or the browser would not use the preloaded responses. -->
    <link rel="preload" href="/i18n/{{lang}}.json?v={{data_version}}" as="fetch" crossorigin="anonymous" />
    <link rel="preload" href="/geo/index.json?v={{data_version}}" as="fetch" crossorigin="anonymous" />
    <link rel="preload" href="/geo/coarse.json?v={{data_version}}" as="fetch" crossorigin="anonymous" />
    <script src="{{assets}}/js/theme.js"></script>
    <link rel="stylesheet" href="{{vendor}}/leaflet/leaflet.css" />
    <link rel="stylesheet" href="{{assets}}/app.css" />
    <meta name="km-config" content="{{config}}" />
    <script defer src="{{vendor}}/leaflet/leaflet.js"></script>
    <script type="module" src="{{assets}}/js/app.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <!-- What the site offers, for visitors without JavaScript and the
         search engines that read the page without running it. -->
    <noscript><p class="noscript">{{noscript}}</p><p class="noscript">{{features}}</p></noscript>
  </body>
</html>
