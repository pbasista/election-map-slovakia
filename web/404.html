<!DOCTYPE html>
<!-- Not-found page template: `ems build` writes it to /404.html (see
     build.py). Cloudflare Pages answers every missing path with it and
     status 404; without it Pages would serve the root page with status 200,
     and a missing data file would arrive as HTML. -->
<html lang="sk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>404 · {{title}}</title>
    <link rel="icon" href="data:," />
  </head>
  <body>
    <h1>404</h1>
    <p>Táto stránka neexistuje. <a href="/">{{title}}</a></p>
    <p lang="en">This page does not exist. <a href="/">{{title}}</a></p>
  </body>
</html>
