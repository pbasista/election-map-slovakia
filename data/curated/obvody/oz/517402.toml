note = "The announcement of resolution MsZ č. 98/2026 of 23.06.2026 gives 8 obvody (31 seats) by city quarters only (Hliny, Staré mesto, Bôrik, Solinky, Vlčince, Hájik, Rosinky …) and by parts of the town. The streets come from the city's official list of volebné okrsky and streets for the 24.10.2026 elections (version of 07.08.2026), which groups the okrsky and their streets under each obvod. Outlying parts (Bytčica, Trnové, Bánová, Závodie, Žilinská Lehota, Brodno, Budatín, Mojšova Lúčka, Považský Chlmec, Strážov, Vranie, Zádubnie, Zástranie) are whole-part rules following the obvod titles; streets the list puts elsewhere (e.g. Pod hliniskom, Prielohy, Zábrehy, Zadný dielec, J.Tombora, Kopanice, M. Šinského of part Bytčica in obvod 3; Essenská, Emanuela Fila, Mikovíniho of part Závodie in obvod 5) are street rules. Streets of the register missing from the list are inferred rules (Burianova medzierka, Cestárska, Katedrálne námestie, Bánovská cesta, Centrálna, Námestie J. Borodáča, Slovanská, Sv.Cyrila a Metoda, Námestie mladosti, Hruštiny, Majstra sveta); Dúbravy, Mojšová Lúčka, Rybné námestie, V Rovni Od Brodna, Za cintorínom fall under their part rules. fill_nearest covers the addresses without a street in part Žilina (the list has no rule for them; its 'bez ulice' entries are residents without an address, in okrsky 1 and 80)."

