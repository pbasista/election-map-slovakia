# Council obvody of Oščadnica (509345), Čadca.
# Estimated by hand: the documents below give the obvody's names and seats,
# and in 2022 their settlements by name, but not which addresses are in
# which (see the note).
#   obvod 1: Rovne
#   obvod 2: Vyšný koniec
#   obvod 3: Centrum
#   obvod 4: Nižný koniec
obec = "509345"
name = "Oščadnica"
date = 2026-06-17
fill = "nearest"
note = "Estimated: uznesenie č. 17/2026 sets obvod 1 Rovne (2 seats), 2 Vyšný koniec (2), 3 Centrum (4) and 4 Nižný koniec (5) without listing houses. The 2022 page, with the same four obvody, lists each by informal settlement names (obvod 1 Vreščovka, Peňáci, Košariská, Svancári, Beskydok, Rovne; obvod 2 Haladeji, Lalíci, Magura, Závozy, Tertež, Moskáli, Hanzlov, Dirgasovia, ...; obvod 3 Ústredie, Janečkovia, Jurčagovia, Kopačkovia, Zadedová, Komanovky, Kozovia, Kubanovia, ...; obvod 4 Ryboňovia, Špalkovia, Kučákovia, Višňákovia, Revajovia, Urbanovia, Šulganovia, ...). Each address goes to the nearest OpenStreetMap hamlet or 'zárubok' of a listed name: Rovne is the northern side valley, Nižný koniec the lower, south-western end of the valley towards Čadca, Vyšný koniec the upper, eastern end. That gives 280, 329, 928 and 630 addresses with a point; by the seats obvod 4 would have about 200 more, but the 2022 list puts the hamlets next to it in Centrum. Some listed names (Píla, Polesie, Beskydok, ...) are on no map and have no point. Addresses without a point take the obvod most of their part got."
estimated = true

