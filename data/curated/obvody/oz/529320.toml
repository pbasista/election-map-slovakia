note = "Resolution 591/XXV/2026 (23.06.2026; council material on zastupitelstvo.egov.sk, id 117574) defines the 4 obvody only by neighbourhood names and a map, no street list. Rules are therefore built from the starosta's official 'Určenie volebných okrskov' (okrsky 1–23 → obvod 1, 24–42 → 2, 43–50 → 3, 51–74 → 4) combined with the district's official street-to-okrsok list 'Zoznam ulíc a okrskov abecedne'. This matches the district's article 'Úprava volebných obvodov' (NUPPU: even Hraničná, Tučkova, Mlynské nivy 64–82C, Bajkalská 29 in obvod 1; Strojnícka even from 16/odd from 31, Mlynské luhy except 2 and 4, Prúdová, Na piesku in obvod 4). fill_nearest is used for house numbers the list omits on split streets and for streets the list lacks entirely: Dr. Vladimíra Clementisa, Horárska, Pod gaštanmi, Poľovnícka, Pri letisku, Pri Čiernom lese, Senecká cesta, Slovnaftská, Stará Ivanská cesta, Stará Prievozská, Viktorínova, and for addresses without a street other than the súpisné numbers the list gives. Persons with residence only 'Bratislava-Ružinov' (no address) vote in okrsok 56, obvod 4."

