obec = "518549"
name = "Kriváň"
date = 2026-07-08
note = "Estimated: uznesenie č. 18/6 and the Oznámenie name obvod 1 'Časť obce Pod traťou' (5 seats) and obvod 2 'Časť obce Nad traťou' (4) without listing houses. The railway (OpenStreetMap) crosses Kriváň west to east and turns south-east; the side north of it, along the main road, lies lower, towards the Slatina (391–405 m against 429–503 m south of it), so it is taken as 'pod traťou'. Pairs of points 250 m either side of the track, every 500 m along it, put each house on its side of the railway: 419 and 323 addresses, close to the 5:4 seats."
estimated = true

