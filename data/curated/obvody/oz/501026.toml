note = "The announcement defines obvod 1 = okrsky 1-2, obvod 2 = okrsky 3-16, obvod 3 = okrsky 17-30 (seats 1/12/12, 25 in total); the rules transcribe its annex listing the addresses of each okrsok (časť obce, ulica, orientačné čísla od-do, párne/nepárne/všetky/jedno číslo). Where a street lies wholly in one obvod but the annex lists it in number ranges, the whole street is taken (rule note says so); only Dunajské nábrežie, Palatínova ul., Mederčská ul. and Železničná ul. are split between obvody 2 and 3 and keep their ranges (a letter suffix on a range end, e.g. 34A, 39A, is read as that number). Numbers of these split streets the annex leaves out, and the streets it omits (Druhá priečna ul., Hadovská cesta, Tržničné nám., Park pri Pevnosti - Anglia), are placed by inferred rules from their neighbours. 'Piesočný hon' (okrsok 4) has no address in the register and is left out; okrsok 25 also holds 'mesto Komárno – občania s trvalým pobytom' (residents registered only to the city), which has no address. Register spelling variants (K. Harmoša, Ul.roľníckej školy, Ul.biskupa Királya, Ul.práce, Nová, Slobody) follow the street they duplicate. fill_nearest: about 2,480 addresses of časť Komárno without a street (súpisné číslo only) that the annex does not list (it lists only nos. 4007 and 4428, in obvod 2) take the obvod of the nearest address."

