okrsky_note = "The mayor's 2018 decision on the okrsky and polling stations is not published on the municipality's website (its 2018 elections page lists the obvody resolution, population, recorder, candidates and results, but no okrsky notice; the notice board and the Internet Archive, which has no capture of the site between June and November 2018 apart from scripts, have none either). The council resolution sets three obvody, one per part (Nižný, Stredný, Vyšný Sliač), and the 2018 results count the votes in three okrsky Nižný, Stredný, Vyšný: one okrsok per obvod, so each okrsok is its whole obvod; no street list is needed."
okrsky_adopted = 2018-11-10
okrsky_adopted_basis = "No document of 2019-05-25 setting the okrsky was found (okrsok-rules-1810): No okrsky document of this vote found on liptovskesliace.sk (live) or in the Internet Archive (CDX of the whole domain checked); the elections pages kept for this vote list no 'určenie volebných okrskov'. Only results/announcements after the vote mention three okrsky by part (Nižný, Stredný, Vyšný Sliač). These are the okrsky of the vote of 2018-11-10 (2018), the nearest in time with okrsky of its own that fit: 3 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2019-05-25 → 2018-11-10: 1: 782 → 788, 2: 1,360 → 1,388, 3: 881 → 902."
okrsky_date_approximate = "named"
okrsky_date_basis = "No published document states the date of the mayor's decision on the okrsky; the results document's heading names the elections of 10 November 2018 and counts the votes in the okrsky Nižný, Stredný and Vyšný."

