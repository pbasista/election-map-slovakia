obec = "511391"
name = "Fiľakovo"
date = 2018-06-28
fill = "nearest"
note = "The council obvody of the vote of 2018-11-10: they only place the okrsky. The announcement is gone from the live website (404) and the Internet Archive's copy could not be had; the Common Crawl captured it on 2019-06-20, and its capture of 2018-10-23 of the town's notice-board page 'Voľby do orgánov samosprávy obcí 2018' links it. It names the streets of each obvod (resolution 64/2018 of 28 June 2018). The 407 addresses without a street take the obvod of the nearest address (fill_nearest)."
reused = 2018-11-10
okrsky_date = 2018-08-22
okrsky_fill = "nearest"
okrsky_note = "Scanned-quality PDF (garbled text layer) read from the page rendered at scale 3; dated 'Fiľakovo, 22. augusta 2018', heading names the elections of 10 November 2018. Parková and Biskupická are split by the document's súpisné/orientačné numbers (rules on the orientačné: 'Parková 1287/2-10' = even 2-10, '1541/9-13' = odd 9-13, '1285/1-3, 1286/5-7, 1548/15-21' = odd 1-7, 15-21; Biskupická '1215/2, 1216/4' = 2, 4, '1259/1-5, 1260/7-15' = odd 1-15, okrsok 1 even from 10 and odd from 17 to the end). Biskupická numbers the document does not name (1A, 4A, 4B, 5A, 8, 8A, 8B) and the 407 houses without a street are placed by fill_nearest. 'Kvetná Fialková' is read as the two streets Kvetná and Fialková. Okrsok 9 is the street Farská lúka (housing estate and family houses)."
okrsky_adopted = 2018-11-10
okrsky_adopted_basis = "No document of 2019-05-25 setting the okrsky was found (okrsok-rules-1696): No document of this vote reachable: the Internet Archive keeps the 2017–2020 notice-board pages (index.php/sk/samosprava/uradna-tabula/942-…-2017, 1323-…-2019, 1349-…-2019, 1549-…-2020) but not the okrsky PDFs they link (/documents/utabula/2017/volebne_okrsky_utvorene_na_vykonanie_volieb_do_samospravnych_organov.pdf, /documents/utabula/2019/volby_nrsr_2020_volebne_okrsky.pdf), which are gone (404) from the live site; the Archive was also mostly offline. These are the okrsky of the vote of 2018-11-10 (2018), the nearest in time with okrsky of its own that fit: 9 okrsky. The voters on the roll per okrsok are not known for both votes, so whether the layout changed is not known either."

