obec = "501905"
name = "Šamorín"
date = 2018-08-14
fill = "nearest"
note = "The council obvody of the vote of 2018-11-10: they only place the okrsky. Uznesenie MsZ č. 34/2018/III of 14.08.2018: 19 poslancov in 9 obvodov (obvod 8: 3, the others 2), each one okrsok. Šamorín-part addresses without a street (the document lists some by súpisné číslo, which are not transcribed) and house numbers outside the listed ranges go by fill_nearest. Hlavná 39 is named in obvody 3 and 7; kept in 3."
reused = 2018-11-10
okrsky_date = 2018-08-14
okrsky_note = "Council resolution 34/2018/III of 14.08.2018 set 9 obvody and stated ('konštatovalo') that they are identical with the volebné okrsky; so okrsok n = obvod n, each alone in its obvod. The streets per okrsok are those of the obvody notice of 15.08.2018 and the city's list of 9.11.2018 (which names each obvod's polling station). No separate mayor's okrsky decision was found on the website; the Internet Archive did not answer."
okrsky_adopted = 2018-11-10
okrsky_adopted_basis = "No document of 2019-05-25 setting the okrsky was found (okrsok-rules-1638): No okrsky document for the European Parliament election of 2019 found on old.samorin.sk (only the notice on delegating commission members). These are the okrsky of the vote of 2018-11-10 (2018), the nearest in time with okrsky of its own that fit: 9 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2019-05-25 → 2018-11-10: 1: 999 → 1,013, 2: 1,142 → 1,159, 3: 1,517 → 1,524, 4: 1,016 → 1,027, 5: 1,118 → 1,151, 6: 959 → 998, 7: 1,235 → 1,249, 8: 1,537 → 1,547, 9: 1,434 → 1,444."

