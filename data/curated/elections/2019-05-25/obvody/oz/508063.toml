obec = "508063"
name = "Malacky"
date = 2018-07-09
fill = "nearest"
note = "The council obvody of the elections of 2018-11-10. Six announcements of 23.8.2018 (scans, read from the page images), one per obvod, publish the council's resolution č. 76/2018 of 9.7.2018: 18 councillors in 6 obvody of 3 seats, each obvod the streets of two okrsky, listed per okrsok. A street split by orientačné numbers keeps its numbers where it lies in two obvody (Štúrova, Záhorácka); one split only between the two okrsky of one obvod (Veľkomoravská, obvod 4) is whole; Bernolákova, listed with numbers only in okrsok 7, is whole. Addresses without a street are listed by súpisné číslo ('Časť obce Malacky'); those not numbered, and house numbers of split streets the lists leave out, are placed by fill_nearest. 'Bez ulice' (voters without an address) has no rule; 'Časť obce ZO Prídavky' (gardening colony) is not a part in the register and has no rule. 'Vinohrádok' is the part Vinohrádok. 'Štúrova súp. č. 5959' is Štúrova 53. The Internet Archive was offline (CDX and Wayback returned 'Temporarily Offline' on several tries); it was not needed for the documents used."
reused = 2018-11-10
okrsky_date = 2018-07-09
okrsky_fill = "nearest"
okrsky_note = "These are the okrsky of the elections of 2018-11-10: in 2019-05-25 the obec had as many okrsky, each that voted with voters on the roll within 10% of its count then. No document of 2019-05-25 was found (okrsky/not-found.json). Six announcements of 23.8.2018 (scans), one per obvod, publish the council's resolution č. 76/2018 of 9.7.2018 and list the streets of each okrsok of the obvod; they are the okrsky document of this vote. Štúrova (okrsky 1, 2, 3) and Záhorácka (okrsky 4, 5, 8) are split by the listed numbers; within obvod 1 Štúrova's numbers 141–159 are okrsok 1 and the rest of the obvod's part okrsok 2; Záhorácka and Veľkomoravská are split between the okrsky of their obvod by the listed numbers. Addresses without a street listed by súpisné číslo ('Časť obce Malacky') are rules by súpisné číslo; 'Bez ulice' (voters without an address) and 'Časť obce ZO Prídavky' (gardening colony, not a part in the register) have no rule. Unlisted house numbers and the other addresses without a street take the okrsok of the nearest placed address (fill_nearest)."
okrsky_reused = 2018-11-10

