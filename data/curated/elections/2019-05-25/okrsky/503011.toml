okrsky_note = "Streets the document names but the address register lacks, left out: Sihoť sv. Alžbety, Veľká Ragoňa, Zemiansky priechod. fill_nearest places streets the document does not name: Bratislavská cesta; house numbers outside the document's ranges: Cyrilometódska 1, 3, 13; G. Bethlena 2, 2A, 2B, 2C, 2D, 54, 56, 58, 73, 79; M. R. Štefánika 82; Nábrežná 1, 24, 50, 52, 54, 107 (G. Bethlena \"2E–50 (párne)\" is read as 2E and 4–50, so 2–2D are left to the nearest address); the addresses without a street name (súpisné čísla of part Nové Zámky). Okrsok 22 also takes \"občania s trvalým pobytom Nové Zámky\" (voters registered without an address), which needs no rule."
okrsky_supplemented = 2022-10-29
okrsky_supplemented_from = "election"
okrsky_supplement_basis = "The document does not name the newer streets Bazová ulica (okrsok 3), Mesačná ulica (okrsok 1), Medová ulica (okrsok 5), Ulica pod hviezdami (okrsok 5), Ulica západ slnka (okrsok 5), Športová (okrsok 23); they are placed as the rule set of the municipal elections of 29 October 2022 (same 37 okrsky, same numbering) places them, copied exactly. The register now has addresses on these streets (mostly new houses) that the document predates."

