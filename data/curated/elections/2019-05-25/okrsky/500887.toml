okrsky_note = "Scanned document, read from the rendered page. 'č. d.' (číslo domu) numbers are taken as súpisné čísla. Cintorínska is named whole in okrsok 1 and its houses 412-417, 441, 1388 in okrsok 2. Hlavná is split only by the listed house numbers; its houses not listed, the register's streets the document does not name (Majer and any other), and the houses without a street (súpisné only) are placed by fill_nearest."
okrsky_adopted = 2022-10-29
okrsky_adopted_basis = "No document of 2019-05-25 setting the okrsky was found (okrsok-rules-1769): The website's notice board and site search reach back only to 2022; no okrsky document of this vote found live. The Internet Archive (web.archive.org, incl. the CDX API) refused connections throughout (about 45 minutes, retried with pauses), so archived pages could not be checked. These are the okrsky of the vote of 2022-10-29 (2022), the nearest in time with okrsky of its own that fit: 3 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2019-05-25 → 2022-10-29: 1: 1,201 → 1,183, 2: 1,189 → 1,191, 3: 1,118 → 1,131."

