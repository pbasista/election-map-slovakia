okrsky_note = "Streets the document names but the register lacks (left out): Bahýľova, Bielych albatrosov, K letisku (okrsok 1), Alejová (okrsok 2). Okrsok 4 is Andraščíkova (Via Lux social-services home). The register's Ulica Andreja Kvasa is not in the document; it and the addresses without a street are placed by fill_nearest. Unlike later votes, Borodáčova is in okrsok 1."
okrsky_adopted = 2018-11-10
okrsky_adopted_basis = "No document of 2019-05-25 setting the okrsky was found (okrsok-rules-1765): The old site's page 'Voľby do Európskeho parlamentu 2019' (archived 2019-08-21) links 'Určenie volebných okrskov' (/images/subory/ine/Urenie volebnch okrskov OKK.pdf), but the PDF was never captured (404) and is gone from the live site. These are the okrsky of the vote of 2018-11-10 (2018), the nearest in time with okrsky of its own that fit: 4 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2019-05-25 → 2018-11-10: 1: 921 → 911, 2: 946 → 962, 3: 968 → 969, 4: 171 → 171."

