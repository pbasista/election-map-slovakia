okrsky_fill = "nearest"
okrsky_note = "The document also names \"rekreačná oblasť Malá voda - Nové Košariská\", not a street in the register; its houses are among the addresses without a street, placed by fill_nearest. Scanned document read from its rendered page images (scale 3), with diacritics. Addresses without a street (numbered by súpisné číslo within the parts, largely the recreational areas and new houses) are placed by fill_nearest."
okrsky_adopted = 2019-03-16
okrsky_adopted_basis = "No document of 2019-05-25 setting the okrsky was found (okrsok-rules-1668): The municipality's page for the European Parliament election of 2019 links 'Informácia o utvorení volebných okrskov a určenie volebných miestností', but the file behind it (755sk_3.pdf, original name 'Vyhlásenie volieb do Európskeho parlamentu.pdf') is the Speaker's decision announcing the election (Zb. 28/2019), not an okrsky document; the Internet Archive capture of the page of 2019-04-11 links the same file. No other okrsky document for 25 May 2019 was found on the website or in the Internet Archive. The documents of 16 March 2019 and 29 February 2020 list identical okrsky. These are the okrsky of the vote of 2019-03-16 (2019-prezident), the nearest in time with okrsky of its own that fit: 5 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2019-05-25 → 2019-03-16: 1: 1,045 → 1,008, 2: 1,027 → 1,024, 3: 958 → 975, 4: 1,027 → 1,013, 5: 1,052 → 1,065."

