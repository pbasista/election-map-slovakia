okrsky_note = "Each street lies wholly in one okrsok, so whole-street rules are used for the house numbers the document lists. 'Voliči s trvalým pobytom Košice-Luník IX' (okrsok 1) are voters registered without an address; the register's 2 addresses without a street are placed by fill_nearest."
