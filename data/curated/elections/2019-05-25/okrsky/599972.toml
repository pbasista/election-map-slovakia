okrsky_adopted_basis = "No document of 2019-05-25 setting the okrsky was found (okrsok-rules-2174): The live website www.mclunik9.sk refused connections on 2026-10-31. In the Internet Archive, the old site's notice board (uradna_elektronicka_tabula, captured 2019-07-16, listing every item from 2015 to 26.3.2019) and the WordPress board that replaced it in 2020 (oznamenia, captured 2020-10-28; elections page dokumenty/volby empty) list no 'utvorenie volebných okrskov' for any vote before 2022: for the European Parliament election of 2019 they post only the e-mail addresses for delegating OVK members and for voting-pass requests (26.3.2019). The archive's list of the domain's PDFs has no okrsky document before the 2022 one (Utvorenie-volebnych-okrskov-a-urcenie-volebnej-miestnosti-v-MC-KE-LIX.pdf, dated 3.8.2022), which may not be used for this vote. These are the okrsky of the vote of 2022-10-29 (2022), the nearest in time with okrsky of its own that fit: 2 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2019-05-25 → 2022-10-29: 1: 2,380 → 2,617, 2: 2,039 → 2,308."

