name = "Košice-Dargovských hrdinov"
okrsky_date = 2019-11-29
okrsky_fill = "nearest"
okrsky_note = "The announcement lists streets and house numbers per okrsok in a table whose okrsok number stands on the middle line of each cell; streets printed just above a number belong to that okrsok (as later announcements, which merge okrsky, confirm: e.g. Kpt. Jaroša goes with Postupimská 33-37). PČL/PČĽ = Povstania českého ľudu, Sv. rodiny = Svätej rodiny. The entry \"mestská časť KE-DH, <office address>\" means voters registered at the office without an address and is no rule. Addresses not listed (e.g. Jegorovovo Nám., Magnezitárska, Maršala Koneva, Pod Furčou, Trieda arm. gen. Svobodu, unlisted numbers, addresses without a street) go by fill_nearest. Vyšná úvrať 14-44 as listed; the same 24 okrsky as in 2022 except that Jegorovovo nám. is not listed."
okrsky_adopted = 2020-02-29
okrsky_adopted_basis = "No document of 2019-05-25 setting the okrsky was found (okrsok-rules-1838): No okrsky document of the EP election 2019 on the website; Internet Archive offline. These are the okrsky of the vote of 2020-02-29 (2020-nrsr), the nearest in time with okrsky of its own that fit: 24 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2019-05-25 → 2020-02-29: 1: 994 → 1,005, 2: 1,146 → 1,123, 3: 627 → 621, 4: 921 → 876, 5: 882 → 872, 6: 792 → 788, 7: 859 → 859, 8: 870 → 828, 9: 1,035 → 1,021, 10: 979 → 949, 11: 858 → 847, 12: 788 → 788, 13: 1,396 → 1,367, 14: 944 → 966, 15: 767 → 752, 16: 792 → 793, 17: 871 → 848, 18: 751 → 742, 19: 805 → 784, 20: 834 → 816, 21: 1,054 → 974, 22: 963 → 1,014, 23: 933 → 925, 24: 1,042 → 1,039."

