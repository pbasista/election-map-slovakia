# The okrsky of Hrabušice of the vote of 2019-03-16, data/curated/elections/2019-03-16/okrsky/526592.toml, standing in, by `ems job reuse`. Its header there:
#   Okrsky of Hrabušice, transcribed by an AI agent in job okrsok-rules-1458 from the documents below;
#   checked by `ems job ingest` against the address register. The document's
#   text per okrsok, verbatim:
#     okrsok 1: pre oprávnených občanov bývajúcich na uliciach: Bernolákova, Jarná, Letná, Majer, Podlesok, Slovenského raja, Zimná a oprávnených voličov prihlásených na Obec Hrabušice
#     okrsok 2: pre oprávnených občanov bývajúcich na uliciach: E. Makovického, Gaštanová, Hlavná, Píla, Hviezdoslavova, Lúčna, Nová, Obchodná, Partizánska, Tomášovská, Zelená.
obec = "526592"
name = "Hrabušice"
okrsky_date = 2019-01-25
okrsky_fill = "nearest"
okrsky_note = "'oprávnených voličov prihlásených na Obec Hrabušice' (okrsok 1) are voters registered without an address. The register streets Hágy and Sokol, which the document does not name, and the addresses without a street are placed by fill_nearest."
okrsky_adopted = 2019-03-16
okrsky_adopted_basis = "No document of 2019-05-25 setting the okrsky was found (okrsok-rules-2047): Only the presidential election's okrsky document of 25.01.2019 exists (it names only the presidential election); nothing for the European Parliament election of 2019 on the notice board or in the Internet Archive. These are the okrsky of the vote of 2019-03-16 (2019-prezident), the nearest in time with okrsky of its own that fit: 2 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2019-05-25 → 2019-03-16: 1: 971 → 953, 2: 855 → 839."

