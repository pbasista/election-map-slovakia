#   Okrsky of Branč, transcribed by an AI agent in job okrsok-rules-886 from the documents below;
#   checked by `ems job ingest` against the address register. The document's
#   text per okrsok, verbatim:
#     okrsok 1: pre voličov - obyvateľov s trvalým pobytom v časti obce Branč
#     okrsok 2: pre voličov - obyvateľov s trvalým pobytom v časti obce Veľká Ves
obec = "500071"
name = "Branč"
okrsky_date = 2022-08-01
okrsky_note = "The live site answered HTTP 429; the document (scanned, Slovak page and Hungarian translation) was taken from the Internet Archive, linked from the archived Voľby 2022 notice. Okrsok 1: voters with permanent residence in the part Branč; okrsok 2: in the part Veľká Ves."
okrsky_adopted = 2022-10-29
okrsky_adopted_basis = "No document of 2019-05-25 setting the okrsky was found (okrsok-rules-1963): The live website www.branc.sk has no elections page or archive; its notice board and announcements reach back only sporadically and hold no okrsky document for this vote. The only okrsky document online is the mayor's decision No. OÚ-200-5/2026 of 9 July 2026 for the elections of 24 October 2026 (okrsok 1 = part Branč, okrsok 2 = part Veľká Ves), which is not valid for this vote. The Internet Archive stayed offline (connection refused / 'Temporarily Offline') across repeated retries over about 20 minutes, so archived pages could not be checked. Web search found nothing. These are the okrsky of the vote of 2022-10-29 (2022), the nearest in time with okrsky of its own that fit: 2 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2019-05-25 → 2022-10-29: 1: 928 → 953, 2: 930 → 905."

