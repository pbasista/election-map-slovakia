obec = "521965"
name = "Sady nad Torysou"
okrsky_date = 2019-11-15
okrsky_note = "The document names each okrsok by its part of the municipality (okrsok č. 1 Byster, polling station in Byster 189; okrsok č. 2 Zdoba, polling station in Zdoba), so each okrsok is that whole part. Same okrsky as the copied 2022 rules."
okrsky_adopted = 2020-02-29
okrsky_adopted_basis = "No document of 2019-05-25 setting the okrsky was found (okrsok-rules-2093): The current website (since 2020) has elections pages only from the National Council election of 2020 on; the old Drupal site's pages are gone (e.g. /volby-2018 answers 404). The Internet Archive keeps nothing of the domain before June 2018, and its complete URL list for 2016-2020 (collapse=urlkey) holds no okrsky document and no elections page of this vote: the only archived old-site PDFs are nariadenie.pdf, obecna_zapisnica_pre_volby_do_oso.pdf, sms_spravodaj_0.pdf, web_ovk.pdf, napln_prace.pdf. The council's archive (Zasadnutia OZ archív do r. 2020) has only resolutions and minutes, not the mayor's okrsky decision. The Archive was intermittently offline (connection refused / \"Temporarily Offline\") during the search; archived notice-board pages fetched: page 3 of 2019-08-04 lists an item \"Voľby do Európskeho parlamentu 2019\" (/volby-do-europskeho-parlamentu-2019), but that page is not archived (CDX empty) and is gone live. Every later document (2020-2026) names okrsok č. 1 Byster and okrsok č. 2 Zdoba. These are the okrsky of the vote of 2020-02-29 (2020-nrsr), the nearest in time with okrsky of its own that fit: 2 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2019-05-25 → 2020-02-29: 1: 797 → 805, 2: 726 → 726."

