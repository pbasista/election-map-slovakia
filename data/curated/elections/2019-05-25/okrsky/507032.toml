name = "Hlohovec"
okrsky_date = 2019-02-21
okrsky_fill = "nearest"
okrsky_note = "'Mesto Hlohovec' in okrsok 1 means voters whose permanent residence was cancelled (registered without an address), not register houses. The lokality given by súpisné číslo and the other register addresses without a street (parts Hlohovec, Šulekovo), and the numbers of split streets the document lists in no okrsok (e.g. Vinohradská 5, 7, 12; Nábrežie A. Hlinku even numbers above 12), are placed by fill_nearest, since a part+súpisné rule would also catch street houses with the same súpisné číslo. Named in the document but not in the address register (left out): Vajanského."
okrsky_supplemented = 2019-11-29
okrsky_supplemented_from = "document"
okrsky_supplement_basis = "The document does not name Šumperská ulica (okrsok 5), streets of the register; the city's okrsky document of 29. 11. 2019 (NR SR 2020), with otherwise the same okrsky, lists them there, so they are taken from it. (https://www.hlohovec.sk/download_file_f.php?id=1249863)"

