sha256 = "3fbbde5bc1301b1e9b038168b3c77f93bc8ad6f8b49d6010dab52d1105d05013"
title = "Utvorenie volebných okrskov a určenie volebných miestností pre Voľby do Národnej rady SR, konané dňa 30.09.2023"

