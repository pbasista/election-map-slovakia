# The okrsky of Holice of the vote of 2023-09-30, data/curated/elections/2023-09-30/okrsky/501581.toml, standing in, by `ems job reuse`. Its header there:
#   Okrsky of Holice, transcribed by an AI agent in job okrsok-rules-3578 from the documents below;
#   checked by `ems job ingest` against the address register. The document's
#   text per okrsok, verbatim:
#     okrsok 1: Kostolná Gala, Póšfa
#     okrsok 2: Stará Gala, Beketfa, Čechová, Veľká Budafa, Malá Budafa
obec = "501581"
name = "Holice"
okrsky_date = 2023-06-26
okrsky_note = "www.obecholice.sk redirects to www.gelle.sk (Gelle is the Hungarian name of Holice), where the documents are served."
okrsky_adopted = 2023-09-30
okrsky_adopted_basis = "No document of 2019-05-25 setting the okrsky was found (okrsok-rules-1812): The obec's website (www.obecholice.sk -> www.gelle.sk; the old www.holice.sk is a parked domain) keeps on its notice board (current and archive by year 2017-2026) okrsky documents only for the NR SR election of 2023-09-30 and the EP election of 2024-06-08; for this vote it has none (for 2017 only an 'Informácie pre voliča' DOCX, for 2026 referendum items without an okrsky decision). The Internet Archive CDX API timed out and then refused connections for about 15 minutes; the availability API shows only a 2019 homepage capture of gelle.sk, which could not be opened. These are the okrsky of the vote of 2023-09-30 (2023-nrsr), the nearest in time with okrsky of its own that fit: 2 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2019-05-25 → 2023-09-30: 1: 904 → 872, 2: 855 → 878."

