okrsky_adopted = 2018-11-10
okrsky_adopted_basis = "No document of 2019-05-25 setting the okrsky was found (okrsok-rules-2041): The site search for 'okrskov', 'okrsky', 'okrsok', 'miestností', 'volieb' lists okrsky documents only for 2017 (id=876391), 2018 (id=1011032), 2022 (id=1717407) and 2026 (id=2398726, now 404); none for this vote. The elections pages of this vote are not on the live site; the Internet Archive CDX was offline/timing out. These are the okrsky of the vote of 2018-11-10 (2018), the nearest in time with okrsky of its own that fit: 3 okrsky. The voters on the roll per okrsok are not known for both votes, so whether the layout changed is not known either."

