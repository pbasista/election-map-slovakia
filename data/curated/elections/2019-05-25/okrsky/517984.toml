okrsky_note = "No document of the elections found: the 2022 page (archived 16 Aug 2022) links \"Volebné okrsky a volebné miestonosti\" PDF, which is gone from the website and not in the Internet Archive; the referendum's document (7 Nov 2022) is used. Its two okrsky with 1075/1069 voters fit the Statistical Office counts. The register's 15 houses without a street are placed by fill_nearest."
