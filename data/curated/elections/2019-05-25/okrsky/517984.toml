okrsky_adopted_basis = "No document of 2019-05-25 setting the okrsky was found (okrsok-rules-1957): The municipality's old WordPress site (www.strecno.sk, replaced in 2024) is gone; the new site's \"Voľby a referendá\" page starts with the 2022 elections. The archived page \"Európsky parlament – voľby\" links only the e-mail address notice, the poster guidance and the voter information (eurovolby-email.pdf, usmernenie-vylepovanie-plagatov.pdf, ep-informacie-pre-volicov.pdf); no okrsky document. The CDX list of the domain holds none for 2019. These are the okrsky of the vote of 2022-10-29 (2022), the nearest in time with okrsky of its own that fit: 2 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2019-05-25 → 2022-10-29: 1: 1,088 → 1,075, 2: 1,069 → 1,069."

