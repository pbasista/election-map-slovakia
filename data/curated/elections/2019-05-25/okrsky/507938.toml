obec = "507938"
name = "Ivanka pri Dunaji"
okrsky_date = 2019-01-29
okrsky_fill = "nearest"
okrsky_note = "Decision of the mayor of 29.01.2019 for the presidential election of 16 (30) March 2019, linked from the Voľby page (posted 29.1.2019). Same okrsky as the copied 2022 rule set except that Šúrska is not listed. The live website answered HTTP 429 (rate limit), so the Internet Archive copies are listed. The register's addresses without a street (súpisné čísla only) are in no list of the document; they take the okrsok of the nearest placed address (fill_nearest)."
okrsky_adopted = 2019-03-16
okrsky_adopted_basis = "No document of 2019-05-25 setting the okrsky was found (okrsok-rules-1677): The municipality's Voľby page (live: HTTP 429 rate limit; Internet Archive captures of 2019-08-23, 2019-10-14, 2022-03-19, 2022-12-04 and 2025-01-15) lists for the European Parliament election of 25 May 2019 only its announcement, the e-mail address for voting-pass requests and the results; it links no okrsky decision, unlike every other vote of 2017–2024. All 59 files (download_file_f.php ids 1085350–1124741, posted February–April 2019) that the Internet Archive captured were opened: none is an okrsky decision. The decision of 29.01.2019 for the presidential election is that vote's only, so no document of this vote was found and the copy stays. These are the okrsky of the vote of 2019-03-16 (2019-prezident), the nearest in time with okrsky of its own that fit: 4 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2019-05-25 → 2019-03-16: 1: 1,293 → 1,301, 2: 1,279 → 1,279, 3: 1,305 → 1,319, 4: 1,405 → 1,409."

