obec = "503401"
name = "Mužla"
okrsky_date = 2022-11-09
okrsky_fill = "nearest"
okrsky_note = "No dated document of the 2022 elections found: the website was rebuilt and the 2022 files are gone; the archive keeps an undated bilingual list 'okrsky-valasztasi-korzetek.pdf' uploaded in October 2022 but archived only on 2023-01-30, with exactly the same okrsky. So the referendum's document (no document of the elections found; the referendum's document), dated 9.11.2022, is used. Okrsok 2 also holds 'Obyvatelia bez súpisného čísla' and 'Obyvatelia s trvalým pobytom na Železničnej stanici Mužla' (voters registered without a house address, not the register's houses without a street). The register's houses without a street in the part Mužla (súpisné only) and Kostolná ulička (1 address, not in the document) are placed by fill_nearest."
okrsky_adopted = 2022-10-29
okrsky_adopted_basis = "No document of 2019-05-25 setting the okrsky was found (okrsok-rules-1882): The archived \"Voľby EP\" page (2019) links the decision calling the elections (Volby_do_EP.pdf), voter information (ilovepdf_merged.pdf) and e-mail addresses; no okrsky document. The website was rebuilt in 2025; its older files are gone (404) and the Internet Archive kept neither this vote's okrsky document nor the pages listing it. These are the okrsky of the vote of 2022-10-29 (2022), the nearest in time with okrsky of its own that fit: 2 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2019-05-25 → 2022-10-29: 1: 716 → 773, 2: 885 → 763."

