name = "Michalovce"
okrsky_date = 2019-01-15
okrsky_fill = "nearest"
okrsky_note = "Okrsky with their streets from the town's notice on the time and place of the vote (polling station and streets of each okrsok). Paired ranges whose ends share parity (1-17, 2-14) are read as odd/even ranges. Súpisné numbers listed among a street's numbers (3932, 5909, 5749, 3937, 3964, 5729, 5826, 3952, 5948) are not transcribed. Okrsky texts follow the notice's wording; the rules are those of the identical okrsky of the 2022 notice, adjusted where this notice differs. fill_nearest covers numbers of split streets the notice does not list, streets it leaves out and addresses without a street. Unlike 2022, okrsok 24 does not name Garbiarska and Ulica pri Duši (placed by fill_nearest)."
okrsky_adopted = 2019-03-16
okrsky_adopted_basis = "No document of 2019-05-25 setting the okrsky was found (okrsok-rules-1610): The 2019 EP section's 'Zoznam okrskových volebných miestností' lists only the polling stations of the okrsky (no streets); with 32 okrsky and about 20 stations the okrsky cannot be placed, and no notice with their streets was found for this vote. These are the okrsky of the vote of 2019-03-16 (2019-prezident), the nearest in time with okrsky of its own that fit: 32 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2019-05-25 → 2019-03-16: 1: 991 → 980, 2: 1,917 → 1,877, 3: 1,022 → 1,040, 4: 1,332 → 1,327, 5: 1,189 → 1,171, 6: 1,281 → 1,254, 7: 1,037 → 1,076, 8: 1,417 → 1,396, 9: 1,256 → 1,266, 10: 740 → 733, 11: 1,380 → 1,380, 12: 771 → 786, 13: 991 → 987, 14: 805 → 806, 15: 862 → 865, 16: 934 → 938, 17: 703 → 699, 18: 646 → 628, 19: 987 → 976, 20: 633 → 629, 21: 756 → 750, 22: 486 → 491, 23: 981 → 970, 24: 761 → 750, 25: 597 → 595, 26: 989 → 996, 27: 1,296 → 1,298, 28: 754 → 744, 29: 940 → 914, 30: 918 → 891, 31: 1,015 → 1,019, 32: 855 → 842."

