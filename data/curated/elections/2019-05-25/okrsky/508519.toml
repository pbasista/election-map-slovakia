okrsky_adopted_basis = "No document of 2019-05-25 setting the okrsky was found (okrsok-rules-2155): The live úradná tabuľa of cerin.sk reaches back only to about 2024; its only okrsky notices are for the 2024 presidential election (25.01.2024), the 2024 EP election (07.03.2024) and the municipal/regional elections of 24.10.2026 (29.07.2026), each listing okrsok 1 Čerín and okrsok 2 Čačín. The Internet Archive CDX API returned some results once, then stayed offline (504 / connection failures) over several retries with pauses, so archived pages of this vote could not be checked. These are the okrsky of the vote of 2022-10-29 (2022), the nearest in time with okrsky of its own that fit: 2 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2019-05-25 → 2022-10-29: 1: 258 → 263, 2: 115 → 119."

