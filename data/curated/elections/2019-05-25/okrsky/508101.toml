okrsky_note = "The mayor's undated decision for this vote (scan, read from the image); 1. mája, Čsl. armády and Krátka moved to okrsok 4. Streets the document names that the register lacks (left out): Muškátová ulica, Leánková ulica, Tramínová ulica, Strapáková ulica, Malagová ulica, Šípková ulica, Veštíkova ulica. 'mesto Modra' are voters without an address (no rule). Addresses the document leaves out (e.g. Komenského numbers not listed, streets of Kráľová it does not name) and those without a street take the okrsok of the nearest address (fill_nearest)."
