okrsky_note = "Scanned document with a poor OCR layer; read from it, its okrsky and wording are those of the city's list of 13.07.2018 (same streets and number ranges), so the text is given in that list's spelling with 'Rapovská křižovatka' as the scan writes it. Mestský park, Ulica Kupeckého and Zlatá ulička, which the document lists, have no addresses in the register and are left out. 'Lučenec' listed in okrsok 10 means the voters registered with the town only (no street address), not houses; it has no rule. fill_nearest places the addresses without a street, Rúbanisko II 19 and 49, Rúbanisko III 59 and 60 and Námestie republiky numbers above 25, which no range covers."
okrsky_date_approximate = "posted"
okrsky_date_seen = 2019-02-22
okrsky_date_basis = "The document is undated; the city's EP 2019 elections page (archived) lists 'Volebne okrsky EP.pdf' as 'Zverejnené 22.2.2019'. Its heading names the European Parliament election of 2019. (https://web.archive.org/web/20190917045254/https://www.lucenec.sk/historia/volby-do-ep.phtml?id5=32846)"
okrsky_supplemented = 2023-06-26
okrsky_supplemented_from = "document"
okrsky_supplement_basis = "The document does not list the newer streets Nezábudková ulica and Bazová ulica (next to Modré zeme and Vinohradná ulica, okrsok 1), Ulica rybničná (by Ulica športová and Tenisové ihrisko, okrsok 20) and Ulica Na Jazerách (Opatová, okrsok 25); the city's document for the National Council election of 2023 (same okrsky) lists them there, so they are placed as it does. (https://www.lucenec.sk/download_file_f.php?id=1879721)"

