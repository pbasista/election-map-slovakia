# The okrsky of Oravské Veselé of the vote of 2022-10-29, data/curated/elections/2022-10-29/okrsky/509931.toml, standing in, by `ems job reuse`. Its header there:
#   Okrsky of Oravské Veselé, transcribed by an AI agent in job okrsok-rules-843 from the documents below;
#   checked by `ems job ingest` against the address register. The document's
#   text per okrsok, verbatim:
#     okrsok 1: pre voličov oprávnených voliť s trvalým pobytom s .č. 0 - 412
#     okrsok 2: pre voličov oprávnených voliť s trvalým pobytom s .č. 413 - 999
obec = "509931"
name = "Oravské Veselé"
okrsky_date = 2022-08-05
okrsky_fill = "nearest"
okrsky_note = "Undated document; date is its posting date on the official notice-board page ('Vyvesené: 5. 8. 2022'). The okrsky are split by súpisné číslo of the voter's permanent residence (s. č. 0-412 and 413-999). Addresses with a súpisné číslo above 999 (if any) are placed by fill_nearest."
okrsky_adopted = 2022-10-29
okrsky_adopted_basis = "No document of 2023-01-21 setting the okrsky was found (okrsok-rules-3121): No document of this vote saying which addresses vote in which okrsok was found: the 2023 referendum notices only state that the obec has two volebné okrsky, without saying which houses vote in which. The obec's other election documents on its website (live, every item of its elections pages and notice board found by enumerating the CMS item numbers, and in the Internet Archive, which was temporarily offline at first and then queried) contain no okrsky document for this vote. The only documents on the website that split the obec's addresses between the okrsky are those of the elections of 29 October 2022 (s. č. 0-412 / 413-999) and of 24 October 2026 (s. č. 0-456 / 457-1034), which are another vote's and differ from each other, so neither can be used for this vote. These are the okrsky of the vote of 2022-10-29 (2022), the nearest in time with okrsky of its own that fit: 2 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2023-01-21 → 2022-10-29: 1: 1,119 → 1,133, 2: 1,184 → 1,176."

