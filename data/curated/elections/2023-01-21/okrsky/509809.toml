obec = "509809"
name = "Lokca"
okrsky_date = 2026-07-28
okrsky_fill = "nearest"
okrsky_note = "Komárnik, Hradská and Pri zdravotnom stredisku are listed in both okrsky as 'časť ulice' without saying which numbers; they get no rule and each of their addresses takes the okrsok of the nearest placed address (fill_nearest), as do the addresses without a street. Šípková (okrsok 1) and Jedľová (okrsok 2) are not in the address register and are left out."
okrsky_adopted = 2026-10-24
okrsky_adopted_basis = "No document of 2023-01-21 setting the okrsky was found (okrsok-rules-3222): Lokca's notice board lists only current items; probing its board files (e_download.php obsah300-1310_1, text and OCR of scans) found an okrsky document only for the elections of October 2026 (obsah1230); none for this vote. The Internet Archive refused connections (offline) during the search. These are the okrsky of the vote of 2026-10-24 (2026), the nearest in time with okrsky of its own that fit: 2 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2023-01-21 → 2026-10-24: 1: 959 → 1,024, 2: 886 → 903."

