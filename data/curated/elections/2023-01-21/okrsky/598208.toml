#   checked by `ems job ingest` against the address register. The document's
#   text per okrsok, verbatim:
#     okrsok 1: Bystrická (párne), Krásnohorská, Krompašská, Perešská, Revúcka, Svidnícka, Chatky, prihlásení na MČ
#     okrsok 2: Betliarska, Bystrická (nepárne), Gelnická, Haburská, Jasovská, Jelšavská, Medzevská, Na Košarisku, Sabinovská, Vranovská
obec = "598208"
name = "Košice-Pereš"
okrsky_date = 2022-08-09
okrsky_note = "Okrsok 1 also lists 'Chatky' (the garden cottages, numbered by súpisné číslo without a street: the register's addresses without a street) and 'prihlásení na MČ' (residents registered at the city district without an address, not placed); the addresses without a street are given to okrsok 1 as its rest."
okrsky_adopted = 2022-10-29
okrsky_adopted_basis = "No document of 2023-01-21 setting the okrsky was found (okrsok-rules-3154): The referendum notice of the city district (archived 2022-12-04) links 'Volebne miestnosti a okrsky' (download_file_f.php?id=1763827), but the live file now answers HTTP 404, the live notice no longer lists any files, and the Internet Archive has no capture of the PDF. The district's okrsky documents of 2022 and 2023 (NRSR) list the same two okrsky, but this vote's own document could not be read. These are the okrsky of the vote of 2022-10-29 (2022), the nearest in time with okrsky of its own that fit: 2 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2023-01-21 → 2022-10-29: 1: 874 → 892, 2: 843 → 858."

