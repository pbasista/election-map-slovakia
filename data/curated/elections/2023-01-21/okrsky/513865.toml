obec = "513865"
name = "Zliechov"
okrsky_date = 2022-07-12
okrsky_note = "The document gives each okrsok only its polling station; the okrsky are as many as the parts and each station lies in another part (okrsok 1: obecný úrad Zliechov č. 233; okrsok 2: Urbársky dom Košecké Rovné č. 71), so each okrsok is given the part of its station (inferred). Voters 363/89 fit Zliechov and the small Košecké Rovné."
okrsky_adopted = 2022-10-29
okrsky_adopted_basis = "No document of 2023-01-21 setting the okrsky was found (okrsok-rules-3268): Zliechov's elections documents (zliechov.sk/dokumenty/volby/, all categories: archív, komunálne, parlamentné, referendum, europarlament, VÚC, prezident) hold okrsky notices only for 2022 (Okrsky.pdf) and the NR SR election 2023; none for this vote. The Internet Archive refused connections (offline) during the search. These are the okrsky of the vote of 2022-10-29 (2022), the nearest in time with okrsky of its own that fit: 2 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2023-01-21 → 2022-10-29: 1: 372 → 363, 2: 92 → 89."

