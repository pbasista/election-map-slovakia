obec = "580899"
name = "Lužianky"
okrsky_fill = "nearest"
okrsky_note = "The mayor's 2022 announcement is not published; the okrsky come from the obec's newsletter (read from the rendered page, the text layer mixes the columns). 'občania s pobytom len obec Lužianky' (okrsok I) are voters registered without an address, no rule. The newsletter leaves out Čerešňová ulica, Cez panské, Dolné Hony, Golfová, Lipová ulica, Višňová ulica (new streets) and the addresses without a street: fill_nearest places them."
okrsky_adopted = 2022-10-29
okrsky_adopted_basis = "No document of 2023-01-21 setting the okrsky was found (okrsok-rules-3010): The referendum's document 'Vytvorenie volebného okrsku a určenie volebnej miestnosti' (article 'Referendum 23.01.2023' of 14.11.2022, file of 16.11.2022; also on the page Referendum 2023) only says the obec 'utvára na území obce Lužianky 2 volebné okrsky' with the polling stations in the Kultúrny dom; it names no streets, and the obec has one part, so the okrsky cannot be drawn from it. No other document of this vote found. These are the okrsky of the vote of 2022-10-29 (2022), the nearest in time with okrsky of its own that fit: 2 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2023-01-21 → 2022-10-29: 1: 1,307 → 1,309, 2: 1,267 → 1,274."
okrsky_date_approximate = "named"
okrsky_date_basis = "The okrsky are in the article 'Voľby do orgánov samosprávneho kraja a do orgánov samosprávy obce' of the obec's newsletter Lužianske novinky 2-3/2022 (October 2022), which says 'Voľby sa budú konať 29. 10. 2022 … V obci máme vytvorené dva okrsky' and lists the 2022 candidates. No decision date; the newsletter's page states no publication date of this issue and the earliest Internet Archive capture of the PDF is 2024-02-09 (after the vote)."

