okrsky_adopted_basis = "No document of 2023-01-21 setting the okrsky was found (okrsok-rules-3250): Every file of the notice board (data/uredni_deska/obsah1..460, all 442 present, scans OCR-read) was checked: okrsky documents exist only for 2018 (OZ resolution 242/OZ/2018), 2022 and the referendum of 2026; the 2017 file (obsah88_3.doc, \"Zoznam okrskov\") and the 2026 notice give only the 3 polling stations, and the municipality has 5 parts, so they cannot be turned into rules. Nothing for this vote. web.archive.org refused connections. These are the okrsky of the vote of 2022-10-29 (2022), the nearest in time with okrsky of its own that fit: 3 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2023-01-21 → 2022-10-29: 1: 379 → 382, 2: 91 → 95, 3: 110 → 104."

