okrsky_note = "The notice (03.08.2022) names settlements: okrsok 2 'Komárno, Ľuľovka, Brnovka', okrsok 3 'Žabica, Bratkovica, Blažková Jama'. Ľuľovka, Brnovka and Blažková Jama are not parts in the register (settlements inside the parts); the parts Detvianska Huta, Komárno, Žabica and Bratkovica are placed by part rules. The part Vrchdobroč is not named by the document; its addresses are placed by fill_nearest (nearest placed address). All addresses lack a street (súpisné only)."
