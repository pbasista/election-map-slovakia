okrsky_adopted_basis = "No document of 2023-01-21 setting the okrsky was found (okrsok-rules-3033): No retrievable okrsky document of this vote. The town's current website (dobsina.sk, Voľby a referendá) holds only the 2026 elections; the Internet Archive's captures of the old vote pages show okrsky notices for the referendum of 2023 (download_file_f.php?id=1761110) and the National Council election of 2023 (id=1878115), but these files are no longer on the site (404) and were not archived; for 2018, 2020, 2024, the by-elections of 2024 and 2025 and the referendum of 2026 no okrsky notice was found. These are the okrsky of the vote of 2019-05-25 (2019-ep), the nearest in time with okrsky of its own that fit: 2 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2023-01-21 → 2019-05-25: 1: 1,847 → 1,849, 2: 1,821 → 1,790."

