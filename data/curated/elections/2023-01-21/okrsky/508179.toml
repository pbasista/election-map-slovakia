okrsky_note = "Streets per okrsok as the document lists them; house-number ranges whose ends are both odd or both even are read as odd or even numbers. Streets the document names but the register lacks (Fortna, SOŠ PZ, Sasinkova ulica, Panský chodník, Vinohradnícka cesta, Ulica gen. Goliana) are left out; 'vrátane občanov, ktorí majú trvalý pobyt mesto Pezinok' (okrsok 1) means voters registered without an address. fill_nearest covers the register's addresses without a street, streets the document does not name and numbers of split streets it does not list. The Statistical Office counts a 19th okrsok that the document does not name: the COVID-19 special okrsok of okres Pezinok (Act No. 395/2022 Coll.), which has no territory (special-okrsky.toml)."

