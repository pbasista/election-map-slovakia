#     okrsok 2: pre oprávnených voličov bývajúcich na súpisných číslach: 316 – 422
#     okrsok 3: pre oprávnených voličov bývajúcich na súpisných číslach: 423 - 600
obec = "524603"
name = "Jarovnice"
okrsky_date = 2022-08-02
okrsky_note = "The mayor's decision of 2 August 2022 (posted 15 August 2022; the old /files/ link is gone, the same file is live on the municipality's new site under 'Voľby do orgánov samosprávy obcí 2022') splits the obec by súpisné čísla only: 0-315, 316-422, 423-600, without naming the parts; the same ranges are applied in both parts Jarovnice and Močidľany."
okrsky_adopted = 2022-10-29
okrsky_adopted_basis = "No document of 2023-01-21 setting the okrsky was found (okrsok-rules-3280): The current elections page starts with the 2024 presidential election; in the Internet Archive the 2017 regional, 2019 presidential and 2019 EP pages carry only the call of the elections, voter information and candidate lists, and no okrsky decision for the 2023 referendum or the NR SR 2023 election is archived. These are the okrsky of the vote of 2022-10-29 (2022), the nearest in time with okrsky of its own that fit: 3 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2023-01-21 → 2022-10-29: 1: 1,261 → 1,263, 2: 1,318 → 1,305, 3: 1,328 → 1,321."

