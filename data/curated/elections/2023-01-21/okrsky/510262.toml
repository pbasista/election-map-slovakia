okrsky_note = "Mayor's decision of 10.11.2022 for the referendum of 21 January 2023. Addresses without a street (súpisné číslo only) in časti Staré Mesto, Vrbica-Nábrežie, Podbreziny, Palúdzka, Okoličné, Liptovská Ondrašová etc. are not named by the document and take the okrsok of the nearest placed address (fill_nearest); so do houses on named streets whose súpisné číslo the document does not list. Street sides (Borbisova north/south, Jura Janošku east/west) are given as odd/even; the sections of 1. mája (at Kpt. Nálepku), Palúčanská (at Demänovská) and Ondrašovská (at Roľnícka) are split by orientačné čísla at the crossing seen in the address points (inferred). Okrsok 22 is the whole of časti Okoličné and Stošice (Smrečianska only in Okoličné; in Podbreziny it is okrsok 14). Streets the document names that the register lacks are left out. Brezovec (1 address, Liptovská Ondrašová) is not named and goes by fill_nearest. Against the rule set of 2023-09-30, this document does not name Veľké lúky (okrsok 3), Demänovská cesta súp. č. 865 (okrsok 11), Žiarska 1053 (okrsok 17), Pod stráňami 1233 (okrsok 32, so it stays in okrsok 3 under 'okrem súp. č. 812, 1099 a 1100') nor the Stošice streets Margarétkova, Pod horou, Podbeľová, Púpavova (okrsok 22 is still the whole of časť Stošice). The document does not name the COVID-19 special okrsok 33."

