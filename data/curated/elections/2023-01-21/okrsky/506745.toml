okrsky_note = "Scanned PDF of the primátor's decision of 8 November 2022, read from its page images. Streets split between okrsky follow the listed numbers ('od č. X do č. Y' as X-Y, 'párne'/'nepárne' as parity; '78D' as 78 and 78D); 'okrem č. 21A a 21B' (Hraničná, okrsok 25) as an exception. Na hlinách: okrsok 11 'od č. 2 do č. 64' and okrsok 12 'od č. 26 do č. 36' overlap; 26-36 is given to okrsok 12 and cut out of okrsok 11. 'bez ulice' (okrsok 2) are voters registered without an address. Not in the address register, left out: Námestie kráľovnej Konštancie (1), Ulica Jozefa Adamca, Ulica Mórica Beňovského, Ulica Sama Chalupku (10), Bazová ulica, Prašná ulica, Ulica Jozefa Adamoviča, Včelárska ulica (16), Rybárska ulica (8), Priečna ulica, Zimná ulica (15). 'Saleziánska ulica Strmá ulica' (14) lacks a comma: two streets. In okrsok 25 a street name is missing ('Chrenová ulica, ulica, Orechová ulica'); nothing is placed for it. Streets the document does not name (Pažitný mlyn, Prechodná ulica, ŠM Farský mlyn), numbers the lists leave out and about 1400 addresses without a street are placed by fill_nearest. The document does not name the COVID-19 special okrsok 26."

