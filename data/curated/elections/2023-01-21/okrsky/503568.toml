name = "Svodín"
okrsky_fill = "nearest"
okrsky_note = "The document is undated (published on the obec's Voľby 2026 page with the 2026 election documents). \"Novovieska\" is the register's Novovieska cesta (the only street of that name). Hlavné námestie and Krivá cesta, which the document does not name, and the addresses without a street take the okrsok of the nearest placed address."
okrsky_adopted = 2026-10-24
okrsky_adopted_basis = "No document of 2023-01-21 setting the okrsky was found (okrsok-rules-2988): No okrsky document found for this vote. The live elections page has only the 2026 municipal documents (with the 2026 okrsky list); the 2026 referendum notice has only the commission records; the site search for 'okrsk' finds nothing older. The Internet Archive's captures of the old (WordPress) and new site's election pages and notices (2017, 2018, 2019, referendum 2023, NR SR 2023) list voters' information, postal vote, e-mail and council-size notices, but no okrsky document, and its CDX of svodin.sk has no okrsky file. These are the okrsky of the vote of 2026-10-24 (2026), the nearest in time with okrsky of its own that fit: 2 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2023-01-21 → 2026-10-24: 1: 1,008 → 977, 2: 1,025 → 1,068."

