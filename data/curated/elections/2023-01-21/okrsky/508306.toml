okrsky_adopted_basis = "No document of 2023-01-21 setting the okrsky was found (okrsok-rules-3100): The old website (archiv.vinicne.sk) ends in June 2019; the new website (Webygroup) shows only the 2026 municipal elections' documents on its elections page, and the Internet Archive has no capture of an okrsky notice for this vote (only the commissions' minutes for 2024). No document of this vote found. These are the okrsky of the vote of 2019-05-25 (2019-ep), the nearest in time with okrsky of its own that fit: 2 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2023-01-21 → 2019-05-25: 1: 1,059 → 1,012, 2: 1,076 → 1,021."

