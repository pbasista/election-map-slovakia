okrsky_note = "The mayor's \"určenie\" gives each okrsok only its polling station; the streets come from the district's \"Zoznam ulíc v okrskoch\" (one line per address with voters: okrsok, street, house number). A street whose listed addresses are all in one okrsok is taken whole, a street split among okrsky by its listed numbers (consecutive numbers written as ranges). fill_nearest places what the list does not name: house numbers without voters on split streets, streets without a listed address and addresses without a street not listed. Entries \"RUŽINOV <číslo>\" / \"ZÁHRADA <číslo>\" are súpisné čísla of buildings without a street: only those that identify one register address without a street are rules (part Bratislava-Ružinov by súpisné číslo); \"PRAZDNE 9999\" is a placeholder and no rule. ČERNICOVÁ is the register's Stará Černicová, TRNAVSKÁ the register's Trnavská cesta. Okrsok 71 is the special okrsok (Drieňová 22) for postal voting of voters without permanent residence in Slovakia: addressless. The určenie (a scan) is headed \"70 volebných okrskov\" but lists 71, the 71st being the postal one."
