# The special okrsky of the referendum of 21 January 2023, besides what ŠÚ
# SR's package declares (tab0c, "Špeciálne volebné okrsky": each okres and
# whether its special okrsok voted; src/election_map_slovakia/special.py).
#
# Act No. 395/2022 Coll. set up one special okrsok per okres for the voters
# in COVID-19 quarantine (§ 3(1): "Územným obvodom špeciálneho volebného
# okrsku je okres";
# https://static.slov-lex.sk/static/SK/ZZ/2022/395/20221129.html). § 3(2)
# counts it as an okrsok of the okres seat, in Bratislava and Košice of the
# city district the head of the district office chose. The package tells
# the seat where an obec of the okres has its name or is its only one; the
# seats below are those of the other okresy, each counted as its city
# district's highest-numbered okrsok.

