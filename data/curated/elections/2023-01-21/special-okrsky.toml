basis = "No okrsky document of the district for the referendum is known (okrsky/not-found.json). Inferred from ŠÚ SR's tables: Nové Mesto has 46 okrsky in this vote and 45 in those of 29 October 2022 and 30 September 2023, and its okrsok 46 had 6 voters on its roll, all of whom voted; no other okrsok of okres Bratislava III had fewer than 400."

