title = "Určenie volebných okrskov, referendum 21. 1. 2023"
basis = "The district's určenie is headed \"70 volebných okrskov\" and lists a 71st, \"Osobitný volebný okrsok, Drieňová 22\", whose footnote speaks of postal voting from abroad; but those voters are counted under Zahraničie (599999), and ŠÚ SR counts 71 okrsky in Ružinov, the 71st with 3 voters on its roll, all of whom voted (tab02e): okres Bratislava II's special okrsok."

