note = "The council obvody of the vote of 2022-10-29: they only place the okrsky. Obvod 1 = part Dohňany (okrsok 1), obvod 2 = parts Mostište and Zbora (okrsky 2, 3), as the announcement and the okrsky document of 2022 state."
reused = 2022-10-29
okrsky_date = 2022-08-03
okrsky_note = "The okrsky document is undated; date is its publication date on the municipality's elections page ('Zverejnené 3.8.2022'). It names only the polling stations: obvod 1 = okrsok 1 (Dohňany); obvod 2 = okrsok 2 (Kultúrny dom Mostište) and okrsok 3 (Kultúrny dom Zbora). Okrsky 2 and 3 are taken as the parts Mostište and Zbora where their polling stations are (inferred; the counts fit: Mostište 98 addresses / 161 voters, Zbora 192 / 243)."
okrsky_adopted = 2022-10-29
okrsky_adopted_basis = "No document of 2023-01-21 setting the okrsky was found (okrsok-rules-3122): The referendum 2023 page exists only in the Internet Archive; it could not be fetched. The Internet Archive stayed unreachable (connection refused / HTTP 429) for well over 15 minutes of retries; the maintainer can retry the archived page. These are the okrsky of the vote of 2022-10-29 (2022), the nearest in time with okrsky of its own that fit: 3 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2023-01-21 → 2022-10-29: 1: 1,112 → 1,114, 2: 159 → 161, 3: 246 → 243."

