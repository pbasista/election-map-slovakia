obec = "542938"
name = "Horné Obdokovce"
date = 2022-06-24
note = "The council obvody of the vote of 2022-10-29: they only place the okrsky. Uznesenie 295/2022 (which replaced 285/2022) names obvod 1 Horné Obdokovce and obvod 2 Obsolovce. The part Bodok is placed with Horné Obdokovce: the 2022 okrsky decision puts Bodok and Horné Obdokovce in okrsok 1, which is obvod 1 per ŠÚ SR."
reused = 2022-10-29
okrsky_date = 2022-06-24
okrsky_note = "Every obvod has exactly one okrsok (okrsok n = obvod n, per the Statistical Office); the okrsok is the whole obvod as the 2022 obvody document sets it, so no separate okrsky list is needed for the rules. Text = the document's words on the obvod. Date = the resolution that set the obvody/okrsky split."
okrsky_adopted = 2022-10-29
okrsky_adopted_basis = "No document of 2023-01-21 setting the okrsky was found (okrsok-rules-3258): The 2023 referendum page (referendum-2023.html, linked from the menu in a capture of 2023-07-08) is gone (404) and was never archived; no okrsky document of the referendum found elsewhere on the site or in the Archive. The only okrsky document the website has (live and archived) is the mayor's 'Utvorenie volebných okrskov a určenie volebných miestností' of the elections of 29 October 2022 (download_file_f.php?id=1734793, posted 4.8.2022: okrsok 1 Bodok and Horné Obdokovce, okrsok 2 Obsolovce), which is another vote's document. The Internet Archive answered only intermittently (often 'Temporarily Offline' or connection refused) but its CDX lists were obtained; it holds no okrsky document of this vote. The live host rate-limited (HTTP 429) part of the time. These are the okrsky of the vote of 2022-10-29 (2022), the nearest in time with okrsky of its own that fit: 2 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2023-01-21 → 2022-10-29: 1: 975 → 1,024, 2: 212 → 215."

