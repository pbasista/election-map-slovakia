okrsky_adopted_basis = "No document of 2026-07-04 setting the okrsky was found (okrsok-rules-5752): The obec's website (hrochot.sk) keeps no okrsky document for this vote: its elections page and the aktuality of the months before the vote (all 33 pages read) hold only other notices; the notice board keeps no older items. The Internet Archive was offline (HTTP 503 'Temporarily Offline') on repeated tries, so archived copies could not be checked. The okrsky document on the OZNAM page of 26 Jun 2026 (image 17935) is the mayor's of 9 Jul 2026 for the elections of 24 Oct 2026, after this referendum, so it is not this vote's. These are the okrsky of the vote of 2026-10-24 (2026), the nearest in time with okrsky of its own that fit: 2 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2026-07-04 → 2026-10-24: 1: 984 → 986, 2: 201 → 206."

