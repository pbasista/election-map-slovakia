okrsky_note = "The document is an image on the obec's OZNAM page. It lists 'Hlavná ulica' in both okrsky without house numbers, so Hlavná ulica has no rule: its houses take the okrsok of the nearest placed address (fill_nearest), as do Stará voda (not in the document) and addresses without a street. Okrsok 1 also holds 'pobyt bezdomovca'."
