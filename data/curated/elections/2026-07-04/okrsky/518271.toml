okrsky_adopted_basis = "No document of 2026-07-04 setting the okrsky was found (okrsok-rules-5697): The referendum notice of 6.5.2026 (obsah407_1.pdf) gives only the 3 polling stations (Detvianska Huta 101, Komárno 237, spol. miestnosť SAD Blažkova jama); the municipality has 5 parts, so the okrsky cannot be drawn from it. Every file of the notice board (data/uredni_deska/obsah1..460, all 442 present, scans OCR-read) was checked: okrsky documents exist only for 2018 (OZ resolution 242/OZ/2018), 2022 and the referendum of 2026; the 2017 file (obsah88_3.doc, \"Zoznam okrskov\") and the 2026 notice give only the 3 polling stations, and the municipality has 5 parts, so they cannot be turned into rules. Nothing for this vote. web.archive.org refused connections. These are the okrsky of the vote of 2026-10-24 (2026), the nearest in time with okrsky of its own that fit: 3 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2026-07-04 → 2026-10-24: 1: 377 → 390, 2: 98 → 100, 3: 107 → 103."

