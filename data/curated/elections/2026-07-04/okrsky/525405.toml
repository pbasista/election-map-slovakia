obec = "525405"
name = "Veľký Šariš"
okrsky_date = 2022-11-10
okrsky_fill = "nearest"
okrsky_note = "'mesto Veľký Šariš' in the document means voters registered without an address and gets no rule. Železničná (4 addresses) is named in no okrsok, and the houses without a street are not listed: both are placed by fill_nearest. The document writes 'Marina Šarošiho' for Martina Šarošiho. Its okrsok 4 (Stará škola, Kanaš) also takes Dlhá and Pod Sordokom of part Veľký Šariš, as written. The announcement is dated 'Veľký Šariš, 10.11.2022'."
okrsky_adopted = 2023-01-21
okrsky_adopted_basis = "No document of 2026-07-04 setting the okrsky was found (okrsok-rules-5366): The mayor's 'Rozhodnutie primátora mesta Veľký Šariš o utvorení volebných okrskov a určení volebných miestností pre referendum, ktoré sa bude konať dňa 04.07.2026' existed (Internet Archive capture 2026-05-12), but the live item and its referendum module are removed, and the Archive capture could not be read: the Archive stayed unreachable (429 / connection refused) for well over 15 minutes. The maintainer can retry the capture. These are the okrsky of the vote of 2023-01-21 (2023-referendum), the nearest in time with okrsky of its own that fit: 4 okrsky (nearer, not taken: 2026-10-24: okrsky 1–7, then 1–4; 2024-06-08: okrsky 1–6, then 1–4; 2024-03-23: okrsky 1–6, then 1–4; 2023-09-30: okrsky 1–6, then 1–4). Voters on the roll per okrsok (ŠÚ SR), 2026-07-04 → 2023-01-21: 1: 1,312 → 1,326, 2: 1,378 → 1,329, 3: 1,367 → 1,316, 4: 1,278 → 1,141."

