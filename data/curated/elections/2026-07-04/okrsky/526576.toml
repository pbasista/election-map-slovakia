okrsky_adopted_basis = "No document of 2026-07-04 setting the okrsky was found (okrsok-rules-5762): No okrsky document of the 2026 referendum found: the notice board's 'REFERENDUM 2026' entries are the information on voting rights and the two okrsky's result protocols (posted 6 Jul 2026); the 'Utvorenie volebných okrskov a určenie volebných miestností' of 9 Jul 2026 (detail 75113) is for the municipal elections, after the referendum. The copy stays. The Internet Archive was reachable. These are the okrsky of the vote of 2026-10-24 (2026), the nearest in time with okrsky of its own that fit: 2 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2026-07-04 → 2026-10-24: 1: 221 → 220, 2: 238 → 243."

