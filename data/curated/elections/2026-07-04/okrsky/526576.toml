okrsky_note = "Okrsok 1 covers voters 'od súp. čísla 92' plus the settlements Zimná dolina, Cechy, Štolvek, Grétla, which are not parts in the register (they lie within part Hnilčík and are assumed to be within the 92+ numbering); okrsok 2 the 'Dolná časť obce' (read as súpisné čísla below 92 in part Hnilčík), the parts Ráztoky and Bindt, and residents registered only to the obec."
