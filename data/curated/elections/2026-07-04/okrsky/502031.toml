okrsky_date = 2026-04-27
okrsky_fill = "nearest"
okrsky_note = "The document's 45 okrsky are word for word those of the elections of 2026-10-24 (document of 16.07.2026), so their rule set is reused unchanged. Okrsky 1-20 lie in obvod 1 and 21-45 in obvod 2 (streets match the obvody resolution). The PDF text layer is OCR with errors (e.g. 'Zcppclina', 'Hlboká ul. 3, 7, 9, 11.30, 32' read as 11, 30, 32; 'Z. Nejedlého 18-3.8' as 18-38); Z. Nejedlého 15-25 in okrsok 21 is taken as odd with 47-71 per the obvod resolution. Okrsky 42-45 are the whole parts Malý Kiar, Kalinčiakovo (with Rekreačná ulica), Horša, Čankov; they get part rules. Localities without register streets (Predné Staré Levice, Stredné Levice, Staré Levice, Studená dolina, ZO Šiklóš, VO Pišla, ZO Zlatý Onyx, Studený bok, Vargov vrch in okrsok 18; Strážny vrch in 39) and residents registered only to the city (okrsok 15) have no rules. Unlisted house numbers (e.g. odd ku Bratke, other Mochovská, Perecká 33-43, Ľ. Štúra 49-63 not listed) and addresses without street take the nearest okrsok (fill_nearest)."

