obec = "510025"
name = "Rabča"
okrsky_date = 2023-01-17
okrsky_fill = "nearest"
okrsky_note = "These okrsky were transcribed for the elections of 2022-10-29 from the municipality's document for the referendum of 2023-01-21: they are the referendum's own. No document of the elections found (the 2022 elections pages, live and archived, hold no okrsky document; the 2022 article 'Ako voliť v spojených voľbách' gives only the polling stations, the same as for the referendum: okrsky 1 and 2 in the Kultúrny dom, okrsok 3 in the school); the referendum's document: the official article of 17 January 2023 (date is its posting date, 'Dátum vloženia'), which splits the okrsky by house numbers (č. d., read as súpisné čísla) plus the streets Mokrá and Pod Magurou in okrsok 2. 'Nové čísla domov' (new house numbers) of each okrsok cannot be placed from the text; numbers above 1035 take the okrsok of the nearest address (fill_nearest)."
okrsky_adopted = 2023-01-21
okrsky_adopted_basis = "No document of 2026-07-04 setting the okrsky was found (okrsok-rules-5431): The referendum 2026 materials on the homepage (information for voters, delegation, minutes, results) contain no okrsky document. No okrsky document of this vote on rabca.sk (new site's notice board and elections sections searched; old Joomla site's election notices in the Internet Archive hold only voter information, delegation and results). The only okrsky text found is the referendum 2023 article (house-number split), which is another vote's. The Internet Archive answered with frequent HTTP 429. These are the okrsky of the vote of 2023-01-21 (2023-referendum), the nearest in time with okrsky of its own that fit: 3 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2026-07-04 → 2023-01-21: 1: 1,308 → 1,285, 2: 1,342 → 1,236, 3: 1,257 → 1,214."

