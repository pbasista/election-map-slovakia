obec = "504106"
name = "Trstice"
okrsky_note = "Only document found is the obec announcement of 22.10.2026 giving okrsky by house numbers (súpisné, no streets in Trstice); no date of the mayor's decision stated."
okrsky_adopted = 2026-10-24
okrsky_adopted_basis = "No document of 2026-07-04 setting the okrsky was found (okrsok-rules-5456): The only okrsky statement for the referendum of 4 July 2026 is in 'Referendum 2026' (notice-board item 405, posted 21.5.2026, https://www.trstice.sk/e_download.php?file=/data/uredni_deska/obsah390_1.pdf, page 3): '3 volebné okrsky v obci Trstice', polling stations 1. Obecný úrad č. 667, 2. Komunitný dom č. 1322, 3. Základná škola č. 647, with no house numbers or territory. Trstice has a single part and no streets (all addresses are súpisné čísla), so a list of polling stations alone cannot be turned into rules (3 okrsky, 1 part). The radio announcements on the site start in May 2026 and none before 4 July 2026 concerns the referendum; the house-number ranges (1–500, 501–1000, 1001–) appear only in the announcement for the elections of 24 October 2026. Every item of the official notice board (úradná tabuľa, items 1–444, 2016–2026, incl. the items migrated from the old Joomla site) was listed by id and every election item opened; the Internet Archive (CDX of trstice.sk, old site trstice.sk/sk/aktuality/…) was searched for election pages and radio announcements (hlásenie miestneho rozhlasu) around the vote; the IA was slow and often refused connections, but the pages listed in tried were retrieved. These are the okrsky of the vote of 2026-10-24 (2026), the nearest in time with okrsky of its own that fit: 3 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2026-07-04 → 2026-10-24: 1: 1,052 → 1,057, 2: 1,092 → 1,106, 3: 1,032 → 1,043."

