okrsky_note = "The district's text lists streets with house-number ranges and parity (párne/nepárne); 'párne, nepárne' means all numbers in the range. Streets the document names but the register lacks (Tvrdošínska, Fiľakovská, Prievidzská, Žarnovická, Chatová lokalita) are left out. fill_nearest covers the register's addresses without a street, streets the document does not name and numbers outside the listed ranges. The notice: voters with permanent residence in Košice-Západ without an address are in okrsok 2. The Statistical Office counts a 17th okrsok that the notice does not name: the COVID-19 special okrsok of okres Košice II (Act No. 395/2022 Coll.), which has no territory (special-okrsky.toml)."
okrsky_adopted = 2023-01-21
okrsky_adopted_basis = "No document of 2026-07-04 setting the okrsky was found (okrsok-rules-5269): No okrsky document of this vote found: the district's current website (kosicezapad.sk, sections per vote under 'Voľby, referendá a SODB') holds only the commissions' minutes for the votes of 2023-2026, and the Internet Archive's index of kosicezapad.sk (including archiv.kosicezapad.sk) lists okrsky notices only for 2017, 2018, 2019, 2022 and the referendum of 2023. These are the okrsky of the vote of 2023-01-21 (2023-referendum), the nearest in time with okrsky of its own that fit: 16 okrsky (nearer, not taken: 2026-10-24: okrsky 1–31, then 1–16). Voters on the roll per okrsok (ŠÚ SR), 2026-07-04 → 2023-01-21: 1: 2,525 → 2,625, 2: 2,814 → 2,463, 3: 1,548 → 1,525, 4: 1,317 → 1,376, 5: 1,746 → 1,832, 6: 1,643 → 1,805, 7: 1,721 → 1,808, 8: 1,749 → 1,806, 9: 1,578 → 1,692, 10: 1,799 → 1,888, 11: 1,823 → 1,901, 12: 1,977 → 2,046, 13: 1,953 → 1,955, 14: 1,782 → 1,931, 15: 1,439 → 1,523, 16: 2,595 → 2,682."
