okrsky_note = "Two-column table in the DOCX. 'Divín - Lazy' read as part Divínske Lazy. 'Divín' in okrsok 2 (residents without a street address) and 'Rekreačná oblasť' (column unclear, not in register) get no rule; addresses without a street take the nearest okrsok. Námestie mieru = register Námestie Mieru (case)."
okrsky_adopted = 2026-10-24
okrsky_adopted_basis = "No document of 2026-07-04 setting the okrsky was found (okrsok-rules-5580): The referendum notice of 05.05.2026 (\"oznámenie o počte utvorených volebných okrskov\") states only that okrsky č. 1 and č. 2 vote in the Kultúrny dom Divín; it names no streets, and both okrsky have the same polling station, so the okrsky cannot be drawn from it. The old site (archived in the Internet Archive: pages of the presidential and EP elections 2019, NR SR 2020 and 2023, presidential 2024, municipal 2018) and the new site (all election documents migrated) have for this vote only the decree, voter information, delegation notices and results; no document of the okrsky. The only okrsky documents are those of 2022 and 2026. These are the okrsky of the vote of 2026-10-24 (2026), the nearest in time with okrsky of its own that fit: 2 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2026-07-04 → 2026-10-24: 1: 775 → 765, 2: 842 → 844."

