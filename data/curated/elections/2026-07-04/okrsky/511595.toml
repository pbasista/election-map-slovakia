#     okrsok 2: voliči od súpisného čísla 351 - 520
obec = "511595"
name = "Málinec"
okrsky_date = 2026-07-09
okrsky_note = "Scanned PDF read from the image. The document divides by súpisné číslo (1–350 / 351–520) plus the parts Dobrý Potok, Ipeľ, Vlčovo in okrsok 1. The numbers are applied to the parts Málinec and Chladná Studňa (the latter not named in the document); okrsok 2 is the rest (351–520 and anything outside the ranges). The part Chladná Studňa has only súpisné čísla above the okrsok 1 range, so it falls to okrsok 2."
okrsky_adopted = 2026-10-24
okrsky_adopted_basis = "No document of 2026-07-04 setting the okrsky was found (okrsok-rules-5732): The website's media library holds okrsky notices only for 2022, NR SR 2023, presidential 2024 and the 2026 municipal elections. The 2023 referendum and EP 2024 posts (live and archived) carry only the call and the generic voter information; the 2026 referendum post has the call, voter info and results only; no okrsky document for 2017–2020 is on the site or in the Internet Archive (the 2020 category page lists only results). These are the okrsky of the vote of 2026-10-24 (2026), the nearest in time with okrsky of its own that fit: 2 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2026-07-04 → 2026-10-24: 1: 544 → 545, 2: 545 → 553."

