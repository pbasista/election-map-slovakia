okrsky_note = "Undated one-page notice attached to the 2026 election item on the úradná tabuľa. Numbers are súpisné čísla. Okrsok 2 covers 434-1736 plus Svarín and Čierny Váh (settlements numbered up to 3030, not parts in the register), so its range is taken as 434-3030. Addresses outside these ranges take the nearest placed okrsok."
okrsky_adopted = 2026-10-24
okrsky_adopted_basis = "No document of 2026-07-04 setting the okrsky was found (okrsok-rules-5586): The notice board (live since 2017) and its full-text search show okrsky notices only for the referendum of 2023 and the presidential and EP elections of 2024 (okrsok 1 houses 1–433, okrsok 2 houses 434 and up with Svarín and Čierny Váh); for this vote only the okrsky commissions' minutes or nothing are published. These are the okrsky of the vote of 2026-10-24 (2026), the nearest in time with okrsky of its own that fit: 2 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2026-07-04 → 2026-10-24: 1: 840 → 839, 2: 1,038 → 921."

