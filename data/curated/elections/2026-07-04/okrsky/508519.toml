okrsky_adopted_basis = "No document of 2026-07-04 setting the okrsky was found (okrsok-rules-5788): The live úradná tabuľa of cerin.sk reaches back only to about 2024; its only okrsky notices are for the 2024 presidential election (25.01.2024), the 2024 EP election (07.03.2024) and the municipal/regional elections of 24.10.2026 (29.07.2026), each listing okrsok 1 Čerín and okrsok 2 Čačín. The Internet Archive CDX API returned some results once, then stayed offline (504 / connection failures) over several retries with pauses, so archived pages of this vote could not be checked. For the referendum of 4 July 2026 the board has only the page \"Referendum 4. júla 2026\" (posted 22.4.2026) with information on voting conditions, no okrsky notice; the 29.07.2026 notice is for the October 2026 elections, after the referendum. These are the okrsky of the vote of 2026-10-24 (2026), the nearest in time with okrsky of its own that fit: 2 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2026-07-04 → 2026-10-24: 1: 256 → 257, 2: 108 → 114."

