okrsky_adopted_basis = "No document of 2026-07-04 setting the okrsky was found (okrsok-rules-5472): The only okrsky document found for these votes (referendum 2023, archived) names each okrsok only by its area and polling station (1 Ústredie, 2 Nižný Kelčov, 3 Vyšný Kelčov), without the parts or houses it covers; the municipality has 8 parts and the part Vysoká nad Kysucou is split between okrsky 1 and 2, so the okrsky cannot be drawn from it. The website and the Internet Archive hold no other okrsky document for 2017–2026 (the 2026 area descriptions are for the October 2026 elections). These are the okrsky of the vote of 2026-10-24 (2026), the nearest in time with okrsky of its own that fit: 3 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2026-07-04 → 2026-10-24: 1: 1,120 → 1,134, 2: 507 → 515, 3: 416 → 427."

