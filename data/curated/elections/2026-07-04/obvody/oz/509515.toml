obec = "509515"
name = "Vysoká nad Kysucou"
date = 2026-06-24
note = "The council obvody of the vote of 2026-10-24: they only place the okrsky. Decided by Uznesenie č. 5/2026-15.6 of the OZ on 24.06.2026 (PDF 'Uznesenia OZ 5/2026', published on the council portal app.digi-sprava.cz/verejny-portal/vysoka-nad-kysucou linked from the obec's site as 'Obecné zastupiteľstvo od roku 2026'; the download needs a session cookie and the host is not the obec's domain, so it is not listed in documents). The obec's elections page repeats the obvody text verbatim; seats (5/2/2) are from the resolution and match the registered-candidates list on the obec's site. The resolution splits the časť Vysoká nad Kysucou (no streets, súpisné čísla only) into 'Nižný koniec, Ústredie po cestu Furmanec' (obvod 1) and 'Vyšný koniec' (obvod 2) without listing numbers; the boundary was placed at the unnamed road branching south from road 487 at about 18.5296 E toward the Furmanec locality (OSM way 227054437), which coincides with the break between súpisné čísla 384 and 385. Houses directly along that road and the exact boundary are uncertain."
reused = 2026-10-24
