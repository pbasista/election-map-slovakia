obec = "504891"
name = "Šaštín-Stráže"
date = 2026-06-17
fill = "nearest"
note = "The council obvody of the vote of 2026-10-24: they only place the okrsky. Source is the mayor's announcement of 15 July 2026 citing resolution No. 685/2026 of 17 June 2026 (11 councillors, 3 obvody). Obvod 1 is defined as the cadastral area of the town part Stráže; obvody 2 and 3 list the streets of Šaštín. The document does not place the addresses without a street in the part Šaštín (súpisné čísla such as 550, 559, 623, 686, 1026, 1482, 1508, 1727); fill_nearest assigns them to the obvod of the nearest address. Šaštín 548 (no street, part Šaštín) is located in k.ú. Stráže nad Myjavou, so the k.ú. rule places it in obvod 1."
reused = 2026-10-24
okrsky_note = "The okrsky document assigns one okrsok to each obvod (okrsok n in obvod n) and gives only the polling stations; each okrsok is its whole obvod. The document is undated."
okrsky_adopted = 2026-10-24
okrsky_adopted_basis = "No document of 2026-07-04 setting the okrsky was found (okrsok-rules-5400): Šaštín-Stráže publishes for each vote only the addresses of the polling stations (e.g. \"Adresy volebných okrskov pre Referendum v r. 2026\": okrsok 1 ZŠ Hviezdoslavova 1462 in Stráže, okrsky 2 and 3 both in the Mestský úrad, Alej 549, Šaštín); no document says which streets of Šaštín belong to okrsok 2 or 3, so no rules can be written. Older votes' pages are gone from the new website, and the Internet Archive stayed unreachable (CDX timeouts / connection refused) during the search. These are the okrsky of the vote of 2026-10-24 (2026), the nearest in time with okrsky of its own that fit: 3 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2026-07-04 → 2026-10-24: 1: 1,463 → 1,478, 2: 1,234 → 1,430, 3: 1,329 → 1,172."

