obec = "509876"
name = "Nižná"
okrsky_date = 2019-02-06
okrsky_fill = "nearest"
okrsky_note = "Hviezdoslavova and Nová doba are split by súpisné čísla as listed; their other numbers, the register streets the document does not name (Sihoť, Samota Hldočín, Samota-mlyn) and houses without a street are placed by fill_nearest. Okrsok 4 (Kultúrny dom Zemianska Dedina) is the part Zemianská Dedina."
okrsky_adopted = 2019-05-25
okrsky_adopted_basis = "No document of 2020-02-29 setting the okrsky was found (okrsok-rules-2433): The archived 2020 NR SR page (2019-12-10) lists the announcement and voter information only; no okrsky document. These are the okrsky of the vote of 2019-05-25 (2019-ep), the nearest in time with okrsky of its own that fit: 4 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2020-02-29 → 2019-05-25: 1: 913 → 949, 2: 1,074 → 1,091, 3: 1,015 → 1,025, 4: 200 → 198."

