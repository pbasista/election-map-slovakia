okrsky_note = "Okrsky set 28.07.2022 (both polling stations at Nitrianska 6). The register's addresses without a street (in the part Kalná and Kalnica, numbered by súpisné číslo) and Nádražná (not in the document) are placed by fill_nearest. The referendum 2023 document has a single okrsok and was not used. The part Mochovce is put in okrsok 2 by inference (see its rule)."
