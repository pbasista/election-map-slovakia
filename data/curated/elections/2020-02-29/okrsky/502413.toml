okrsky_adopted_basis = "No document of 2020-02-29 setting the okrsky was found (okrsok-rules-2525): No 2020 okrsky document found. The live site no longer has a 2020 elections page. The Internet Archive's captures of the 2020 elections page (http://www.kalna.eu/volby-do-nr-sr/, 2019-11-16, 2019-11-22, 2020-01-15) link only 'Informácie pre voliča' (Slovak and Hungarian) and 'Hlasovanie poštou'; the notice/announcements page captured 2020-02-17 has no okrsky notice; the CDX lists no okrsky PDF of 2019–2020. The copy's 2022 document differs from the 2023–2024 documents (Školská, Viničná), so it cannot be assumed for 2020. These are the okrsky of the vote of 2022-10-29 (2022), the nearest in time with okrsky of its own that fit: 2 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2020-02-29 → 2022-10-29: 1: 828 → 786, 2: 867 → 913."

