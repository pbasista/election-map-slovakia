okrsky_note = "The town's old website rajec.info (rajec.sk redirected to it until 2024), as archived by the Internet Archive. Hollého 50-59 and 118-120, Nádražná 24 and Kukučínova are named by no okrsok: inferred rules (see rule notes). Addresses without a street (part Rajec, súpisné čísla) are not placed by the document; fill_nearest gives them the okrsok of the nearest placed address. 'Občania bez domova s trvalým pobytom Rajec 0' (homeless voters registered at the town) vote in okrsok 3; they have no address. Differs from the copied 2026 okrsky: Nádražná 64 is in okrsok 3 (not 2), Partizánska only to 146 in okrsok 4, Hollého to 117 without 117A, no Rajec 5042/5177 or Dubová ulica."
