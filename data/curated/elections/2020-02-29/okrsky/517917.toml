okrsky_supplement_basis = "The document leaves out Nádražná 65 (it ends okrsok 3 at 38-64) and Partizánska 147 (okrsok 4 has 144-146); the next okrsky document, the mayor's of 9 August 2022, has Nádražná 38-65 in okrsok 3 and Partizánska 144-147 in okrsok 4, so these two addresses are placed as there. (https://web.archive.org/web/20230923203454/http://www.rajec.info/files/84844-Volebne-okrsky.pdf)"

