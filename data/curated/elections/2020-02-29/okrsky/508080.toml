obec = "508080"
name = "Marianka"
okrsky_fill = "nearest"
okrsky_note = "The document does not list Lúčna and Veterná (and the 37 register addresses without a street, súpisné only); these are placed by fill_nearest. 'Obyvatelia s trvalým pobytom na Obci Marianka' (residents registered without an address) are in okrsok 2."
okrsky_adopted = 2018-11-10
okrsky_adopted_basis = "No document of 2020-02-29 setting the okrsky was found (okrsok-rules-2448): The live site lists elections only from 2022; the Internet Archive (CDX of marianka.sk 2017-2026) holds no page or file of the National Council election of 29 February 2020 (no capture of the site between late 2019 and August 2020 of any elections page). The 2018 and 2021 documents differ from each other, so neither can be assumed for 2020. These are the okrsky of the vote of 2018-11-10 (2018), the nearest in time with okrsky of its own that fit: 2 okrsky. The voters on the roll per okrsok are not known for both votes, so whether the layout changed is not known either."
okrsky_date_approximate = "posted"
okrsky_date_seen = 2018-10-19
okrsky_date_basis = "The municipality's page 'VOLEBNÉ OKRSKY' (as archived on 2019-08-18) states 'Posledná úprava: 19.10.2018': its content was last changed on 19 October 2018, before the elections of 10 November 2018, so it is the okrsky list published for them; the page itself states no decision date. No capture before the vote exists. (https://web.archive.org/web/20190818085541/https://www.marianka.sk/som-obcan/aktuality/volebne-okrsky.html)"

