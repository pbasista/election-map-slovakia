name = "Ivanka pri Nitre"
okrsky_fill = "nearest"
okrsky_note = "The municipality's notice on the 2018 okrsky and the time and place of the vote lists the streets of each of its 3 okrsky. Not named: Agátová, Brezová, Buková, Dubová, Jaseňová, Javorová and Vŕbová ulica (a newer residential area) and the addresses without a street; these take the okrsok of the nearest address (fill_nearest)."
okrsky_adopted = 2018-11-10
okrsky_adopted_basis = "No document of 2020-02-29 setting the okrsky was found (okrsok-rules-2445): The 2020 NR SR page only says 'V obci budú zriadené 3 volebné okrsky', no streets. The only okrsky documents on ivankaprinitre.sk are of 2022-11 (referendum 2023), 2023-06 (NR SR 2023), 2024-01 (president 2024), 2024-03 (EP 2024), giving only the three polling stations (all in the Kultúrny dom), and 2026-07 (municipal/regional 2026-10-24, with streets). Internet Archive was reachable. These are the okrsky of the vote of 2018-11-10 (2018), the nearest in time with okrsky of its own that fit: 3 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2020-02-29 → 2018-11-10: 1: 701 → 714, 2: 861 → 876, 3: 757 → 747."
okrsky_date_approximate = "named"
okrsky_date_basis = "The document's second page, 'Informácia o čase a mieste konania volieb do orgánov samosprávy obcí', names the vote of 10 November 2018 (its first point miswrites it as 'voľby do orgánov samosprávnych krajov ... 10. novembra 2018'); it states no date of the decision, and the Common Crawl captured it only on 2019-01-21."

