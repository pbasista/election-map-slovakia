obec = "525634"
name = "Dobšiná"
okrsky_date = 2019-01-24
okrsky_fill = "nearest"
okrsky_note = "Streets per okrsok as the document lists them. 'bez adresy' / 'bez názvu ulice' means voters registered without an address and gets no rule. fill_nearest covers the register's addresses without a street."
okrsky_adopted = 2019-03-16
okrsky_adopted_basis = "No document of 2020-02-29 setting the okrsky was found (okrsok-rules-2411): No retrievable okrsky document of this vote. The town's current website (dobsina.sk, Voľby a referendá) holds only the 2026 elections; the Internet Archive's captures of the old vote pages show okrsky notices for the referendum of 2023 (download_file_f.php?id=1761110) and the National Council election of 2023 (id=1878115), but these files are no longer on the site (404) and were not archived; for 2018, 2020, 2024, the by-elections of 2024 and 2025 and the referendum of 2026 no okrsky notice was found. These are the okrsky of the vote of 2019-03-16 (2019-prezident), the nearest in time with okrsky of its own that fit: 3 okrsky (nearer, not taken: 2019-05-25: okrsky 1, 2, then 1–3). Voters on the roll per okrsok (ŠÚ SR), 2020-02-29 → 2019-03-16: 1: 1,086 → 1,087, 2: 1,232 → 1,252, 3: 1,327 → 1,286."

