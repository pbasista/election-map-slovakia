okrsky_adopted_basis = "No document of 2020-02-29 setting the okrsky was found (okrsok-rules-2310): No okrsky document of the 2020 NR SR election found. The old site's elections page (komunalne-volby-2018.phtml?id5=31524, reused for every vote) was captured by the Internet Archive only on 2019-07-22, when it showed the 2019 presidential election; the e-board (elektronicka-uradna-tabula.phtml) only in Dec 2021; the PDFs captured from 2017-2021 carry no titles and none is linked from a captured page of this vote. The live site (rebuilt 2022) has no pages for votes before 2022 and its later elections pages are gone (404). These are the okrsky of the vote of 2019-03-16 (2019-prezident), the nearest in time with okrsky of its own that fit: 6 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2020-02-29 → 2019-03-16: 1: 957 → 971, 2: 527 → 547, 3: 653 → 679, 4: 996 → 1,044, 5: 1,231 → 1,272, 6: 483 → 477."

