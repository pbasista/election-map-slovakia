# The okrsky of Stará Ľubovňa of the vote of 2019-05-25, data/curated/elections/2019-05-25/okrsky/526665.toml, standing in, by `ems job reuse`. Its header there:
#   Okrsky of Stará Ľubovňa, transcribed by an AI agent in job okrsok-rules-1665 from the documents below;
#   checked by `ems job ingest` against the address register. The document's
#   text per okrsok, verbatim:
#     okrsok 1: 1.mája, Hviezdoslavova, Farbiarska, Garbiarska, Nám. sv. Mikuláša, Levočská, Popradská 2, 4, Stará Ľubovňa - bez ulice
#     okrsok 2: SNP, Janka Kráľa, Prešovská, Duklianskych hrdinov, Za vodou 1, Jarmočná
#     okrsok 3: Za vodou 2 - 31
#     okrsok 4: Popradská - okrem č. 2 a 4, Mýtna, Poľská, Zámocká, Zamoyského, Továrenská
#     okrsok 5: Podsadek
#     okrsok 6: Zimná, Vsetínska, Bernolákova, Tehelná, Štúrova
#     okrsok 7: Okružná 1 - 23 /nepárne čísla/, Okružná 2 - 34 /párne čísla/, Mierová 1 - 6, Letná 1 - 5, Vansovej
#     okrsok 8: Okružná 25 - 127 /nepárne čísla/, Komenského, Tatranská
#     okrsok 9: Letná 7, Letná 8 - 38 /párne čísla/
#     okrsok 10: Mierová 7 - 91 /nepárne čísla/, Letná 11 - 23 /nepárne čísla/
#     okrsok 11: Okružná 36 - 82 /párne čísla/, Letná 25 - 33 /nepárne čísla/
#     okrsok 12: Mierová 14 - 54 /párne čísla/, Lipová
#     okrsok 13: Nám. gen. Štefánika, 17. novembra, Sládkovičova, Budovateľská, Obrancov mieru
#     okrsok 14: Mierová 8 - 12 /párne čísla/, Mierová 56 - 88 /párne čísla/
obec = "526665"
name = "Stará Ľubovňa"
okrsky_date = 2019-02-18
okrsky_fill = "nearest"
okrsky_note = "'Stará Ľubovňa - bez ulice' (okrsok 1) means voters registered without an address, so it has no rule. Obchodná is not named in the document; it and the addresses without a street and the house numbers the ranges leave out take the okrsok of the nearest address (fill_nearest). The whole part Podsadek is okrsok 'Podsadek'. The document does not name Michalská ulica, Rastislavova ulica and Ľubomírska ulica (newer streets, one address each, by Továrenská/Zámocká): they take the okrsok of the nearest address (fill_nearest). The PDF is a scan whose text layer has OCR errors; checked against the page images."
okrsky_adopted = 2019-05-25
okrsky_adopted_basis = "No document of 2020-02-29 setting the okrsky was found (okrsok-rules-2251): The NR 2020 page (live and archived 2019-11-16 and 2020-09-18) links only voter information, the vote's announcement, postal-vote forms and later the results; no okrsky document for 2020 was published or archived. The 'volby-do-nr-sr' page holds the 2012 okrsky only. These are the okrsky of the vote of 2019-05-25 (2019-ep), the nearest in time with okrsky of its own that fit: 14 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2020-02-29 → 2019-05-25: 1: 1,249 → 1,250, 2: 728 → 738, 3: 788 → 814, 4: 912 → 934, 5: 986 → 981, 6: 915 → 965, 7: 716 → 751, 8: 730 → 753, 9: 775 → 835, 10: 831 → 890, 11: 859 → 877, 12: 1,162 → 1,163, 13: 858 → 850, 14: 818 → 793."

