obec = "512648"
name = "Sučany"
okrsky_fill = "nearest"
okrsky_note = "The register streets SNP (4 addresses, distinct from Námestie SNP) and Ulica priemyselná (1) are named by no document: placed by fill_nearest, as are the addresses without a street. Same okrsky as the 2022 copy except that this document does not yet name the streets supplemented; the youth prison (okrsok 4) is an institution, not a street."
okrsky_adopted = 2019-03-16
okrsky_adopted_basis = "No document of 2020-02-29 setting the okrsky was found (okrsok-rules-2371): The elections page (live, and as archived 2020-09-23) has a section \"Voľby do Národnej rady SR 2020\" with e-mail notices, postal-vote forms, voter information (checked: no okrsky) and the decision calling the election, but no okrsky notice; the site search finds none. These are the okrsky of the vote of 2019-03-16 (2019-prezident), the nearest in time with okrsky of its own that fit: 4 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2020-02-29 → 2019-03-16: 1: 1,141 → 1,151, 2: 1,024 → 1,031, 3: 1,132 → 1,123, 4: 619 → 631."
okrsky_date_approximate = "named"
okrsky_date_basis = "The undated notice names the presidential election of 16 March 2019 (round 2 on 30 March 2019) and gives the streets of each okrsok."

