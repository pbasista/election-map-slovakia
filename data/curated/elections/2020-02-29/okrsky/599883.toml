obec = "599883"
name = "Košice-Sídlisko KVP"
okrsky_date = 2019-01-28
okrsky_fill = "nearest"
okrsky_note = "The mayor's decision of 28.01.2019 for the presidential election (Internet Archive copy of the old website's PDF). Differences from 2022: Bauerova 9-21 is in okrsok 5, Klimkovičova 27-35 in okrsok 9, Klimkovičova 1, 11-17 in okrsok 14, Titogradská split by parity and Wuppertálska 53-63 in okrsok 18. Voters with permanent residence only in Košice-Sídlisko KVP (no address) are in okrsok 5 per the document's note (no rule). Addresses the document does not name (e.g. Drocarov park, Moskovská trieda, numbers outside the listed ranges) and the addresses without a street take the okrsok of the nearest address (fill_nearest)."
okrsky_adopted = 2019-03-16
okrsky_adopted_basis = "No document of 2020-02-29 setting the okrsky was found (okrsok-rules-2610): The old website's page for the National Council election of 2020 ('Určenie volebných okrskov a volebných miestností', archived) links the mayor's PDF, but the PDF is gone live (404), was not captured by the Internet Archive, and the page itself has no text of the okrsky. The website's archive (archiv.mckvp.sk) answers 503. These are the okrsky of the vote of 2019-03-16 (2019-prezident), the nearest in time with okrsky of its own that fit: 18 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2020-02-29 → 2019-03-16: 1: 964 → 1,002, 2: 967 → 949, 3: 1,006 → 1,035, 4: 933 → 989, 5: 1,373 → 1,406, 6: 883 → 898, 7: 980 → 985, 8: 871 → 902, 9: 1,167 → 1,183, 10: 1,080 → 1,032, 11: 1,096 → 1,091, 12: 748 → 821, 13: 1,037 → 1,058, 14: 1,188 → 1,210, 15: 1,135 → 1,222, 16: 984 → 1,029, 17: 1,057 → 1,126, 18: 1,083 → 1,124."

