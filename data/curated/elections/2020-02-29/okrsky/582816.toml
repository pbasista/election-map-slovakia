# The okrsky of Žitavany of the vote of 2022-10-29, data/curated/elections/2022-10-29/okrsky/582816.toml, standing in, by `ems job reuse`. Its header there:
#   Okrsky of Žitavany, transcribed by an AI agent in job okrsok-rules-931 from the documents below;
#   checked by `ems job ingest` against the address register. The document's
#   text per okrsok, verbatim:
#     okrsok 1: Volebný okrsok č. 1: Kultúrno – spoločenské zariadenie, Opatovecká ulica č. 847/32, Žitavany
#     okrsok 2: Volebný okrsok č. 2: Športová hala Žitavany, Športová ulica č. 791/26, Žitavany
obec = "582816"
name = "Žitavany"
okrsky_date = 2022-11-09
okrsky_note = "No document of the elections found (the 2022 elections pages, live and archived, hold no okrsky document); the referendum's document, signed 'V Žitavanoch 09.11.2022' (its header misprints 09.11.2023). It gives each okrsok only its polling station: okrsok 1 in the Kultúrno-spoločenské zariadenie, Opatovecká 847/32 (k.ú. Opatovce), okrsok 2 in the Športová hala, Športová 791/26 (k.ú. Kňažice). Žitavany has one part but two k.ú., the former villages Opatovce and Kňažice, each holding one station, so each okrsok is given the k.ú. of its station (inferred, by analogy with one part per station). Doubtful: voters 802/763 against 336/432 addresses."
okrsky_adopted = 2022-10-29
okrsky_adopted_basis = "No document of 2020-02-29 setting the okrsky was found (okrsok-rules-2609): The live website (www.zitavany.sk, Voľby - Referendum) keeps vote pages only from the 2022 elections on; the oldest okrsky document there is the referendum's of 2023. In the Internet Archive (CDX of zitavany.sk 2017–2022 and of the old notice board) no okrsky document of 2017–2020 is captured: the 'Voľby VÚC 2017' page is captured empty (2018-12-30, 2021-05-06); the 2018 notice-board entry 'Voľby do orgánov samosprávy obcí 2018' links only the voters' information and the decision calling the elections; the 2018 obvody notice concerns council obvody only; the 2019 notice board lists EP 2019 voter-information and voting-certificate entries, never captured, and no okrsky entry; the 2020 by-election page links only the obvody/seats decision and results. Web search found nothing else. The Archive was intermittently offline but answered after retries. No page of the NR SR elections of 29 February 2020 is captured. These are the okrsky of the vote of 2022-10-29 (2022), the nearest in time with okrsky of its own that fit: 2 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2020-02-29 → 2022-10-29: 1: 813 → 802, 2: 776 → 763."

