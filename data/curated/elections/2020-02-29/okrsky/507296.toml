okrsky_adopted_basis = "No document of 2020-02-29 setting the okrsky was found (okrsok-rules-2606): The 2020 elections page as archived on 2019-12-08 links 'volby nrsr okrsky.pdf' (e_download.php?file=data/editor/119sk_3.pdf), but the Internet Archive never captured that PDF and the live site (rebuilt) returns 404 for it. No other okrsky document of 2020 found live or archived (the archived notice-board file of 2019-11 is an unrelated SPP notice). These are the okrsky of the vote of 2024-03-23 (2024-prezident), the nearest in time with okrsky of its own that fit: 2 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2020-02-29 → 2024-03-23: 1: 883 → 810, 2: 847 → 879."

