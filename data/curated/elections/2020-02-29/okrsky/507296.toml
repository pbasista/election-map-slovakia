okrsky_note = "Scanned notice of the mayor dated 22.01.2024 (read from the rendered scan), linked as 'volebny okrsok.pdf' from the presidential election page as archived on 2024-03-03. Both okrsky vote in the Kultúrny dom, Majcichov 606 (doors 1 and 2). The split differs from the copied 2026 document (súp. č. 1–432 / 433–880): in 2024 it was 1–415 / 416–880."
