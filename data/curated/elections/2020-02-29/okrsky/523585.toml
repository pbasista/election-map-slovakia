obec = "523585"
name = "Kežmarok"
okrsky_date = 2019-02-13
okrsky_fill = "nearest"
okrsky_note = "\"Mesto Kežmarok\" in okrsok 5 means voters registered only to the town, not a rule. Weinova (register street the document does not name) and register addresses without a street are placed by fill_nearest. P.J. Šafárika covers both register spellings (\"P. J. Šafárika\", \"P.J.Šafárika\"). Image-only scan, read from the page image."
okrsky_adopted = 2019-05-25
okrsky_adopted_basis = "No document of 2020-02-29 setting the okrsky was found (okrsok-rules-2239): The only archived capture of the 2020 elections page (2019-10-29) precedes the okrsky announcement and links only postal-voting documents; no okrsky document of the 2020 National Council election is archived or live. These are the okrsky of the vote of 2019-05-25 (2019-ep), the nearest in time with okrsky of its own that fit: 12 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2020-02-29 → 2019-05-25: 1: 1,095 → 1,081, 2: 896 → 890, 3: 734 → 727, 4: 713 → 708, 5: 1,220 → 1,250, 6: 1,081 → 1,086, 7: 855 → 910, 8: 1,115 → 1,118, 9: 1,478 → 1,502, 10: 1,210 → 1,227, 11: 1,401 → 1,418, 12: 1,018 → 1,059."

