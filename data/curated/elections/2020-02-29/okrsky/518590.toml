obec = "518590"
name = "Ľubotice"
okrsky_date = 2022-08-03
okrsky_fill = "nearest"
okrsky_note = "Scanned decision of 3.8.2022 (2022 elections page, files re-uploaded 2024). Streets Letná, Orgovánová, Roľnícka (okrsok 3) and Zimná (okrsok 3) are named by the document but missing from the register: left out. Houses without a street in the part Ľubotice (súpisné only) are placed by fill_nearest; Šarišské Lúky's are put in okrsok 1 (inferred)."
okrsky_adopted = 2022-10-29
okrsky_adopted_basis = "No document of 2020-02-29 setting the okrsky was found (okrsok-rules-2367): The live website (moderneobce CMS) keeps election pages only from 2022 on. The Internet Archive's captures of lubotice.eu and obeclubotice.sk (2017–2020) hold no okrsky document with streets for this vote. The archived decision of 26.11.2019 for the NR SR elections of 29.2.2020 creates 3 okrsky and names only their polling stations (okrsky 1 and 2 both in the MŠ, Čsl. letcov 2; okrsok 3 in the OcÚ), without streets or parts; 3 okrsky in 2 parts cannot be placed by part. These are the okrsky of the vote of 2022-10-29 (2022), the nearest in time with okrsky of its own that fit: 3 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2020-02-29 → 2022-10-29: 1: 936 → 960, 2: 981 → 1,025, 3: 822 → 991."

