#     okrsok 2: Ulice patriace do okrsku: Cintorínska, Čsl. letcov, Hájnova, Hviezdna, Jarková, Kalinčiakova, Krátka, Ku Bánovcu, Ku ihrisku, Kvetná, Makarenkova, Mesačná, Nižňanská, Platanová, Pod Hájom, Polárna, Prešovská, Slnečná, Šebastovská, Za potokom, Záhradná
