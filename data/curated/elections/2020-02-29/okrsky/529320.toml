name = "Bratislava-Ružinov"
okrsky_fill = "nearest"
okrsky_note = "The mayor's \"určenie\" gives each okrsok only its polling station; the streets come from the district's list of streets and okrsky (street, house numbers or \"celá\", okrsok). A street the list places whole (\"celá\") or in one okrsok only is taken whole, a street split among okrsky by its listed numbers. fill_nearest places what the list does not name: unlisted house numbers of split streets, streets the list omits and addresses without a street not listed. The rows \"Ružinov\"/\"Ružinov - súpisné čísla\" list súpisné čísla of buildings without a street: only those that identify one register address without a street are rules (part Bratislava-Ružinov by súpisné číslo), the others are left to fill_nearest; a row \"Ružinov – Adresa trvalého pobytu: Bratislava-Ružinov\" concerns voters registered without an address and is no rule. The určenie names 71 okrsky: 1-70 with addresses and 71, a special okrsok (Drieňová 22) for postal voting of voters without permanent residence in Slovakia, which the Statistical Office does not count and which is left out here."
okrsky_date_approximate = "named"
okrsky_date_basis = "The undated určenie names the election to the National Council of 29 February 2020; the street list was published with it on the district's page of that election."

