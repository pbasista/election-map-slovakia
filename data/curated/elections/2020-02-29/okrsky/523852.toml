okrsky_adopted_basis = "No document of 2020-02-29 setting the okrsky was found (okrsok-rules-2589): The municipality's elections page for the National Council election of 29 February 2020 (live, and as archived on 2020-09-25 at /m/volby/) and its 2019 announcement (archived 2019-11-14) list only the voter information, the decision calling the election, the results and turnout; no okrsky document. The site search and the notice board (live and archived) show no okrsky notice for this vote. The Internet Archive was intermittently offline (connection refused) but answered after retries. These are the okrsky of the vote of 2019-03-16 (2019-prezident), the nearest in time with okrsky of its own that fit: 2 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2020-02-29 → 2019-03-16: 1: 988 → 976, 2: 960 → 960."

