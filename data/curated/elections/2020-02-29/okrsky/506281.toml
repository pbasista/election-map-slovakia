obec = "506281"
name = "Nemšová"
okrsky_fill = "nearest"
okrsky_note = "'Nemšová' in okrsok 1 means voters registered without an address (no rule). Addresses without a street and Záhradná's addresses in the part Nemšová (not listed for okrsky 1–3) are placed by fill_nearest. The document's 'J. Lacu' is Jozefa Lacu."
okrsky_adopted = 2019-05-25
okrsky_adopted_basis = "No document of 2020-02-29 setting the okrsky was found (okrsok-rules-2338): The NR SR 2020 page lists only the election decision, voter information, postal vote and VZN; no okrsky document. The Internet Archive was 'Temporarily Offline' when queried. These are the okrsky of the vote of 2019-05-25 (2019-ep), the nearest in time with okrsky of its own that fit: 6 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2020-02-29 → 2019-05-25: 1: 1,115 → 1,153, 2: 1,016 → 1,011, 3: 1,180 → 1,201, 4: 1,088 → 1,083, 5: 519 → 510, 6: 209 → 215."
okrsky_date_approximate = "named"
okrsky_date_basis = "The undated document's heading names the European Parliament election of 25 May 2019."

