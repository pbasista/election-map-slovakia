obec = "528447"
name = "Kráľovský Chlmec"
okrsky_fill = "nearest"
okrsky_note = "Paired ranges of one street (e.g. Hlavná 2-114, 1-43) are read as its even and odd sides. Ibrányiho 1-55 (okrsok 4) overlaps Ibrányiho 18-28 (okrsok 6): 18-28 go to okrsok 6. \"Bez ulice\" in okrsok 2 is the voters registered without an address, given no rule; the register's houses without a street in part Kráľovský Chlmec and the numbers the ranges leave out (gaps in Hlavná, L. Kossutha, Pri Štadióne, Ibrányiho 56-57) take the okrsok of the nearest placed address (fill_nearest). FEJSÉŠ (okrsok 3) is both the street Fejséš and the part Fejséš. \"Pri Štadióne 47 – 77\" (okrsok 7) next to \"1– 45\" (okrsok 2); \"L. Kossutha 2 – 56\" in okrsok 7. The okrsky differ slightly from the 2022 document used for the copy (Hlavná 2-112 in okrsok 1; Hlavná 85, 97 in okrsok 2; Pri Štadióne 1-45 in okrsok 2)."
okrsky_adopted = 2019-05-25
okrsky_adopted_basis = "No document of 2020-02-29 setting the okrsky was found (okrsok-rules-2295): No okrsky document of the 2020 NR SR election: the notice-board item 'Voľby do Národnej rady SR 2020' (posted 5.11.2019) holds only the announcement, voter information, postal-vote and delegation forms; the old site's election posts of January–February 2020 archived in the Internet Archive contain no okrsky document. These are the okrsky of the vote of 2019-05-25 (2019-ep), the nearest in time with okrsky of its own that fit: 7 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2020-02-29 → 2019-05-25: 1: 1,135 → 1,160, 2: 1,091 → 1,093, 3: 175 → 184, 4: 1,016 → 1,040, 5: 764 → 814, 6: 901 → 929, 7: 886 → 893."
okrsky_date_approximate = "named"
okrsky_date_basis = "The primátor's announcement (by § 8 of Act 180/2014) of the 7 okrsky and their polling stations names the European Parliament election of 25 May 2019; it states no date of the decision."

