obec = "500968"
name = "Zlaté Moravce"
okrsky_date = 2019-01-30
okrsky_fill = "nearest"
okrsky_note = "Krížna and Poštová are named but not in the register, left out. 'Voliči s trvalým pobytom Zlaté Moravce sú zapísaní v okrsku č. 2' are voters registered without an address. Hviezdoslavova 2-30 / 32-86D and 1. mája are split as written (no parity for Hviezdoslavova); other numbers of these streets and the houses without a street in part Zlaté Moravce are placed by fill_nearest."
okrsky_adopted = 2019-03-16
okrsky_adopted_basis = "No document of 2020-02-29 setting the okrsky was found (okrsok-rules-2231): The NR SR 2020 page is gone from the live site (404); its only capture (2019-10-29) predates the okrsky (it links voter information and postal-voting notices only). The Internet Archive has no later capture or 2020 file of the site. These are the okrsky of the vote of 2019-03-16 (2019-prezident), the nearest in time with okrsky of its own that fit: 11 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2020-02-29 → 2019-03-16: 1: 1,087 → 1,095, 2: 1,029 → 1,008, 3: 929 → 953, 4: 1,312 → 1,345, 5: 1,249 → 1,274, 6: 935 → 942, 7: 754 → 771, 8: 798 → 840, 9: 976 → 987, 10: 586 → 586, 11: 339 → 343."

