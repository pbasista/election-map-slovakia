obec = "525006"
name = "Pečovská Nová Ves"
okrsky_fill = "nearest"
okrsky_note = "The okrsky are split by the main road I/68 (ulica Hlavná): right side heading Sabinov→Lipany (north-east) okrsok 1, left side okrsok 2. Streets placed by their OpenStreetMap position relative to Hlavná (all inferred). Left to fill_nearest (nearest address): Hlavná and the addresses without a street. The document states no decision date; it is known from the Internet Archive's capture of the old WordPress site."
okrsky_adopted = 2019-05-25
okrsky_adopted_basis = "No document of 2020-02-29 setting the okrsky was found (okrsok-rules-2580): The live site keeps election documents only from 2024 on. The archived elections page of the old site (capture 2020-09-25) lists for the NR SR elections 2020 only the proclamation, information for voters, postal-vote documents, the e-mail address and the results; no okrsky document. The Internet Archive's CDX lists no 2020 okrsky document. These are the okrsky of the vote of 2019-05-25 (2019-ep), the nearest in time with okrsky of its own that fit: 2 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2020-02-29 → 2019-05-25: 1: 1,063 → 1,061, 2: 832 → 849."
okrsky_date_approximate = "named"
okrsky_date_basis = "The document names the European Parliament elections of 25 May 2019; it is undated."

