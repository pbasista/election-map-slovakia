# The okrsky of Trstice of the vote of 2022-10-29, data/curated/elections/2022-10-29/okrsky/504106.toml, standing in, by `ems job reuse`. Its header there:
#   Okrsky of Trstice, transcribed by an AI agent in job okrsok-rules-738 from the documents below;
#   checked by `ems job ingest` against the address register. The document's
#   text per okrsok, verbatim:
#     okrsok 1: Okrsok č. 1 - Obecný úrad, pre voličov s trvalým pobytom od súp. č. 1 – 450
#     okrsok 2: Okrsok č. 2 - Kultúrny dom, pre voličov s trvalým pobytom od súp. č. 451 – 900. Do tohto okrsku boli zaradení i občania, ktorým boli zrušené trvalé pobyty.
#     okrsok 3: Okrsok č. 3 - Základná škola, pre voličov s trvalým pobytom od súp. č. 901 – 1500
obec = "504106"
name = "Trstice"
okrsky_date = 2022-10-06
okrsky_note = "Scanned, undated announcement; date = its posting date on the official notice board ('Vyvesené: 6. 10. 2022', also shown as 06.okt 2022 in the archived 2022 notice-board page, snapshot 20221024203507). The okrsky are ranges of súpisné čísla (1-450, 451-900, 901-1500). Okrsok 2 also holds the citizens whose permanent residence was cancelled (registered only to the obec), which has no address of its own."
okrsky_adopted = 2022-10-29
okrsky_adopted_basis = "No document of 2020-02-29 setting the okrsky was found (okrsok-rules-2389): No okrsky document for the National Council election of 29 February 2020 on trstice.sk: the notice board has no item for this vote at all, and the archived old-site page 'Voľby do Národnej rady SR r.2020' (5.11.2019) links only one PDF with postal-vote information, the application form, e-mail address and the Speaker's decision (file on Google Drive via the old site, not archived), with no okrsky. No radio announcement of the days before the vote is archived. Every item of the official notice board (úradná tabuľa, items 1–444, 2016–2026, incl. the items migrated from the old Joomla site) was listed by id and every election item opened; the Internet Archive (CDX of trstice.sk, old site trstice.sk/sk/aktuality/…) was searched for election pages and radio announcements (hlásenie miestneho rozhlasu) around the vote; the IA was slow and often refused connections, but the pages listed in tried were retrieved. These are the okrsky of the vote of 2022-10-29 (2022), the nearest in time with okrsky of its own that fit: 3 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2020-02-29 → 2022-10-29: 1: 1,055 → 1,014, 2: 1,020 → 1,030, 3: 1,171 → 1,203."

