okrsky_note = "Streets the document names but the register lacks (left out): Bahýľova, Bielych albatrosov, K letisku (okrsok 1), Alejová (okrsok 2). The register's Ulica Andreja Kvasa is not in the document and its 297 addresses without a street are placed by fill_nearest. The document's note 'voliči s trvalým pobytom Košice – Barca' (registered without an address) are in okrsok 1; they are not the register's addresses without a street."
okrsky_adopted = 2022-10-29
okrsky_adopted_basis = "No document of 2020-02-29 setting the okrsky was found (okrsok-rules-2352): The old site's page 'Voľby do NR SR 2020' (archived 2019-12-09) links 'Určenie volebných okrskov' (/images/subory/ine/Urenie-volebnch-okrskov.pdf), but the PDF was never captured (404) and is gone from the live site. These are the okrsky of the vote of 2022-10-29 (2022), the nearest in time with okrsky of its own that fit: 3 okrsky (nearer, not taken: 2018-11-10: okrsky 1–4, then 1–3). Voters on the roll per okrsok (ŠÚ SR), 2020-02-29 → 2022-10-29: 1: 1,218 → 996, 2: 927 → 1,071, 3: 982 → 999."

