obec = "520471"
name = "Medzilaborce"
okrsky_date = 2017-08-24
okrsky_fill = "nearest"
okrsky_note = "Split streets: the listed súpisné numbers of Komenského and gen. Svobodu go to okrsok 1, the rest of each street to okrsok 2; the listed numbers of Duchnovičova and kpt. Nálepku in okrsok 4 go there, the rest of each street to okrsok 5 (okrsok 5's ranges overlap okrsok 4's). Addresses without a street in part Medzilaborce go by fill_nearest. In 2017 Komenského 151 is in okrsok 2 (later lists move it to okrsok 1); Danová is not named."
okrsky_adopted = 2017-11-04
okrsky_adopted_basis = "No document of 2020-02-29 setting the okrsky was found (okrsok-rules-2325): The mayor's decision for this vote (where published) only names the 7 okrsky's polling stations ('tak, ako je uvedené v prílohe') without the streets of each; the city has 3 parts but 7 okrsky, so the okrsky cannot be drawn from it. No EP 2019 page exists on the website. These are the okrsky of the vote of 2017-11-04 (2017), the nearest in time with okrsky of its own that fit: 7 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2020-02-29 → 2017-11-04: 1: 917 → 966, 2: 1,084 → 1,166, 3: 957 → 983, 4: 861 → 948, 5: 521 → 571, 6: 229 → 232, 7: 176 → 174."

