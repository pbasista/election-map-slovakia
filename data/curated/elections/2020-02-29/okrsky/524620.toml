# The okrsky of Kapušany of the vote of 2019-05-25, data/curated/elections/2019-05-25/okrsky/524620.toml, standing in, by `ems job reuse`. Its header there:
#   Okrsky of Kapušany, transcribed by an AI agent in job okrsok-rules-2036 from the documents below;
#   checked by `ems job ingest` against the address register. The document's
#   text per okrsok, verbatim:
#     okrsok 1: ulice: Ardova, Kováčska, Kráľovská, Krátka, Požiarnická, Prešovská, Pri trati, Sadová, Sekčovská, Slánska, Slovenská, Tehelná, Urbárska, Vranovská, Záhradná, súpisné číslo 686
