obec = "524620"
name = "Kapušany"
okrsky_date = 2019-02-21
okrsky_fill = "nearest"
okrsky_note = "Addresses without a street other than súpisné číslo 686 (okrsok 1) are not named; fill_nearest places them. Differs from the copied okrsky of 2022-10-29/2026-10-24: Pri trati, Sekčovská and Urbárska are in okrsok 1, Na rínku and Nám. sv. Martina in okrsok 2, and of the súpisné čísla only 686 is named (okrsok 1)."
okrsky_adopted = 2019-05-25
okrsky_adopted_basis = "No document of 2020-02-29 setting the okrsky was found (okrsok-rules-2640): No 2020 okrsky document found. The page of the election of 29 February 2020 (live at archiv.kapusany.sk/volby/volby-do-nr-sr-rok-2020; archived 2019-12-06 on the old site and 2020-08-03 on the new) lists information for voters, e-mail addresses, postal voting and results, but no utvorenie volebných okrskov; the two 'Informácie pre voliča' PDFs do not list the okrsky. The Internet Archive has no other capture of the 2020 election pages before the vote. These are the okrsky of the vote of 2019-05-25 (2019-ep), the nearest in time with okrsky of its own that fit: 2 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2020-02-29 → 2019-05-25: 1: 852 → 859, 2: 840 → 849."

