name = "Lučenec"
date = 2018-06-28
fill = "nearest"
note = "The council obvody of the elections of 2018-11-10. The announcement defines each obvod by its okrsky and lists the okrsky's streets; the rules are those streets, whole where a street lies in one obvod. Ulica Arm. Gen. L. Svobodu: odd 7–15 and even 14–28 in obvod 1, the rest in obvod 2; Ulica Martina Rázusa: odd 1–53 and even 2–32 in obvod 2, the rest in obvod 3; Rúbanisko III: 53–58 in obvod 5, the rest in obvod 6. Mestský park, Ulica Kupeckého and Zlatá ulička have no addresses in the register and are left out; 'Lučenec' (okrsok 10) means voters without an address and has no rule. fill_nearest places the addresses without a street."
reused = 2018-11-10
okrsky_date = 2018-06-28
okrsky_fill = "nearest"
okrsky_note = "These are the okrsky of the elections of 2018-11-10: in 2020-02-29 the obec had as many okrsky, each that voted with voters on the roll within 10% of its count then. No document of 2020-02-29 was found (okrsky/not-found.json). The town's announcement of the 2018 obvody (council resolutions of 28.06.2018, announced 13.07.2018) defines each obvod by its okrsky and lists the streets of each okrsok; it is the okrsky document of this vote. Mestský park, Ulica Kupeckého and Zlatá ulička have no addresses in the register and are left out; 'Lučenec' in okrsok 10 means voters registered with the town only and has no rule. Streets split between obvody (Ulica Arm. Gen. L. Svobodu, Ulica Martina Rázusa, Rúbanisko III) are whole within each obvod's okrsok. House numbers the document does not list (Rúbanisko II 19, Rúbanisko III 59–60, Námestie republiky 26, 32) and the addresses without a street take the okrsok of the nearest placed address (fill_nearest)."
okrsky_reused = 2018-11-10

