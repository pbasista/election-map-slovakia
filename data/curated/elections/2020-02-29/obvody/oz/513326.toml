obec = "513326"
name = "Lednické Rovne"
date = 2022-07-14
fill = "nearest"
note = "The council obvody of the vote of 2022-10-29: they only place the okrsky. Obvody are defined by okrsky with their streets. Addresses without a street (súpisné only, 721) are placed by fill_nearest."
reused = 2022-10-29
okrsky_date = 2022-08-04
okrsky_fill = "nearest"
okrsky_note = "Medňanská, named in okrsky 4 and 5, is split by part (Horenická Hôrka → 4, Medné → 5); within obvod 1 it is okrsok 1. The register's houses without a street (súpisné only) in Medné go to okrsok 5; the others in Lednické Rovne and Horenická Hôrka are placed by fill_nearest."
okrsky_adopted = 2022-10-29
okrsky_adopted_basis = "No document of 2020-02-29 setting the okrsky was found (okrsok-rules-2370): The NR 2020 page (archived 2019-11-15) links 'Určenie volebných okrskov a zapisovateľov', but the file is gone live (404) and the Internet Archive has no capture of it; the page itself is gone live. These are the okrsky of the vote of 2022-10-29 (2022), the nearest in time with okrsky of its own that fit: 5 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2020-02-29 → 2022-10-29: 1: 1,054 → 1,020, 2: 860 → 899, 3: 822 → 778, 4: 436 → 437, 5: 153 → 146."

