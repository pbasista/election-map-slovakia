obec = "512851"
name = "Beluša"
date = 2018-07-30
fill = "nearest"
note = "The council obvody of the vote of 2018-11-10: they only place the okrsky. The council's resolution 104/18.8 of 30.07.2018 lists per obvod (and poslanecký obvod/okrsok) the streets; numbers are súpisné. fill_nearest places the Ľ. Štúra houses it does not list and the addresses without a street in part Beluša."
reused = 2018-11-10
okrsky_date = 2018-07-30
okrsky_fill = "nearest"
okrsky_note = "The council's resolution 104/18.8 of 30.07.2018 tabulates per volebný obvod the poslanecké obvody, the volebný okrsok (I-VIII) and their streets; the mayor's page 'Utvorenie volebných okrskov … 10. 11. 2018' (posted 31.7.2018) gives okrsky I-VIII with their polling stations only. Numbers are súpisné. Slatinská houses outside the listed súpisné ranges and the addresses without a street in part Beluša take the okrsok of the nearest address (fill_nearest)."
okrsky_adopted = 2018-11-10
okrsky_adopted_basis = "No document of 2020-02-29 setting the okrsky was found (okrsok-rules-2277): No okrsky document of the 2020 election on the website or in the Internet Archive. These are the okrsky of the vote of 2018-11-10 (2018), the nearest in time with okrsky of its own that fit: 8 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2020-02-29 → 2018-11-10: 1: 837 → 869, 2: 689 → 680, 3: 906 → 834, 4: 753 → 776, 5: 458 → 471, 6: 511 → 455, 7: 564 → 574, 8: 397 → 373."

