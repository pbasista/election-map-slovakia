okrsky_adopted_basis = "No document of 2023-09-30 setting the okrsky was found (okrsok-rules-3954): The election's own document was found: 'Oznámenie o utvorení volebných okrskov a volebných miestností' of 2023-06-26, archived https://web.archive.org/web/20230627213358/https://velketeriakovce.sk/wp-content/uploads/2023/06/Utvorenie-volebn%C3%BDch-okrskov-volebn%C3%BDch-miestnost%C3%AD.pdf. Each of those announcements names only the two polling stations (okrsok 1: zasadačka Obecného úradu Veľké Teriakovce; okrsok 2: Kultúrny dom Vrbovce nad Rimavou) and no parts or houses; the municipality has 4 parts (Krásna, Malé Teriakovce, Veľké Teriakovce, Vrbovce nad Rimavou) but 2 okrsky, so the station-per-part inference does not apply and the okrsky cannot be written from it. These are the okrsky of the vote of 2026-10-24 (2026), the nearest in time with okrsky of its own that fit: 2 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2023-09-30 → 2026-10-24: 1: 501 → 508, 2: 159 → 150."

