okrsky_note = "Same okrsky as the referendum of 2023 (also used for 2022), with the document's additions: okrsok 13's houses without a street now by the listed súpisné čísla, okrsok 20's by 1028, 1039, 1056. Ranges like '1-23' are orientačné ranges covering the whole street; 3-4 digit lists are súpisné čísla (by supisne), and on streets split among okrsky one okrsok takes the whole street as in 2022. Námestie SNP 151 is listed in okrsky 1 and 2; given to okrsok 1. 'Partizánske (bez TP na adrese v meste)' in okrsok 3 = voters without an address. Streets the document names but the register lacks (left out): Pod Stráňami, Ulica Eugena Salzbergera, Dlhé lúky. Ovocná, Priehrady, Viničná (okrsok 22) have no register addresses. Riečna: okrsok 1 the súpisné 842, 877, 886, okrsok 11 the rest; Októbrová only by the listed súpisné čísla (okrsky 1 and 12). Placed by fill_nearest: súpisné numbers not listed, Za riekou Nitrou and other houses without a street. Malobielická (not named) is inferred in okrsok 21 (Malé Bielice). Table cells are given as 'streets | numbers' in the document's order."

