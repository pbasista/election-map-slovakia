okrsky_note = "House numbers are given as súpisné/orientačné; the rules use the orientačné číslo (after the slash). Hviezdoslavova, L. Novomeského and Štefánikova are split between okrsky by these numbers; their unlisted numbers, the streets the list does not name (Johanna Vaillanta, Kaplinské pole) and the addresses without a street (parts Sotina, Čáčov, Senica) take the nearest okrsok (fill_nearest). 'Senica' in okrsok 5 means residents registered without an address; 'Kunov' in okrsok 16 is the part Kunov."
okrsky_adopted = 2026-07-04
okrsky_adopted_basis = "No document of 2023-09-30 setting the okrsky was found (okrsok-rules-3391): The city's election articles are reused for each new vote (the municipal and regional pages now show 2026 only), so this vote's documents are no longer linked; older files survive only under unknown article/file ids. The Internet Archive's CDX was offline ('Temporarily Offline', HTTP 503) for over 15 minutes, so archived copies could not be searched. These are the okrsky of the vote of 2026-07-04 (2026-referendum), the nearest in time with okrsky of its own that fit: 16 okrsky (nearer, not taken: 2022-10-29: okrsky 1–17, then 1–16). Voters on the roll per okrsok (ŠÚ SR), 2023-09-30 → 2026-07-04: 1: 851 → 826, 2: 902 → 866, 3: 937 → 944, 4: 726 → 738, 5: 1,155 → 1,216, 6: 1,049 → 1,032, 7: 1,140 → 1,118, 8: 1,116 → 1,197, 9: 1,118 → 1,129, 10: 968 → 982, 11: 936 → 941, 12: 1,082 → 1,091, 13: 1,061 → 987, 14: 1,069 → 1,076, 15: 974 → 975, 16: 647 → 637."

