# The okrsky of Zlaté Klasy of the vote of 2022-10-29, data/curated/elections/2022-10-29/okrsky/502022.toml, standing in, by `ems job reuse`. Its header there:
#   Okrsky of Zlaté Klasy, transcribed by an AI agent in job okrsok-rules-828 from the documents below;
#   checked by `ems job ingest` against the address register. The document's
#   text per okrsok, verbatim:
#     okrsok 1: , súp.č. (0); Agátová ulica, Hasičská ulica, Malomágerská cesta, Nový trh, Prievozská cesta, Sídlisko, Šamorínska cesta, Školská ulica, Športová ulica, Ulica Zsigmondovcov, Záhradnícka ulica (celá ulica)
#     okrsok 2: Bratislavská cesta, Cintorínska ulica, Čakanská cesta, Hlavná ulica, Horná ulica, Kolárska ulica, Krajná cesta, Krížna ulica, Nový rad, Orgovánová ulica, Pekná cesta, Poštová ulica, Pri Hlinisku, Slepá ulica, Vodárenská ulica, Za záhradami (celá ulica)
#     okrsok 3: Dunajská ulica, Obchodná ulica, Poľná ulica, Slávičia ulica, Veterná ulica, Viničná ulica (celá ulica)
obec = "502022"
name = "Zlaté Klasy"
okrsky_date = 2022-10-14
okrsky_fill = "nearest"
okrsky_note = "No mayor's decision found; the municipality's scanned list 'Počty voličov po uliciach' for the election of 29/10/2022 (printed 14.10.2022, date used) assigns every street to okrsok 1–3 ('celá ulica'); its voter sums (898/912/924) match the ŠÚ SR counts (908/905/922). Archived only after the election (2022-11-30), but the document itself is dated 14.10.2022. Its ', súp.č. (0)' row (54 voters, okrsok 1) is voters registered without an address; the register's houses without a street (súpisné only) take the okrsok of the nearest placed address (fill_nearest)."
okrsky_adopted = 2022-10-29
okrsky_adopted_basis = "No document of 2023-09-30 setting the okrsky was found (okrsok-rules-3676): The municipality has an elections page for each vote (live and in the Internet Archive), but none of them links an okrsky document (they hold the information for voters, delegation forms and the okrsky commissions' minutes). The only okrsky document found, \"rozdelenie ulíc do okrskov\" (evt_file.php?file=7010), is on the page of the 2022 municipal and regional elections, a vote not among these. These are the okrsky of the vote of 2022-10-29 (2022), the nearest in time with okrsky of its own that fit: 3 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2023-09-30 → 2022-10-29: 1: 898 → 904, 2: 895 → 894, 3: 945 → 922."

