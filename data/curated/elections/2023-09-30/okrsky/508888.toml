# The okrsky of Pohronská Polhora of the vote of 2023-01-21, data/curated/elections/2023-01-21/okrsky/508888.toml, standing in, by `ems job reuse`. Its header there:
#   Okrsky of Pohronská Polhora, transcribed by an AI agent in job okrsok-rules-3255 from the documents below;
#   checked by `ems job ingest` against the address register. The document's
#   text per okrsok, verbatim:
#     okrsok 1: HLAVNÁ, HRAŠKUĽA, KÚT, PÍLA, ROHOZNÁ, STANIČNÁ, ŠPORTOVÁ, ZBOJSKÁ, POHRONSKÁ POLHORA
#     okrsok 2: BÁNY, BÁNIKY, LIPIANKA, NAD IHRISKOM, POD POĽANOU, VARGUĽA, ŽELEZNIČNÁ
obec = "508888"
name = "Pohronská Polhora"
okrsky_date = 2022-11-10
okrsky_fill = "nearest"
okrsky_note = "'ZBOJSKÁ' is not in the register and is left out; 'POHRONSKÁ POLHORA' means voters registered only on the obec. Predkopačno and houses without a street are placed by fill_nearest."
okrsky_adopted = 2023-01-21
okrsky_adopted_basis = "No document of 2023-09-30 setting the okrsky was found (okrsok-rules-3871): The vote's page has the mayor's decision forming 'dva okrsky' with polling rooms only (both in the obecný úrad, Hlavná 62); no streets per okrsok and the obec has one part, so the okrsky cannot be drawn from it. Internet Archive (CDX API) refused connections / 503 on retries, so archived pages could not be checked. These are the okrsky of the vote of 2023-01-21 (2023-referendum), the nearest in time with okrsky of its own that fit: 2 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2023-09-30 → 2023-01-21: 1: 632 → 623, 2: 703 → 688."

