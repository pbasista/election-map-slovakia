obec = "500577"
name = "Mojmírovce"
okrsky_fill = "nearest"
okrsky_note = "The document names Piaty rad (okrsok 1) and Pred lesíkom (okrsok 3), streets named by VZN 01/2026 that the register lacks; they are left out. Agátová ulica (10 addresses) is in the register but not in the document, and 4 addresses without a street: these take the okrsok of the nearest placed address (fill_nearest). 'Občania prihlásení na Obec' (residents registered only to the municipality) vote in okrsok 2."
okrsky_adopted = 2026-07-04
okrsky_adopted_basis = "No document of 2023-09-30 setting the okrsky was found (okrsok-rules-3637): The municipality's current website (new CMS, notice board from 2025) holds only 2026 election documents; the old website (WEBY GROUP CMS) is gone and only partly in the Internet Archive, which has no capture of the notice board or elections page from the weeks before this vote (the National Council election 2023), and no okrsky document for it (the 'Voľby a referendá' page captured 2018–2024 lists only old results). Only the 2017 (Voľby 2017 page) and 2026 (referendum) okrsky documents were found. Nor was the referendum of 21 January 2023's document found to stand in. These are the okrsky of the vote of 2026-07-04 (2026-referendum), the nearest in time with okrsky of its own that fit: 3 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2023-09-30 → 2026-07-04: 1: 790 → 753, 2: 865 → 887, 3: 742 → 756."
okrsky_date_approximate = "posted"
okrsky_date_seen = 2026-05-18
okrsky_date_basis = "the notice board page linking the PDF states 'Vyvesené: 18. 5. 2026'; the mayor's decision itself is undated (it names the referendum of 4 July 2026) (https://www.mojmirovce.sk/zverejnovanie/uradna-tabula-1/referendum-2026-utvorenie-volebnych-okrskov-a-urcenie-volebnych-miestnosti-323.html)"

