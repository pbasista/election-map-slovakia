# The okrsky of Jarovnice of the vote of 2024-03-23, data/curated/elections/2024-03-23/okrsky/524603.toml, standing in, by `ems job reuse`. Its header there:
#   Okrsky of Jarovnice, transcribed by an AI agent in job okrsok-rules-4530 from the documents below;
#   checked by `ems job ingest` against the address register. The document's
#   text per okrsok, verbatim:
#     okrsok 1: súpisné čísla: 0 - 315
#     okrsok 2: súpisné čísla: 316 – 422
#     okrsok 3: súpisné čísla: 423 - 608
obec = "524603"
name = "Jarovnice"
okrsky_date = 2024-01-23
okrsky_note = "Okrsky are súpisné-číslo ranges for the whole obec; the document does not name the parts, so each range is applied in both parts (Jarovnice, Močidľany), the súpisné čísla being numbered across the obec. The last okrsok is open-ended so that higher numbers also fall there."
okrsky_adopted = 2024-03-23
okrsky_adopted_basis = "No document of 2023-09-30 setting the okrsky was found (okrsok-rules-3905): The current elections page starts with the 2024 presidential election; in the Internet Archive the 2017 regional, 2019 presidential and 2019 EP pages carry only the call of the elections, voter information and candidate lists, and no okrsky decision for the 2023 referendum or the NR SR 2023 election is archived. These are the okrsky of the vote of 2024-03-23 (2024-prezident), the nearest in time with okrsky of its own that fit: 3 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2023-09-30 → 2024-03-23: 1: 1,277 → 1,300, 2: 1,352 → 1,380, 3: 1,356 → 1,389."

