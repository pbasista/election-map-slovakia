okrsky_note = "Transcribed from the primátor's decision listing the streets of each okrsok. Streets split between okrsky follow the listed numbers; an okrsok listing a street without numbers, or with 'okrem', takes the rest of it. 'bez ulice' (okrsok 2) are voters registered without an address. Not in the address register, left out: Bazová ulica, Cukrovarská ulica, Námestie Augusta Stummera, Námestie kráľovnej Konštancie, Park Janka Kráľa, Prašná ulica, Priečna ulica, Rybárska ulica, Ulica Jozefa Adamca, Ulica Jozefa Adamoviča, Ulica Jána Krištofíka, Ulica Mikuláša Vaymára, Ulica Mórica Beňovského, Ulica Sama Chalupku, Včelárska ulica, Zimná ulica. About 1400 addresses without a street go by fill_nearest. The 2023 document is a scan with an OCR layer; its texts are given as OCR'd with obvious punctuation fixed. Its lists match the 2024 lists except that okrsok 18 lacks the new streets Cukrovarská, Nám. Augusta Stummera, Jána Krištofíka and Mikuláša Vaymára (not in the register in any case)."

