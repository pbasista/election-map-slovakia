obec = "545333"
name = "Dunajská Lužná"
okrsky_date = 2024-01-25
okrsky_fill = "nearest"
okrsky_note = "The document also names \"rekreačná oblasť Malá voda - Nové Košariská\", \"rekreačná oblasť – Za hrádzou\", not a street in the register; its houses are among the addresses without a street, placed by fill_nearest. Addresses without a street (numbered by súpisné číslo within the parts, largely the recreational areas and new houses) are placed by fill_nearest. The copied 2022 okrsky differ: this document puts Malinová in okrsok 3 (2022: okrsok 5)."
okrsky_adopted = 2024-03-23
okrsky_adopted_basis = "No document of 2023-09-30 setting the okrsky was found (okrsok-rules-3433): The municipality's website keeps pages for every vote from 2018 to 2026 under Úradná tabuľa / Voľby except the National Council election of 30 September 2023; the site search finds no okrsky document for it, and the Internet Archive lists no capture of such a page or file (CDX of the domain 2019–2024). The Internet Archive's capture of the elections index (Voľby 2024, 2024-08-10) lists only the 2024 votes. The Internet Archive was intermittently offline during the search; the queries succeeded on retry. The documents of 21 January 2023 (4 okrsky) and 25 January 2024 (5 okrsky) differ, so neither can stand in. These are the okrsky of the vote of 2024-03-23 (2024-prezident), the nearest in time with okrsky of its own that fit: 5 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2023-09-30 → 2024-03-23: 1: 1,170 → 1,198, 2: 1,160 → 1,205, 3: 1,072 → 1,119, 4: 1,164 → 1,188, 5: 1,068 → 1,096."

