# The okrsky of Majcichov of the vote of 2024-03-23, data/curated/elections/2024-03-23/okrsky/507296.toml, standing in, by `ems job reuse`. Its header there:
#   Okrsky of Majcichov, transcribed by an AI agent in job okrsok-rules-4421 from the documents below;
#   checked by `ems job ingest` against the address register. The document's
#   text per okrsok, verbatim:
#     okrsok 1: súpisné číslo 1 - 415
#     okrsok 2: súpisné číslo 416 - 880
obec = "507296"
name = "Majcichov"
okrsky_date = 2024-01-22
okrsky_note = "Scanned notice of the mayor dated 22.01.2024 (read from the rendered scan), linked as 'volebny okrsok.pdf' from the presidential election page as archived on 2024-03-03. Both okrsky vote in the Kultúrny dom, Majcichov 606 (doors 1 and 2). The split differs from the copied 2026 document (súp. č. 1–432 / 433–880): in 2024 it was 1–415 / 416–880."
okrsky_adopted = 2024-03-23
okrsky_adopted_basis = "No document of 2023-09-30 setting the okrsky was found (okrsok-rules-3791): This vote's document was found (archived 2023-06-28): 'Oznámenie o utvorení volebných okrskov a určenie volebných miestností pre voľby do NR SR', dated 26.06.2023. It creates 2 okrsky but gives each only its polling station (both in the Kultúrny dom, Majcichov 606, doors 1 and 2), with no split of the addresses; the municipality has a single part, so the station-per-part inference does not apply. No other 2023 document on the page (captures of 2023-06-28, 2023-08-30, 2023-09-27). The referendum of 21 January 2023 had 1 okrsok only (notice of 10.11.2022), so it cannot stand in. The presidential notice of 22.01.2024 splits by súpisné číslo 1–415 / 416–880, but it is a later vote's document. These are the okrsky of the vote of 2024-03-23 (2024-prezident), the nearest in time with okrsky of its own that fit: 2 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2023-09-30 → 2024-03-23: 1: 822 → 810, 2: 872 → 879."

