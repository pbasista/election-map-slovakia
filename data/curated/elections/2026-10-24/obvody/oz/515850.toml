note = "Resolution 326/2026 of 24 June 2026 (identical text in the announcement) defines obvody by street and house-number lists only. fill_nearest covers what it leaves out: J.A.Komenského (whole street, not named), A.H.Škultétyho 103-106 and 108, J.Kráľa 77, Lučenská 73, Št.Tučeka 121, 123, 127, 139, and the 1351 addresses without a street (by súpisné číslo). A.H.Škultétyho 77, 79, 83, 98 are listed in both obvody (16-101 in 1, explicitly in 2); placed in obvod 2."
okrsky_date = 2026-07-22
okrsky_fill = "nearest"
okrsky_note = "Mayor's decision of 22.07.2026. Split streets are read by parity where the document pairs odd and even ranges (Boženy Němcovej 1-25 odd/2-20 even in okrsok 6, 22-34 even/27-67 odd in okrsok 7; Ľ.Štúra 1-15 odd in 9, the rest in 10). Streets split between obvody follow the obvod rules (A.H.Škultétyho, J.Kráľa, Št.Tučeka go whole to okrsok 1 in obvod 1 and okrsok 6 in obvod 2). fill_nearest covers J.A.Komenského (not named), Lučenská numbers not listed in obvod 1 (e.g. 73) and the addresses without a street."

