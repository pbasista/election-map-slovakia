note = "The resolution lists streets only. The 435 addresses without a street (houses in the vineyards and gardens of the parts Pezinok and Myslenice, numbered by súpisné číslo) and the streets Talihov dvor and Viničnianska cesta, which it does not name, take the obvod of the nearest address. 'obyvatelia s trvalým pobytom iba na mesto Pezinok' (obvod I) are residents registered without an address, not addresses. Pánsky chodník and Vinohradnícka cesta (obvod III) have no addresses in the register."
okrsky_fill = "nearest"
okrsky_note = "The city's page of 24.09.2026 lists the 18 okrsky by obvod with their streets. Bratislavská is whole-street within each obvod (1-102 in obvod I, 108-130 in obvod IV). dona Sandtnera lies in one okrsok per obvod. Svätoplukova (9: 3, 4, 5; 10: 1, 2; 11: 6-51) and L. Novomeského (10: 36-66; 12: 1-27 odd, 2-34 even) are split by number. Fortna, Pri majeri, gen. Goliana, Za potokom (okrsok 18), Panský chodník and Vinohradnícka cesta are not in the register (or have no addresses) and are left out; 'Svätojurská' and 'Okružná' are the register's 'Svätojurská ulica' and 'Okružná ulica'. Okrsok 2 also has the residents registered only at 'mesto Pezinok'. fill_nearest covers the addresses without a street (vineyards/gardens by súpisné číslo) and unlisted numbers on split streets."

