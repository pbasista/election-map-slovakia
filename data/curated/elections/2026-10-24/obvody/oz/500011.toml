obec = "500011"
name = "Nitra"
date = 2026-07-23
note = "The council's June 2026 resolution on the obvody was not signed by the mayor, so the obvody and seats were set by the head of Okresný úrad Nitra (decision of 23.07.2026, published on nitra.sk). On 14.08.2026, after a prosecutor's protest, she supplemented it with population figures. The boundaries (7 obvody, 31 seats) are unchanged. 'date' is the 23.07.2026 decision. Both PDFs are clean scans, read visually. Obvody are whole city parts (mestské časti), so each rule is a part rule."
okrsky_date = 2026-07-31
okrsky_fill = "nearest"
okrsky_note = "22-page scanned list (signed by the mayor 31.07.2026) giving per obvod and okrsok the streets with house numbers; read by OCR and checked visually where lines were missed. Texts give street names as in the register (the OCR lost diacritics). Streets split between okrsky of one obvod use the document's number lists. Streets in the document but not in the register (Pri driku, Ulica Ľuda Ondrejova, Námestie Kráľovnej pokoja, Štrková, Cyrilo-metodské námestie, Stará veterná ulica, Starý rínok, Ku skládke, Griesbachova, Pod Dubinou, Vlašská, Hrabová, Mandľova, Rovná, Račia ulica) are left out. Okrsky 3 and 55 also take residents without an address by surname (A–Ř / S–Ž) and okrsok 6 foreigners without an address. Addresses without a street and house numbers the lists omit take the nearest okrsok (fill_nearest)."

