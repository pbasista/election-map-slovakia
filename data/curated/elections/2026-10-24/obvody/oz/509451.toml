# Council obvody of Skalité (509451), Čadca.
# Estimated by hand: the documents below give the obvody's seats and their
# volebné okrsky, and the okrsky by hamlet names, but not which addresses
# are in which (see the note).
#   obvod 1: volebné okrsky č. 1 a 2 (ZŠ s MŠ Kudlov 781)
#   obvod 2: volebné okrsky č. 3 a 4 (ZpS Goral 1710/1720)
# Okrsky added by an AI agent in job okrsok-rules-104 from the documents below;
# checked by `ems job ingest` against the address register. The document's
# text per okrsok, verbatim:
obec = "509451"
name = "Skalité"
date = 2026-06-08
fill = "nearest"
note = "Estimated: uznesenie č. 59/2026 sets obvod 1 (6 seats) and obvod 2 (7); the elections page makes obvod 1 the volebné okrsky 1 and 2 (polling station ZŠ s MŠ Kudlov 781) and obvod 2 the okrsky 3 and 4. The 2023 NRSR page lists the okrsky only by hamlet names: the eastern hamlets (Kudlov, Chajsovka, U Varmuza, U Serafína, ... U Svedov, U Migasa) form okrsky 1 and 2, the western part with Ústredie, Bory, Poľana, Tridsiatok, Sihly and Rieky okrsky 3 and 4. Each address goes to the nearest of these hamlets (OpenStreetMap), those bordering the dividing line and a few in each core: 741 and 907 addresses with a point, close to the 6:7 seats. Addresses without a point take the obvod most of their part got."
estimated = true
okrsky_note = "The 2026 elections page gives obvod 1 = okrsky 1, 2 (ZŠ s MŠ Kudlov 781) and obvod 2 = okrsky 3, 4 (ZpS Goral 1710/1720) but no territory per okrsok. The 2023 NRSR page lists okrsky by hamlet names, but the register has no streets (all addresses by súpisné číslo in one part), so no rules can be written; and 2023 is another election."

