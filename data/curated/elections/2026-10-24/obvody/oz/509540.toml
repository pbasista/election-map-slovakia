note = "The announcement of resolution MsZ 43/2026 (25 June 2026) defines obvody by locality names only (Brezovec; Veľký/Malý Bysterec, Beňova Lehota, Záskalie; Staré mesto, Medzihradné, Banisko, Srňacie; Kňažia, Mokraď). The streets come from the city's official okrsky document, which assigns every street to an okrsok and volebný obvod; all 89 register streets are listed there. Nábrežie Oravy is split by súpisné číslo between okrsky 17 and 18, both in obvod 4, so the whole street is in obvod 4. Addresses without a street in parts other than Dolný Kubín follow their part. Addresses without a street in part Dolný Kubín (about 1000, split between Brezovec = obvod 1 and Staré mesto/Banisko = obvod 3) are not assignable from the documents, so they use fill_nearest. Seats 5+6+4+1 = 16."
okrsky_date = 2026-07-01
okrsky_fill = "nearest"
okrsky_note = "Mayor's decision of 1.7.2026 lists streets per okrsok. Parts Malý Bysterec, Beňova Lehota, Záskalie, Medzihradné, Srňacie, Mokraď, Kňažia are given to their okrsok so their addresses without a street follow them. Nábrežie Oravy is split by súpisné číslo as written; its other numbers follow their part. 'Nemocnica s poliklinikou' and 'Centrum sociálnych služieb' are facilities, not streets. fill_nearest covers addresses without a street in parts Dolný Kubín and Veľký Bysterec."

