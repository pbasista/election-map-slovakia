name = "Bratislava-Nové Mesto"
date = 2026-07-16
fill = "nearest"
note = "Obvody are defined as sets of volebné okrsky (1-8, 9-16, 17-24, 25-32); streets and house numbers transcribed from the district's okrsky street list (Zoznam volebných okrskov so zaradenými ulicami a číslami domov). The official notice board (úradná tabuľa, 25.6.2026) carries an earlier oznámenie per resolution 26/15 of 23.06.2026 with obvod 1 = okrsky 1-7 and obvod 2 = okrsky 8-16 (same seats 6/6/6/7); the elections page carries the later oznámenie per resolution 27/04 of 16.07.2026 moving okrsok 8 (Belehradská, Jiskrova, Kováčska, Krížna, Legionárska, Šancová 88-110) to obvod 1, used here. Okrsok 25 also lists 'Bratislava-Nové Mesto : 0' (residents registered without a house address) → obvod 4; the register's 1321 addresses without a street are not otherwise covered and are placed by fill_nearest. Likavská (not in the list) inferred into obvod 3. For streets split between obvody, numbers not in the list fall to the obvod holding most of the street. Typos fixed: 'Cesta na Kamzík 37, E' read as 37E; 'Na Rozhliadke 1 B1 2' read as 1B, 2."
okrsky_fill = "nearest"
okrsky_note = "Rules from the per-okrsok list of streets and house numbers (Zoznam volebných okrskov so zaradenými ulicami a číslami domov). A street listed in only one okrsok of its obvod is a whole-street rule; a street listed in several okrsky of the same obvod gets the listed numbers per okrsok, and register numbers the list omits go to fill_nearest. Text-layer fixes: Cesta na Kamzík '37, E' read as 37E; Na Rozhliadke '1 B1 2' read as 1B, 2; Sliačska also lists 'súpisné číslo 12742' (okrsok 16). Likavská (not in the list), okrsok 25's 'Bratislava-Nové Mesto : 0' (voters without an address) and addresses without a street are left to fill_nearest. No document states the date of the okrsky decision. Two numbers are listed in two okrsky: Jeséniova 10 (18 and 19, kept in 19 with the other even numbers) and Nobelova 16 (29 and 30, kept in 29 within its even run 4-26)."

