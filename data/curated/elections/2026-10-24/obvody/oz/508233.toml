okrsky_note = "Mayor's announcement of 13.7.2026. Obvod 2 holds okrsky 3 and 6 (as the document numbers them). Ruda Morica, Trojerovo námestie and Malý Háj are not in the register and are left out. Hlavná, Ružová, Cementárenská and Dlhá are split between obvody; within each obvod the street lies in one okrsok, so whole-street rules are used there. Marianska 88 and Železničná numbers outside 3-55/4-36 are not assigned by the document, nor are the street-less addresses (lokality like Piesky, Grefty, Háje, and voters registered only at the town); these take the nearest okrsok (fill_nearest). The document puts k.ú. Mást lokality in okrsok 7 (obvod 4), but the register's one Mást address is in obvod 2; it follows the obvod via fill_nearest."

