okrsky_note = "Scanned document, read from the page images. Where a street is split, two ranges like '2-38, 7-31' are even and odd numbers (parity by the range's first number); Radvanská, Trieda Hradca Králové and Sládkovičova (obvod 7) ranges are taken as consecutive numbers. Streets not in the register (Hutná, Ľaliová, Tulipánová, Tribečská, Zoborská, Žiarska, Lariská, Radomská, Pánska, Pod Flosom, Cínová, Dolomitová, Grafitová, Petelenova etc.) are left out; 'Banská Bystrica' in okrsok 1 means residents registered only at the town. fill_nearest covers Podbeľová ulica (not listed), numbers outside the listed ranges (e.g. Sládkovičova odd numbers in obvod 7, Internátna 3-11) and addresses without a street. Súpisné číslo 13936 (okrsok 8, obvod 1) lies in obvod 3 by the obvod rules; it follows the obvod (fill_nearest) and is not placed in okrsok 8."

