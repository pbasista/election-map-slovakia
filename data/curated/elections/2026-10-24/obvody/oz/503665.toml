note = "Announcement of the mayor (15.7.2026) of MsZ resolution č. 830-Z/2026 of 25.6.2026: 19 seats in 3 obvody. Numbers in the document are súpisné čísla. Obvod 1 is a list of specific buildings on Železničiarska, Mierová, Hodská, Česká and Švermova plus Ulica Karola Duchoňa; the other buildings of those streets (except Mierová) fall to obvod 2, where the streets are named whole. Obvod 2 lists some streets only by some súpisné čísla; unlisted buildings in the town are placed in obvod 2 by a rest rule. 'Čipkéš' (obvod 2) has no addresses in the register. The rest rule also places in obvod 2 the 23 addresses of the town without a street (by súpisné číslo, e.g. 1707, 1872, 2386–2390, 2419, some of them next to obvod-1 buildings) and Šaľská ulica, which the document does not name. Mierová súp. č. 3173–3177 (or. č. 1–9) are inferred to obvod 1 with the rest of Mierová, though they are geographically closer to obvod-2 buildings; uncertain. Foreigners with permanent residence 'Mesto Galanta' are mentioned in obvody 1, 2 and 3 and have no address."
