obec = "503011"
name = "Nové Zámky"
date = 2026-05-06
fill = "nearest"
note = "The Oznámenie (resolution MsZ č. 467/060526, date read as 6 May 2026 from the number) gives 7 obvody x 3 seats but no streets; the streets come from the city's official announcement of volebné okrsky, which lists for each obvod its okrsky and their streets. The text of resolution 467/060526 itself was not found online. Streets the document names but the register lacks: Zemiansky priechod, Olivová ulica, Veľká Ragoňa, Sihoť sv. Alžbety, Severná ulica, Strieborná ulica. fill_nearest covers the 4663 addresses without street (súpisné only) and Bratislavská cesta (in register, not in the document; lies between Cyrilometódska (obvod 7) and T. G. Masaryka (obvod 6)). Okrsok 19 (obvod 5) also includes citizens with permanent residence registered only as 'Nové Zámky' (no address)."
okrsky_fill = "nearest"
okrsky_note = "Okrsky and streets from the city's announcement of volebné okrsky for 24.10.2026 (no decision date stated). Streets named but missing from the register left out: Zemiansky priechod, Olivová ulica, Veľká Ragoňa, Sihoť sv. Alžbety, Severná ulica, Strieborná ulica. 'Nový Gúg' (okrsok 4) taken as the part Nový Gúg. G. Bethlena 2E-50 (párne) written as even 2-50. fill_nearest covers addresses without street, Bratislavská cesta (not in the document) and house numbers outside the listed ranges. Okrsok 19 also includes citizens with residence only 'Nové Zámky'."

