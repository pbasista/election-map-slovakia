note = "Council resolution 114/2026 of 14 Jul 2026 kept the 2022 obvody (2 obvody, 7 + 6 seats); the city's announcement of 15 Jul 2026 lists the streets. The document also names 'Vitéz kert' and 'Skalná' (obvod 1), which are not in the address register and are left out. The okrsky announcement (okrsky 1-7, 9, 17, 18 -> obvod 1; 8, 10-16 -> obvod 2) agrees with the street lists. The announcement's 'Rožňava 3655, bez ulice' (obvod 1) is okrsok 9's 'Rožňava 3655, občania s trvalým pobytom „mesto Rožňava“': the street-less house súp. č. 3655 and citizens registered only at the town (no house, not in the address register). The other addresses without a street of the part Rožňava are placed by fill_nearest."
okrsky_fill = "nearest"
okrsky_note = "The city's Oznámenie on the joint okrsky lists the streets of each okrsok and assigns okrsky 1-7, 9, 17, 18 to obvod 1 and 8, 10-16 to obvod 2. 'Vitéz kert' (okrsok 1) is not in the address register and is left out. Šafárikova is split between okrsky 5 (1-15 odd, 2-22 even) and 9 (17- odd, 50- even); its even numbers 24-48 are not named and, with the other addresses without a street in the part Rožňava, take fill_nearest. Okrsok 9's 'Rožňava 3655' is the street-less house súp. č. 3655; its 'občania s trvalým pobytom mesto Rožňava' are residents without an address. Okrsok 13 is Kyjevská except 1, 3, 5, 7; the unnamed Edelényska numbers 17 and odd 33-45 take fill_nearest."

