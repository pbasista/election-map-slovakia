note = "Announcement of 29.06.2026 of resolution MsZ č. 27/IV/2026 (25.06.2026): 24 councillors in 2 obvody; obvod 1 elects 12. The obvod 2 paragraph ends without the seat count; 12 is derived as 24 - 12. Locality names in the document with no register street (obvod 1: Predné Staré Levice, Staré Levice, Stredné Levice, Studená dolina, Studený bok, Vargov vrch, ZO Šiklóš, VO Pišla, ZO Zlatý Onyx; obvod 2: Strážny vrch) are left out. The ~2867 addresses of part Levice without a street (garden/vineyard cottages, garages, industrial sites, which cannot be matched to those localities from the register) are placed by fill_nearest; about 11 of them have no coordinates. 'Saratovská ul. Perecká ul.' and 'Poľná ul. Ul. A. Sládkoviča' lack commas in the document and are read as two streets each."
okrsky_date = 2026-07-16
okrsky_fill = "nearest"
okrsky_note = "Okrsky 1-20 lie in obvod 1 and 21-45 in obvod 2 (streets match the obvody resolution). The PDF text layer is OCR with errors (e.g. 'Zcppclina', 'Hlboká ul. 3, 7, 9, 11.30, 32' read as 11, 30, 32; 'Z. Nejedlého 18-3.8' as 18-38); Z. Nejedlého 15-25 in okrsok 21 is taken as odd with 47-71 per the obvod resolution. Okrsky 42-45 are the whole parts Malý Kiar, Kalinčiakovo (with Rekreačná ulica), Horša, Čankov; they get part rules. Localities without register streets (Predné Staré Levice, Stredné Levice, Staré Levice, Studená dolina, ZO Šiklóš, VO Pišla, ZO Zlatý Onyx, Studený bok, Vargov vrch in okrsok 18; Strážny vrch in 39) and residents registered only to the city (okrsok 15) have no rules. Unlisted house numbers (e.g. odd ku Bratke, other Mochovská, Perecká 33-43, Ľ. Štúra 49-63 not listed) and addresses without street take the nearest okrsok (fill_nearest)."

