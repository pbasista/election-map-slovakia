note = "Announcement of the city (dated 21. 7. 2026) of MsZ resolution no. 1130 of 20. 7. 2026: 27 councillors in 6 obvody (5+6+6+5+4+1). fill_nearest covers the ~1430 addresses without a street (numbered by súpisné číslo in parts Trnava and Modranka), which the document does not assign. Streets named in the document but absent from the register (left out): Antona Malatinského, Námestie kráľovnej Konštancie, Námestie Pavla Ďurka, Novosadská, Stará ulica, Tŕnitá ulička (1); Gaštanová (2); Jána Krištofíka, Mikuláša Vaymára, Námestie Augusta Stummera (3); Jána Korca, Jozefa Adamoviča, Medová, Prašná (4); Park Janka Kráľa (5). Hlboká west/east side and Dohnányho north/south of the railway resolved from address coordinates and OSM geometry (see rule notes)."
okrsky_date = 2026-07-23
okrsky_fill = "nearest"
okrsky_note = "Okrsky per the primátor's decision of 23.07.2026 and its annex listing streets per okrsok grouped by obvod. Okrsky 2 and 47 (MsÚ, Trhová 3) also take 'bez ulice' residents (registered to the town without a street) by surname A-K / L-Z; these select no address, so okrsok 47 is addressless. Left out (not in the register): Námestie kráľovnej Konštancie (1), Námestie Pavla Ďurka (2), Gaštanová ulica (15), Námestie Augusta Stummera, Ulica Jána Krištofíka, Ulica Mikuláša Vaymára (18), Medová ulica, Ulica Jána Korca, Ulica Jozefa Adamoviča, Prašná ulica (28), Park Janka Kráľa (38). 'Horné bašky' is a typo for Horné bašty; 'Wiliama' for Williama Schiffera. Streets the annex places in an okrsok of one obvod while the obvod rules split them (Ulica Hlboká west side in obvod 1, Ulica Dohnányho north of the railway in obvod 1, Trstínska cesta, Okružné námestie) are followed by obvod; their addresses in the other obvod, house numbers the lists omit, and the ~1430 addresses without a street are placed by fill_nearest. Contradiction: the annex lists Oravné in okrsok 27 (obvod 3), but the obvody resolution puts Oravné in obvod 4; following the obvod, Oravné has no rule and its addresses take the nearest okrsok of obvod 4 (fill_nearest)."

