note = "Announcement of 20.07.2026 of MsZ resolution no. 1291/2026 of 16.07.2026 (adopted after the mayor vetoed the June resolution); 31 seats in 6 obvody. fill_nearest covers house numbers the document does not assign on split streets: Levočská (odd 31-45, even 32, odd 151-163), Pod Táborom (34, even 36-42), L. Novomeského (odd 13-23), Ľ. Podjavorinskej (24). 'Pražská (časť ulice)' (obvody 2, 4, 5) is not in the address register and is left out; 'Teriakovská (časť ulice)' in obvod 5 has no numbers and the register's Teriakovská 1-22 is wholly in obvod 6 ('č. 1-22'). Streets named without addresses in the register are omitted. Street-less addresses of parts other than Prešov are assigned by the obvod descriptions (inferred). 'Prešov' at the end of obvod 4's street list means citizens registered only at the town (no house), who are not in the address register; the street-less addresses of the part Prešov are placed by fill_nearest."
