okrsky_note = "Mayor's decision OVS/5798/2026 of 31.07.2026, annex 1 (streets and house numbers per okrsok). A street named in only one okrsok of its obvod gets a whole-street rule; streets split between okrsky of an obvod get the listed numbers (orientačné). Streets the document names but the register lacks are left out: Gorazdova, Koceľova, Pribinova, Rastislavova, Jána Lazoríka, Ulica Eleny Lackovej, Ulica Fraňa Gibalu, Ulica Maxa Kurtha, Ulica Oskara Bergera, Ulica Štefana Hlaváča, Sadovnícka, Česká ulica, Pražská, Liesková, Gerlachovská, Račia, Riečna, Rybníčky, Remscheidská, Ku Škáre, Ulica Jozefa Gabčíka, Dlhá (okrsok 44), Tulipánová. 'trvalý pobyt „Prešov“' (okrsok 33) means voters registered only at the town. Štefana Náhalku = register 'Ulica Štefana Náhalku', Zlatnícka = 'Zlatnícka ulica'. House numbers on split streets that the annex does not list, and all addresses without a street (súpisné only, incl. Nižná Šebastová, Solivar, Šalgovík), take the nearest okrsok (fill_nearest)."

