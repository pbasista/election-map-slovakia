note = "Council decided by Uznesenie č. 699/2026 of 14 May 2026 (two obvody JUH/SEVER, 10 + 9 seats); the street lists are transcribed from the mayor's announcement of 17 July 2026. Not in the address register (left out): Kysucká, Borovicová (obvod 1); Nitrianska is listed twice in obvod 1. Streets missing from the document placed by map (inferred): Cintorínska, Odorínska cesta (obvod 2), Šafárikovo námestie (obvod 1), Elektrárenská 9-10 (obvod 1) and 11 (obvod 2). \"Lomnická\" = register \"Lomnická ulica\". The document's a \"Spišská Nová Ves\" among the obvod 2 streets means citizens registered only at the town (no house), who are not in the address register; the addresses without a street in part Spišská Nová Ves are placed by fill_nearest, those in Novoveská Huta go to obvod 1 (inferred)."
okrsky_date = 2026-07-29
okrsky_fill = "nearest"
okrsky_note = "Okrsok 28 is listed after 15 in the document; okrsky 1-15 and 28 lie in obvod 1 (JUH), 16-27 in obvod 2 (SEVER). Kysucká and Borovicová are not in the register (left out); 'voliči s trvalým pobytom Spišská Nová Ves' (okrsok 19) are not in the register. Okrsok 1 also takes the whole part Novoveská Huta ('miestna časť Novoveská Huta'). Elektrárenská: 6-8 in okrsok 7 (obvod 1), 1-5 in okrsok 17 (obvod 2), each as the whole street within its obvod. Kollárova: bloky 1-12 → okrsok 21, the rest (rodinné domy) → 20; Slovenská: bloky 44-56 → 22, the rest → 20. Duklianska 50- → 25. Not listed and placed by fill_nearest: Cintorínska, Odorínska cesta, numbers the document leaves out (e.g. Brezová 30, 33-36, J. Wolkera 9-24 gaps, Štúrovo nábrežie 8, P. Jilemnického other even numbers, Trieda 1. mája 28+ even) and the addresses without a street. An older document oznamenie-o-utvoreni-volebnych-okrskov-a-urceni-volebnych-miestnosti.pdf lists only polling stations."

