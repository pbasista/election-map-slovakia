okrsky_note = "Okrsky from the city's 'Informácia o čase a mieste konania volieb' (okrsky 1–52 with their streets). Obvod per okrsok follows the obvody streets: 1 = okrsky 1–19, 2 = 20–31 and 24, 3 = 32–40, 4 = 41–52. Okrsky 13, 24, 36, 46 take voters registered at Námestie S. H. Vajanského (town office, without a real address) by surname (A–F, G–H, CH–P, R–Ž); the register's Námestie S. H. Vajanského addresses lie in obvod 1, so they go to okrsok 13 (whose only content that is); okrsok 36 has no street and is marked addressless. Split streets: where the document numbers a street in several okrsky, one okrsok takes the remainder of the street (Stavbárska 5, Gogoľova 6, P. Mudroňa 14, M. R. Štefánika 15, Šoltésovej 15, P. O. Hviezdoslava 18, Jilemnického 21, Zvolenská 22, Kratinova 33, A. Stodolu 42, Hrdinov SNP 50, V. Žingora 50, Hollého 50, J. Goliána 52), the others their listed numbers. Komenského and Červenej armády are split between okrsky 19 and 20 exactly as between obvody 1 and 2. Named but not in the register (left out): Pod strelnicou, Hrby, Kalnô, Predvalašská, Lázky, Veľká Hora, Kohútova, Memorandové námestie, Jána Bohdana Hroboňa, Ulica A. Scherera, Jedľoviny, Podhradište, Včelárska paseka, Martinské hole, Stráne, Štrbovo, Podstráne I., Osikovo, Osada SNP 3, 4. fill_nearest covers register streets the document omits (Riadok, Obchodné centrum Turiec, Ulica E. T. Böhma), numbers of split streets not listed, and addresses without a street (Jahodníky, Tomčany, Košúty, Priekopa, Záturčie, Podháj)."

