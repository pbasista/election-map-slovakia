note = "Uznesenie MsZ č. 114/26 of 13 July 2026 adopted 'variant č. 1' (4 obvody, 8/5/5/7 seats) but names the obvody only; the street lists are transcribed from Variant č. 1 of the council material (Návrh, dokument 109188), which the resolution refers to. Streets named in the document but absent from the register (K Mestskej Bôrovej, Kohútova, Memorandové námestie, Pod strelnicou, Thomku-Mitrovského, Ulica Jána Bohdana Hroboňa, Námestie francúzskych partizánov, Ulica A. Scherera, Ulica J. Ursínyho) and the 'Iné verejné priestranstvá' localities are left out. Addresses without a street: parts Jahodníky, Tomčany → 1, Košúty → 2, Priekopa → 3, Záturčie, Podháj → 4 (inferred part rules, all streets of those parts lie in that obvod); the ~2371 street-less addresses of part Martin (split across obvody 1, 2 and 4 localities such as Stráne) are left to fill_nearest."
