obec = "543187"
name = "Jaklovce"
okrsky_date = 2024-01-22
okrsky_fill = "nearest"
okrsky_note = "Stará is split into \"dolná časť\" (okrsok 1) and \"horná časť\" (okrsok 2) without house numbers, so Stará is placed by fill_nearest, as are Pekárenská (not named in the document) and the houses without a street. Voters registered only on the obec (\"Jaklovce 0\") vote in okrsok 1; they have no register address."
okrsky_adopted = 2024-03-23
okrsky_adopted_basis = "No document of 2026-10-24 setting the okrsky was found (okrsok-rules-440): The decision of 20.07.2026 (Utvorenie volebných okrskov a určenie volebných miestnosti) only creates okrsky č. 1 and č. 2 with their polling stations (Obecný úrad Jaklovce; Základná škola Jaklovce) and gives no streets. The obec has one part, so no part-based inference is possible. These are the okrsky of the vote of 2024-03-23 (2024-prezident), the nearest in time with okrsky of its own that fit: 2 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2026-10-24 → 2024-03-23: 1: 791 → 799, 2: 693 → 693."

