obec = "582816"
name = "Žitavany"
okrsky_date = 2026-04-29
okrsky_note = "The document gives each okrsok only its polling station, no streets: okrsok 1 in the Kultúrno-spoločenské zariadenie, Opatovecká 847/32 (k.ú. Opatovce), okrsok 2 in the Obecný úrad, Športová 229/5 (k.ú. Kňažice). Žitavany has one part but two k.ú., the former villages Opatovce and Kňažice, each holding one station, so each okrsok is given the k.ú. of its station (inferred, by analogy with one part per station), as for the 2022 elections and the 2023 referendum in this repository. Dated and signed 29.04.2026. Okrsok 2 now votes in the Obecný úrad (Športová 229/5) instead of the Športová hala (Športová 791/26) of 2023–2024; both on Športová in Kňažice, the okrsky are otherwise as before."
okrsky_adopted = 2026-07-04
okrsky_adopted_basis = "No document of 2026-10-24 setting the okrsky was found (okrsok-rules-501): The 2026 election pages publish no decision on okrsky. The referendum 2026 decision (29.04.2026) gives each of the 2 okrsky only its polling station (1: Kultúrno-spoločenské zariadenie, Opatovecká 847/32; 2: Obecný úrad, Športová 229/5), with no streets; the obec has a single part, so no rules can be given. These are the okrsky of the vote of 2026-07-04 (2026-referendum), the nearest in time with okrsky of its own that fit: 2 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2026-10-24 → 2026-07-04: 1: 787 → 774, 2: 731 → 726."

