obec = "501280"
name = "Nesvady"
okrsky_date = 2024-02-23
okrsky_fill = "nearest"
okrsky_note = "The primátor's decision of 23. 2. 2024 sets the 4 okrsky and polling stations for the voľby do Európskeho parlamentu of 8 June 2024; the attached table 'Volebné okrsky s vymedzením ich územného obvodu' lists the streets per okrsok (as in 2023, plus Konvalinková ulica in okrsok 3). Aňala, Aňalské záhrady and Sady are parts of the town (part rules). Novozámocká cesta 76-91 and the register streets the table does not name (Fialková ulica, Kúpeľná, Nezábudková ulica, Orgovánová ulica, Priemyselná ulica), as well as the addresses without a street in the part Nesvady, are placed by fill_nearest. 'Bez TP' (voters without a permanent address) in okrsok 1 holds no addresses and is left out. The okrsky copied here from 2022 (rule set of 2022-10-29, job okrsok-rules-659) misread the 2022 table's columns (it put Parková, Piesková 1-16, Slnečná, Športová, Tulipánová, Turecká, Úzka, Vápenná, Vinohradnícka and Potočná, Sady, Sládkovičova, Studená, Taránska, Tatranská, Vodná, Záhradná in okrsok 1, and Kvetná, Lúčna, Malá, nám. 1. mája, Nitriansky rad, Palárikova, Pekárenská, Pettemská, Poľná in okrsok 2); this vote's table, read from the rendered page, has them in okrsky 2 and 3 as given here (the 2022 table, file 302sk_7, has the same columns)."
okrsky_adopted = 2024-06-08
okrsky_adopted_basis = "No document of 2026-10-24 setting the okrsky was found (okrsok-rules-204): The mayor's 'Utvorenie volebných okrskov a určenie volebných miestností' of 15.07.2026 lists only the four polling stations (Obchodná 21, Obchodná 23, Komenského 21, Športová 1), all in the part Nesvady, with no streets; the referendum 2026 document is the same. No 2026 document assigns streets or parts to okrsky; station-part inference impossible (4 parts but all stations in Nesvady). These are the okrsky of the vote of 2024-06-08 (2024-ep), the nearest in time with okrsky of its own that fit: 4 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2026-10-24 → 2024-06-08: 1: 985 → 1,008, 2: 1,032 → 994, 3: 1,006 → 994, 4: 1,011 → 1,009."

