okrsky_adopted_basis = "No document of 2022-10-29 setting the okrsky was found (okrsok-rules-730): No 2022 elections okrsky document is left: the 2022 elections articles are deleted (the candidates article 404s; the remaining 'Komunálne voľby 2022' article has only results and says three okrsky in one obvod), the site's surviving attachments of July–September 2022 (evt_file ids 21500–22100 probed) include no okrsky notice, and the Internet Archive has no capture of the site between April 2022 and mid-2023. The referendum's document (evt_file 22857, 10. novembra 2022) has only 2 okrsky (streets split 1/2), so it does not match the 3 okrsky of 2022. These are the okrsky of the vote of 2023-09-30 (2023-nrsr), the nearest in time with okrsky of its own that fit: 3 okrsky (nearer, not taken: 2023-01-21: okrsky 1, 2, then 1–3). Voters on the roll per okrsok (ŠÚ SR), 2022-10-29 → 2023-09-30: 1: 1,019 → 910, 2: 1,056 → 1,020, 3: 958 → 925."
okrsky_date_approximate = "named"
okrsky_date_basis = "The document is undated; its heading names the elections to the National Council of 30 September 2023. It is attached to the page \"Parlamentné voľby 2023\" (https://www.banov.sk/pre-obcanov/aktuality/spravodajstvo/parlamentne-volby-2023-2763sk.html), whose earliest Internet Archive capture (2023-10-01) is after the vote."

