okrsky_adopted_basis = "No document of 2022-10-29 setting the okrsky was found (okrsok-rules-821): No okrsky document for 2022 found. archiv.vinicne.sk is the old WordPress site whose content ends in 2019 (its 'určenie okrskov a miestnosti' is of the 2019 presidential election, not valid). The live 'Voľby a Referendum' page lists only 2026 documents. The Internet Archive's 2022 snapshots of www.vinicne.sk (homepage 2022-09-11) link only the 'Informácia o podmienkach práva voliť' notices; no okrsky notice or elections page of 2022 was archived. Web searches found nothing. These are the okrsky of the vote of 2019-05-25 (2019-ep), the nearest in time with okrsky of its own that fit: 2 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2022-10-29 → 2019-05-25: 1: 1,065 → 1,012, 2: 1,089 → 1,021."

