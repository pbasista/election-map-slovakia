okrsky_note = "'Obec Malá Ida' in okrsok 1 means voters registered without an address (no rule). Streets the document names but the register lacks: Pod lesom. Register streets the document does not name (Nevädzová) and the houses without a street are placed by fill_nearest."
okrsky_adopted = 2024-03-23
okrsky_adopted_basis = "No document of 2022-10-29 setting the okrsky was found (okrsok-rules-962): The 2022 document (19.07.2022) only says the obec forms 2 okrsky, both voting in the Kultúrny dom, Letná 7, without streets; the referendum's (8.11.2022) says the same. The only list of streets per okrsok found is the document for the elections to the NR SR 2020 (Volebné-okrsky.docx), not valid for 2022 and not stated to be unchanged. These are the okrsky of the vote of 2024-03-23 (2024-prezident), the nearest in time with okrsky of its own that fit: 2 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2022-10-29 → 2024-03-23: 1: 760 → 745, 2: 727 → 757."
