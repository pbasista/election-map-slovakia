okrsky_note = "No document of the elections of 2022-10-29 was found; these are the okrsky of the elections of 2026-10-24, the same as in 2022 (each okrsok's voters on the roll within 10%). The document is an image on the obec's OZNAM page. It lists 'Hlavná ulica' in both okrsky without house numbers, so Hlavná ulica has no rule: its houses take the okrsok of the nearest placed address (fill_nearest), as do Stará voda (not in the document) and addresses without a street. Okrsok 1 also holds 'pobyt bezdomovca'."
