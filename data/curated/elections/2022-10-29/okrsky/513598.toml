# The okrsky of Pruské of the vote of 2023-09-30, data/curated/elections/2023-09-30/okrsky/513598.toml, standing in, by `ems job reuse`. Its header there:
#   Okrsky of Pruské, transcribed by an AI agent in job okrsok-rules-3731 from the documents below;
#   checked by `ems job ingest` against the address register. The document's
#   text per okrsok, verbatim:
#     okrsok 1: voliči s trvalým pobytom v obci Pruské, miestna časť Pruské súp. č. 1 až 335 a voliči, ktorých miestom trvalého pobytu je obec Pruské
#     okrsok 2: voliči s trvalým pobytom v obci Pruské, miestna časť Pruské súp. č. 336 až 900; Pruské, miestna časť Podvažie súp. č. 1 až 140, a Pruské, miestna časť Savčina súp. č. 1 až 140
obec = "513598"
name = "Pruské"
okrsky_note = "The obec's elections page (archived) states the okrsky by part and súpisné číslo; 'voliči, ktorých miestom trvalého pobytu je obec Pruské' are voters without an address (okrsok 1). The live site answered HTTP 429, so the Internet Archive copy is used."
okrsky_adopted = 2023-09-30
okrsky_adopted_basis = "No document of 2022-10-29 setting the okrsky was found (okrsok-rules-877): No document of the 2022 elections (nor of the January 2023 referendum) found. The official site www.obecpruske.sk now shows only the 2026 elections; its 2022 elections page (volby-do-organov-samospravy-obci-a-volby-do-organov-samospravnych-krajov.phtml?id3=161042, linked from the homepage snapshots of 2022-07-08 and 2022-09-28) was reused for later votes and the live URL now redirects to the 2026 page. The Internet Archive has no 2022 capture of that page (CDX prefix listing of /volby*, availability API empty) and no capture of the notice board or of any election file after March 2022; between July 2022 and January 2023 it holds only the homepage (2022-07-08, 2022-09-28, neither naming the okrsky) and style/image files. The page's archived 2023-07-12 version gives the okrsky of the NR SR elections of 30.9.2023 (okrsok 1: miestna časť Pruské súp. č. 1–335 and voters registered only to the obec; okrsok 2: Pruské súp. č. 336–900, Podvažie, Savčina), a later vote, not used. Three web searches found nothing for 2022. Earlier attempts had the archive answering 'Temporarily Offline'; the CDX and snapshot requests above later succeeded. These are the okrsky of the vote of 2023-09-30 (2023-nrsr), the nearest in time with okrsky of its own that fit: 2 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2022-10-29 → 2023-09-30: 1: 893 → 881, 2: 937 → 878."
okrsky_date_approximate = "archived"
okrsky_date_seen = 2023-07-12
okrsky_date_basis = "the Internet Archive captured the elections page with this text on 2023-07-12, before the vote of 30.9.2023; the text names the vote and states no decision date (https://web.archive.org/web/20230712055800/https://www.obecpruske.sk/volby-do-nr-sr-2023.phtml?id3=161042)"

