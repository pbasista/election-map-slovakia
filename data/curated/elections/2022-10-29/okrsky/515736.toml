okrsky_adopted_basis = "No document of 2022-10-29 setting the okrsky was found (okrsok-rules-1051): The website keeps only the 2026 documents; the Internet Archive holds no 2022 elections okrsky document (its July 2022 election uploads lack it). The referendum's document (10.11.2022, archived 2022-11-15) gives only the polling stations: okrsok 1 at the OcÚ Veľké Teriakovce, okrsok 2 at the KD Vrbovce nad Rimavou; with 2 okrsky and 4 parts (Krásna, Malé Teriakovce, Veľké Teriakovce, Vrbovce nad Rimavou) the parts of okrsok 1 cannot be inferred by the prompt's rule (voters 513/161 suggest okrsok 2 = Vrbovce nad Rimavou only). These are the okrsky of the vote of 2026-10-24 (2026), the nearest in time with okrsky of its own that fit: 2 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2022-10-29 → 2026-10-24: 1: 513 → 508, 2: 161 → 150."

