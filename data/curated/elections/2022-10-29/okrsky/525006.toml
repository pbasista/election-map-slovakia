# The okrsky of Pečovská Nová Ves of the vote of 2023-01-21, data/curated/elections/2023-01-21/okrsky/525006.toml, standing in, by `ems job reuse`. Its header there:
#   Okrsky of Pečovská Nová Ves, transcribed by an AI agent in job okrsok-rules-3177 from the documents below;
#   checked by `ems job ingest` against the address register. The document's
#   text per okrsok, verbatim:
#     okrsok 1: Pravá strana hlavnej cesty I/68 v smere Sabinov – Lipany
#     okrsok 2: Ľavá strana hlavnej cesty I/68 v smere Sabinov – Lipany
obec = "525006"
name = "Pečovská Nová Ves"
okrsky_fill = "nearest"
okrsky_note = "The okrsky are split by the main road I/68 (ulica Hlavná): right side heading Sabinov→Lipany (north-east) okrsok 1, left side okrsok 2. Streets placed by their OpenStreetMap position relative to Hlavná (all inferred). Left to fill_nearest (nearest address): Hlavná and the addresses without a street. The document states no decision date; it is known from the Internet Archive's capture of the old WordPress site."
okrsky_adopted = 2023-01-21
okrsky_adopted_basis = "No document of 2022-10-29 setting the okrsky was found (okrsok-rules-1021): The 2022 document exists and is dated well enough, but its okrsky cannot be written as rules without guessing. (1) Transcription of the starosta's 'Utvorenie volebných okrskov a určenie volebných miestností v obci Pečovská Nová Ves pre voľby do orgánov samosprávy obcí, ktoré platia aj pre voľby do orgánov samosprávnych krajov' (https://web.archive.org/web/20221210075516/http://pecovska.sk/wp-content/uploads/2015/05/utvorenie_volebnych_okrskov-1.pdf, undated, no signature date): 'utváram … pre voľby do orgánov samosprávy obcí a do orgánov samosprávnych krajov, ktoré sa budú konať 29. októbra 2022 tieto volebné okrsky: Volebný okrsok č. 1: Pravá strana hlavnej cesty I/68 v smere Sabinov – Lipany, volebná miestnosť Obecný úrad, ul. Hlavná 33; Volebný okrsok č. 2: Ľavá strana hlavnej cesty I/68 v smere Sabinov – Lipany, volebná miestnosť Základná škola s materskou školou, ul. Školská 12.' No streets are named. (2) Dating: the document names the elections of 29 October 2022 ('named'); the obec's elections page captured on 2022-10-02 (https://web.archive.org/web/20221002162114/http://pecovska.sk/obecny-urad/volby-a-referenda/) links it as 'Utvorenie volebných okrskov pre voľby do orgánov samosprávy obcí 2022 a pre voľby do orgánov samosprávnych krajov 2022' ('archived', 2022-10-02); the PDF itself is captured only on 2022-12-10. (3) Why not usable: checking the register's address points (09/2022) against the I/68 in OSM (2022-01-01), the I/68 runs through the village as the streets Hlavná and Na Dujave themselves, whose houses lie on both sides: Hlavná 1–58 right, 59–97 left, 107–122 mixed (107, 108, 109, 111, 113, 116, 117, 119–122 right; 110, 112, 115, 118 left); Na Dujave 1–21 right, 22–53 left, 54–57 right; the 51 houses without a street (súpisné only) also lie on both sides. The other streets each lie on one side (right: Kvetná, Ľutinská, Na Hliník, Na Pečovec, Na Trubalovec, Rómska, Za Majerom, Záhradná; left: Jabloňová, Južná, Kostolná, Mlynská, Na Rybníkoch, Orgovánova, Poľský Dvor, Školská, Za Ľutinkou), and the polling stations (Hlavná 33 right, Školská 12 left) fit. Splitting Hlavná and Na Dujave by house numbers would be our own inference from map points, not the document's, so the item is left not_found. These are the okrsky of the vote of 2023-01-21 (2023-referendum), the nearest in time with okrsky of its own that fit: 2 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2022-10-29 → 2023-01-21: 1: 1,152 → 1,150, 2: 826 → 824."
okrsky_date_approximate = "named"
okrsky_date_basis = "The document names the referendum of 21 January 2023; it is undated."

