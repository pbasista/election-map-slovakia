name = "Pečovská Nová Ves"
okrsky_fill = "nearest"
okrsky_note = "No document of the elections of 2022-10-29 was found; these are the okrsky of the elections of 2026-10-24, the same as in 2022 (each okrsok's voters on the roll within 10%). The okrsky are split by the road I/68 (ulica Hlavná): right side heading Sabinov→Lipany (north-east) okrsok 1, left side okrsok 2. Streets were placed by their OpenStreetMap position relative to Hlavná (all inferred). Hlavná itself (both sides) and the 78 addresses without a street take the okrsok of the nearest address (fill_nearest). No decision date stated (published 8.7.2026)."
okrsky_reused = 2026-10-24

