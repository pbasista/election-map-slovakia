okrsky_note = "The okrsky for the elections of 29.10.2022 were set by the notice 'Volebné okrsky a volebné miestnosti pre voľby do VÚC a samosprávy obce – 29.10.2022' (published on the notice board on 2022-07-22 per the page's datePublished, archived 2022-08-08; its PDF, archived only 2024, names the three okrsky and stations but no date and no streets). The streets per okrsok are from the post 'Adresy okrskov v obci Miloslavov a ulice patriace do okrskov' (published 2022-10-24 before the elections, archived 2022-12-05) and its three PDFs (uploaded 2022/10, created 2022-09-27). `date` is the notice's publication date: no document states the decision's date. The referendum's Informácia of 09.11.2022 keeps three okrsky but names only stations. The page says residents of the garden settlement by the railway and those with cancelled permanent residence (bezdomovci) are in okrsok 1: no separate addressless okrsok. Centrálna ulica is listed in okrsky 1 and 3: split by part (Alžbetin Dvor → 1, Miloslavov → 3). Streets listed but missing from the register are left out: Bernolákova, Cédrová, Jedľová (1), Liesková, Smreková (2), Brestová, Drozdia, Hrušková, Jantárová, Opálová, Orgovánová, Orlia, Osiková, Slivková, Višňová, Vŕbová, Zafírová (3). Houses without a street (súpisné only, 297) are placed by fill_nearest."

