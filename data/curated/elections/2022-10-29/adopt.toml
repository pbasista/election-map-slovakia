# The obce whose 2022 obvody or okrsky `ems job reuse` draws with the rules
# of 2026 as they stand, though the layout is not proven to match: no usable
# 2022 document places their addresses (src/election_map_slovakia/reuse.py).
# Of the others whose 2022 rules would all have to come from 2026, none
# fits: Pružina has no council rule set of 2026 (one obvod then, two in
# 2022) and its 2026 okrsky (2) are not its 2022 ones (3); the 2026 okrsky
# of Bratislava-Nové Mesto (32, 45 in 2022) and Košice-Juh (18, 20 in 2022)
# are numbered otherwise in every obvod with several; those of Veľké Rovné
# and Liptovské Sliače do not place the addresses either; those of
# Hodruša-Hámre and Nižná are drawn already, one okrsok per obvod.

[[adopt]]
obec = "517488"
name = "Divina"
units = "obvody"
basis = "No usable 2022 document places the addresses: resolution 40/2022 of 10 June 2022 and the announcement of 13 June 2022 name obvod 1 'Divina – dolná' (3 seats), 2 'Divina – horná' (4) and 3 'Divina – Lúky' (2), but do not say where the lower end stops and the upper end begins, both in the part Divina, whose houses have súpisné čísla only; no other 2022 document does (obvod-rules-343, not found). The 2026 rule set has the same obvod numbers, seats and names (dolný koniec, horný koniec, Lúky) and is itself an estimate of that split, so the 2022 borders may differ from it."

[[adopt]]
obec = "501522"
name = "Veľký Meder"
units = "okrsky"
basis = "No usable 2022 document places the addresses in okrsky: the 2022 announcement of the obvody (notice board 7.7.2022) puts okrsky 1–7 in obvod 1 (the part Veľký Meder) and okrsok 8 in obvod 2 (Ižop), but no 2022 document lists the streets of okrsky 1–7, and the January 2023 referendum's document gives only the 8 polling stations (okrsok-rules-1116). The 2026 okrsky have the same numbers in the same obvody; their streets may have been split otherwise in 2022."
