note = "No document of the elections of 2022-10-29 was found; this is the rule set of the elections of 2026-10-24, whose obvody, seats and okrsky are those of 2022 (each okrsok's voters on the roll within 10%). The announcement is a scanned image (clearly legible, read visually). Obvod 3 is defined by the settlements Nižné Kamence and Vyšné Kamence, which are not parts of the obec in the address register (they lie in part Belá and have no streets). Their houses were identified from the register's address points: the dense settlement around Nižné/Vyšné Kamence (incl. the cluster on road 583 just SW of it, súpisné 855-865, 1037) holds exactly the street-less súpisné numbers 837-1043 of part Belá (a contiguous block, no other Belá address in it; ZUŠ Nižné Kamence 891 is in it) plus scattered recreational houses 2041-2180 within the settlement. 1004 has no point and was included by its number. All other street-less houses of part Belá (Bránica, Zlieň 819-836, recreational 2000+ numbers elsewhere) go to obvod 1. The resolution 81/2026 itself is not in the published list of resolutions of 17.07.2026."
