obec = "504998"
name = "Topoľčany"
date = 2018-06-27
fill = "nearest"
note = "The council's resolution č. 676/26/2018 of 27 June 2018 is gone from the live website; the Common Crawl captured it (download_file_f.php?id=1003920, 'Urcenie_volebnych_obvodov_a_pocet_poslancov.pdf') on 2019-09-17 from the town's page 'Voľby do orgánov samosprávy obcí 2018'. It names the streets of each obvod; J. Hollého and Sama Chalupku, which it leaves out, are placed as the okrsky document of 4 September 2018 places them (okrsky 4 and 13, obvod 1). 'Priemyselná ulica' (obvod 2) is not in the address register and is left out. The 1,687 addresses without a street in part Topoľčany take the obvod of the nearest address (fill_nearest); those of Malé and Veľké Bedzany are obvod 6."
adopted = 2018-11-10
adopted_basis = "No document of 2022-10-29 setting the obvody was found (obvod-rules-224): A search engine still indexes the city's page 'Voľby do orgánov samosprávy obcí a samosprávnych krajov 2022' (topolcany.sk/volby-do-organov-samospravy-obci-a-samospravnych-krajov-2022.html) with the file 'Urcenie-volebnych-obvodov-a-pocet-poslancov-v-nich.pdf' dated 30.6.2022, but the page now answers 404 and neither it nor the PDF is in the Internet Archive (none of the ~150 archived 2022 download_file_f.php files is it; volebne-obvody.html is archived only on 21.12.2022 with its content blocked by the cookie banner). Council sessions since 2021 are only on topolcany.digitalnemesto.sk (not the city's domain). No 2022 document with the obvody's streets was found. These are the council obvody of the vote of 2018-11-10 (2018), the nearest in time with a rule set of its own of the same obvody and seats. Voters on the roll per obvod (ŠÚ SR), 2022-10-29 → 2018-11-10: 1: 6,003 → 6,239, 2: 4,493 → 4,812, 3: 5,617 → 6,020, 4: 1,537 → 1,676, 5: 2,676 → 2,792, 6: 823 → 814."

