obec = "500968"
name = "Zlaté Moravce"
date = 2022-06-23
fill = "nearest"
note = "Hviezdoslavova is split as \"2-30\" (obvod 1) and \"32-86/D\" (obvod 2) without parity; taken literally, so Hviezdoslavova 1, 31, 77, 88, 183 and 86E, and 1.mája 24, are placed by fill_nearest, as are the addresses without a street in part Zlaté Moravce. \"Voliči s trvalým pobytom Mesto Zlaté Moravce\" (okrsok 2, obvod 1) are voters registered without an address. Krížna and Poštová are named but not in the register."
okrsky_date = 2022-08-11
okrsky_fill = "nearest"
okrsky_note = "Okrsky from the city's 'Oznámenie o utvorení volebných obvodov a o určení počtu poslancov pre voľby do orgánov samosprávy obcí 29. októbra 2022', which lists the okrsky of each obvod with their streets (undated; the city's 2022 elections page lists it as 'Určenie volebných obvodova a okrskov', zverejnené 11.8.2022, aktualizované 16.9.2022: date is that publication date). 1.mája and Hviezdoslavova are split between obvody by house numbers; within each obvod each lies in one okrsok, so whole-street rules (the obvod limits them). Krížna and Poštová are named but not in the register, left out. 'Voliči s trvalým pobytom Mesto Zlaté Moravce volia v okrsku č. 2' are voters registered without an address, not the register's houses without a street; those are placed by fill_nearest."

