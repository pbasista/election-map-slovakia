fill = "nearest"
note = "The resolution (uznesenie MZ č. 187/2022 of 20.06.2022, adopted as drafted per the minutes) defines the obvody by mestské časti (Hliny I-IV, Staré mesto, ...). No 2022 list of streets per okrsok was found (the 2022 okrsky document lists only polling stations). Streets are assigned to mestské časti by the street list of VZN č. 3/2022 (in force for the 2022 elections), which gives each street its mestská časť and for Hliny the sub-part (Hliny I-VIII, Malá Praha). The register parts Bytčica and Závodie contain streets of MČ Solinky and Hájik (e.g. Kopanice, M. Šinského, Essenská, Mikovíniho), so no part rules are used there; the eight obvod-8 villages are whole register parts. Streets the VZN splits between mestské časti of different obvody (Bytčická, Centrálna, Daxnerova, Hlboká cesta, Hôrecká cesta, Na Veľký Diel, Rajecká, Univerzitná, Veľká okružná) and all addresses without a street outside the obvod-8 parts are placed by fill_nearest."
okrsky_date = 2022-08-10
okrsky_fill = "nearest"
okrsky_note = "The 2022 document (10.08.2022, listed by its Internet Archive snapshot of 2022-08-14) lists the streets of each okrsok by obvod, with the house numbers where a street is split. A street the document splits between okrsky of one obvod takes the listed (orientačné) numbers in each; a street listed in only one okrsok of an obvod is taken whole within that obvod. Numbers outside every list, register streets the document does not name (Bánovská cesta, Centrálna, Cestárska, Dúbravy, Essenská, Hruštiny, Katedrálne námestie, Námestie mladosti, Rybné námestie, Slovanská, Sv.Cyrila a Metoda, V Rovni Od Brodna, Za cintorínom) and the register addresses without a street are placed by fill_nearest. \"Žilina (iba Žilina bez ulice)\" in okrsok 1 and the bare village names (Brodno, Vranie, Zádubnie, Zástranie, Žilinská Lehota, Stará Mojšova Lúčka) mean voters registered without a street address, not register houses without a street. Not in the register, left out: Samova, Hallonova, Kubelíkova, Pod záhradkou, Budatínska, Hyrovská. Contradiction: the document puts Rosinská 30A–34C in okrsok 52 (obvod 4), but the obvod rules put the whole of Rosinská in obvod 6; following the obvod, Rosinská is left out of okrsok 52 and is whole in okrsok 55. Námestie J. Brodáča (okrsok 41) is a typo for Námestie J. Borodáča."

