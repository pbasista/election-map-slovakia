# The council obvody of Divina of the vote of 2026-10-24, data/curated/elections/2026-10-24/obvody/oz/517488.toml, standing in, by `ems job reuse`. Its header there:
#   Council obvody of Divina (517488), Žilina.
#   Estimated by hand: the documents below give the obvody's names and seats
#   but not which addresses are in which (see the note).
#     obvod 1: Divina – dolný koniec
#     obvod 2: Divina – horný koniec
#     obvod 3: Divina – Lúky
obec = "517488"
name = "Divina"
date = 2026-06-15
fill = "nearest"
note = "Estimated: uznesenie č. 50/2026 and the Oznámenie name obvod 1 'Divina – dolný koniec' (3 seats), 2 'Divina – horný koniec' (4) and 3 'Divina – Lúky' (2) without listing houses. Obvod 3 is the part Lúky. The Divina stream flows south towards the Váh (367 m at the village centre, 531 m up the valley), so the lower end is the south around the centre and the upper end the valley to the north; the part Divina is split at the nearer of two points, in the only gap between the built-up stretches, at the junction with the road to Lúky (291 and 321 addresses with a point; the seats would give about 262 and 350). Addresses without a point take the obvod most of their part got."
estimated = true
adopted = 2026-10-24
adopted_basis = "No document of 2022-10-29 setting the obvody was found (obvod-rules-343): Resolution 40/2022 of 10 June 2022 and the announcement of 13 June 2022 set the obvody as: 1 Divina – dolná (3 seats), 2 Divina – horná (4 seats), 3 Divina – Lúky (2 seats). Lúky is a part, but dolná and horná both lie in the part Divina, whose addresses are súpisné-only. Neither document draws the line between dolná and horná. The 2022 notice board has no okrsky document. The Nov 2022 okrsky notice for the referendum also says only 'Divina dolná' / 'Divina horná', and the Internet Archive has no 2022 captures of divina.sk. So obvody 1 and 2 cannot be separated. These are the council obvody of the vote of 2026-10-24 (2026), the nearest in time with a rule set of its own of the same obvody and seats. Voters on the roll per obvod (ŠÚ SR), 2022-10-29 → 2026-10-24: 1: 762 → 743, 2: 855 → 849, 3: 350 → 357."
okrsky_adopted = 2026-10-24
okrsky_adopted_basis = "ŠÚ SR counted one okrsok per obvod in 2022-10-29, so each is drawn as its obvod."

