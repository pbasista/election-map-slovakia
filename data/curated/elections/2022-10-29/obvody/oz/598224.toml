obec = "598224"
name = "Košice-Západ"
date = 2022-06-21
fill = "nearest"
note = "The announcement defines the obvody as areas (Luník I–III, IV–VI, VII–VIII and IBV); the streets are taken from the 2022 okrsky document, grouping okrsky 1–11, 12–23 and 24–31 as ŠÚ SR counts them per obvod. Streets lying wholly in one obvod are whole-street rules; Trieda SNP, Ružová, Popradská, Šafárikova trieda, Moldavská and Toryská, split between obvody, carry the okrsky document's numbers. 'Chatová lokalita' (okrsok 30), Tvrdošínska, Fiľakovská, Prievidzská and Žarnovická have no register addresses. fill_nearest places addresses without a street, the register streets the document does not name (Aničkin Park, Katkin Park, Zuzkin Park, Moldavská cesta) and numbers of the split streets the document does not list."
okrsky_date = 2022-08-02
okrsky_fill = "nearest"
okrsky_note = "Obvody grouped as ŠÚ SR counts them (1–11, 12–23, 24–31). \"Tr. SNP\" = Trieda SNP, \"Šafárikova tr.\" = Šafárikova trieda, \"Čsl.odboja\" = Československého odboja (abbreviations). Streets split between okrsky of one obvod carry the document numbers; a street listed in only one okrsok of its obvod is a whole-street rule (e.g. Popradská in 9 and 30, Šafárikova trieda in 13 and 27). \"Tri hôrky\" appears in the PDF as a heading after okrsok 23 and is read as part of okrsok 23 (register street in obvod 2). Tvrdošínska, Fiľakovská, Prievidzská, Žarnovická and \"Chatová lokalita\" have no register addresses and are left out. The note \"voliči s trvalým pobytom Košice-Západ\" (okrsok 4) concerns residents without an address. fill_nearest places addresses without a street, Aničkin Park, Katkin Park, Zuzkin Park, Moldavská cesta, Popradská addresses in obvod 2, and numbers of split streets the document does not list."

