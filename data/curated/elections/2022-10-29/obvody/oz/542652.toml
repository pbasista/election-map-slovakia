obec = "542652"
name = "Bánovce nad Bebravou"
date = 2022-06-22
fill = "nearest"
note = "Hrežďovská (part Dolné Ozorovce) is listed in both obvod 7 and obvod 8 (okrsky 16 and 17) without saying which houses belong where; it is left to fill_nearest, so each house takes the obvod of its nearest neighbours (Hečkova/Jahodová/I. Krasku in 7, Inovecká etc. in 8). Also by fill_nearest: Duklianska (1 address, not named in the document) and the part Bánovce nad Bebravou's addresses without a street. 'Vodná nádrž' (obvod 4) is not in the register. Biskupice, Malé Chlievany, Horné Ozorovce are whole parts."
okrsky_date = 2022-08-09
okrsky_fill = "nearest"
okrsky_note = "The okrsky document states no decision date; date is its posting date on the city's page VOĽBY 2022 ('Zverejnené 9.8.2022', updated 24.10.2022, before the vote). Okrsok 1 also takes the residents registered at 'Bánovce nad Bebravou' without a street or number (not placed). Okrsky 15–18 are each a whole obvod. Left to fill_nearest within their obvod: Duklianska (1 address, named in no okrsok), the Hrežďovská addresses the obvod rules put outside obvody 7 and 8, and the houses without a street. 'Vodná nádrž' (okrsok 7) is not in the register."

