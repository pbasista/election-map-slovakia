note = "The announcement (resolution 529/XXVIII/2022 of 28.06.2022) names the 9 obvody and their seats; the \"Informácia o zaradení\" assigns okrsky 1-70 to them; the okrsky are defined address by address in the list \"ulice podľa okrskov\" (printed 28.10.2022, listing the addresses with voters). Rules: a street whose listed addresses are all in one obvod is taken whole; 16 streets split between obvody are given by the listed house numbers (runs of consecutive numbers written as ranges). fill_nearest places what the list does not name: house numbers of split streets without voters, most addresses without a street name, and the streets with no listed address (Dr. Vladimíra Clementisa, Hrušovská, Orgovánová, Pod gaštanmi, Poľovnícka, Pri letisku, Pri Čiernom lese, Senecká cesta, Slovnaftská, Stará Ivanská cesta, Stará Prievozská, Viktorínova). The list entries PRAZDNE 9999 and ZÁHRADA 8524 and the \"RUŽINOV\" entries whose súpisné číslo is not unique among the addresses without a street are left out."
