okrsky_fill = "nearest"
okrsky_note = "The mayor's \"Určenie 70 volebných okrskov\" (undated scan, polling stations only) and the \"Informácia o zaradení\" (okrsky per obvod) do not give streets; the okrsky's addresses come from the district's \"Zoznam ulíc\" printed 28.10.2022 (one line per address with voters: okrsok, street, number); date is that list's print date. A street whose listed addresses within an obvod are all in one okrsok is taken whole; streets split among okrsky are given by the listed numbers (runs of consecutive listed numbers of one okrsok written as ranges, letters listed). text gives the list's streets and numbers per okrsok. AMBRUŠOVÁ = Ambrušova, TRNAVSKÁ 72 = Trnavská cesta, ČERNICOVÁ = Stará Černicová. The list's \"RUŽINOV\" entries (súpisné numbers without a street), \"ZÁHRADA\" and \"PRAZDNE 9999\" are left out. fill_nearest places the addresses without a street, unlisted house numbers of split streets, and the register streets the list does not name (Dr. Vladimíra Clementisa, Hrušovská, Orgovánová, Pod gaštanmi, Poľovnícka, Pri Čiernom lese, Pri letisku, Senecká cesta, Slovnaftská, Stará Ivanská cesta, Stará Prievozská, Viktorínova)."

