obec = "518379"
name = "Dúbravy"
date = 2022-07-18
note = "Obvod 1 = part Dúbravy, obvod 2 = 'Dúbravy – Hradná, Želobudza, Iviny'. Hradná is a hamlet that the register keeps in part Dúbravy (no street names; parts are only Dúbravy, Iviny, Želobudza); the document gives no house numbers for it and no later document does (the 2026 announcement repeats 'Hradná, Želobudza, Iviny'). Hradná's houses are therefore taken by location: the compact cluster of part Dúbravy houses at the OSM hamlet Hradná (48.585 N, 19.334 E, about 2.5 km west of the village and 0.6 km south of Želobudza): súpisné 202-232 (one numbering run between the village's ...-200 and Želobudza's 233-250) and the later houses in the same cluster. The other houses of part Dúbravy (the village around 19.37 E and its outlying houses, all at least 1.2 km from the cluster) stay in obvod 1. With Hradná, okrsok 2 (Hradná + Želobudza) has 88 addresses for 150 voters, in line with the obec's 1.5 voters per address; without it 44."
okrsky_note = "No document of the elections found (the 2022 elections page lists only the obvody announcement; nothing archived); the referendum's document. Okrsok 1 Dúbravy, 2 Hradná + Želobudza, 3 Iviny, matching the Statistical Office's okrsky per obvod. Hradná is a hamlet that the register keeps in part Dúbravy; as in the obvody, its houses are the part-Dúbravy cluster at the OSM hamlet Hradná (súpisné 202-232 and later houses there), which the obvod rules already put in obvod 2. Okrsok 2 then has 88 addresses for 150 voters, okrsok 3 (Iviny, many cottages) 127 for 88."
