obec = "504009"
name = "Sereď"
date = 2022-06-16
fill = "nearest"
note = "Uznesenie 132/2022 defines the obvody by okrsky (1-5, 6-9, 10-13), 133/2022 the seats. The 2022 oznámenie is not archived and the archived 2022 okrsky PDF is truncated, so the streets of each okrsok are taken from the council material 17A of the same meeting (population per street and okrsok as of 31.5.2022). Okrsok 6 includes voters 'bez určenia ulice' (registered without address), not the register's addresses without a street; those and Niklová, Priemyselná (not in the material, industrial/new streets) are placed by fill_nearest. Námestie republiky inferred to obvod 1."
okrsky_date = 2022-06-16
okrsky_fill = "nearest"
okrsky_note = "The mayor's 2022 list 'Volebné okrsky a volebné miestnosti' (file dated 22.7.2022) is gone from the website and archived only truncated (1 MB of 1.2 MB, unreadable, snapshot of 28.11.2022). The streets of each okrsok come from the council material 17A for the meeting of 16.6.2022 (population per street and okrsok as of 31.5.2022), which set the 2022 obvody by these okrsky (uznesenie 132/2022); date = that meeting. Okrsok 6's 'občania … bez určenia ulice' = voters without address, not the register's houses without a street. Čepenská 1211-1214 read as súpisné čísla (blocks) for okrsok 7, the rest of Čepeňská okrsok 9. Written -cepenská for register -čepeňská streets, Jelšova for Jelšová. Južná and Tulipánová (0 inhabitants) are not in the register. Not in the material and placed by fill_nearest: Niklová, Priemyselná, Námestie republiky and the houses without street."

