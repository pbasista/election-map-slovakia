obec = "501026"
name = "Komárno"
date = 2022-06-16
fill = "nearest"
note = "The resolution defines the obvody by okrsky; its annex lists the addresses of each okrsok (and obvod). Streets lying wholly in one obvod are written as whole streets; only Dunajské nábrežie, Mederčská ul., Palatínova ul. and Železničná ul., split between obvody 2 and 3, carry the list's number ranges. Piesočný hon (listed) has no register addresses. fill_nearest places the addresses the list does not name: addresses without a street (other than the parts the list names whole and the súpisné čísla 4007, 4428) and the register streets Hadovská cesta, Nová (1 address), Park pri Pevnosti - Anglia, Tržničné nám. and any unlisted numbers of the split streets."
okrsky_date = 2022-06-16
okrsky_fill = "nearest"
okrsky_note = "The council resolution 1811/2022 (16 June 2022) set the obvody by okrsky; its annex lists the addresses of each okrsok (part, street, number range with parity, single numbers, whole parts, súpisné čísla 4007 and 4428 without a street). A street in one okrsok only of its obvod is a whole-street rule; split streets carry the list's ranges (\"16 18A\" read as 16-18, 18A). Piesočný hon (listed) has no register addresses. fill_nearest places addresses the list does not name: addresses without a street outside the whole parts listed, register streets not in the list (e.g. Hadovská cesta, Nová, Park pri Pevnosti - Anglia, Tržničné nám., Slobody, Druhá Priečna ul.) and unlisted numbers of split streets."

