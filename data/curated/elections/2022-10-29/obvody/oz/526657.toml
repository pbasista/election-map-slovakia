obec = "526657"
name = "Žehra"
date = 2018-08-06
fill = "nearest"
note = "Houses numbered outside the ranges the document gives and addresses it does not place take the okrsok of the nearest address (fill_nearest)."
adopted = 2018-11-10
adopted_basis = "No document of 2022-10-29 setting the obvody was found (obvod-rules-393): The 2022 obvody were set not by the council but by 'Rozhodnutie prednostu Okresného úradu Spišská Nová Ves' OU-SN-OVVS-2022/010355-1 of 08.08.2022 (published on obeczehra.sk, Komunálne voľby 2022, 'Oznámenie o určení počtu poslancov a utvorení volebných obvodov'): 9 poslancov; obvod č. 1 'Žehra – centrálna časť a Žehra – časť Hodkovce' 2 poslanci; obvod č. 2 'Žehra – sídlisko Dreveník a osada Dreveník' 7 poslancov. The okrsky announcement of 21.07.2022 (JPG) uses the same descriptions. Seats match ŠÚ SR. Not transcribable: the register's part Žehra (151 addresses, no streets) must be split between the centre (obvod 1) and the Dreveník housing estate/settlement (obvod 2), and neither document gives súpisné numbers or any other boundary; Hodkovce is wholly obvod 1. A transcription would need súpisné numbers of the Dreveník estate and settlement (not published), so no rules were guessed. These are the council obvody of the vote of 2018-11-10 (2018), the nearest in time with a rule set of its own of the same obvody and seats. Voters on the roll per obvod (ŠÚ SR), 2022-10-29 → 2018-11-10: 1: 392 → 297, 2: 1,079 → 905."
okrsky_adopted = 2018-11-10
okrsky_adopted_basis = "ŠÚ SR counted one okrsok per obvod in 2022-10-29, so each is drawn as its obvod."

