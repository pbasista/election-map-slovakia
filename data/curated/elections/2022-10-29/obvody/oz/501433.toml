fill = "nearest"
note = "The Príloha lists the obvody by okrsky with their streets and block numbers (súpisné). Only Jilemnického is split between obvody (súp. č. 201 in VO 2, súp. č. 203, 204, 205, 233, 234, 337, 338 in VO 4); every other numbered street lies wholly in one obvod and is transcribed as a whole street. Part Mliečany (okrsok 10) is VO 2; all streets of part Malé Blahovo are in VO 3 (okrsky 11, 12, 14), transcribed as the part. Streets named by the document but absent from the register are left out. Not named by the document, placed by fill_nearest: Námestie Jehudu Aszáda (5), Námestie Jána Kálvina (1), Ulica logistického parku (3) and the register addresses without a street (part Dunajská Streda). \"Mesto – Dunajská Streda\" (okrsok 7) is the city-office residence address."
okrsky_date = 2022-07-12
okrsky_fill = "nearest"
okrsky_note = "The 2022 document (12.07.2022) lists the streets per okrsok, blocks of flats by súpisné číslo. Streets split between okrsky of one obvod use the súpisné numbers (by supisne): Nám. SNP (1/2), Boriny (2/3/4), Jantárová cesta (12/13), Nová Ves (15/16/18), Nám. priateľstva (17/18); the okrsok named with the street's \"rodinné domy\" or without numbers takes the rest. Streets the document lists with numbers in only one okrsok of the obvod are whole streets. Jilemnického: súp. 201 in okrsok 5 (obvod 2), 203–338 in okrsok 18 (obvod 4), whole street within each obvod. Part Malé Blahovo is okrsok 14, except the streets of the part the document puts in okrsky 11 and 12. \"Mesto – Dunajská Streda\" (okrsok 7) means voters registered without an address, not the register's houses without a street; these (part Dunajská Streda) and Námestie Jehudu Aszáda, Námestie Jána Kálvina, Ulica logistického parku (not named) are placed by fill_nearest. Named but not in the register, left out: Kaplnská, Ulica Ferenca Kulcsára, Ödöna Janovitsa, Józsefa Vázsonyiho, Lajosa Luzsiczu, Imre Makovecza, Ohradská cesta, Krajná cesta, Székelyudvarhelyská, Gödöllőska, Jindřichohradecká, Győrska, Subotická, Fehérvárska, Ulica kráľa Mateja, Istvána Dobóa, Károlya Róberta, Cesta svätého pápeža Jána Pavla II. \"Ulica Gyulu Szabóa – časť Dunajská Streda\" (okrsok 11) has no register addresses; the street lies in Malé Blahovo (okrsok 14)."

