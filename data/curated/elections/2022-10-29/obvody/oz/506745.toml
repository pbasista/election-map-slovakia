okrsky_note = "The mayor's 2022 document (13.7.2022, scanned PDF linked from the Spojené voľby 2022 page; transcribed from the page images) lists the streets per okrsok. Streets the document splits between okrsky of one obvod follow its number ranges (Hospodárska 4/6/7; Čajkovského 9/11, Jána Bottu 9/15 and 5 (obvod 1), Mozartova 10/12, Botanická 8/12, Terézie Vansovej 15/16; Špačinská cesta 18/19/22/25, Na hlinách 19/20/21/22, Veterná 21/25/27; Spartakovská 29/30, Vladimíra Clementisa 30/32/35/37; gen. Goliána 41/43, Zelenečská 38/42); the okrsok without numbers for a street, or the one with \"okrem\", takes the rest. Streets split between obvody (Andreja Žarnova, Kollárova, Okružné námestie, Trstínska cesta, Rybníková, Sladovnícka, Zelený kríčok, Bučianska, Hraničná, Jána Bottu, Terézie Vansovej) are whole within each obvod. \"bez ulice\" in okrsok 2 means voters registered without an address, not register houses without a street; those (parts Trnava, Modranka), numbers outside every range, and register streets the document does not name (Mesačná, Prechodná ulica, Ulica Novosadská, Ulica Skladová, Univerzitné námestie; Ulica Hlboká in obvod 1, Hospodárska in obvod 3) are placed by fill_nearest. Named but not in the register, left out: Námestie kráľovnej Konštancie, Rybárska ulica, Ulica Jozefa Adamca, Ulica Mórica Beňovského, Ulica Sama Chalupku, Priečna ulica, Zimná ulica, Bazová ulica, Ulica Jozefa Adamoviča, Prašná ulica, Včelárska ulica, Park Janka Kráľa. Contradiction: the document puts Oravné in okrsok 27 (obvod 3), but the obvod rules put it in obvod 4; following the obvod, it is left out of okrsok 27 and placed by fill_nearest within obvod 4."

