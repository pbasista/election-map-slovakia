okrsky_note = "The mayor's decision of 5.8.2022 (scan, read visually; its text layer is garbage) lists each obvod's okrsky with streets and house-number ranges. \"Banská Bystrica\" in okrsok 7 means voters registered only to the town: no rule. Where a street is split within an obvod with odd and even ranges (e.g. \"Trieda SNP 2 - 38, 7 – 31\"), each range is taken with the parity of its first number; Trieda Hradca Králové, Radvanská, Sládkovičova (obvod 7) and Zvolenská cesta are split by plain ranges/lists. Streets split between obvody (Rudlovská cesta, Sládkovičova) are whole within each obvod. Súpisné numbers the document gives for streetless addresses are part+numbers rules: Šalková 10865, 10866 (14); Kostiviarska 10151, 10153 (40); Podlavice 10775 (45); Radvaň 10165, 2751, 13165, 14958, 15069 (63) and 13241 (64). Contradiction: \"Nám.Ľ.Štúra 1\" is listed in okrsok 62 (obvod 5) but the register and obvod rules put Nám. Ľ. Štúra in obvod 6; followed the obvod (whole street in okrsok 65). Written variants: Rutkaya Nedeckého = Ruttkaya Nedeckého, Ovčiarska cesta = Ovčiarska ulica, Opálova/Rubínova/Zafírova = Opálová/Rubínová/Zafírová ulica. fill_nearest places addresses without a street and house numbers outside the listed ranges."

