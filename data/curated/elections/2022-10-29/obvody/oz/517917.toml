obec = "517917"
name = "Rajec"
date = 2018-08-16
fill = "nearest"
note = "The town's announcement on its then website rajec.info (archived) of MsZ resolution 71/2018 of 16 August 2018 (13 seats: obvod 1 Rajec-Sever 4, obvod 2 Rajec-Východ 2, obvod 3 Rajec-Západ 3, obvod 4 Rajec-Juh 4; the resolution and the minutes of that session, are on rajec.sk; the minutes give the proposal's street lists, which differ only in obvod 3 (Hollého 60-116, Nádražná 1-23, 38-60), while the announcement has Hollého 60-117 and Nádražná 1-23, 38-64; the announcement is followed: blocks/files/018c86f1-6963-761b-a989-e71350bbb627.pdf and 018c86f1-ec24-7726-bc1d-6684858e7524.pdf). Each obvod is one okrsok of the same number; the announcement lists the okrsok's streets. Hollého 50-59 and 118-120, Nádražná 24 and Kukučínova are named by no obvod: inferred rules (see rule notes). Addresses without a street (part Rajec, súpisné čísla) are not placed by the document; fill_nearest gives them the obvod of the nearest placed address. 'Občania bez domova s trvalým pobytom Rajec 0' (homeless voters registered at the town) vote in obvod 3; they have no address."
adopted = 2018-11-10
adopted_basis = "No document of 2022-10-29 setting the obvody was found (obvod-rules-308): No 2022 resolution or announcement found: the 2022 elections page holds only results and candidate lists; the old site's 2022 snapshots contain no election documents. The live page 'Volebné obvody a okrsky' (new website, © 2024, undated, no seats) lists streets of 4 obvody/okrsky but is not a document dated for 2022, so it was not used. These are the council obvody of the vote of 2018-11-10 (2018), the nearest in time with a rule set of its own of the same obvody and seats. Voters on the roll per obvod (ŠÚ SR), 2022-10-29 → 2018-11-10: 1: 1,433 → 1,470, 2: 1,045 → 1,070, 3: 1,215 → 1,203, 4: 1,131 → 1,188."
okrsky_date = 2018-09-10
okrsky_note = "The town's announcement on its then website rajec.info (archived 2019-09-21) says the mayor set the four okrsky and polling stations 'dňa 10. septembra 2018' and lists each okrsok's streets under the obvod of the same number; the announcement itself is signed 'V Rajci dňa 17. augusta 2018', so the stated day of the mayor's decision (10 September) may be a slip for an earlier day; date follows the document's statement. Each obvod is one okrsok (obvod n = okrsok n), so each okrsok is its whole obvod and has rules []."
okrsky_adopted = 2018-11-10
okrsky_adopted_basis = "The okrsky of the same rule set: 4 okrsky, those ŠÚ SR counted in each obvod. Voters on the roll per okrsok (ŠÚ SR), 2022-10-29 → 2018-11-10: 1: 1,433 → 1,470, 2: 1,045 → 1,070, 3: 1,215 → 1,203, 4: 1,131 → 1,188."

