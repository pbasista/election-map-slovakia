obec = "510998"
name = "Ružomberok"
date = 2022-06-29
fill = "nearest"
note = "Resolution 91/2022 keeps the 11 existing obvody (names and seats); their streets are in the council material of the same item. Material counts of voters per street omitted from rules. Obvody 1–4 are the parts Biely Potok (+Vlkolínec), Černová, Hrboltová, Rybárpole, transcribed as part rules. Priehradka is listed in both VO 2 and VO 11 (VO 11 with 0 voters); the register has it only in Černová, so it is in VO 2. Not named by the document, placed by fill_nearest: Janka Jesenského (1 address), Štiavnička (4), and addresses without a street in part Ružomberok (the document puts \"trvalý pobyt Ružomberok (bez ulice)\" – voters registered at the city office – in VO 8). Malino Brdo, ÚVVaÚVTOS, ÚVN, VÚ have no register street."
okrsky_date = 2022-07-12
okrsky_fill = "nearest"
okrsky_note = "The mayor's 2022 document (12.7.2022, DOCX linked from the Voľby 2022 page, archived snapshot) lists the streets per okrsok; the 9.8.2022 document assigns the okrsky to the obvody. Streets split by house numbers: one okrsok gets the listed numbers, the other the rest of the street (Moyzesa 9/10, Žilinská cesta 8/10, Plavisko 15/16, Houdeka 17/18/20, Za dráhou 22/24, Bystrická cesta 23/24 in obvod 11 and 20 in obvod 10). \"trvalý pobyt Ružomberok (bez ulice)\" in okrsok 14 means voters registered without an address at the city office, not register houses without a street; those (part Ružomberok) and Janka Jesenského, Štiavnička (not named by the document) are placed by fill_nearest. Not in the register, left out: Malino Brdo, ÚVVaÚVTOS, ÚVN, VÚ, Jánova dolina, Skalnatá. Spelling: B. Björnsona = Björnsterna Björnsona."

