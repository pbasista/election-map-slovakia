obec = "508101"
name = "Modra"
date = 2026-06-25
note = "Resolution 693/27/2026 defines obvod 1 = Modra (10 seats) and obvod 2 = Kráľová, Harmónia, Piesok (3 seats); the elections page states obvod 1 = okrsky 1–5 and obvod 2 = okrsky 6–7, so streets are taken from the mayor's okrsky document (scanned PDFs, read from rendered images). Kráľová is not a register part (it lies in part Modra), so it is given by its okrsok 6–7 streets. Veštíkova ulica (okrsok 7) has no addresses in the register and is omitted. Addresses in part Modra without a street go to obvod 1 via rest."
adopted = 2026-10-24
adopted_basis = "No document of 2022-10-29 setting the obvody was found (obvod-rules-253): The 2022 elections page of the old (vismo) website, archived 2022-08-31, links \"Oznámenie o utvorení volebných obvodov a určení počtu poslancov.pdf\" (id_dokumenty=10758) and \"Okrsky a volebné miestnosti Modra\" (10765), but neither file was archived and the old site is gone (404/redirect). The new website lists council minutes only from December 2022 and only the 2026 obvody resolution. Web searches found no other 2022 copy. These are the council obvody of the vote of 2026-10-24 (2026), the nearest in time with a rule set of its own of the same obvody and seats. Voters on the roll per obvod (ŠÚ SR), 2022-10-29 → 2026-10-24: 1: 5,989 → 5,774, 2: 1,677 → 1,753."

