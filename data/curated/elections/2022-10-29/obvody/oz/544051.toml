obec = "544051"
name = "Vranov nad Topľou"
date = 2026-07-16
fill = "nearest"
note = "The adopted resolution 257/2026 (16.7.2026) states only the 5 obvody (LOMNICA 1, ČEMERNÉ 4, SEVER 6, CENTRUM 6, JUH 8 poslancov); the street lists come from the dôvodová správa of the council material (návrh na vytvorenie volebných obvodov, dated 08.07.2026), adopted with the same obvody and seats. Numbers on Námestie slobody, M. R. Štefánika and Duklianskych hrdinov are súpisné čísla. Unlisted numbers placed by neighbours are marked inferred. fill_nearest covers: Námestie slobody s.č. 98/151, 79/153, 79/153A, 2466/157, 2467/159, 2675/161, 2675/163, 1000/162 (between obvod 3 and 4 numbers, ambiguous) and the addresses without a street in mestská časť Vranov (split between obvody 3–5; Lomnica and Čemerné ones are covered by part rules)."
adopted = 2026-10-24
adopted_basis = "No document of 2022-10-29 setting the obvody was found (obvod-rules-243): Uznesenie MsZ č. 252/2022 of 30.6.2022 (39. MsZ, in the 2018-2022 ZIP of resolutions) only names the 5 obvody and seats: Lomnica 1, Čemerné 4, Sever 6, Centrum 6, Juh 8 — no streets or okrsky. The 2022 elections page now lists only results; the oznámenie o utvorení volebných obvodov and the 2022 okrsky document were removed after the election, and the Internet Archive has no snapshot of the page between 15.6.2022 and 29.11.2022 nor any of those files. The council material for item 13 of the 39. MsZ is not online. Territory of Sever/Centrum/Juh cannot be transcribed without guessing. These are the council obvody of the vote of 2026-10-24 (2026), the nearest in time with a rule set of its own of the same obvody and seats. Voters on the roll per obvod (ŠÚ SR), 2022-10-29 → 2026-10-24: 1: 584 → 589, 2: 2,631 → 2,630, 3: 3,918 → 3,730, 4: 4,550 → 3,744, 5: 5,701 → 6,205."

