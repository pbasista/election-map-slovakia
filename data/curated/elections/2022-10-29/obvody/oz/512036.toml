note = "Resolution 152/22 of 19 July 2022 names the obvody only by city quarter (Ľadoveň-Jahodníky-Tomčany, Stred, Sever, Košúty, Priekopa, Záturčie, Podháj-Stráne) with their seats; the 2022 announcement page with streets (d-84756) is gone (404, not archived). Streets are taken from the 2022 okrsky document (10 Aug 2022), grouped by ŠÚ SR's okrsky of each obvod (1–12, 13–20, 21–27, 28–32, 33–40, 41–46, 47–52), which match the quarters. Streets in the okrsky document without addresses in the register are left out. fill_nearest places the addresses without a street (the okrsky document lists none) and the register streets Obchodné centrum Turiec and Riadok, which the okrsky document does not name."
okrsky_date = 2022-08-10
okrsky_fill = "nearest"
okrsky_note = "Date is that of the Informácia (10 Aug 2022); obvody grouped by ŠÚ SR okrsky (1–12, 13–20, 21–27, 28–32, 33–40, 41–46, 47–52). Okrsky 13 and 14 are \"Nám. S. H. Vajanského – by voters' surnames A–K / L–Z\": the residents registered at the town office address only (2674 voters on 3 addresses), so marked addressless; the 3 register addresses of Námestie S. H. Vajanského are placed by fill_nearest. Names in the document with no register addresses are left out: Pod strelnicou, Hrby, Kalnô, Predvalašská, Lázky, Veľká Hora, Kohútova, Memorandové námestie, Jána Bohdana Hroboňa, Jedľoviny, Podhradište, Včelárska paseka, Martinské hole, Stráne, Štrbovo, Podstráne I., Osikovo. Streets named in only one okrsok of their obvod are whole-street rules (their partial numbers dropped, e.g. Palackého, Chotárna, Fínska, Leningradská, Francúzskych partizánov). \"od č. X do konca\" read as X and up. fill_nearest places addresses without a street, register streets not named (Obchodné centrum Turiec, Riadok, Ulica E. T. Böhma) and the numbers of split streets not listed (e.g. Jilemnického even 4–44, 43–45, Š. Furdeka 27)."

