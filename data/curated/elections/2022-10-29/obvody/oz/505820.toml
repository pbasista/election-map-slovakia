okrsky_note = "The 2022 document (undated, uploaded July 2022; listed by its Internet Archive snapshot of 2022-10-07) gives the streets per okrsok and the okrsky of each obvod (resolution 1327 of 22.06.2022). Streets split by house numbers (Legionárska, Inovecká, Soblahovská, 28. októbra, Saratovská, Mateja Bela, Halalovka, Gen. Goliana, Gen. Viesta, Kpt. Nálepku, Hodžova, Považská, Opatovská, Gen. M. R. Štefánika, Bratislavská) follow the document's ranges; numbers outside every range and the ~490 register addresses without a street are placed by fill_nearest. Not in the register (no addresses), left out: Jaselská, Šťastná, Ku štvrtiam, Muškátová, Zuzany Jarábkovej, Lúčky. The document misses commas in okrsky 50 and 51 (\"K mlyniskám Kňažské\", \"Malozáblatská Poľovnícka Severná\", \"Lúčky Pavla Ondráška\"), read as separate streets. Contradiction: the document puts Sadová in okrsok 41 (obvod 3), but the register's Sadová lies in obvod 1 per the obvod rules; following the obvod, it is left out of okrsok 41 and its addresses go by fill_nearest within obvod 1."

