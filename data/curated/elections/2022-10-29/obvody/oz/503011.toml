obec = "503011"
name = "Nové Zámky"
date = 2022-06-30
note = "The resolution 584/300622 and the announcement give only numbers of obvody and seats (7 x 3). The streets are from the council material (Variant 3 – 7 volebných obvodov, 21 poslancov), the variant the resolution adopted."
okrsky_date = 2022-07-20
okrsky_fill = "nearest"
okrsky_note = "The okrsky document (signed by the mayor, undated) was published on the 2022 elections page on 20.7.2022 (\"zverejnené 20.7.2022\", archived 31.08.2022 as id 46325, now id 47344 with the same title and date); date is that publication date. It names each obvod's okrsky (as the input). Okrsok 22 also takes \"občania s trvalým pobytom Nové Zámky\" (residents without an address), left out of rules. Contradiction: Ulica Piritovská alej is listed in okrsok 5 (obvod 1) but the register/obvod rules put it in obvod 5; following the obvod, it is placed by fill_nearest in obvod 5. Zemiansky priechod, Letná, Veľká Ragoňa and Sihoť sv. Alžbety have no register addresses. fill_nearest places addresses without a street, Bratislavská cesta, the obvod-5 addresses of Cyrilometódska, G. Bethlena and Nábrežná, and numbers of split streets not listed."

