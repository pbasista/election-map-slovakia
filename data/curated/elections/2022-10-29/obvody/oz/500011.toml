date = 2022-06-23
note = "The resolution 286/2022-MZ defines the 7 obvody as mestské časti; transcribed as part rules. The announcement lists each obvod's streets (split streets such as Novozámocká, Bratislavská, Štúrova, Golianova, Dolnočermánska, Partizánska, Piešťanská, Kmeťova, Furmanská, Hornostavská, Popradská, Dolné Hony by house numbers); every whole street it lists lies in the register part(s) of its obvod, and the split streets straddle exactly those parts. The announcement text is an OCR layer with typos (quoted as is)."
okrsky_date = 2022-07-07
okrsky_fill = "nearest"
okrsky_note = "The 2022 Informácia (dated 07.07.2022, signed by the mayor; re-uploaded on nitra.sk's 2022 elections archive page) lists each okrsok's streets with house numbers for split streets. It is a scan; text from OCR without diacritics, street names restored to the register's spelling where matched (e.g. OCR \"K ricke\" = K rieke, \"Pri zungovc\" = Pri zungove, \"Picst'anska\" = Piešťanská, \"Na Horkc\" = Na Hôrke); Dlhá \"16B\" in okrsok 56 read as 163B (between 163A and 165). A street listed in only one okrsok of its obvod is a whole-street rule. Okrsok 6 also lists \"bez ulice\" (residents without an address), left out of its rules. Names without register addresses left out: Pri dríku, Ulica Ľuda Ondrejova, Námestie Kráľovnej pokoja, Štrková, Cyrilo-metodské námestie, Stará veterná ulica, Starý rínok, Ku skládke, Griesbachova, Pod Dubinou, Vlašská, Hrabová, Mandľová, Prvosienková, Račia ulica. fill_nearest places addresses without a street, register streets the list does not name, and numbers of split streets it does not list. Contradiction: okrsok 48 lists Furmanská 16, 20, which the register puts in obvod 4; following the obvod, that rule is left out and Furmanská in obvod 5 is a whole-street rule of okrsok 47. Dlhá is whole in okrsok 69 and numbered in the other okrsky of obvod 7 (69 takes Dlhá numbers not listed elsewhere)."

