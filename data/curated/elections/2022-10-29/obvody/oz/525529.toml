note = "Resolution 67/2021 of 1 July 2021 kept the 2 obvody (boundaries unchanged) with 7 and 6 seats for 2022-2026; the mayor's okrsky document of 20 July 2022 lists the streets of each okrsok and assigns okrsky 1-7, 9, 17, 18 to VO 1 and 8, 10-16 to VO 2 (matching ŠÚ SR). \"Vitéz kert\" is not in the register; \"mesto Rožňava\" = voters without address. Register addresses without a street in part Rožňava placed by fill_nearest. Resolution 67/2021 of 2021-07-01 was still in force for the 2022 elections; no later decision on obvody was found (June 2022 resolutions checked)."
okrsky_date = 2022-07-20
okrsky_fill = "nearest"
okrsky_note = "Mayor's document of 20.07.2022 (page headings of okrsky 7 and 17 lack the number; they follow in sequence). \"Vitéz kert\" (okrsok 1) is not in the register, left out. \"Páterová\" is the register's Páterova (same street, different ending of the name). \"občania s trvalým pobytom mesto Rožňava\" (okrsok 9) are voters without an address, not a rule. Not listed by the document, placed by fill_nearest: Šafárikova even 24-48, Edelényska odd 17-27 and 33-45, and the register houses without a street in part Rožňava (súpisné only)."

