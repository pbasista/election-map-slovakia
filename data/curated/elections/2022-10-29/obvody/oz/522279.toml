name = "Michalovce"
date = 2022-05-30
fill = "nearest"
note = "Resolution 295 and the announcement give the okrsky of each obvod; the streets are from the 2022 notice on time and place of the elections, which lists every okrsok's streets by obvod. Súpisné numbers in that notice (3932, 5909, 5749, 5948, 3937, 3964, 5729, 5826, 3952) are not transcribed. fill_nearest covers the streets the document leaves out (Park študentov, Priemyselná, Priemyselný Park, Sobranecká cesta, Stavbárov, Vihorlatská) and addresses without a street in part Michalovce."
okrsky_date = 2022-08-24
okrsky_fill = "nearest"
okrsky_note = "Okrsky with their streets from the town's 2022 notice on the time and place of the elections (okrsky and polling stations per obvod), matching resolution 295's okrsky per obvod. House-number ranges whose ends share parity (e.g. 1-17, 2-14) are read as odd/even ranges, as the paired ranges in the notice show. Súpisné numbers in the notice (3932, 5909, 5749, 5948, 3937, 3964, 5729, 5826, 3952) are not transcribed. 'Sama Chalúpku' (okrsok 2) is the register's Sama Chalupku, 'Koceľová' Koceľova. fill_nearest covers numbers of split streets the notice does not list, streets it leaves out (Park študentov, Priemyselná, Priemyselný Park, Sobranecká cesta, Stavbárov, Vihorlatská and others) and addresses without a street. Date: the notice is undated and the archive's first snapshot of it is of 2022-12-03; it names the elections of 29 October 2022 and is linked in the 2022 section of the town's elections page; 2022-08-24 is the creation date in the PDF's metadata (no decision date published; the 2022 okrsky list Volebné okrsky.xlsx gives polling stations only)."

