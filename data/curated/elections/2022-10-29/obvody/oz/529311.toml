okrsky_fill = "nearest"
okrsky_note = "The mayor's list of 09.08.2022 (per his Rozhodnutie č. 3) gives the streets of each okrsok by obvod; the okrsok number 3 is missing in the PDF's text layer but the page shows the block between okrsky 2 and 4. 'obyvatelia bez domova' (okrsok 2) are voters without an address, no rule. Streets split between obvody (Korytnická, Podzáhradná, Popradská, Vrakunská) are whole within an obvod where one okrsok has them. Not in the register, left out: Akvamarínová, Ul. akad. mal. Jozefa Nagya. Petöfiho = Petőfiho, Jégenešská = Jegenešská. Streets the list leaves out (Slovnaftská, Osada pri tehelni, Štátne lesy, Vrakunská in obvod 2) and house numbers the ranges leave out take the nearest okrsok (fill_nearest)."

