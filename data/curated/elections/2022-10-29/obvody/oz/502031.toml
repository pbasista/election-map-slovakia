note = "Resolution 21/2022 part V of 23.06.2022 (identical to the draft of 08.06.2022). The obvody are given by okrsky with their streets and house numbers. fill_nearest places the addresses without a street name in part Levice (vineyards, garden colonies: the document names localities such as Staré Levice, Studená dolina, Vargov vrch, ZO Šiklóš in obvod 1 and Čudo, Strážny vrch in obvod 2, which are not in the register) the street Rybáreň (not named; filled into obvod 1) and the house numbers the document leaves out of split streets: Dopravná 13, 60; Hlboká 1, 34; Mochovská 1, 5, 9, 15, 40, 42, 42A, 44, 46; Perecká 38-43; Poľná 8, 10; Saratovská 36, 87; Textilná 21; Ul. A. Sládkoviča 1, 2, 3, 5, 18; Ul. P. Jilemnického 7; Ul. Z. Nejedlého 41, 43; Ul. kpt. J. Nálepku 1, 3, 137, 139; Ul. ku Bratke 1, 3, 3A-3C, 5, 9, 9A, 11, 13, 48, 50; Vajanského 1, 3, 5, 5A, 23. \"občania s trvalým pobytom mesto Levice\" (residents without an address) has no address. Vajanského \"2, 4, 6, 8, c x 10\" read as 2, 4, 6, 8, 10 as in the draft. Names not in the register are left out: Predné Staré Levice, Staré Levice, Stredné Levice, Strážny vrch, Studená dolina, Studený bok, Ulica Magdy Pavelekovej, Ulica Pavla Maňku, Ulica na vyhliadke, Ulica svätého Urbana, VO Pišla, Vargov vrch, Vínna ul., ZO Zlatý Onyx, ZO Šiklóš, občania s trvalým pobytom mesto Levice."
