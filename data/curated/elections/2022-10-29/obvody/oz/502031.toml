okrsky_note = "Resolution 21/2022 part V of 23.06.2022 gives each obvod by its okrsky with their streets and house numbers; used as the okrsky document. \"občania s trvalým pobytom mesto Levice\" in okrsok 17 are voters registered only to the town: no rule. Parts: Géňa (okrsok 1), Nixbród (43), Malý Kiar (44), Kalinčiakovo (45, written Kalinčiakov), Horša (46), Čankov (47). Names not in the register, left out: Ulica na vyhliadke, Predné/Stredné/Staré Levice, Studená dolina, Studený bok, Vargov vrch, ZO Šiklóš, VO Pišla, ZO Zlatý Onyx, Ulica svätého Urbana, Vínna ul., Strážny vrch, Ulica Pavla Maňku, Ulica Magdy Pavelekovej. \"c x 10\" in okrsok 12 read as Vajanského 10. fill_nearest places Rybáreň (not named), addresses without a street (vineyards, garden colonies, part Krížny Vrch outside its streets) and house numbers of split streets the document leaves out."

