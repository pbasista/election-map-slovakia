okrsky_note = "The document is a scan, read by OCR without diacritics and checked against the page image; the text is given with diacritics. Houses numbered outside the ranges the document gives and addresses it does not place take the okrsok of the nearest address (fill_nearest)."
okrsky_adopted = 2023-01-21
okrsky_adopted_basis = "No document of 2023-09-09 setting the okrsky was found (okrsok-rules-3353): The notice of this vote describes the two okrsky only by area names (\"Žehra centrálna časť, Žehra časť Hodkovce\" and \"Sídlisko Dreveník, Osada Dreveník\") without house numbers; all addresses are numbered by súpisné číslo without streets, so the okrsky cannot be drawn from it. These are the okrsky of the vote of 2023-01-21 (2023-referendum), the nearest in time with okrsky of its own that fit: 2 okrsky (nearer, not taken: 2024-03-23: okrsky 1–3, then 1, 2). Voters on the roll per okrsok (ŠÚ SR), 2023-09-09 → 2023-01-21: 1: 383 → 388, 2: 1,121 → 1,094."

