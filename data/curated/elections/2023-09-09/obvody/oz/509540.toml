name = "Dolný Kubín"
date = 2022-07-18
fill = "nearest"
note = "The council obvody of the elections of 2022-10-29. The resolution names the obvody by city quarters (Kňažia, Mokraď, Záskalie / Staré mesto / Medzihradné, Banisko, Srňacie / Brezovec / Veľký Bysterec, Malý Bysterec, Beňova Lehota); the 2022 okrsky document gives the streets of each okrsok, and ŠÚ SR's okrsky per obvod (1-3, 4-5, 6-7, 8-11, 12-18) match these quarters. The quarters that are register parts are part rules; the Dolný Kubín part (Staré mesto, Banisko, Brezovec) is split by streets, and its addresses without a street (and Kubínska Hoľa etc.) are placed by fill_nearest. 'Voliči bez adresy trvalého pobytu' (okrsok 5) are voters without an address, not transcribed."
reused = 2022-10-29
okrsky_date = 2023-07-17
okrsky_fill = "nearest"
okrsky_note = "The by-election was held only in volebný obvod č. 3; its document (17.07.2023) sets okrsky 6 (Medzihradné) and 7 (Banisko) with their streets, the same numbers as in the mayor's okrsky of 26.06.2023 for the NRSR election, whose streets give the other (non-voting) okrsky; obvody grouping as in the 2022 obvody (okrsky 1-3, 4-5, 6-7, 8-11, 12-18). Voters without an address and institutions are not rules; streets not listed and addresses without a street go by fill_nearest."

