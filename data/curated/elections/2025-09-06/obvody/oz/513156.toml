obec = "513156"
name = "Ilava"
date = 2022-07-12
fill = "nearest"
note = "These are the council obvody of the elections of 2022-10-29: in 2025-09-06 each obvod that voted had voters on the roll within 10% of its count then. No document of 2025-09-06 was found (okrsky/not-found.json). Streets Lašteky I (obvod 2), Mládežnícka and Za kanálom (obvod 4) have no addresses in the register and are left out. 'občania s trvalým pobytom Ilava' (obvod 1) means voters registered without an address, not a rule. Addresses without a street in part Ilava (súpisné only) are placed by fill_nearest; parts Klobušice and Iliavka are whole obvody 5 and 6."
reused = 2022-10-29
okrsky_date = 2022-08-03
okrsky_note = "Mayor's okrsky notice of 3.8.2022: each of the 6 obvody is one okrsok with the same territory (okrsok n = obvod n), so no rules are needed."
okrsky_adopted = 2022-10-29
okrsky_adopted_basis = "No document of 2025-09-06 setting the okrsky was found (okrsok-rules-5231): Found the mayor's Oznámenie o určení volebných miestností pre doplňujúce voľby 6.9.2025 (18.7.2025, https://www.ilava.sk/e_download.php?file=/data/editor/736sk_5.pdf&original=ur%C4%8Denie%20volebnej%20miestnosti.pdf): only okrsok 2 votes, 'ulice: Medňanská, Skala, Jesenského, Kalinčiakova, Hollého, Slnečná a Lašteky I' (ZŠ Medňanská). In 2025 the council obvody were still those of 2022 (six obvody, obvod 2 = okrsok 2 only; Iliavka with Iliavčanská dolina and Záštepy was obvod/okrsok 6), whereas the input's obvody are those of 2026 (obvod 2 including Iliavka). With obvod 2 = okrsky [2] as the Statistical Office counts, okrsok 6 (Iliavka) fits no input obvod, and putting it in obvod 2 is rejected; so no valid rules can be given against these obvody. These are the okrsky of the vote of 2022-10-29 (2022), the nearest in time with okrsky of its own that fit: 6 okrsky, those ŠÚ SR counted in each council obvod (nearer, not taken: 2026-07-04: okrsky of the whole obec, the council then elected in several obvody; 2026-10-24: council obvody 1–5, then 1–6; 2023-09-30: okrsky of the whole obec, the council then elected in several obvody). Voters on the roll per okrsok (ŠÚ SR), 2025-09-06 → 2022-10-29: 2: 928 → 941."

