obec = "509001"
name = "Slovenská Ľupča"
okrsky_date = 2022-11-09
okrsky_fill = "nearest"
okrsky_note = "All 35 register streets are named. The 345 addresses without a street (numbered by súpisné číslo in the single part Slovenská Ľupča) take the okrsok of the nearest placed address (fill_nearest); 'občania s pobytom na obci' (residents registered only to the municipality) are in okrsok 1. The streets are from the mayor's announcement on the Referendum 2023 page; the linked signed PDF of 09.11.2022 (the date) lists the okrsky and stations without streets."
okrsky_adopted = 2023-01-21
okrsky_adopted_basis = "No document of 2017-11-04 setting the okrsky was found (okrsok-rules-262): The live website (WordPress, posts back to 2019) has okrsky only for the 2023 referendum, NR SR 2023, president 2024 and EP 2024; none for this vote. The Internet Archive was unreachable (connection refused) on repeated retries over ~15 minutes, so archived pages could not be checked. These are the okrsky of the vote of 2023-01-21 (2023-referendum), the nearest in time with okrsky of its own that fit: 3 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2017-11-04 → 2023-01-21: 1: 890 → 861, 2: 929 → 902, 3: 924 → 932."

