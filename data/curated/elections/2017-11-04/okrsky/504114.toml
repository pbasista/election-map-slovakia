okrsky_adopted_basis = "No document of 2017-11-04 setting the okrsky was found (okrsok-rules-386): The municipality's old WordPress website (vahovce.sk, now redirecting to obecvahovce.sk) is archived in the Internet Archive from 2016 on; its 2017 election posts (electronic address of the obec, registered TSK candidates) and the archived PDFs of July–September 2017 that could be retrieved (invoices, contracts) contain no okrsky decision, and no post on okrsky appears among its archived pages. Its page \"Voľby do samosprávnych krajov\" is archived only as reused for 2022. The current website obecvahovce.sk starts in 2022. Many archived 2017 PDFs (Document_xxx) were only retrievable truncated (Common Crawl 1 MB captures) or not at all. Every okrsky document found (2022–2026) splits the two okrsky by súpisné číslo 0–430 / 431–875 (878). Internet Archive was slow/intermittent (HTTP 503/timeouts) but answered after retries. These are the okrsky of the vote of 2022-10-29 (2022), the nearest in time with okrsky of its own that fit: 2 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2017-11-04 → 2022-10-29: 1: 864 → 876, 2: 902 → 906."

