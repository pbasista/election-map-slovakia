okrsky_note = "The decision of 4.8.2022 is titled for the elections to the self-governing regions only; these were held jointly on 29.10.2022 with the municipal elections in the same okrsky. Okrsky by súpisné číslo: 0–430 and 431–875; addresses above 875 (if any) are placed by fill_nearest."
