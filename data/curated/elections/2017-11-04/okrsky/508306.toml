obec = "508306"
name = "Viničné"
okrsky_note = "Scanned PDF, read from the image. The old website archiv.vinicne.sk (subdomain of vinicne.sk) keeps it. A mayor's notice to voters for the municipal elections of 10 November 2018 listing the streets of each okrsok; the council's notice of 19.07.2018 sets the same two obvody."
okrsky_adopted = 2018-11-10
okrsky_adopted_basis = "No document of 2017-11-04 setting the okrsky was found (okrsok-rules-308): The 2017 elections post on the old website (archiv.vinicne.sk, WordPress) holds only the e-mail for delegations and the poster rules; its media library (all uploads 2017) has no okrsky document for 2017, and the Internet Archive keeps none. These are the okrsky of the vote of 2018-11-10 (2018), the nearest in time with okrsky of its own that fit: 2 okrsky. The voters on the roll per okrsok are not known for both votes, so whether the layout changed is not known either."
okrsky_date_approximate = "named"
okrsky_date_basis = "The mayor's notice names the vote: \"Voľby sa konajú 10.11.2018\" and lists the streets of okrsok 1 and 2; it states no date of the decision."

