obec = "525146"
name = "Sabinov"
okrsky_date = 2019-01-30
okrsky_fill = "nearest"
okrsky_note = "'Medzi vodami' (a garden area) is not in the register; left out. The register street Lazy is not named; it, house numbers on 17. novembra outside the ranges, and houses without a street take the okrsok of the nearest address (fill_nearest). 'Sabinov 0' / 'bezdomovci' are voters registered only on the town, not places. The register keeps Janka Jesenského also as 'J. Jesenského': both are given."
okrsky_adopted = 2019-03-16
okrsky_adopted_basis = "No document of 2017-11-04 setting the okrsky was found (okrsok-rules-084): The archived 2017 VÚC page (captured 20.7.2017) has no okrsky document; no 2017 okrsky document archived or live. Internet Archive (CDX API) refused connections / 503 on retries, so archived pages could not be checked. These are the okrsky of the vote of 2019-03-16 (2019-prezident), the nearest in time with okrsky of its own that fit: 10 okrsky (nearer, not taken: 2018-11-10: okrsok 3: 987 voters then, 1,624 in 2018-11-10). Voters on the roll per okrsok (ŠÚ SR), 2017-11-04 → 2019-03-16: 1: 653 → 627, 2: 1,107 → 1,089, 3: 987 → 957, 4: 882 → 900, 5: 787 → 812, 6: 901 → 855, 7: 1,100 → 1,048, 8: 1,240 → 1,279, 9: 1,111 → 1,081, 10: 1,002 → 976."

