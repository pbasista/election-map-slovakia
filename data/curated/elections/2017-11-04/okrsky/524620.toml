okrsky_adopted_basis = "No document of 2017-11-04 setting the okrsky was found (okrsok-rules-442): No 2017 okrsky document found. The website of 2017 (kapusany.sk, old CMS) had a page 'Voľby do VÚC 2017' (/m/samosprava/vo-by-do-vuc-2017, linked from the notice board captured 2017-10-06), but the Internet Archive has no capture of it and no 2017 PDF of the site from after April 2017; the general 'Voľby' page captured 2018-01-08 and 2018-03-29 lists no documents. The current site and its archive (archiv.kapusany.sk/volby) start with the elections of 2018. The Internet Archive was intermittently offline but answered in the end. These are the okrsky of the vote of 2019-03-16 (2019-prezident), the nearest in time with okrsky of its own that fit: 2 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2017-11-04 → 2019-03-16: 1: 858 → 836, 2: 855 → 847."
okrsky_date_approximate = "named"
okrsky_date_basis = "The announcement's heading names the presidential election of 2019, held on 16 March 2019 (round 2: 30 March 2019); it states no date of the decision."

