obec = "598186"
name = "Košice-Staré Mesto"
okrsky_date = 2024-02-13
okrsky_fill = "nearest"
okrsky_note = "The document's table lists the territory of okrsky 1–19 (same as in 2022). Okrsok 19 takes Garbiarska 4 and the citizens registered only in the MČ (no address); okrsok 1 takes Garbiarska except 4. Streets split between okrsky (Hlavná, Komenského, Štúrova, Kpt. Nálepku and others) take the listed numbers; a street named in one okrsok only with a number range (Czambelova, Rampová, Palackého, Prešovská cesta, Kuzmányho 35-55 in okrsok 18) is kept whole there. Not in the register, left out: Bosákova, Prof. Jána Kňazovického. House numbers outside the listed ranges and addresses without a street take the okrsok of the nearest placed address (fill_nearest)."
okrsky_adopted = 2024-06-08
okrsky_adopted_basis = "No document of 2017-11-04 setting the okrsky was found (okrsok-rules-041): The district's elections page and site search hold documents from 2024 on only (presidential and EP elections 2024, referendum and elections 2026); nothing of this vote. The Internet Archive was unreachable (connection refused) throughout. These are the okrsky of the vote of 2024-06-08 (2024-ep), the nearest in time with okrsky of its own that fit: 19 okrsky (nearer, not taken: 2022-10-29: okrsok 1: 672 voters then, 869 in 2022-10-29; 2024-03-23: okrsok 1: 672 voters then, 847 in 2024-03-23). Voters on the roll per okrsok (ŠÚ SR), 2017-11-04 → 2024-06-08: 1: 672 → 835, 2: 1,020 → 961, 3: 922 → 825, 4: 1,149 → 1,142, 5: 988 → 906, 6: 964 → 930, 7: 845 → 776, 8: 1,137 → 1,064, 9: 983 → 888, 10: 1,004 → 958, 11: 1,042 → 924, 12: 935 → 808, 13: 875 → 756, 14: 936 → 798, 15: 989 → 919, 16: 1,041 → 900, 17: 878 → 781, 18: 983 → 929, 19: 761 → 662."

