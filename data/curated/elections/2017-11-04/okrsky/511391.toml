obec = "511391"
name = "Fiľakovo"
okrsky_fill = "nearest"
okrsky_note = "'Ulica Viliama Hulitu' (okrsok 1) and 'Ulica Cebriánova' (okrsok 8) are not in the register and are left out; 'žel. stanica' is the station, no street. Parková and Biskupická are split by the numbers the document gives (súpisné/orientačné; the rules use the orientačné; Parková '1278/2-10' is súpisné 1287 in the register, a transposition). Biskupická numbers the document does not name and houses without a street are placed by fill_nearest."
okrsky_adopted = 2024-06-08
okrsky_adopted_basis = "No document of 2017-11-04 setting the okrsky was found (okrsok-rules-108): No document of this vote reachable: the Internet Archive keeps the 2017–2020 notice-board pages (index.php/sk/samosprava/uradna-tabula/942-…-2017, 1323-…-2019, 1349-…-2019, 1549-…-2020) but not the okrsky PDFs they link (/documents/utabula/2017/volebne_okrsky_utvorene_na_vykonanie_volieb_do_samospravnych_organov.pdf, /documents/utabula/2019/volby_nrsr_2020_volebne_okrsky.pdf), which are gone (404) from the live site; the Archive was also mostly offline. These are the okrsky of the vote of 2024-06-08 (2024-ep), the nearest in time with okrsky of its own that fit: 9 okrsky (nearer, not taken: 2022-10-29: okrsok 8: 768 voters then, 571 in 2022-10-29; 2023-01-21: okrsky 1–4, then 1–9; 2023-09-30: okrsok 8: 768 voters then, 559 in 2023-09-30; 2024-03-23: okrsok 8: 768 voters then, 556 in 2024-03-23). Voters on the roll per okrsok (ŠÚ SR), 2017-11-04 → 2024-06-08: 1: 959 → 894, 2: 844 → 835, 3: 877 → 818, 4: 894 → 843, 5: 974 → 949, 6: 571 → 580, 7: 1,066 → 1,295, 8: 768 → 577, 9: 1,167 → 1,115."
okrsky_date_approximate = "named"
okrsky_date_basis = "the document's heading names the vote ('Volebné okrsky a sídla volebných komisií pre voľby do Európskeho parlamentu 08.06.2024'); it states no date"

