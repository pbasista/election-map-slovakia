# The okrsky of Kopčany of the vote of 2018-11-10, data/curated/elections/2018-11-10/okrsky/504459.toml, standing in, by `ems job reuse`. Its header there:
#   Okrsky of Kopčany, transcribed by an AI agent in job okrsok-rules-751 from the documents below;
#   checked by `ems job ingest` against the address register. The document's
#   text per okrsok, verbatim:
#     okrsok 1: Bratislavská, Kollárova, Sasinkova, Priečna, Slnečná, Športová, Kopčany (občania s trvalým pobytom na adrese obec Kopčany)
#     okrsok 2: Masarykova, Štefánikovo námestie, Hurbanova, Moravská, Marxova, Damborského, Vrbovské
obec = "504459"
name = "Kopčany"
okrsky_fill = "nearest"
okrsky_note = "'Kopčany (občania s trvalým pobytom na adrese obec Kopčany)' are voters registered without an address, not houses without a street; the register's houses without a street (incl. the settlement Vrbovské, which okrsok 2 names but the register has no street of) are placed by fill_nearest."
okrsky_adopted = 2018-11-10
okrsky_adopted_basis = "No document of 2017-11-04 setting the okrsky was found (okrsok-rules-304): The current elections page starts with 2018 (and lacks 2019); the archived old 2019 pages link 'Volebné okrsky a volebná miestnosť' files for the presidential and EP elections, but those files are gone (404) and were not captured by the Internet Archive; nothing for the 2017 regional elections was found. These are the okrsky of the vote of 2018-11-10 (2018), the nearest in time with okrsky of its own that fit: 2 okrsky. The voters on the roll per okrsok are not known for both votes, so whether the layout changed is not known either."
okrsky_date_approximate = "named"
okrsky_date_basis = "The document names the municipal elections of 10 November 2018; it states no decision date."

