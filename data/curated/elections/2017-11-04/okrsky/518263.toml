obec = "518263"
name = "Detva"
okrsky_date = 2019-01-25
okrsky_fill = "nearest"
okrsky_note = "'Detva súpisné číslo …' = houses without a street in part Detva by súpisné číslo. 'A. Hlinku, Detva' (/bez ulice a čísla/): 'Detva' is the voters registered only to the town, not mapped. Addresses no rule selects (street Bottova, the other houses without a street in parts Detva and Detva-sídlisko) are placed by fill_nearest. Named but not in the address register, left out: Jána Pavla II. Slnečná ulica and Priemyselná ulica are not named in this document; placed by fill_nearest."
okrsky_adopted = 2019-03-16
okrsky_adopted_basis = "No document of 2017-11-04 setting the okrsky was found (okrsok-rules-046): The live website's elections section starts with 2019; no okrsky document of the regional elections of 4 November 2017 found (guessed 2017 pages 404). The Internet Archive refused connections throughout (offline for us), so the 2017/2018 pages could not be checked there. These are the okrsky of the vote of 2019-03-16 (2019-prezident), the nearest in time with okrsky of its own that fit: 15 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2017-11-04 → 2019-03-16: 1: 511 → 516, 2: 490 → 484, 3: 629 → 632, 4: 362 → 367, 5: 1,174 → 1,168, 6: 1,258 → 1,236, 7: 823 → 781, 8: 1,056 → 1,038, 9: 644 → 624, 10: 979 → 950, 11: 1,271 → 1,229, 12: 1,031 → 971, 13: 458 → 450, 14: 1,247 → 1,225, 15: 224 → 224."

