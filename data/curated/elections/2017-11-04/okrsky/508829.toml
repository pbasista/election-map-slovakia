okrsky_note = "\"Sviniarka\" (okrsok 2) is not a street of the address register and is left out. Addresses without a street (súpisné čísla only, in parts Dubová, Nemecká, Zámostie) take the okrsok of the nearest address (fill_nearest). No decision date is stated on the page."
okrsky_adopted = 2020-02-29
okrsky_adopted_basis = "No document of 2017-11-04 setting the okrsky was found (okrsok-rules-426): The obec's 2017 regional-elections notice-board page (vyvesené 30.6.2017) lists the okrsky only by their polling stations: \"Okrsok č. 1 - budova Obecného úradu, Hronská 37; Okrsok č. 2 - budova Dolnej školy, Zámostského 53\", with no streets or parts. The obec has 3 parts (Dubová, Nemecká, Zámostie) but 2 okrsky, so the okrsky cannot be inferred from the stations. The site's full-text search finds no other okrsky document of 2017 (the earliest street list, with \"Sviniarka\", is of the 2020 elections); the Internet Archive has no capture of the 2017 notice-board pages. These are the okrsky of the vote of 2020-02-29 (2020-nrsr), the nearest in time with okrsky of its own that fit: 2 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2017-11-04 → 2020-02-29: 1: 784 → 777, 2: 688 → 678."
okrsky_date_approximate = "posted"
okrsky_date_seen = 2019-11-25
okrsky_date_basis = "The notice-board page of the 2020 National Council elections has the section \"Utvorenie volebných okrskov a určenie volebných miestností\" (for the elections of 2020), marked \"Zverejnené 25.11.2019\"; the decision itself is undated. (https://www.nemecka.info/zverejnovanie-1/uradna-tabula/volby-do-narodnej-rady-sr-2020-250.html)"

