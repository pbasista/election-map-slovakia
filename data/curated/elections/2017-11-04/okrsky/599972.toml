# The okrsky of Košice-Luník IX of the vote of 2023-01-21, data/curated/elections/2023-01-21/okrsky/599972.toml, standing in, by `ems job reuse`. Its header there:
#   Okrsky of Košice-Luník IX, transcribed by an AI agent in job okrsok-rules-3344 from the documents below;
#   checked by `ems job ingest` against the address register. The document's
#   text per okrsok, verbatim:
#     okrsok 1: Hrebendova 2A, Hrebendova č. 1-3, Hrebendova 10 – 12
#     okrsok 2: Krčméryho č. 1 – 15, Podjavorinskej 3 - 13
obec = "599972"
name = "Košice-Luník IX"
okrsky_date = 2022-11-08
okrsky_fill = "nearest"
okrsky_note = "The document lists the house numbers per street; each street lies wholly in one okrsok, so whole-street rules are used (register numbers the document does not list, e.g. Hrebendova 4-9, Podjavorinskej 1-2, 14-18, go with their street). 'Voliči s trvalým pobytom Košice-Luník IX' are voters registered only to the city part (okrsok 1); the register's 2 addresses without a street are placed by fill_nearest. Same okrsky as the 2022 document."
okrsky_adopted = 2023-01-21
okrsky_adopted_basis = "No document of 2017-11-04 setting the okrsky was found (okrsok-rules-583): The live website www.mclunik9.sk refused connections on 2026-10-31. In the Internet Archive, the old site's notice board (uradna_elektronicka_tabula, captured 2019-07-16, listing every item from 2015 to 26.3.2019) and the WordPress board that replaced it in 2020 (oznamenia, captured 2020-10-28; elections page dokumenty/volby empty) list no 'utvorenie volebných okrskov' for any vote before 2022: for the regional elections of 2017 they post only the list of registered candidates for the KSK elections (9.10.2017). The archive's list of the domain's PDFs has no okrsky document before the 2022 one (Utvorenie-volebnych-okrskov-a-urcenie-volebnej-miestnosti-v-MC-KE-LIX.pdf, dated 3.8.2022), which may not be used for this vote. These are the okrsky of the vote of 2023-01-21 (2023-referendum), the nearest in time with okrsky of its own that fit: 2 okrsky (nearer, not taken: 2022-10-29: okrsok 1: 2,063 voters then, 2,617 in 2022-10-29). Voters on the roll per okrsok (ŠÚ SR), 2017-11-04 → 2023-01-21: 1: 2,063 → 2,481, 2: 2,150 → 2,295."

