obec = "515612"
name = "Tornaľa"
okrsky_date = 2017-08-21
okrsky_fill = "nearest"
okrsky_note = "The list is approved by the mayor on the date given (\"Schválila … V Tornali\"). Okrsky 1, 2 and 9 take the parts Behynce, Starňa and Králik. fill_nearest places what the list leaves out in the part Tornaľa: Drevosklad (3 addresses), Poštová 72–86, Mierová numbers outside the listed ranges, and houses without a street."
okrsky_supplemented = 2018-07-10
okrsky_supplemented_from = "document"
okrsky_supplement_basis = "The 2017 list names okrsok 2 only as 'mestská časť Starňa' and leaves out the streets Osada Železné and Priemyselná (2 addresses each, part Tornaľa); the 2018 list, otherwise identical, puts both in okrsok 3 Sever I, which is taken for them. (https://www.mestotornala.sk/download_file_f.php?id=1012347)"

