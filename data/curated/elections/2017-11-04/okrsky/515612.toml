#   okrsok 5: Mierová 18-114 párne čísla, Mierová 49-129 nepárne čísla, Škultétyho
#   okrsok 6: I. Mája, Hurbanova, Hviezdoslavova, Komenského, Kostolné námestie, Letná, Poštová 1-71
#   okrsok 7: Južná, Poštová 87-107, Školská – nepárne čísla
