okrsky_note = "Streets per okrsok as the document lists them. The register's houses without a street (súpisné only) are not named; they take the okrsok of the nearest placed address (fill_nearest). Bazová (okrsok 2) is kept as the 2022 rule set has it."
okrsky_adopted = 2021-05-15
okrsky_adopted_basis = "No document of 2017-11-04 setting the okrsky was found (okrsok-rules-162): No okrsky document of this vote found: the municipality's elections section (malinovo.sk/samosprava/volby/) keeps pages only from the by-elections of 2021 on, and the Internet Archive's index of malinovo.sk has no capture of an elections page or okrsky notice from 2017-2020. These are the okrsky of the vote of 2021-05-15 (2021-05), the nearest in time with okrsky of its own that fit: 2 okrsky. The voters on the roll per okrsok are not known for both votes, so whether the layout changed is not known either."

