okrsky_adopted_basis = "No document of 2017-11-04 setting the okrsky was found (okrsok-rules-239): No okrsky document for the regional elections of 2017 (old Voľby page lists only the 2017 candidate lists, the election decree and the commission delegation notice; no okrsky document). The Internet Archive was reachable (after a short outage). Other votes' documents split the obec by súpisné číslo (2018: 1-600 / 601-; 2022-2026: 1-700 / 701-). These are the okrsky of the vote of 2018-11-10 (2018), the nearest in time with okrsky of its own that fit: 2 okrsky. The voters on the roll per okrsok are not known for both votes, so whether the layout changed is not known either."
