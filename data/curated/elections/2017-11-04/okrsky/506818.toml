obec = "506818"
name = "Boleráz"
okrsky_date = 2022-07-19
okrsky_note = "Scanned document; split by súpisné (house) numbers: č.d. 1-400 and citizens registered only to the obec in okrsok 1, from č.d. 401 in okrsok 2. The document does not name Klčovany; its houses are split by the same number ranges as the document gives them for the whole obec. \"Občania s trvalým pobytom prihlásení na obec\" are voters without an address, not register houses."
okrsky_adopted = 2022-10-29
okrsky_adopted_basis = "No document of 2017-11-04 setting the okrsky was found (okrsok-rules-383): The live notice board (current and archive records, searched for okrsk/volieb/miestnost) keeps election records only from 2022 on, besides result notices of 2018-2020; no okrsky document of this vote. The Internet Archive (offline at times, retried) has no capture of boleraz.sk before 2021. These are the okrsky of the vote of 2022-10-29 (2022), the nearest in time with okrsky of its own that fit: 2 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2017-11-04 → 2022-10-29: 1: 878 → 929, 2: 997 → 998."

