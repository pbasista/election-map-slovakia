name = "Jarovnice"
okrsky_date = 2019-11-19
okrsky_note = "Okrsky are súpisné-číslo ranges for the whole obec; the document does not name the parts, so each range is applied in both parts (Jarovnice, Močidľany), the súpisné čísla being numbered across the obec. The last okrsok is open-ended so that higher numbers also fall there."
okrsky_adopted = 2020-02-29
okrsky_adopted_basis = "No document of 2017-11-04 setting the okrsky was found (okrsok-rules-509): The current elections page starts with the 2024 presidential election; in the Internet Archive the 2017 regional, 2019 presidential and 2019 EP pages carry only the call of the elections, voter information and candidate lists, and no okrsky decision for the 2023 referendum or the NR SR 2023 election is archived. These are the okrsky of the vote of 2020-02-29 (2020-nrsr), the nearest in time with okrsky of its own that fit: 3 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2017-11-04 → 2020-02-29: 1: 1,110 → 1,113, 2: 1,112 → 1,216, 3: 1,118 → 1,212."

