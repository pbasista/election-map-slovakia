name = "Strekov"
okrsky_date = 2024-02-28
okrsky_fill = "nearest"
okrsky_note = "Table listing each okrsok's streets with súpisné čísla. Every street except Hlavná ulica lies wholly in one okrsok, so whole-street rules; Hlavná ulica is split by the súpisné numbers given (okrsok 2 as 'Hlavná ulica II'), its other numbers take the nearest placed address. 'Stará cinotírnska' is a typo for Stará cintorínska ulica; 'Topoľova' = Topoľová ulica. Ulica za potokom (1 address) is not named; it and addresses without a street take the nearest placed address (fill_nearest). Same okrsky as the copied 2022/2026 rule set. The mayor's decision (dated 28.02.2024, heading names the EP election of 8 June 2024) lists only the two polling stations; the territorial table published beside it on the EP 2024 page gives the streets."
okrsky_adopted = 2024-06-08
okrsky_adopted_basis = "No document of 2017-11-04 setting the okrsky was found (okrsok-rules-251): The 2017 elections article on the municipality's old website (oldpage.strekov.sk, archived) links the election documents only as a Google Drive folder, which asks for sign-in and is not on the municipality's website. The new website's elections page (archived July/Sept 2019 and Nov 2020) lists only 2014 documents; the notice board as archived in Sept 2019 has no election items; the Internet Archive holds no other capture of the website from 2017-2020 with an okrsky document. The live website's elections pages start with 2022. Internet Archive was intermittently offline but answered after retries. These are the okrsky of the vote of 2024-06-08 (2024-ep), the nearest in time with okrsky of its own that fit: 2 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2017-11-04 → 2024-06-08: 1: 896 → 782, 2: 775 → 813."

