name = "Lučenec"
okrsky_date = 2017-08-28
okrsky_fill = "nearest"
okrsky_note = "Mestský park, Ulica Kupeckého and Zlatá ulička, which the document lists, have no addresses in the register and are left out. 'Mesto Lučenec' listed in okrsok 10 means the voters registered with the town only; it has no rule. Where the document lists house numbers (Ulica Martina Rázusa, Ulica novohradská, Námestie republiky, Ulica A. Bernoláka, Ulica Ľudovíta Štúra, Rúbanisko II and III) they are transcribed as listed; numbers it does not list and the addresses without a street are placed by fill_nearest."
okrsky_supplemented = 2023-06-26
okrsky_supplemented_from = "document"
okrsky_supplement_basis = "The document does not list the newer streets Nezábudková ulica and Bazová ulica (next to Modré zeme and Vinohradná ulica, okrsok 1), Ulica rybničná (by Ulica športová and Tenisové ihrisko, okrsok 20) and Ulica Na Jazerách (Opatová, okrsok 25); the city's document for the National Council election of 2023 (same okrsky) lists them there, so they are placed as it does. (https://www.lucenec.sk/download_file_f.php?id=1879721)"

