name = "Malacky"
okrsky_date = 2017-09-05
okrsky_fill = "nearest"
okrsky_note = "The mayor's decision of 05.09.2017 sets the 12 okrsky and their polling stations; the city's street list for the regional elections of 4.11.2017 (scanned PDF dated 27.09.2017, read from page images, linked from the article of 27.9.2017) gives the streets. The street list gives each okrsok its streets; a street split among okrsky lists its orientačné numbers, and addresses without a street are listed by súpisné číslo as 'časť obce Malacky'. House numbers of split streets the lists leave out and the addresses without a street they do not number (mostly gardens and non-residential buildings) are placed by fill_nearest. 'bez ulice' lists nothing (voters registered without an address) and has no rule. Here Bernolákova is split between okrsky 6 (24, 26, 28, 30) and 7; Jozefa Kubinu and part of the addresses without a street are in okrsok 5, and okrsok 10 has only its four streets. 'L.Novomeského', 'Ľ. Kukorelliho' are register streets L. Novomeského, Kukorelliho. 'Štúrova súp. č. 5959' is the súpisné číslo of Štúrova 53. The Internet Archive was offline (CDX and Wayback returned 'Temporarily Offline' on several tries); it was not needed for the documents used."
okrsky_supplemented = 2022-10-29
okrsky_supplemented_from = "election"
okrsky_supplement_basis = "The document does not name Javorová, Ulica Ernsta Wiesnera, Ulica Karola Virsíka, Krátka ulica (streets of the register, most of them newer than the document); each is placed in the okrsok the rule set of the elections of 2022-10-29 gives it: Javorová in okrsok 11, Ulica Ernsta Wiesnera in okrsok 8, Ulica Karola Virsíka in okrsok 6, Krátka ulica in okrsok 12."

