# The okrsky of Dulovce of the vote of 2018-11-10, data/curated/elections/2018-11-10/okrsky/501123.toml, standing in, by `ems job reuse`. Its header there:
#   Okrsky of Dulovce, transcribed by an AI agent in job okrsok-rules-833 from the documents below;
#   checked by `ems job ingest` against the address register. The document's
#   text per okrsok, verbatim:
#     okrsok 1: Cintorínska, Družstevná, Dvorská, Hlavná, Hurbanovská, Mierová, Mudroňovská, Nová, Robotnícka, Záhradná; obyvatelia s trvalým pobytom na adrese Obec Dulovce (bez udania súpisného a orientačného čísla)
#     okrsok 2: Kamenica, Krivá, Novozámocká, Podháj, Poľná, Podbrežná, Rovná, Starohorská, Urbárska, Úzka
obec = "501123"
name = "Dulovce"
okrsky_fill = "nearest"
okrsky_note = "Kamenica and Podháj (okrsok 2) are settlements the address register has no street or part for; their houses, like the other addresses without a street, are placed by fill_nearest. Residents registered only on the obec vote in okrsok 1; they have no register address."
okrsky_adopted = 2018-11-10
okrsky_adopted_basis = "No document of 2017-11-04 setting the okrsky was found (okrsok-rules-395): The website's elections section has no page for the regional elections of 2017 (its first is the municipal elections of 2018); the Internet Archive's 2017 captures of dulovce.sk hold no okrsky document. These are the okrsky of the vote of 2018-11-10 (2018), the nearest in time with okrsky of its own that fit: 2 okrsky. The voters on the roll per okrsok are not known for both votes, so whether the layout changed is not known either."
okrsky_date_approximate = "named"
okrsky_date_basis = "the document's heading names the municipal elections of 10 November 2018"

