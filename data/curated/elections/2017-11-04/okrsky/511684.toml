okrsky_note = "The list (dated 'V Ozdíne 1.8.2022', posted 03.08.2022; the live page has lost its content, so the archived page is used) gives each okrsok only its polling station: no. 1 Kultúrna miestnosť Ozdín, no. 2 Kultúrny dom Bystrička. The okrsky are as many as the parts and each station lies in another part, so each okrsok is given the part of its station (inferred)."
