# The okrsky of Raslavice of the vote of 2018-11-10, data/curated/elections/2018-11-10/okrsky/519936.toml, standing in, by `ems job reuse`. Its header there:
#   Okrsky of Raslavice, transcribed by an AI agent in job okrsok-rules-876 from the documents below;
#   checked by `ems job ingest` against the address register. The document's
#   text per okrsok, verbatim:
#     okrsok 1: Voliči s trvalým pobytom v časti obce Vyšné Raslavice a na ul. Sekčovskej
#     okrsok 2: Voliči s trvalým pobytom v časti obce Nižné Raslavice / okrem voličov s trvalým pobytom na Sekčovskej ul. /
obec = "519936"
name = "Raslavice"
okrsky_date = 2018-08-28
okrsky_fill = "nearest"
okrsky_note = "Archived copy of the municipality's PDF (e_download.php on raslavice.sk). Part 'Raslavice' (1 address) is not named in the document; placed by fill_nearest."
okrsky_adopted = 2018-11-10
okrsky_adopted_basis = "No document of 2017-11-04 setting the okrsky was found (okrsok-rules-438): The only 2017 document (archived 2017-12-13, 'Volebné okrsky a volebné miestnosti v obci Raslavice 2017') gives each of the 2 okrsky only its polling station (Obecný úrad, Hlavná 154; Dom kultúry, Toplianska 560), no streets or parts; the municipality has 3 parts and Toplianska runs through both Nižné and Vyšné Raslavice, so the okrsky cannot be inferred from the stations. From 2018 on the documents assign Vyšné Raslavice + Sekčovská to okrsok 1 and the rest of Nižné Raslavice to okrsok 2. These are the okrsky of the vote of 2018-11-10 (2018), the nearest in time with okrsky of its own that fit: 2 okrsky. The voters on the roll per okrsok are not known for both votes, so whether the layout changed is not known either."

