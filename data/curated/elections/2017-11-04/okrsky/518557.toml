okrsky_adopted_basis = "No document of 2017-11-04 setting the okrsky was found (okrsok-rules-073): The city's 2017 elections page (live, re-uploaded in 2018) and its archived old-site page (captures of 2017-08-05 and 2017-12-19) list the decision calling the election, voter information, the law, the candidate lists and the results, but no okrsky announcement; no 2017 okrsky document is archived (the archived volby/ folder holds only older okrsky files, e.g. okrsky_referendum_2015.pdf). These are the okrsky of the vote of 2018-11-10 (2018), the nearest in time with okrsky of its own that fit: 6 okrsky. The voters on the roll per okrsok are not known for both votes, so whether the layout changed is not known either."

