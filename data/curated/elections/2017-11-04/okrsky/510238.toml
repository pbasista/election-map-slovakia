obec = "510238"
name = "Zuberec"
okrsky_date = 2022-08-10
okrsky_note = "The starosta's document is undated; date is its notice-board posting date ('Vyvesené: 10. 8. 2022'). The okrsky are split by súpisné číslo over the whole obec (1–300 / from 301), applied to every address, streets included."
okrsky_adopted = 2022-10-29
okrsky_adopted_basis = "No document of 2017-11-04 setting the okrsky was found (okrsok-rules-399): The archived 2017 elections page (captured 2017-10-07) says only that Zuberec has 2 okrsky with their polling stations (Klub dôchodcov, sála kultúrneho domu), both in the single part Zuberec; no document assigning addresses to okrsky for 2017 was found live or in the Internet Archive. The 2023 and 2024 documents split by súpisné číslo 1–300 / 301–, but are later votes'. These are the okrsky of the vote of 2022-10-29 (2022), the nearest in time with okrsky of its own that fit: 2 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2017-11-04 → 2022-10-29: 1: 783 → 729, 2: 716 → 799."

