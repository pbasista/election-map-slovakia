okrsky_fill = "nearest"
okrsky_note = "Scanned PDF read from the rendered page. The 2018 document leaves out Agátová; it is placed in okrsok 2 as the next document (29.11.2019) and every later one lists it. The register's addresses without a street are placed by fill_nearest."
okrsky_adopted = 2018-11-10
okrsky_adopted_basis = "No document of 2017-11-04 setting the okrsky was found (okrsok-rules-369): The regional elections of 2017: the notice board's archive (searchable live) keeps only the voter information (item 306), the e-mail address for delegations (307) and the results (317); no okrsky document. The aktuality list starts in 2018. The Internet Archive has only two captures of the notice board index (2017-03 and 2017-12) and kept refusing connections when fetched. The 2018 (28.08.2018) and 2020 (29.11.2019) documents list the same okrsky. These are the okrsky of the vote of 2018-11-10 (2018), the nearest in time with okrsky of its own that fit: 2 okrsky. The voters on the roll per okrsok are not known for both votes, so whether the layout changed is not known either."

