okrsky_adopted_basis = "No document of 2017-11-04 setting the okrsky was found (okrsok-rules-161): The mayor's decision for the regional elections of 4 November 2017 (Č. KNR-410/2017-3 of 18.08.2017) on the municipality's elections page (https://www.kokava.sk/download_file_f.php?id=872009, https://www.kokava.sk/download_file_f.php?id=887241) gives only the three okrsky with their polling stations (Kultúrny dom Nám. 1. mája 10; Obecný úrad Nám. 1. mája 1; Materská škola Dobšinského 29), no streets. The municipality has one part, so okrsky cannot be assigned by part; no street list valid for this vote was found on the website (live). Later votes' street lists (2018, 2022 onward) exist but are not this vote's. These are the okrsky of the vote of 2018-11-10 (2018), the nearest in time with okrsky of its own that fit: 3 okrsky. The voters on the roll per okrsok are not known for both votes, so whether the layout changed is not known either."
