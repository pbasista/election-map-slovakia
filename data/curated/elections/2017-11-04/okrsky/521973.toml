okrsky_adopted_basis = "No document of 2017-11-04 setting the okrsky was found (okrsok-rules-458): The 2017 elections page (archived 2021-11-28) links only an unnamed 'voľby2017.docx' on moderneobce2.sk, which the Internet Archive does not hold and the host no longer answers; no okrsky document for 2017 found. Seňa has one part and no streets; okrsky can be drawn only from house-number ranges, which only the documents of the 2019 presidential election and the 2024 EP election give. These are the okrsky of the vote of 2019-03-16 (2019-prezident), the nearest in time with okrsky of its own that fit: 2 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2017-11-04 → 2019-03-16: 1: 913 → 828, 2: 827 → 875."

