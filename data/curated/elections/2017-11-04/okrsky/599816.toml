obec = "599816"
name = "Košice-Nad jazerom"
okrsky_date = 2019-01-29
okrsky_fill = "nearest"
okrsky_note = "23 okrsky; the same division as the 2022 list (2019 omits only Bukovecká 20, Galaktická 9A, 9B and Textilná 4, which follow their whole-street or number rules). Rules as in 2022: The 2022 document (snapshot of 21 Oct 2022; the mayor's okrsky, undated) lists each okrsok's streets and house numbers (orientačné). Streets wholly in one okrsok get whole-street rules (their numbers not listed follow the street, e.g. Bukovecká 4, 18-19, Dneperská 8, Azovská 1); Ladožská is split by the obvody (1-6 obvod 1 → okrsok 9, 7-16 obvod 2 → okrsok 12). Inferred: Jenisejská 1A-1F, 11A → 7; 45A, 45B, 47A → 10. Placed by fill_nearest: numbers of split streets the document leaves out (Levočská 1A, 3; Irkutská 1; Jenisejská 24; Uralská 1, 3, 3A; Poludníková 7; Rovníková 11; Galaktická 1A, 11), the streets it does not name (Lubina, Napájadlá, Pri Krásnej, Slanecká, Spišské námestie) and the register's addresses without a street (súpisné only)."
okrsky_adopted = 2019-03-16
okrsky_adopted_basis = "No document of 2017-11-04 setting the okrsky was found (okrsok-rules-230): No okrsky or obvody document of this vote on jazerokosice.sk: the Internet Archive (CDX of the whole domain 2017-2025) holds okrsky lists only for 2019 (presidential), 2022, the 2023 referendum, 2023, and 2024; the live site (rebuilt 2025) and CUET have none. These are the okrsky of the vote of 2019-03-16 (2019-prezident), the nearest in time with okrsky of its own that fit: 23 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2017-11-04 → 2019-03-16: 1: 834 → 821, 2: 986 → 975, 3: 863 → 839, 4: 767 → 737, 5: 825 → 812, 6: 954 → 917, 7: 881 → 853, 8: 793 → 766, 9: 803 → 765, 10: 926 → 867, 11: 677 → 633, 12: 1,013 → 994, 13: 812 → 793, 14: 887 → 859, 15: 1,133 → 1,137, 16: 953 → 923, 17: 814 → 780, 18: 746 → 703, 19: 812 → 785, 20: 808 → 771, 21: 867 → 847, 22: 1,108 → 1,069, 23: 934 → 938."

