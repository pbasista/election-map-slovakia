obec = "508047"
name = "Limbach"
okrsky_fill = "nearest"
okrsky_note = "Scanned PDFs, read from the rendered pages. The 2019 lists do not name Krátka ulica (2 addresses in today's register, likely built later); it is taken from the rule set of 2022-10-29 (supplemented). The register's addresses without a street are placed by fill_nearest."
okrsky_adopted = 2019-03-16
okrsky_adopted_basis = "No document of 2017-11-04 setting the okrsky was found (okrsok-rules-352): No okrsky document of 2017 on the website: the notice board archive and the old website's elections page and notice board 2017 have only the voter information and the OVK delegation e-mail notice for the regional elections of 2017 (no streets per okrsok); the old site's search finds okrsky posts only from 2018 on. The Internet Archive holds no capture of limbach.sk between 2016 and 2023 (CDX), so no archived 2017 page either. These are the okrsky of the vote of 2019-03-16 (2019-prezident), the nearest in time with okrsky of its own that fit: 2 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2017-11-04 → 2019-03-16: 1: 809 → 846, 2: 783 → 821."
okrsky_date_approximate = "posted"
okrsky_date_seen = 2019-01-28
okrsky_date_basis = "'Volebné okrsky – ulice' states no date and does not name the vote; the official notice board archive lists it with 'Dátum vyvesenia: 28.1.2019' (four days after the posting of the presidential election's announcement, 24.1.2019), and the old website's elections page lists it, with 'Kontakty na volebné okrsky' (posted 4.3.2019, same okrsky), under 'Prezidentské voľby – 2019'. (https://www.limbach.sk/uradna-tabula-archiv)"

