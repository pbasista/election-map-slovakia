# The okrsky of Limbach of the vote of 2019-03-16, data/curated/elections/2019-03-16/okrsky/508047.toml, standing in, by `ems job reuse`. Its header there:
#   Okrsky of Limbach, transcribed by an AI agent in job okrsok-rules-1353 from the documents below;
#   checked by `ems job ingest` against the address register. The document's
#   text per okrsok, verbatim:
#     okrsok 1: Cintorínska, Černicová, Družstevná, Gaštanová, Limbašská dolina, Limbová, Malokarpatská, Mlynské pole, Podlesná, Pod dúblami, Potočná, Pri kockách, Priečna, Raková, Silvánska, SNP, Suchý vrch, Záhradná
