# The okrsky of Poproč of the vote of 2018-11-10, data/curated/elections/2018-11-10/okrsky/521892.toml, standing in, by `ems job reuse`. Its header there:
#   Okrsky of Poproč, transcribed by an AI agent in job okrsok-rules-748 from the documents below;
#   checked by `ems job ingest` against the address register. The document's
#   text per okrsok, verbatim:
#     okrsok 1: pre voličov bývajúcich vo východnej časti obce + Partizánska ul.
#     okrsok 2: pre voličov bývajúcich v západnej časti obce.
obec = "521892"
name = "Poproč"
okrsky_date = 2018-08-09
okrsky_fill = "nearest"
okrsky_note = "Partizánska is from the 2018 notice; all other streets are from the 2019 notice, which repeats the 2018 definition word for word and names its streets. Addresses without a street go by fill_nearest. Internet Archive copies are used (the old website's files are gone)."
okrsky_adopted = 2018-11-10
okrsky_adopted_basis = "No document of 2017-11-04 setting the okrsky was found (okrsok-rules-301): Of the 2017 VÚC elections the archive keeps only the voter information and the commissions e-mail notice; no okrsky document of 2017 was found on the website or in the Internet Archive. These are the okrsky of the vote of 2018-11-10 (2018), the nearest in time with okrsky of its own that fit: 2 okrsky. The voters on the roll per okrsok are not known for both votes, so whether the layout changed is not known either."

