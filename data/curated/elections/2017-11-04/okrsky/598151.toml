obec = "598151"
name = "Košice-Sever"
okrsky_date = 2019-01-28
okrsky_fill = "nearest"
okrsky_note = "Names the document gives that the register lacks are left out: Košické kúpele (okrsok 15), Solisková (okrsok 18). 'Na Šajbe' and 'Stará Spišská cesta' are the register's Na šajbe and Stará spišská cesta (capitalisation only). Komenského 35-73 '(párne a nepárne)' is taken as all numbers 35-73. Placed by fill_nearest: numbers outside the listed ranges of Hlinkova, Národná trieda, Slovenskej jednoty, Rampová, Czambelova, Komenského and the even side of Letná, and addresses without a street."
okrsky_adopted = 2019-03-16
okrsky_adopted_basis = "No document of 2017-11-04 setting the okrsky was found (okrsok-rules-025): The 2017 elections category page (archived 2017-09-18) links the article 'Oznámenie o volebných okrskoch a volebných miestnostiach v MČ Košice – Sever pre voľby do orgánov…', but the Internet Archive has no capture of that article nor of any okrsky PDF of 2017; the live site (new CMS) keeps nothing older than 2023. Earliest okrsky document found: 28.01.2019. These are the okrsky of the vote of 2019-03-16 (2019-prezident), the nearest in time with okrsky of its own that fit: 18 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2017-11-04 → 2019-03-16: 1: 917 → 868, 2: 1,029 → 1,010, 3: 953 → 918, 4: 963 → 927, 5: 867 → 819, 6: 887 → 834, 7: 840 → 812, 8: 704 → 665, 9: 1,652 → 1,588, 10: 846 → 793, 11: 909 → 862, 12: 1,003 → 956, 13: 884 → 834, 14: 790 → 740, 15: 939 → 902, 16: 1,099 → 919, 17: 895 → 846, 18: 1,012 → 949."

