okrsky_note = "Same okrsky as in 2026-10-24. SNP in the part Turčianske Teplice is split between okrsok 5 (from the MsÚ to the I/65 road) and okrsok 6 (from liečebný dom Veľká Fatra to Dolná Štubňa) without house numbers, so its addresses there are placed by fill_nearest. Okrsok 4 holds the Centrum sociálnych služieb at Banská 19 (and residents registered only at the town). Also by fill_nearest: the parts of Poľnohospodárska, Prievidzská, Tehelná and Teplická in the part Turčianske Teplice, which the document does not name, and addresses without a street. Dolné Rakovce and Horné Rakovce are streets in the register."
