# The okrsky of Turčianske Teplice of the vote of 2023-01-21, data/curated/elections/2023-01-21/okrsky/512729.toml, standing in, by `ems job reuse`. Its header there:
#   Okrsky of Turčianske Teplice, transcribed by an AI agent in job okrsok-rules-028 from the documents below;
#   checked by `ems job ingest` against the address register. The document's
#   text per okrsok, verbatim:
#     okrsok 1: vymedzený územím mestskej časti Dolná Štubňa pre voličov bývajúcich v Turčianskych Tepliciach – časti Dolná Štubňa
#     okrsok 2: vymedzený územím mestskej časti Turčiansky Michal pre voličov bývajúcich v Turčianskych Tepliciach – časti Turčiansky Michal
#     okrsok 3: vymedzený územím mestskej časti Diviaky pre voličov bývajúcich v Turčianskych Tepliciach – časti Diviaky
#     okrsok 4: tvorí Centrum sociálnych služieb Horný Turiec (bývalé Zariadenie pre seniorov, domov sociálnych služieb a špecializované zariadenie) na ulici Banská 533/19 pre voličov bývajúcich v tomto zariadení a pre voličov s trvalým pobytom na adrese Turčianske Teplice, 039 01 Turčianske Teplice
#     okrsok 5: vymedzený územím Horných Rakoviec a Dolných Rakoviec, časťou Ulice SNP (od budovy MsÚ po vyústenie na štátnu cestu I/65), Ulicou Banskou a Ulicou Hájskou pre voličov bývajúcich v Turčianskych Tepliciach v častiach Horné Rakovce, Dolné Rakovce, na uliciach Banská, Hájska a na časti Ulice SNP
#     okrsok 6: vymedzený ulicami Kuzmányho, Slobody, Partizánskou, 9. mája, Školskou, 29. augusta, Mládeže, Pod Bôrom a SNP (od liečebného domu Veľká Fatra po začiatok Dolnej Štubne) pre voličov bývajúcich na týchto uliciach
#     okrsok 7: vymedzený ulicami Kollárovou, Somolického, Družstevnou, Železničnou, J. Lettricha, Robotníckou, Kúpeľnou, Odbojárov, Slnečnou, Záhradnou, Pod Stráňou, a M. Galandu pre voličov bývajúcich na týchto uliciach
obec = "512729"
name = "Turčianske Teplice"
okrsky_fill = "nearest"
okrsky_note = "SNP in the part Turčianske Teplice is split between okrsok 5 (from the MsÚ to the I/65 road) and okrsok 6 (from liečebný dom Veľká Fatra to Dolná Štubňa) without house numbers, so its addresses there are placed by fill_nearest. Okrsok 4 holds the Centrum sociálnych služieb at Banská 19 (and residents registered only at the town). Also by fill_nearest: the parts of Poľnohospodárska, Prievidzská, Tehelná and Teplická in the part Turčianske Teplice, which the document does not name, and addresses without a street. Dolné Rakovce and Horné Rakovce are streets in the register. The document does not name the COVID-19 special okrsok 8."
okrsky_adopted = 2023-01-21
okrsky_adopted_basis = "No document of 2017-11-04 setting the okrsky was found (okrsok-rules-155): The city's Voľby page keeps for this vote no okrsky document (only voter information and results). These are the okrsky of the vote of 2023-01-21 (2023-referendum), the nearest in time with okrsky of its own that fit: 7 okrsky (nearer, not taken: 2022-10-29: okrsok 2: 414 voters then, 523 in 2022-10-29). Voters on the roll per okrsok (ŠÚ SR), 2017-11-04 → 2023-01-21: 1: 525 → 506, 2: 414 → 460, 3: 984 → 933, 4: 284 → 226, 5: 1,478 → 1,426, 6: 1,278 → 1,168, 7: 604 → 555."
okrsky_date_approximate = "named"
okrsky_date_basis = "The mayor's 'Utvorenie volebných okrskov a určenie volebných miestností' in the Referendum 2023 tab of the city's Voľby page is undated; it is made on the basis of the President's decision No. 362/2022 of 4.11.2022 declaring the referendum, which it names."

