# The okrsky of Jaklovce of the vote of 2022-10-29, data/curated/elections/2022-10-29/okrsky/543187.toml, standing in, by `ems job reuse`. Its header there:
#   Okrsky of Jaklovce, transcribed by an AI agent in job okrsok-rules-870 from the documents below;
#   checked by `ems job ingest` against the address register. The document's
#   text per okrsok, verbatim:
#     okrsok 1: Jarčeková, Kopaná, Kostolná, Nová, Okružná, Poľná, Potočná, Požiarnická, Priehradná, Rybničná, Stará – dolná časť, Záhradná a pre voličov, ktorí majú evidovaný trvalý pobyt na adrese Jaklovce 0 – Obec Jaklovce
#     okrsok 2: Nábrežná, Obchodná, Skaličná, Stará – horná časť, Školská, Úvozná, Vodárenská, Benátska
obec = "543187"
name = "Jaklovce"
okrsky_date = 2022-11-10
okrsky_fill = "nearest"
okrsky_note = "The referendum's document: the 2022 elections' document (19. 7. 2022) names only the polling stations (okrsok 1 obecný úrad, okrsok 2 základná škola), the same as the referendum's, which lists the streets. Stará is split into \"dolná časť\" (okrsok 1) and \"horná časť\" (okrsok 2) without numbers, so Stará is placed by fill_nearest, as are Pekárenská (not named) and the houses without a street. Voters registered only on the obec (\"Jaklovce 0\") vote in okrsok 1; they have no register address."
okrsky_adopted = 2022-10-29
okrsky_adopted_basis = "No document of 2017-11-04 setting the okrsky was found (okrsok-rules-359): The 2017 elections page holds only the results (Volby_KSK_2017.pdf); the old 2017 website (archived April 2017) and the CDX list no okrsky document of 2017. These are the okrsky of the vote of 2022-10-29 (2022), the nearest in time with okrsky of its own that fit: 2 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2017-11-04 → 2022-10-29: 1: 847 → 814, 2: 718 → 690."

