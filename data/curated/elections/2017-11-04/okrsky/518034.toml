okrsky_adopted_basis = "No document of 2017-11-04 setting the okrsky was found (okrsok-rules-212): No okrsky document of the 2017 regional elections: the site's 2017 elections page only holds the results; the old Joomla site as archived (last capture of its elections article 22.08.2017, before the okrsky deadline of 5.09.2017) only has the announcement of the elections; nothing later archived in 2017. The 2018 document (10.09.2018) has 3 okrsky but is not valid for 2017. These are the okrsky of the vote of 2018-11-10 (2018), the nearest in time with okrsky of its own that fit: 3 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2017-11-04 → 2018-11-10: 1: 1,295 → 1,287, 2: 1,092 → 1,094, 3: 1,003 → 998."

