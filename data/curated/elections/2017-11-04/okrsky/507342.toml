obec = "507342"
name = "Moravany nad Váhom"
okrsky_date = 2022-10-17
okrsky_fill = "nearest"
okrsky_note = "The list of streets per okrsok (Obvod: OBEC MORAVANY NAD VÁHOM; okrsok 1 in the obecný úrad, Kostolecká 175/4; okrsok 2 in the požiarna zbrojnica, Kostolecká 179/3) is undated; it hangs on the notice board item 'Spojené voľby 2022', which states 'Vyvesené: 17. 10. 2022', so date is that publication date. Its title names the elections to the samosprávne kraje, held together with the municipal elections on 29.10.2022 in the same okrsky. Okrsok 1 also lists an entry without a street and 'MORAVANY n/V' (celá ulica): voters registered without a street/only to the obec, not the register's houses without a street; those 79 addresses (súpisné only) are placed by fill_nearest."
okrsky_adopted = 2022-10-29
okrsky_adopted_basis = "No document of 2017-11-04 setting the okrsky was found (okrsok-rules-326): Moravany nad Váhom's live notice board lists only current items; probing its board files (e_download.php obsah150-620) found an okrsky decision only for the NR SR election 2023 (and 2022, 2026 municipal); none for this vote. The Internet Archive refused connections (offline) during the search. These are the okrsky of the vote of 2022-10-29 (2022), the nearest in time with okrsky of its own that fit: 2 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2017-11-04 → 2022-10-29: 1: 962 → 1,012, 2: 978 → 975."

