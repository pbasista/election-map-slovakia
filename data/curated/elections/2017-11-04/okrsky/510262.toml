okrsky_note = "Mayor's decision of 04.09.2017 for the regional elections of 4 November 2017 (archived copy of the city's PDF). Addresses without a street (súpisné číslo only) in časti Staré Mesto, Vrbica-Nábrežie, Podbreziny, Palúdzka, Okoličné, Liptovská Ondrašová etc. are not named by the document and take the okrsok of the nearest placed address (fill_nearest); so do houses on named streets whose súpisné číslo the document does not list. Street sides (Borbisova north/south, Jura Janošku east/west) are given as odd/even; the sections of 1. mája (at Kpt. Nálepku), Palúčanská (at Demänovská) and Ondrašovská (at Roľnícka) are split by orientačné čísla at the crossing seen in the address points (inferred). Okrsok 22 is the whole of časti Okoličné and Stošice (Smrečianska only in Okoličné; in Podbreziny it is okrsok 14). Streets the document names that the register lacks are left out. Okrsok 1 lists Štefánikova whole while okrsok 32 lists Štefánikova súp. č. 1509 and 1780: the numbered rule in 32 takes those two houses. Hurbanova súp. č. 1264 and Jelšová (Bodice) are not in the register."
