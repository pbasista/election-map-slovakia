okrsky_note = "The referendum's document (dated 2022-11-09). The elections' own document (Utvorenie volebných okrskov ... v roku 2022, https://www.soporna.sk/e_download.php?file=data/editor/147sk_8.pdf&original=Utvorenie%20volebn%C3%BDch%20okrskov%20a%20ur%C4%8Denie%20volebn%C3%BDch%20miestnost%C3%AD.pdf, linked from the 2022-09-30 snapshot https://web.archive.org/web/20220930094654/https://www.soporna.sk/obec-samosprava/samosprava/volby/volby-do-organov-samospravy-obci-a-samospravnych-krajov/) is undated and not archived, so it cannot be dated; it sets the very same okrsky word for word: súp. č. 1-640, 641-1175, 1176-1680 a časť Štrkovec. Súpisné numbers above 1680, if any, are placed by fill_nearest."
okrsky_adopted = 2022-10-29
okrsky_adopted_basis = "No document of 2017-11-04 setting the okrsky was found (okrsok-rules-169): No okrsky document for the regional elections of 2017 was published on soporna.sk as archived: the old site's Voľby page (archived 2017-10-01) lists only the 2014 results, and its complete news list (all-news, archived 2018-08-20, items back to 2014) has for 2017 only 'Voľby do orgánov samosprávnych krajov 2017 – Informácie pre voliča' (posted 2017-07-17), no okrsky. Every 2017–2018 election PDF the Internet Archive kept was checked; none sets the okrsky. The Internet Archive was online. These are the okrsky of the vote of 2022-10-29 (2022), the nearest in time with okrsky of its own that fit: 3 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2017-11-04 → 2022-10-29: 1: 1,258 → 1,121, 2: 1,086 → 1,108, 3: 1,380 → 1,371."

