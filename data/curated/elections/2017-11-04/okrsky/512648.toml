obec = "512648"
name = "Sučany"
okrsky_fill = "nearest"
okrsky_note = "The register streets SNP (4 addresses, distinct from Námestie SNP) and Ulica priemyselná (1) are named by no document: placed by fill_nearest, as are the addresses without a street. Kpt. Nálepku in okrsok 1."
okrsky_adopted = 2018-11-10
okrsky_adopted_basis = "No document of 2017-11-04 setting the okrsky was found (okrsok-rules-196): No okrsky document of the 2017 regional elections found. The live elections page starts with 2018. In the Internet Archive the old site's \"Voľby a referendá\" page (captured 2017-09-15) lists only the 2016 NR SR documents, and the notice board captured 2017-12-06 lists every notice of 2017 (incl. \"Oznámenie o vyhlásení volieb do orgánov samosprávnych krajov\" of 30.6.2017 and the results of 5.11.2017, neither text captured) but no okrsky notice; the CDX lists no 2017 elections PDF. The 2018-09-13 capture of the elections page could not be fetched (Internet Archive offline at the time). The municipal-elections notice of 2018 (same 4 okrsky by street) exists but is not this vote's. These are the okrsky of the vote of 2018-11-10 (2018), the nearest in time with okrsky of its own that fit: 4 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2017-11-04 → 2018-11-10: 1: 1,146 → 1,163, 2: 1,055 → 1,047, 3: 1,141 → 1,136, 4: 535 → 554."
okrsky_date_approximate = "posted"
okrsky_date_seen = 2018-10-18
okrsky_date_basis = "The notice itself is undated but names the municipal elections of 10 November 2018 (rozhodnutie č. 203/2018 Z. z.); the municipality's elections page, as the Internet Archive captured it on 2019-08-18, lists \"Oznam ku komunálnym voľbám - okrsky\" as inserted on 18.10.2018. (https://web.archive.org/web/20190818212215/https://www.sucany.sk/obec-2/volby-a-referenda/)"

