okrsky_adopted_basis = "No document of 2017-11-04 setting the okrsky was found (okrsok-rules-095): No okrsky document of 2017 on the website (elections page lists only candidates and the 2014 okrsky notice; the notice board's 2017 VÚC item is the ministry's voter information); the Internet Archive's captures of the elections page (2017-02-12, 2018-03-12) show no 2017 okrsky document. These are the okrsky of the vote of 2022-10-29 (2022), the nearest in time with okrsky of its own that fit: 7 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2017-11-04 → 2022-10-29: 1: 312 → 283, 2: 743 → 735, 3: 1,041 → 1,017, 4: 1,297 → 1,245, 5: 881 → 853, 6: 653 → 619, 7: 1,032 → 994."

