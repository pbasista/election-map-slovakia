obec = "505315"
name = "Partizánske"
okrsky_date = 2019-02-22
okrsky_fill = "nearest"
okrsky_note = "Ranges like '1-23' are orientačné ranges covering the whole street; 3-4 digit lists are súpisné čísla (by supisne); a street split among okrsky goes whole to one okrsok and by the listed súpisné čísla to the others (Generála Svobodu, Nádražná: okrsok 5; Malá okružná: 10; Horská: 19; Riečna: 13). Októbrová, Námestie SNP, Komenského, Lesná and Veľká okružná only by the listed numbers. 'Rudolfa Jašíka 155-160, 652' in okrsok 4 as written. 'Partizánske (bez TP)' in okrsok 1 = voters without an address. Ovocná, Priehrady, Viničná (okrsok 24) have no register addresses. Not named and placed by fill_nearest: Púpavová, Za riekou Nitrou, súpisné numbers not listed, houses without a street (except Malé Bielice 242-250). Table cells are given as 'streets | numbers' in the document's order."
okrsky_adopted = 2019-05-25
okrsky_adopted_basis = "No document of 2017-11-04 setting the okrsky was found (okrsok-rules-069): The archived 2017 elections page (2019 capture) lists only candidate lists; no okrsky document of 2017 in the Internet Archive or on the live site. These are the okrsky of the vote of 2019-05-25 (2019-ep), the nearest in time with okrsky of its own that fit: 24 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2017-11-04 → 2019-05-25: 1: 1,147 → 1,099, 2: 584 → 561, 3: 718 → 706, 4: 960 → 957, 5: 540 → 514, 6: 941 → 926, 7: 1,014 → 980, 8: 523 → 488, 9: 663 → 641, 10: 810 → 771, 11: 792 → 754, 12: 811 → 784, 13: 873 → 867, 14: 557 → 523, 15: 632 → 618, 16: 762 → 764, 17: 1,055 → 1,005, 18: 924 → 896, 19: 1,266 → 1,192, 20: 1,025 → 978, 21: 919 → 901, 22: 939 → 942, 23: 382 → 372, 24: 394 → 376."

