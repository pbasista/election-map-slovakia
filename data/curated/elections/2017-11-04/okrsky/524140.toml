okrsky_note = "The mayor's decision of 21 August 2017 creates 81 okrsky and names their polling stations; the city's announcement of 31.08.2017 (18-page scan, read from page images) lists each okrsok's streets, with orientačné numbers for streets split between okrsky. A street named without numbers is a whole-street rule; a split street gets exactly the listed numbers. 'bez ulice' in okrsok 39 = voters registered without an address: no rule. Streets the document names but the register lacks are left out: Dlhá, Gerlachovská, Gorazdova, Koceľova, Ku Škáre, Liesková, Pražská, Pribinova, Priemyselná, Rastislavova, Račia, Remscheidská, Riečna, Rybníčky, Tarjányiho, Tulipánová. fill_nearest places the addresses no rule selects: the addresses without a street (numbered by súpisné číslo in their part), house numbers of split streets the 2017 list does not name (newer or unlisted numbers), and the streets the 2017 document omits and the 2018 rule set cannot place in one 2017 okrsok: Poľovnícka (2018 okrsok 26, which merges 2017's 26 and 27), Hrušková, Slivková, Na Tablách (in neither document)."
okrsky_supplemented = 2018-11-10
okrsky_supplemented_from = "election"
okrsky_supplement_basis = "The 2017 announcement lists every okrsok's streets and, for split streets, their orientačné numbers, but leaves out streets and house numbers the register now has. From the rule set of the 2018-11-10 election (same okrsky, okrsky 26 and 27 of 2017 merged into 26 in 2018, so 2018 okrsok k is 2017 okrsok k+1 from 27 on) are taken only those left out: streets Ulica Štefana Náhalku (16), Hrnčiarska and Rezbárska (35), Biskupa Gojdiča (39), Mätová and Sovia (81), and house numbers the 2017 lists lack, Antona Prídavka 3, 5, 7 (7), Mirka Nešpora 40A (16), Sabinovská 32A (30), Tarasa Ševčenka 7A (38), Hlavná 73 (39), Budovateľská 63E (42), Sekčovská 99 (81), by copying the 2018 rule of that street in that okrsok (which otherwise repeats the 2017 list); each placed where the 2018 okrsok with the same 2017 streets has it."

