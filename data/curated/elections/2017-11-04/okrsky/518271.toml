#   text per okrsok, verbatim:
#     okrsok 1: Detvianska Huta, Vrchdobroč
#     okrsok 2: Komárno, Ľuľovka, Brnovka
#     okrsok 3: Žabica, Bratkovica, Blažková Jama
obec = "518271"
name = "Detvianska Huta"
okrsky_date = 2018-07-27
okrsky_note = "Ľuľovka, Brnovka (okrsok 2) and Blažková Jama (okrsok 3) are settlements, not parts in the register; the five parts are placed by part rules as the document names them."
okrsky_adopted = 2018-11-10
okrsky_adopted_basis = "No document of 2017-11-04 setting the okrsky was found (okrsok-rules-472): Every file of the notice board (data/uredni_deska/obsah1..460, all 442 present, scans OCR-read) was checked: okrsky documents exist only for 2018 (OZ resolution 242/OZ/2018), 2022 and the referendum of 2026; the 2017 file (obsah88_3.doc, \"Zoznam okrskov\") and the 2026 notice give only the 3 polling stations, and the municipality has 5 parts, so they cannot be turned into rules. Nothing for this vote. web.archive.org refused connections. These are the okrsky of the vote of 2018-11-10 (2018), the nearest in time with okrsky of its own that fit: 3 okrsky. The voters on the roll per okrsok are not known for both votes, so whether the layout changed is not known either."

