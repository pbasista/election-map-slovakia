note = "The council obvody of the vote of 2018-11-10: they only place the okrsky. The 2018 resolution itself (Uznesenie MZ č. 172/2018 of 25.06.2018) was not found; its obvody (by mestské časti) and date are stated by the city's 2022 council material, and the city's 2018 list of okrsky by obvod (scanned, read by OCR and checked against the page images) gives the streets of each obvod and okrsok. Each obvod takes the streets of its okrsky; Daxnerova and Rosinská, split between obvody, take the listed numbers. Village names in the list are part rules. The seats per obvod are those of the Statistical Office (5, 4, 5, 7, 3, 2, 2, 3; 31 in all, the number the 2022 material says was unchanged). Streets the list names that the register lacks are left out (Kubelíkova, Oškerdská cesta, Samova, Pod záhradkou, Stará Mojšova Lúčka, Hyrovská). 'Žilina (iba Žilina bez ulice)' means voters without an address. Register streets the list does not name, numbers outside the split lists and addresses without a street take the obvod of the nearest placed address (fill_nearest)."
reused = 2018-11-10
okrsky_date = 2018-09-10
okrsky_fill = "nearest"
okrsky_note = "Scanned PDF, read by OCR (without diacritics) and checked against the page images; the text gives the names with diacritics as the page images show them. The document lists the streets of each okrsok 1-79 grouped by volebný obvod, with orientačné numbers where a street is split; a street split between okrsky takes the listed numbers in each, a street listed once is taken whole. 'Žilina (iba Žilina bez ulice)' in okrsok 1 means voters registered without an address (no rule). Village names (Brodno, Vranie, Zádubnie, Zástranie, Žilinská Lehota) are part rules. 'Námestie J. Borodáča' is the register's 'Námestie J. Borodáča'. Streets the document names that the register lacks are left out: Samova, Kubelíkova, Oškerdská cesta, Hyrovská, Stará Mojšova Lúčka, Pod záhradkou. Numbers of split streets outside every list (e.g. Predmestská 29, Jána Milca 10A, M. R. Štefánika 71, Tajovského 13), register streets neither the document nor the 2023 rule set names (Bánovská cesta, Centrálna, Cestárska, Dúbravy, Hruštiny, Katedrálne námestie, Námestie mladosti, Rybné námestie, Slovanská, Sv.Cyrila a Metoda, V Rovni Od Brodna, Za cintorínom) and addresses without a street take the okrsok of the nearest placed address within their obvod (fill_nearest)."
okrsky_adopted = 2018-11-10
okrsky_adopted_basis = "No document of 2017-11-04 setting the okrsky was found (okrsok-rules-031): Searched again 2026-11-07; the Internet Archive answered. The archived 2017 elections page (www.zilina.sk/volby2017/, captured 2017-11-05) links two okrsky documents of this vote: 'Volebné okrsky a volebné miestnosti v meste Žilina, voľby do VÚC 2017' (captured 20200921121352, downloaded whole: a 2-page scan that gives each of the 79 okrsky only its name and polling station, no streets) and 'Zoznam volebných okrskov, voľby do VÚC 2017' (the street list, a scanned PDF of about 20 pages), whose only capture (20200921133743) still ends at 1,048,576 bytes: it holds only the first 4 page images of the scan, and a range request beyond 1 MB returns 404 from the archive. The file is gone from the live site (404 at zilina.sk). No other 2017 document places the streets. (The 2018 municipal elections' street list per okrsok, archived at web.archive.org/web/20190819150007/http://www.zilina.sk:80/userfiles/2018/volby/..., is another vote's document and not used.). These are the okrsky of the vote of 2018-11-10 (2018), the nearest in time with okrsky of its own that fit: 79 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2017-11-04 → 2018-11-10: 1: 1,890 → 2,050, 2: 945 → 945, 3: 1,023 → 1,037, 4: 718 → 740, 5: 1,009 → 1,001, 6: 1,033 → 962, 7: 947 → 947, 8: 782 → 1,156, 9: 1,057 → 808, 10: 877 → 870, 11: 738 → 726, 12: 863 → 844, 13: 923 → 938, 14: 842 → 817, 15: 891 → 807, 16: 1,202 → 1,187, 17: 1,047 → 1,031, 18: 938 → 926, 19: 1,000 → 1,002, 20: 979 → 966, 21: 907 → 900, 22: 843 → 852, 23: 1,275 → 1,295, 24: 915 → 888, 25: 906 → 896, 26: 977 → 972, 27: 886 → 861, 28: 903 → 890, 29: 813 → 804, 30: 915 → 881, 31: 1,012 → 983, 32: 1,141 → 1,115, 33: 870 → 852, 34: 633 → 608, 35: 1,021 → 1,013, 36: 851 → 841, 37: 954 → 943, 38: 790 → 776, 39: 925 → 917, 40: 858 → 851, 41: 919 → 890, 42: 888 → 881, 43: 910 → 895, 44: 813 → 802, 45: 872 → 866, 46: 877 → 863, 47: 792 → 796, 48: 830 → 825, 49: 775 → 768, 50: 914 → 898, 51: 757 → 747, 52: 657 → 825, 53: 1,185 → 1,226, 54: 156 → 136, 55: 767 → 577, 56: 1,071 → 1,046, 57: 1,133 → 1,127, 58: 914 → 887, 59: 1,118 → 1,122, 60: 998 → 992, 61: 931 → 968, 62: 822 → 823, 63: 836 → 854, 64: 728 → 726, 65: 800 → 804, 66: 752 → 753, 67: 947 → 957, 68: 1,095 → 1,097, 69: 369 → 372, 70: 1,159 → 1,162, 71: 473 → 481, 72: 996 → 1,016, 73: 1,107 → 1,098, 74: 642 → 642, 75: 607 → 603, 76: 770 → 777, 77: 1,183 → 1,187, 78: 1,098 → 1,098, 79: 278 → 286. Of these, okrsky 8 (782 → 1,156), 52 (657 → 825) differ by more than 25% (2017-11-04 → 2018-11-10), allowed in an obec of 79 okrsky: of 10 or more, one okrsok, or 5% of them, may differ while the layout holds."
