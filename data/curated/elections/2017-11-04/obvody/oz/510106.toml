obec = "510106"
name = "Trstená"
date = 2018-07-31
fill = "nearest"
note = "The council obvody of the vote of 2018-11-10: they only place the okrsky. Obvod I lists only the apartment blocks by súpisné číslo (rule on part Trstená); the other houses of the street Západ, Brezovická cesta (named nowhere) and the houses without a street are placed by fill_nearest. Left out: \"Pri Kovalinci\" (not in the address register). Oravská Priehrada and Prístav are taken from the okrsky decision of 2018 (okrsok 6, obvod III)."
reused = 2018-11-10
okrsky_date = 2018-08-02
okrsky_fill = "nearest"
okrsky_note = "The mayor's decision of 02.08.2018 (Komunálne voľby 2018, určenie volebných okrskov a volebných miestností) gives obvod I = okrsok 1, obvod II = okrsky 2-4, obvod III = okrsky 5-6, with the streets of each okrsok. Left out: \"Hornooravská nemocnica s poliklinikou\" (a hospital, not a street), \"Trstená 0\" (voters registered without an address), \"Pri Kovalinci\" (not in the address register). Placed by fill_nearest: the houses of Západ other than the listed apartment blocks and Brezovická cesta (in obvod II, named in no okrsok) and the houses without a street. \"I. Obrachta\" is the register's I. Olbrachta (a typo dropping the l)."
okrsky_adopted = 2018-11-10
okrsky_adopted_basis = "No document of 2017-11-04 setting the okrsky was found (okrsok-rules-130): Trstená's pages 'Voľby do VÚC 2017' and 'Voľby do Európskeho parlamentu 2024' (trstena.sk) link no okrsky document (the other votes' pages do). The host rate-limits (HTTP 429); the Internet Archive refused connections (offline) during the search. These are the okrsky of the vote of 2018-11-10 (2018), the nearest in time with okrsky of its own that fit: 6 okrsky. The voters on the roll per okrsok are not known for both votes, so whether the layout changed is not known either."

