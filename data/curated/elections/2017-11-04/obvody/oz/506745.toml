note = "The council obvody of the vote of 2018-11-10: they only place the okrsky. The obvody are the city parts listed in the annex of the information on resolution 943/2018; the rules are built from the okrsky of the 2018 okrsky document (scan, read by OCR) grouped as the Statistical Office's okrsky per obvod (obvod 1 = okrsky 1-9, 2 = 10-21, 3 = 22-32, 4 = 33-45, 5 = 46-54, 6 = 55-56), since the annex splits streets by sides ('Hlboká – západná/východná strana') that only the okrsky lists turn into rules. Addresses without a street go by fill_nearest."
reused = 2018-11-10
okrsky_date = 2018-09-03
okrsky_fill = "nearest"
okrsky_note = "The mayor's decision of 3 September 2018 is a scan; read by OCR (without diacritics) checked against the page images, which are clearly legible; the texts give the street names in the register's spelling, as the document writes them, with the numbers as printed (č. = orientačné číslo; '12A', '11/A' etc. as letters). Its okrsky are grouped into obvody as the Statistical Office counts them (1-9, 10-21, 22-32, 33-45, 46-54, 55-56). Named in the document but not in the address register, left out: Námestie kráľovnej Konštancie (1), Rybárska ulica (18), Park Janka Kráľa (46). 'bez ulice' (2) are voters registered without an address. A range ending in a lettered number ('do č. 78/E', 'do č. 31/E') is written as the range plus that number; other lettered numbers in such ranges, numbers outside every listed range of a split street (e.g. Veterná 46-48, Hlboká 29), Hlboká's addresses in obvod 1 (west side, not in any okrsok list of obvod 1), and the addresses without a street (about 1,370) are placed by fill_nearest."
okrsky_adopted = 2018-11-10
okrsky_adopted_basis = "No document of 2017-11-04 setting the okrsky was found (okrsok-rules-008): No okrsky document of this vote was found: the city's current website keeps only the latest elections, and among the Internet Archive's captures of trnava.sk the okrsky documents are those of 2018, NR SR 2020, the referendum 2023, NR SR 2023, 2024 and 2026. These are the okrsky of the vote of 2018-11-10 (2018), the nearest in time with okrsky of its own that fit: 56 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2017-11-04 → 2018-11-10: 1: 982 → 960, 2: 1,822 → 1,879, 3: 1,024 → 1,075, 4: 963 → 954, 5: 830 → 823, 6: 985 → 964, 7: 959 → 941, 8: 982 → 983, 9: 937 → 941, 10: 957 → 951, 11: 987 → 972, 12: 939 → 928, 13: 963 → 951, 14: 810 → 795, 15: 884 → 891, 16: 889 → 876, 17: 877 → 855, 18: 937 → 1,045, 19: 922 → 919, 20: 1,010 → 1,002, 21: 938 → 922, 22: 933 → 928, 23: 878 → 877, 24: 1,058 → 1,047, 25: 1,246 → 1,263, 26: 1,049 → 1,033, 27: 995 → 968, 28: 1,051 → 1,033, 29: 1,010 → 967, 30: 1,170 → 1,136, 31: 1,140 → 1,122, 32: 1,219 → 1,299, 33: 982 → 991, 34: 1,007 → 1,003, 35: 913 → 902, 36: 777 → 757, 37: 889 → 866, 38: 851 → 832, 39: 897 → 896, 40: 866 → 851, 41: 859 → 854, 42: 791 → 771, 43: 851 → 838, 44: 901 → 857, 45: 870 → 873, 46: 1,065 → 1,075, 47: 1,152 → 1,166, 48: 1,076 → 1,050, 49: 837 → 809, 50: 853 → 834, 51: 859 → 845, 52: 945 → 952, 53: 871 → 865, 54: 1,136 → 1,134, 55: 1,023 → 1,015, 56: 1,042 → 1,039."

