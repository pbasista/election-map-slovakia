obec = "501590"
name = "Horná Potôň"
date = 2022-06-21
note = "The council obvody of the vote of 2022-10-29: they only place the okrsky. The 2022 announcement gives only 9 seats in 3 obvody (3 each), not their composition; the minutes of the session of 21.06.2022 (resolutions 06-03/2022 and 07-03/2022) say no more ('tri volebné obvody a 3 okrsky'). Each obvod has exactly one okrsok (ŠÚ SR); the 2022 okrsky document puts the polling rooms of okrsok 1 in Horná Potôň (Kultúrny dom), okrsok 2 in Benkova Potôň č. 16 and okrsok 3 in Čečínska Potôň č. 9, and the page 'Vedenie obce' (councillors 2022-2026) names obvod č. 1 Horná Potôň, č. 2 Benkova Potôň, č. 3 Čečínska Potôň. Obvody 2 and 3 are taken from the 2026 rule set, which rests on the decision of 23.06.2026 naming them so; obvod 1 is the remaining part Horná Potôň."
reused = 2022-10-29
okrsky_date = 2022-08-03
okrsky_note = "The 2022 document gives only the 3 okrsky with their polling stations, no streets; each obvod has exactly one okrsok (ŠÚ SR), so okrsok n is the whole obvod n (Horná Potôň, Benkova Potôň, Čečínska Potôň, matching the polling stations)."
okrsky_adopted = 2022-10-29
okrsky_adopted_basis = "No document of 2017-11-04 setting the okrsky was found (okrsok-rules-209): No 2017 okrsky document: The old Joomla site (index.php/sk/samosprava/uradna-tabula) was captured by the Internet Archive only in 2017 (home page, a few items) and 2019-08-17 (board pages 2-3 and items 53-68): no okrsky or obvody notice is among the captures; the 2017-2019 notice-board items (e.g. 39 and 51 \"OZNAM\", 52 \"Zoznam kandidátov\") were never captured and the old site is gone (404). These are the okrsky of the vote of 2022-10-29 (2022), the nearest in time with okrsky of its own that fit: 3 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2017-11-04 → 2022-10-29: 1: 674 → 774, 2: 656 → 697, 3: 336 → 343."

