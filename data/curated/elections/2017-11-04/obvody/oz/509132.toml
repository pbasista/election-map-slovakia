obec = "509132"
name = "Čadca"
date = 2018-06-28
note = "The council obvody of the vote of 2018-11-10: they only place the okrsky. The announcement defines the obvody by the parts of the town (heading of each obvod) and lists their streets and localities (U Bargary etc., which the register does not have as streets; their houses are covered by the part rules). Palárikova is split by listed house numbers between obvody 3 and 4."
reused = 2018-11-10
okrsky_date = 2018-08-20
okrsky_fill = "nearest"
okrsky_note = "The town's list of streets and okrsky of 20.08.2018 groups the 20 okrsky under obvody 1–4 (1; 2–4; 5–10; 11–20). Okrsky 2–4 list the same localities as in the town's 2019 list, so their súpisné-number rules for parts Čadečka/Podzávoz/Milošová are those of the 2019 rule set in this repository (houses placed by the nearest listed locality; inferred). Palárikova is split by numbers between obvody 3 and 4; within each obvod it lies in one okrsok (5, 17), so whole-street rules. Street house numbers are given as súpisné/orientačné; rules use the orientačné numbers. fill_nearest places the houses without a street that the list names only as localities and no part rule covers (part Čadca: Bukov, U Capka … of okrsok 6 and Belajka, Blažkova, Čerchle, Lazy, Meľa, U Burdy … of okrsok 10; part U Hluška: U Buty of okrsok 12, Kyčerka and U Kyzka of okrsok 20) and the house numbers of SNP, Okružná and Chalupkova the list leaves out. 'bez ulice' (okrsok 6) are voters registered without an address."
okrsky_adopted = 2018-11-10
okrsky_adopted_basis = "No document of 2017-11-04 setting the okrsky was found (okrsok-rules-030): No 2017 okrsky document found: the town's pre-2019 site pages are gone (404) and the Internet Archive kept no 2017 election page or PDF of mestocadca.sk (its 2017 notice-board capture lists no election notices). The 2018 list (20 okrsky, dated 20.08.2018) exists but is for the municipal elections of 2018. These are the okrsky of the vote of 2018-11-10 (2018), the nearest in time with okrsky of its own that fit: 20 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2017-11-04 → 2018-11-10: 1: 1,152 → 1,159, 2: 933 → 929, 3: 926 → 923, 4: 1,206 → 1,219, 5: 987 → 1,180, 6: 1,765 → 1,842, 7: 1,007 → 933, 8: 945 → 840, 9: 853 → 797, 10: 810 → 861, 11: 862 → 1,057, 12: 1,069 → 1,016, 13: 1,037 → 1,008, 14: 1,015 → 999, 15: 1,017 → 986, 16: 995 → 998, 17: 1,006 → 714, 18: 924 → 899, 19: 883 → 881, 20: 721 → 726. Of these, okrsok 17 (1,006 → 714) differs by more than 25% (2017-11-04 → 2018-11-10), allowed in an obec of 20 okrsky: of 10 or more, one okrsok, or 5% of them, may differ while the layout holds."
okrsky_adopted_outliers = [[17, 1006, 714]]

