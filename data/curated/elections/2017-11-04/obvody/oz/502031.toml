obec = "502031"
name = "Levice"
date = 2018-08-02
fill = "nearest"
note = "The council obvody of the vote of 2018-11-10: they only place the okrsky. The resolution gives each obvod by its okrsky (1-22 and 23-47) with their streets and house numbers. Names not in the register are left out: Predné/Stredné/Staré Levice, Studená dolina, Studený bok, Vargov vrch, ZO Šiklóš, VO Pišla, ZO Zlatý Onyx, Vína ul., Strážny vrch, Nixbród as a street (Nixbród is placed by its part Nixbrod), Géňa by its part. fill_nearest places the addresses without a street name in part Levice (vineyards, garden colonies), the street Rybáreň (not named) and the house numbers the document leaves out of split streets. Poľná 6 (not named) is placed by fill_nearest."
reused = 2018-11-10
okrsky_date = 2018-08-02
okrsky_fill = "nearest"
okrsky_note = "The council resolution of 2 August 2018 on the obvody lists each okrsok (1-22 in obvod 1, 23-47 in obvod 2) with its streets and house numbers. Names the register lacks are left out: Predné Staré Levice, Staré Levice, Stredné Levice, Studená dolina, Studený bok, Vargov vrch, ZO Šiklóš, VO Pišla, ZO Zlatý Onyx (okrsok 20), Vína ul. (40), Strážny vrch (41). Géňa is taken as the part Géňa and Nixbród as the part Nixbrod. 'Ul. Kmeťa' is Ul. A. Kmeťa, 'Nám. Hrdinov' Nám. hrdinov, 'U. Z. Nejedlého' a typo of Ul. Z. Nejedlého. fill_nearest places what the document leaves out: streets not named (Hradná ulica, Piesočná ulica, Včeláriková ulica, Rybáreň, Ulica Lajosa Grendela, Šípková ulica, Ulica pod záhradami, later streets), addresses without a street in part Levice and Krížny Vrch, and house numbers of split streets not listed (e.g. Poľná 6, Ľ. Štúra 1A, 51, Štefánika 69)."
okrsky_adopted = 2018-11-10
okrsky_adopted_basis = "No document of 2017-11-04 setting the okrsky was found (okrsok-rules-015): The live website's election pages list only results (minutes per okrsok) for this vote, no mayor's okrsky document; the úradná tabuľa (CG eGOV) shows only current postings. The Internet Archive's CDX for levice.sk answered 504/timeouts for most years over ~20 minutes of retries (only 2018 and 2020 lists came back, without okrsky documents); its captures of the old elections pages hold no okrsky notice. The council's obvody resolution of 02.08.2018 lists 47 okrsky but is no document of this vote. These are the okrsky of the vote of 2018-11-10 (2018), the nearest in time with okrsky of its own that fit: 47 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2017-11-04 → 2018-11-10: 1: 1,034 → 1,041, 2: 493 → 484, 3: 524 → 532, 4: 604 → 582, 5: 724 → 710, 6: 688 → 677, 7: 716 → 727, 8: 542 → 523, 9: 526 → 504, 10: 515 → 506, 11: 628 → 627, 12: 693 → 681, 13: 521 → 518, 14: 557 → 535, 15: 556 → 550, 16: 573 → 584, 17: 1,120 → 1,101, 18: 668 → 672, 19: 653 → 652, 20: 662 → 651, 21: 497 → 500, 22: 612 → 614, 23: 797 → 783, 24: 594 → 581, 25: 576 → 559, 26: 920 → 921, 27: 659 → 679, 28: 606 → 589, 29: 559 → 549, 30: 526 → 519, 31: 588 → 576, 32: 558 → 546, 33: 555 → 556, 34: 583 → 571, 35: 550 → 550, 36: 858 → 843, 37: 695 → 675, 38: 542 → 529, 39: 580 → 590, 40: 605 → 620, 41: 592 → 583, 42: 669 → 660, 43: 600 → 609, 44: 212 → 212, 45: 504 → 465, 46: 119 → 121, 47: 248 → 243."

