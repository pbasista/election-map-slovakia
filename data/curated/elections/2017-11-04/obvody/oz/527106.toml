name = "Svidník"
date = 2018-06-06
fill = "nearest"
note = "The council obvody of the vote of 2018-11-10: they only place the okrsky. Streets split among obvody are written by the súpisné čísla the announcement gives in parentheses (Komenského, Kutuzovova, Sov. hrdinov, 8. mája, Stropkovská 375) and by orientačné numbers where it gives ranges (Centrálna 18-40 and 5, Stropkovská 42-76, 90). Their other houses and the addresses without a street go by fill_nearest; \"bezdomovci\" are voters without an address, not a rule."
reused = 2018-11-10
okrsky_fill = "nearest"
okrsky_note = "Several streets are split among the okrsky of one obvod by the súpisné čísla of their blocks (Gen. Svobodu in okrsky 2/3, Sov. Hrdinov in 4/5, 8. mája in 7/8, Duklianska in 8/9), written as súpisné numbers; their other houses and the addresses without a street go by fill_nearest. A street wholly in one okrsok of its obvod is a whole-street rule (the rules see only the obvod's addresses), even where the document lists its blocks or numbers (e.g. Komenského in okrsok 3 also covers 837, which the obvod resolution puts in obvod 1 but the okrsky list omits; Centrálna 584 is the obvod's Centrálna 5). 'bezdomovci' in okrsok 4 are voters without an address, not a rule. The document writes Festivalová for the register's Festivalova."
okrsky_adopted = 2018-11-10
okrsky_adopted_basis = "No document of 2017-11-04 setting the okrsky was found (okrsok-rules-110): No okrsky document of the regional elections 2017 was found: the website keeps only the 2026 votes, and the Internet Archive has no capture of the vote's elections page or okrsky file. These are the okrsky of the vote of 2018-11-10 (2018), the nearest in time with okrsky of its own that fit: 9 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2017-11-04 → 2018-11-10: 1: 1,021 → 1,002, 2: 1,036 → 1,024, 3: 1,030 → 1,005, 4: 1,068 → 1,070, 5: 1,195 → 1,179, 6: 1,047 → 1,027, 7: 1,066 → 1,043, 8: 969 → 951, 9: 918 → 909."
okrsky_date_approximate = "posted"
okrsky_date_seen = 2018-09-19
okrsky_date_basis = "The city's 2018 elections page lists 'Volebné okrsky v meste Svidník' as 'Zverejnené 19.9.2018' (and 'Volebné miestnosti pre jednotlivé okrsky' as 'Zverejnené 6.9.2018'); the PDF itself is undated, its heading names the municipal elections of 2018. (https://www.svidnik.sk/volby-do-organov-samospravy-obci-0.html)"

