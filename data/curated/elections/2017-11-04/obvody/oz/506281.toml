obec = "506281"
name = "Nemšová"
date = 2018-06-20
note = "The council obvody of the vote of 2018-11-10: they only place the okrsky. The resolution names each obvod by the part of the town ('Nemšová č. X' = časť X); the okrsky document of 2018 confirms obvod 1 = Nemšová, 2 = Ľuborča, 3 = Kľúčové, 4 = Trenčianska Závada."
reused = 2018-11-10
okrsky_fill = "nearest"
okrsky_note = "Okrsok 1's 'Odbojárov 181/1' is the house with súpisné 181 and orientačné 1 (rule: Odbojárov 1); the rest of Odbojárov is listed in okrsok 2. The trailing 'Nemšová' of okrsok 1 refers to voters registered without a street address (no rule). Záhradná lies in parts Kľúčové and Nemšová in the register; the document lists it only in okrsok 5 (Kľúčové, obvod 3), so its addresses in part Nemšová (obvod 1) and the addresses without a street in obvod 1 are placed by fill_nearest. Okrsky 4–6 are each a whole obvod."
okrsky_adopted = 2018-11-10
okrsky_adopted_basis = "No document of 2017-11-04 setting the okrsky was found (okrsok-rules-164): The 2017 regional elections page lists only the election decision, voter information, candidate lists and VZN 5/2017; no okrsky document. The Internet Archive was 'Temporarily Offline' when queried. These are the okrsky of the vote of 2018-11-10 (2018), the nearest in time with okrsky of its own that fit: 6 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2017-11-04 → 2018-11-10: 1: 936 → 1,007, 2: 1,324 → 1,240, 3: 1,147 → 1,143, 4: 1,072 → 1,096, 5: 518 → 516, 6: 212 → 214."
okrsky_date_approximate = "named"
okrsky_date_basis = "Both documents are undated; their headings name the elections to the organs of municipal self-government of 10 November 2018 (the Internet Archive keeps no 2018 capture of them)."

