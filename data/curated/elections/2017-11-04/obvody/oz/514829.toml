obec = "514829"
name = "Hnúšťa"
date = 2018-08-13
note = "The council obvody of the vote of 2018-11-10: they only place the okrsky. Troska and Brezina (obvod 1) are settlements, not streets of the register; they lie in the part Hnúšťa. Kotlištská (written Kotlišská) is one street. Skálie lies in the part Hačava (obvod 1 by part)."
reused = 2018-11-10
okrsky_fill = "nearest"
okrsky_note = "All house numbers in the notice are súpisné čísla (by: supisne). Kotlištská is written as in the register. Addresses of SNP, M. R. Štefánika, Hlavná and 1.mája whose súpisné číslo the notice does not list, Záhrada 1.mája, Skálie (part Hačava, okrsok 1 by part) and the houses without a street (incl. the settlements Troska and Brezina, not streets of the register, and the houses without a street in part Likier) are placed by fill_nearest."
okrsky_adopted = 2018-11-10
okrsky_adopted_basis = "No document of 2017-11-04 setting the okrsky was found (okrsok-rules-150): No okrsky document of the regional elections 2017: the old website (mesto.hnusta.sk, Drupal, archived 2017) shows no 2017 elections page or file, and the current site's elections section starts with 2018. These are the okrsky of the vote of 2018-11-10 (2018), the nearest in time with okrsky of its own that fit: 8 okrsky. The voters on the roll per okrsok are not known for both votes, so whether the layout changed is not known either."
okrsky_date_approximate = "named"
okrsky_date_basis = "The notice's heading names the elections to the organs of municipal self-government of 10.11.2018; it states no decision date, nor does the page linking it."

