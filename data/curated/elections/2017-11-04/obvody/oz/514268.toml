obec = "514268"
name = "Nováky"
date = 2018-07-02
fill = "nearest"
note = "The council obvody of the vote of 2018-11-10: they only place the okrsky. The resolution describes the obvody only by boundaries (Pribinova street, the railway, Horné Lelovce), the same obvody as in 2022 and 2026; streets are placed against them by register coordinates as in the 2026 rule set in this repository (all inferred). Addresses without a street go by fill_nearest."
reused = 2018-11-10
okrsky_date = 2018-07-13
okrsky_fill = "nearest"
okrsky_note = "The primátor's decision of 13.07.2018 for the elections of 10 November 2018 (on the city's 'Voľby do orgánov samosprávy obcí r. 2018' page) describes the okrsky only by boundaries (Svätoplukova, Pribinova, Lehotská streets, the railway, Horné Lelovce), word for word as the 2019 decisions do; the streets are placed against these boundaries by register coordinates exactly as in this repository's rule set of 16 March 2019 (all rules inferred). Okrsky 1-2 lie south of Pribinova (obvod 1), 3-4 north of it (obvod 2), 5 west of the railway (obvod 3, alone). Addresses without a street and streets not placed go by fill_nearest."
okrsky_adopted = 2018-11-10
okrsky_adopted_basis = "No document of 2017-11-04 setting the okrsky was found (okrsok-rules-167): The page of the 2017 regional elections links \"Volebné okrsky a volebné miestnosti\", but that file is the decision of 13. 07. 2018 for the municipal elections of 10 November 2018, not a 2017 document; no 2017 okrsky document found. Internet Archive offline. These are the okrsky of the vote of 2018-11-10 (2018), the nearest in time with okrsky of its own that fit: 5 okrsky. The voters on the roll per okrsok are not known for both votes, so whether the layout changed is not known either."

