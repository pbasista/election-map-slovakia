obec = "501204"
name = "Kolárovo"
date = 2018-07-26
fill = "nearest"
note = "The council obvody of the vote of 2018-11-10: they only place the okrsky. Resolution 986/2018 (26.7.2018) forms okrsky 1-10 by streets/parts and composes obvod 1 of okrsky 1,3,4,6,7 (9 councillors) and obvod 2 of okrsky 2,5,8,9,10 (8 councillors); obvod rules are the union of the okrsky's streets. The announcement PDF linked from the archived Komunálne voľby 2018 page was not archived. Parts Veľký Ostrov, Kráľka (obvod 1), Pačérok, Veľká Gúta (obvod 2); Částa 1-55 and 56-250 read as súpisné numbers of part Částa (both obvod 1). \"obyvatelia bez adresy\" not mapped; houses without street in part Kolárovo by fill_nearest."
reused = 2018-11-10
okrsky_date = 2018-07-26
okrsky_fill = "nearest"
okrsky_note = "The council's resolution 986/2018 of 26.7.2018 (signed by the mayor 31.7.2018), the input's document, approves the okrsky 1-10 with their streets and parts for the 2018 municipal elections and composes obvod 1 of okrsky 1,3,4,6,7 and obvod 2 of okrsky 2,5,8,9,10. Miestne časti (Veľký Ostrov, Pačérok + Veľká Gúta, Kráľka) are part rules; \"Částa 1-55\" / \"Částa 56-250\" read as súpisné numbers of part Částa. \"Rábska Športová\" = the streets Rábska and Športová. \"obyvatelia bez adresy\" (okrsok 7) = voters without an address, not mapped. Jilemníckeho = Jilemnického (misspelling); M.R.Štefánika = the register's Štefánikova (its only Štefánik street); Okt.námestie = Októbrové námestie. Houses without a street in part Kolárovo by fill_nearest. Internet Archive was offline, so the mayor's separate 2018 announcement (not archived per the obvod job) was not sought there."
okrsky_adopted = 2018-11-10
okrsky_adopted_basis = "No document of 2017-11-04 setting the okrsky was found (okrsok-rules-045): No document of the 2017 regional elections found: the live site's Voľby, referendum section starts with the 2019 votes (migrated from the old WordPress site), and the Internet Archive kept no 2017 elections page or notice-board item (its 2017 captures of kolarovo.sk are the home page and general pages; category/uradna-tabula was not captured in 2017). These are the okrsky of the vote of 2018-11-10 (2018), the nearest in time with okrsky of its own that fit: 10 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2017-11-04 → 2018-11-10: 1: 208 → 217, 2: 182 → 188, 3: 1,143 → 1,148, 4: 1,038 → 1,045, 5: 876 → 881, 6: 966 → 981, 7: 1,333 → 1,385, 8: 985 → 979, 9: 1,243 → 1,290, 10: 804 → 813."

