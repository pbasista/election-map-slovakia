obec = "500933"
name = "Vráble"
okrsky_fill = "nearest"
okrsky_note = "\"časť obce Vráble\" (okrsok 1) means voters registered with the town only (no part rule). Levická \"pravá strana\" / \"ľavá strana\" are read as the even / odd side. Sídl. Lúky numbers the list leaves out, the part Vráble's addresses without a street and Čerešňové námestie go by fill_nearest."
okrsky_adopted = 2019-05-25
okrsky_adopted_basis = "No document of 2019-03-16 setting the okrsky was found (okrsok-rules-1080): For the presidential election of 2019 the city page \"Informácia o volebných okrskoch\" (captured 2019-02-10) gives only the mayor's 9 polling stations, no streets; the parts (3) are fewer than the okrsky (9). These are the okrsky of the vote of 2019-05-25 (2019-ep), the nearest in time with okrsky of its own that fit: 9 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2019-03-16 → 2019-05-25: 1: 1,148 → 1,167, 2: 946 → 954, 3: 844 → 852, 4: 880 → 892, 5: 743 → 743, 6: 831 → 844, 7: 1,027 → 1,021, 8: 498 → 502, 9: 360 → 370."
okrsky_date_approximate = "archived"
okrsky_date_seen = 2019-04-02
okrsky_date_basis = "the Internet Archive captured the city page with the mayor's okrsky for the European Parliament election of 25 May 2019 on 2019-04-02; the page states no decision date (https://web.archive.org/web/20190402230434/http://www.vrable.sk:80/informacia-o-volebnych-okrskoch.phtml?id3=93319)"

