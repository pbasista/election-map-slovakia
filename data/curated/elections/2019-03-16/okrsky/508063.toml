okrsky_date = 2019-01-16
okrsky_fill = "nearest"
okrsky_note = "The mayor's decision of 16.01.2019 (scan) sets the 12 okrsky and polling stations for the presidential election 2019; 'Volebné okrsky v Malackách' (Okrsky.pdf, linked on the same election page) lists the streets per okrsok, with the zapisovateľky the mayor appointed for this election on 28.01.2019. The street list gives each okrsok its streets; a street split among okrsky lists its orientačné numbers, and addresses without a street are listed by súpisné číslo as 'časť obce Malacky'. House numbers of split streets the lists leave out and the addresses without a street they do not number (mostly gardens and non-residential buildings) are placed by fill_nearest. 'bez ulice' lists nothing (voters registered without an address) and has no rule. Bernolákova, listed with numbers only in okrsok 7, is taken whole. 'Časť obce ZO Prídavky' (okrsok 10, the gardening colony Prídavky) is not a part in the register; its houses are addresses without a street, placed by fill_nearest. 'Ulica Ernsta Weisnera' is Ulica Ernsta Wiesnera; 'Štúrova súp. č. 5959' is the súpisné číslo of Štúrova 53. The Internet Archive was offline (CDX and Wayback returned 'Temporarily Offline' on several tries); it was not needed for the documents used."
okrsky_supplemented = 2022-10-29
okrsky_supplemented_from = "election"
okrsky_supplement_basis = "The document does not name Krátka ulica (streets of the register, most of them newer than the document); each is placed in the okrsok the rule set of the elections of 2022-10-29 gives it: Krátka ulica in okrsok 12."

