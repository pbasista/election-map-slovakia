okrsky_fill = "nearest"
okrsky_note = "Štúrova and ČSA are split by the súpisné čísla of the blocks of flats the document lists (okrsky 3, 4, 5); their other houses (\"rodinné domy\") are okrsok 5. Budatínska Lehota, Dubie and Oškerda are parts. \"+ občania KNM bez bližšie určenej adresy\" (okrsok 6) are voters without an address, not a rule. Register streets the document does not list, placed by fill_nearest: Dr.G.Schaefflera, Karola Andela, Škorčie, Viliama Galvánka; also the addresses without a street."
