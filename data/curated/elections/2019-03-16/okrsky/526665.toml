okrsky_note = "'Stará Ľubovňa - bez ulice' (okrsok 1) means voters registered without an address, so it has no rule. Obchodná is not named in the document; it and the addresses without a street and the house numbers the ranges leave out take the okrsok of the nearest address (fill_nearest). The whole part Podsadek is okrsok 'Podsadek'. The document does not name Michalská ulica, Rastislavova ulica and Ľubomírska ulica (newer streets, one address each, by Továrenská/Zámocká): they take the okrsok of the nearest address (fill_nearest). The PDF is a scan whose text layer has OCR errors; checked against the page images."

