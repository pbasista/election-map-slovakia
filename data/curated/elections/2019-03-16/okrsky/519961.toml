obec = "519961"
name = "Zborov"
okrsky_fill = "nearest"
okrsky_note = "The mayor's announcement for the municipal elections of 10 November 2018, archived from the old website. Zákutie is split by orientačné čísla (1–42 / 43–100). The 29 houses with only a súpisné číslo take the okrsok of the nearest address (fill_nearest)."
okrsky_adopted = 2018-11-10
okrsky_adopted_basis = "No document of 2019-03-16 setting the okrsky was found (okrsok-rules-1433): No okrsky document for the presidential election of 16 March 2019 found. The live elections page (/urad/volby/, all pages; files migrated from the old site with placeholder dates) and the old website's elections page 'Voľby a referendá' (/samosprava/volby-nr-sr-2016.html, archived 2020-08-14 and 2021-01-24, listing every election file of 2016–2020) carry no 'utvorenie volebných okrskov' for this vote: its 2019 presidential entries are the announcement of the election, the list of candidates, the voters' information and the results. The only okrsky document of 2016–2020 is that of the municipal elections of 10 November 2018. The Internet Archive's CDX of zborov.sk (2016–2021) has no other okrsky file; the notice board captures list no election documents. Web search found nothing. The Internet Archive was intermittently refusing connections but answered in the end. These are the okrsky of the vote of 2018-11-10 (2018), the nearest in time with okrsky of its own that fit: 2 okrsky. The voters on the roll per okrsok are not known for both votes, so whether the layout changed is not known either."
okrsky_date_approximate = "named"
okrsky_date_basis = "The document's heading names this vote: 'Utvorenie volebných okrskov a určenie volebných miestností v obci ZBOROV počas konania volieb do orgánov samosprávy obcí dňa 10. novembra 2018'. It states no date of its own (signed 'Ján Lukáč, starosta obce v.r.', undated). The Internet Archive's earliest capture of the PDF (from the old website's /dokumenty/ folder, no longer live) is of 2021-03-05. The old elections page ('Voľby a referendá', /samosprava/volby-nr-sr-2016.html) links it in its first capture after 2018-01-25, of 2020-08-14; the notice board captures of 2018-09-05 and 2018-10-09 do not list it, so no capture before the vote shows it."

