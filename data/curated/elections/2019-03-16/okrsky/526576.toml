# The okrsky of Hnilčík of the vote of 2022-10-29, data/curated/elections/2022-10-29/okrsky/526576.toml, standing in, by `ems job reuse`. Its header there:
#   Okrsky of Hnilčík, transcribed by an AI agent in job okrsok-rules-1037 from the documents below;
#   checked by `ems job ingest` against the address register. The document's
#   text per okrsok, verbatim:
#     okrsok 1: Volebný okrsok zahŕňa voličov od súp. čísla 92, miestnu časť Zimná dolina, Cechy, Štolvek, Grétla.
#     okrsok 2: Volebný okrsok zahŕňa voličov Dolnej časti obce, miestnu časť Ráztoky, Bindt a voličov, ktorí majú trvalý pobyt hlásený len na obci.
obec = "526576"
name = "Hnilčík"
okrsky_date = 2022-11-09
okrsky_note = "No document of the elections found; the referendum's document (the municipality's 2022 elections page keeps only candidate and results files; the notice board archive has no okrsky document; web.archive.org was offline when tried). 'Od súp. čísla 92' is read as súpisné čísla 92 and up in the part Hnilčík, the 'Dolná časť obce' as the lower numbers; the settlements Zimná dolina, Cechy, Štolvek, Grétla are not parts or streets in the register and are taken to lie within those numbers. Voters registered only on the municipality (okrsok 2) have no address."
okrsky_adopted = 2022-10-29
okrsky_adopted_basis = "No document of 2019-03-16 setting the okrsky was found (okrsok-rules-1537): No okrsky document of the 2019 presidential election found: the municipality's presidential elections page has for 2019 only the timetable, voters' information, e-mail address, the candidate list (scan of 26 Feb 2019) and the results; archived home pages of Jan and Jun 2019 list no okrsky notice. The copy (the 2022 referendum document) stays. The Internet Archive was reachable. These are the okrsky of the vote of 2022-10-29 (2022), the nearest in time with okrsky of its own that fit: 2 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2019-03-16 → 2022-10-29: 1: 233 → 243, 2: 242 → 234."

