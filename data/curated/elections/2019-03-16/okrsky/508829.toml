okrsky_date_basis = "The notice-board page of the 2020 National Council elections has the section \"Utvorenie volebných okrskov a určenie volebných miestností\" (for the elections of 2020), marked \"Zverejnené 25.11.2019\"; the decision itself is undated. (https://www.nemecka.info/zverejnovanie-1/uradna-tabula/volby-do-narodnej-rady-sr-2020-250.html)"

