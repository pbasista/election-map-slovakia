okrsky_note = "\"Sviniarka\" (okrsok 2) is not a street of the address register and is left out. Addresses without a street (súpisné čísla only, in parts Dubová, Nemecká, Zámostie) take the okrsok of the nearest address (fill_nearest). No decision date is stated on the page."
okrsky_adopted = 2020-02-29
okrsky_adopted_basis = "No document of 2019-03-16 setting the okrsky was found (okrsok-rules-1430): The obec's notice-board page of the presidential election 2019 only says \"V obci Nemecká sú utvorené 2 volebné okrsky\"; it gives neither streets nor polling stations. The site's full-text search (okrskov, Sviniarka, Dolnej školy) finds no okrsky document of 2019 (the earliest street list is of the 2020 elections, posted 25.11.2019); the Internet Archive has no capture of the 2019 notice-board pages. These are the okrsky of the vote of 2020-02-29 (2020-nrsr), the nearest in time with okrsky of its own that fit: 2 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2019-03-16 → 2020-02-29: 1: 788 → 777, 2: 674 → 678."
okrsky_date_approximate = "posted"
