okrsky_note = "The mayor's decision (č. 1/2019, effective 2019-01-22) forms the okrsky in its annex 2; the separate list \"Volebné okrsky a volebné miestnosti\" is identical. Same okrsky as in 2017 and 2018. Named in the document but without addresses in the register, left out: Jaselská, Ku štvrtiam, Šťastná. Addresses without a street (about 490, in every part) and house numbers outside every range the document gives for a split street are placed by fill_nearest."
okrsky_supplemented = 2023-09-30
okrsky_supplemented_from = "election"
okrsky_supplement_basis = "The document does not name Mládežnícka (Sihoť I), Odevná (Zámostie), Tramínová, Rizlingová, Rulandská (Zlatovce), Pavla Ondráška, Na pažiti and Pod privádzačom (Záblatie), streets built or named later. The rule set of the National Council election of 2023-09-30 (data/curated/elections/2023-09-30/okrsky/505820.toml, from the city's document for that vote) places each as a whole street: Mládežnícka with Nábrežná, Švermova, Študentská, Komenského, Smetanova (its okrsok 26, here okrsok 26); Odevná with Veľkomoravská, Zlatovská (its 42, here 42); Tramínová, Rizlingová, Rulandská with Hlavná, Hroznová, Jána Prháčka (its 49, here okrsok 49, all of Zlatovce); Pavla Ondráška, Na pažiti, Pod privádzačom with Záblatská, Dolné Pažite (its 51, here okrsok 50, Záblatie). Each is copied into the okrsok that holds those same neighbouring streets here."

