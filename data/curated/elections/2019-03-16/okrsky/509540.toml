obec = "509540"
name = "Dolný Kubín"
okrsky_date = 2019-02-22
okrsky_fill = "nearest"
okrsky_note = "Text is the document's list of streets per okrsok. \"Voliči/občania bez adresy trvalého pobytu\" (okrsok 5) and institutions named beside the streets (Nemocnica s poliklinikou, Zariadenie pre seniorov, Centrum sociálnych služieb) are not rules. Nábrežie Oravy is split by the súpisné čísla the document gives; its other houses go by fill_nearest. Podzámocká is not in the register; left out. Register streets the document does not list, placed by fill_nearest: M. M. Hodžu, P. Jilemnického, Veterná; also the addresses without a street."
okrsky_adopted = 2019-05-25
okrsky_adopted_basis = "No document of 2019-03-16 setting the okrsky was found (okrsok-rules-1049): The archived 2019 presidential election page (2019-03-19) links \"Utvorenie volebných okrskov a určenie volebných miestností v Meste Dolný Kubín pre voľby prezidenta Slovenskej republiky\" (download_file_f.php?id=1082617), but the file is gone from the website (returns an HTML page) and the Internet Archive has no capture of it (404). These are the okrsky of the vote of 2019-05-25 (2019-ep), the nearest in time with okrsky of its own that fit: 16 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2019-03-16 → 2019-05-25: 1: 214 → 214, 2: 793 → 799, 3: 675 → 689, 4: 940 → 950, 5: 1,226 → 1,228, 6: 663 → 653, 7: 887 → 886, 8: 1,198 → 1,196, 9: 2,009 → 2,006, 10: 1,129 → 1,146, 11: 1,043 → 1,049, 12: 871 → 864, 13: 1,431 → 1,449, 14: 871 → 864, 15: 683 → 680, 16: 228 → 153. Of these, okrsok 16 (228 → 153) differs by more than 25% (2019-03-16 → 2019-05-25), allowed in an obec of 16 okrsky: of 10 or more, one okrsok, or 5% of them, may differ while the layout holds."
okrsky_adopted_outliers = [[16, 228, 153]]

