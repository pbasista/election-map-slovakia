okrsky_note = "The Informácia (scan, read by OCR) of 14 January 2019 sets 33 okrsky; its address list is dated 15.01.2019. The list leaves out Hlboká ul. 4–10 (fill_nearest). Rules transcribe the annex 'Zoznam adries začlenených v jednotlivých okrskoch' (časť obce, ulica, orientačné čísla od–do, párne/nepárne/všetky/jedno číslo). A street the list puts in one okrsok only is a whole-street rule; streets split between okrsky carry the list's numbers (a range ending in a lettered number, e.g. 16–18A, read as 16-18 plus 18A; 12A–12J as the single lettered houses). Numbers listed in časť Komárno without a street (4007, 4428) are súpisné čísla of addresses without a street. 'Piesočný hon' (listed) has no register addresses and is left out. Register spelling variants (Slobody, Ul.biskupa Királya, Ul.roľníckej školy, Ul.práce, K. Harmoša, Nová) follow their main street (inferred). The row 'občania s trvalým pobytom Komárno' (residents registered only to the city) has no rule. fill_nearest places addresses the list does not name: addresses without a street outside the whole parts listed, register streets not in the list (e.g. Hadovská cesta, Park pri Pevnosti - Anglia, Tržničné nám., Druhá priečna ul.) and unlisted numbers of split streets."

