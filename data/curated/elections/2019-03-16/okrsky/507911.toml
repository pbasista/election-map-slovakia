okrsky_note = "Document linked as 'Určenie volebných okrskov' from the archived elections page (volby.html, 2019-05-10). Its heading cites the EP election decision 28/2019 Z. z. (the annex wrongly says 'voľby do orgánov samosprávy obcí'). Streets in the register the document does not name (newer streets): Jastrabia, Kolibríková, Sokolia, Toskánska, and addresses without a street take the okrsok of the nearest placed address (fill_nearest)."
okrsky_adopted = 2019-05-25
okrsky_adopted_basis = "No document of 2019-03-16 setting the okrsky was found (okrsok-rules-1077): The archived elections page (2019-03-10) links 'Volebné okrsky a volebné miestnosti' (urcenie_volebnych_okrskov_volby_prezidenta_2019.pdf, id=1087166), but the PDF was never archived and the old site is gone (live 404). These are the okrsky of the vote of 2019-05-25 (2019-ep), the nearest in time with okrsky of its own that fit: 4 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2019-03-16 → 2019-05-25: 1: 1,543 → 1,522, 2: 954 → 955, 3: 989 → 1,006, 4: 1,066 → 1,048."

