obec = "508659"
name = "Hrochoť"
okrsky_date = 2024-01-25
okrsky_fill = "nearest"
okrsky_note = "The mayor's decision of 25 Jan 2024 (PDF) gives each okrsok's polling station; the elections page of the vote and the OZNAM of 25 Jan 2024 give the streets per okrsok (the OZNAM leaves out Kyslinky, which the elections page lists in okrsok 1). Hlavná ulica is listed in both okrsky without house numbers, so it has no rule: its houses take the okrsok of the nearest placed address (fill_nearest), as do Stará voda (not named) and addresses without a street. Okrsok 1 also holds 'pobyt bezdomovca'. Same okrsky as the 2026 document."
okrsky_adopted = 2024-03-23
okrsky_adopted_basis = "No document of 2019-03-16 setting the okrsky was found (okrsok-rules-1526): The obec's website (hrochot.sk) keeps no okrsky document for this vote: its elections page and the aktuality of the months before the vote (all 33 pages read) hold only other notices; the notice board keeps no older items. The Internet Archive was offline (HTTP 503 'Temporarily Offline') on repeated tries, so archived copies could not be checked. These are the okrsky of the vote of 2024-03-23 (2024-prezident), the nearest in time with okrsky of its own that fit: 2 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2019-03-16 → 2024-03-23: 1: 955 → 964, 2: 216 → 211."

