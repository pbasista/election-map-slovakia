obec = "512681"
name = "Turany"
okrsky_fill = "nearest"
okrsky_note = "The town's announcement of the okrsky for the municipal elections of 2018, linked as 'Volebné okrsky v Turanoch' from the elections page. It does not name Na Dubovú, Doliny and Slnečná (named in the later documents); they take the nearest okrsok too. The register's addresses without a street (súpisné čísla only) take the okrsok of the nearest address (fill_nearest)."
okrsky_adopted = 2018-11-10
okrsky_adopted_basis = "No document of 2019-03-16 setting the okrsky was found (okrsok-rules-1184): The town's website (webygroup) keeps per-vote pages; the Internet Archive's CDX of turany.sk lists no okrsky notice for this vote: the archived page 'Voľba prezidenta Slovenskej republiky' (2019-08-19) lists the voters' information, e-mail addresses and results only. These are the okrsky of the vote of 2018-11-10 (2018), the nearest in time with okrsky of its own that fit: 4 okrsky. The voters on the roll per okrsok are not known for both votes, so whether the layout changed is not known either."
okrsky_date_approximate = "named"
okrsky_date_basis = "The announcement names the vote ('Harmonogramu organizačno-technického zabezpečenia volieb do orgánov samosprávy v roku 2018') and states no date; the PDF was made 2018-09-10 and the Internet Archive's only capture of the elections page linking it is of 2019-07-18, after the vote."

