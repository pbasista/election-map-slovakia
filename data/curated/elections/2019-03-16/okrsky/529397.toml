okrsky_adopted_basis = "No document of 2019-03-16 setting the okrsky was found (okrsok-rules-1076): The district publishes a new \"Rozhodnutie starostky o určení volebných okrskov\" for each vote (found for 2017, EP 2019, NR SR 2020, 2023, 2024, referenda 2023 and 2026), but none for the presidential election of 2019 is on the live website (media library, posts, guessed file names) or among the PDFs the Internet Archive CDX listed for karlovaves.sk; the 2019 elections post (prve-kolo-prezidentskych-volieb-bude-16-marca) links no document. Further Internet Archive lookups (2018–2019 CDX without mimetype filter) failed: the Archive refused connections after several retries with pauses. The EP 2019 decision (20.02.2019) and the NR SR 2020 decision differ in okrsky 7/8, so neither can stand in. These are the okrsky of the vote of 2020-02-29 (2020-nrsr), the nearest in time with okrsky of its own that fit: 30 okrsky (nearer, not taken: 2019-05-25: okrsok 8: 996 voters then, 1,331 in 2019-05-25; 2018-11-10: okrsok 8: 996 voters then, 1,316 in 2018-11-10). Voters on the roll per okrsok (ŠÚ SR), 2019-03-16 → 2020-02-29: 1: 1,075 → 1,105, 2: 1,684 → 1,682, 3: 984 → 953, 4: 924 → 922, 5: 882 → 878, 6: 905 → 892, 7: 1,176 → 1,150, 8: 996 → 1,125, 9: 896 → 910, 10: 741 → 726, 11: 734 → 717, 12: 829 → 760, 13: 941 → 932, 14: 988 → 970, 15: 978 → 966, 16: 997 → 855, 17: 1,282 → 995, 18: 1,119 → 1,047, 19: 1,034 → 1,047, 20: 963 → 943, 21: 894 → 945, 22: 937 → 914, 23: 1,052 → 1,015, 24: 1,200 → 1,108, 25: 723 → 722, 26: 986 → 983, 27: 888 → 1,043, 28: 1,274 → 1,106, 29: 1,092 → 1,068, 30: 1,099 → 1,090."

