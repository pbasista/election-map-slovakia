okrsky_note = "The annex lists the streets of each okrsok, with orientačné numbers where a street is split; split streets are transcribed with the listed numbers. Streets the document names that the register lacks are left out: Mlyny, Čavojského. fill_nearest places register streets the document does not name (Lamačská cesta, Mlynská Dolina, Tienistá), house numbers of split streets the annex does not list, and the addresses without a street. \"súpisné číslo 5578\" is a rule on that súpisné number."
