# The okrsky of Ľubica of the vote of 2019-05-25, data/curated/elections/2019-05-25/okrsky/523682.toml, standing in, by `ems job reuse`. Its header there:
#   Okrsky of Ľubica, transcribed by an AI agent in job okrsok-rules-1747 from the documents below;
#   checked by `ems job ingest` against the address register. The document's
#   text per okrsok, verbatim:
#     okrsok 1: Bernolákova, Gen. Svobodu, Jesenského, Povstalecká, Úzka, voliči s trvalým pobytom Obec Ľubica
#     okrsok 2: Pod lesom, Poľná, Športová, Vrbovská
#     okrsok 3: 8. mája, Hlboká, Jarná, Kruhová, Mierová, Na vŕšku, Remeselnícka
#     okrsok 4: Budovateľská, Jánošíkova, Karola Kuzmányho, Podtatranská, Slnečná, Svätej Alžbety, Školská
obec = "523682"
name = "Ľubica"
okrsky_date = 2019-02-19
okrsky_fill = "nearest"
okrsky_note = "\"voliči s trvalým pobytom Obec Ľubica\" (okrsok 1) are voters registered without an address, not the register's houses without a street; those (súpisné only, incl. Ľubické Kúpele) go to the nearest placed address (fill_nearest)."
okrsky_adopted = 2019-05-25
okrsky_adopted_basis = "No document of 2019-03-16 setting the okrsky was found (okrsok-rules-1157): No okrsky document for the presidential election of 16 March 2019 found. The site's page 'Voľby prezidenta SR 2019' (volby-prezidenta-sr-2019.phtml?id3=144373) is empty in its only Internet Archive capture (2021-12-31) and gone live; the site search lists okrsky documents of 2017, 2018, EP 2019 (dated 19.02.2019, for the EP election only), 2020 and later, but none for the 2019 presidential election; the Archive has no capture of the site between Nov 2018 and Mar 2019. The okrsky of 2018 (06.09.2018) and EP 2019 (19.02.2019) documents are identical, so the copy very likely fits, but no document of this vote states it. These are the okrsky of the vote of 2019-05-25 (2019-ep), the nearest in time with okrsky of its own that fit: 4 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2019-03-16 → 2019-05-25: 1: 784 → 794, 2: 859 → 848, 3: 814 → 821, 4: 790 → 794."

