# The okrsky of Prašice of the vote of 2023-09-30, data/curated/elections/2023-09-30/okrsky/505374.toml, standing in, by `ems job reuse`. Its header there:
#   Okrsky of Prašice, transcribed by an AI agent in job okrsok-rules-3565 from the documents below;
#   checked by `ems job ingest` against the address register. The document's
#   text per okrsok, verbatim:
#     okrsok 1: Ulice: 1.mája, Nemečkovská cesta, Cintorínska, Partizánska, Krátka, Lipová, Okšovská, Pri majeri, Duchonka, Obec Prašice
#     okrsok 2: Ulice: Slnečná, Družstevná, Mládežnícka, Mlynská, Budovateľská, Studničná, Žalmanova, Novosvetská
obec = "505374"
name = "Prašice"
okrsky_date = 2023-06-22
okrsky_note = "The document is on archiv.prasice.sk, the municipality's archive of its former website (linked from the footer of www.prasice.sk). Same okrsky as the copied 2026 document; this one also names Duchonka (recreational area without streets) in okrsok 1."
okrsky_adopted = 2023-09-30
okrsky_adopted_basis = "No document of 2019-03-16 setting the okrsky was found (okrsok-rules-1209): No page or document of the presidential election 2019 is archived (the Internet Archive has no capture of the website between Sep 2018 and June 2019 other than redirects), and the current website and the archiv.prasice.sk mirror (from 2020) have none. The Internet Archive was intermittently offline during the search; it was retried until it answered. These are the okrsky of the vote of 2023-09-30 (2023-nrsr), the nearest in time with okrsky of its own that fit: 2 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2019-03-16 → 2023-09-30: 1: 855 → 892, 2: 895 → 849."

