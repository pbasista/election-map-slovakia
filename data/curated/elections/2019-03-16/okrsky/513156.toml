obec = "513156"
name = "Ilava"
okrsky_fill = "nearest"
okrsky_note = "ÚZVJS (the prison, okrsok 1) has no street of its own in the register and is left out; 'občania s trvalým pobytom: Ilava' are the voters registered without an address. Unlike 2022+, Slnečná is in okrsok 1. Addresses of part Ilava without a street are placed by fill_nearest."
okrsky_adopted = 2019-05-25
okrsky_adopted_basis = "No document of 2019-03-16 setting the okrsky was found (okrsok-rules-1105): The archived list of aktuality (2019-02-21) links 'Voľby prezidenta SR 2019 – Vyhlásenie volieb, volebných okrskov a informácie pre voliča' (posted 16.01.2019), but that page was never captured by the Internet Archive and is gone from the live site; no other 2019 okrsky document found. These are the okrsky of the vote of 2019-05-25 (2019-ep), the nearest in time with okrsky of its own that fit: 6 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2019-03-16 → 2019-05-25: 1: 1,262 → 1,177, 2: 950 → 974, 3: 721 → 725, 4: 926 → 935, 5: 692 → 701, 6: 99 → 103."
okrsky_date_approximate = "archived"
okrsky_date_seen = 2019-05-22
okrsky_date_basis = "The Internet Archive captured the city's EP 2019 elections page listing the okrsky on 2019-05-22 (the page is dated 13.05.2019); no decision date is stated. (https://web.archive.org/web/20190522134350/http://www.ilava.sk:80/aktuality/volby-do-europskeho-parlamentu)"

