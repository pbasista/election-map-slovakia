# The okrsky of Čalovec of the vote of 2022-10-29, data/curated/elections/2022-10-29/okrsky/501085.toml, standing in, by `ems job reuse`. Its header there:
#   Okrsky of Čalovec, transcribed by an AI agent in job okrsok-rules-1000 from the documents below;
#   checked by `ems job ingest` against the address register. The document's
#   text per okrsok, verbatim:
#     okrsok 1: volebný okrsok č. 1
#     okrsok 2: volebný okrsok č. 2
obec = "501085"
name = "Čalovec"
okrsky_date = 2022-08-02
okrsky_note = "The document names only the polling stations (okrsok 1: zasadacia miestnosť OcÚ, Čalovec č. 170; okrsok 2: kultúrno-spoločenská miestnosť Čalovec-Violín č. 56); okrsky inferred as the parts of the stations, consistent with voters 870/73."
okrsky_adopted = 2022-10-29
okrsky_adopted_basis = "No document of 2019-03-16 setting the okrsky was found (okrsok-rules-1493): The live notice board (searched in full for 'okrskov') keeps okrsky notices only for 2022, 2023 (NR SR), 2024 (president, EP) and October 2026; for this vote it has at most the notice on delegating okrsková komisia members, without okrsky. The Internet Archive's captures of calovec.sk begin in 2021 and its notice-board files (obsah…) of 2021–2026 include no okrsky notice for this vote. These are the okrsky of the vote of 2022-10-29 (2022), the nearest in time with okrsky of its own that fit: 2 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2019-03-16 → 2022-10-29: 1: 861 → 870, 2: 78 → 73."

