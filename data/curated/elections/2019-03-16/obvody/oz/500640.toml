obec = "500640"
name = "Nové Sady"
date = 2022-06-27
note = "The council obvody of the vote of 2022-10-29: they only place the okrsky. Scanned announcement, read visually. Kotrbál is a settlement without its own part in the register (its addresses lie in part Nové Sady), so obvod 1 = parts Nové Sady + Ceroviny."
reused = 2022-10-29
okrsky_date = 2022-06-27
okrsky_note = "Every obvod has exactly one okrsok (okrsok n = obvod n, per the Statistical Office); the okrsok is the whole obvod as the 2022 obvody document sets it, so no separate okrsky list is needed for the rules. Text = the document's words on the obvod. Date = the resolution that set the obvody/okrsky split."
okrsky_adopted = 2022-10-29
okrsky_adopted_basis = "No document of 2019-03-16 setting the okrsky was found (okrsok-rules-1491): The municipality's page for this vote (live, or as archived) lists only the announcement of the vote, voter information, e-mail addresses and results; no okrsky document. Okrsky documents exist only for the referendum 2023, EP 2024 and referendum 2026 (okrsok 1 Nové Sady, Kotrbál, Ceroviny; okrsok 2 Sila). These are the okrsky of the vote of 2022-10-29 (2022), the nearest in time with okrsky of its own that fit: 2 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2019-03-16 → 2022-10-29: 1: 817 → 814, 2: 279 → 270."

