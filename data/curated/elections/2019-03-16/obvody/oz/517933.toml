okrsky_note = "'Dielnice' and 'Žliabková dolina' are not in the address register and are left out. Rajecká cesta is split by súpisné čísla as the document lists them; its unlisted addresses, Pri Rajčanke (not named by the document) and the addresses without a street in part Rajecké Teplice take the nearest okrsok (fill_nearest). Okrsok 3 (mestská časť Poluvsie) is alone in obvod 2."
okrsky_adopted = 2018-11-10
okrsky_adopted_basis = "No document of 2019-03-16 setting the okrsky was found (okrsok-rules-1236): No okrsky document of this vote found. The live site (rajecke-teplice.info) has election pages for 2018, 2019 and 2020 with results and candidate lists only. In the Internet Archive the old site rajecke-teplice.sk was captured only in June 2017 (before the okrsky of 2017 were set) and the 2017-2020 captures of rajecke-teplice.info (CDX, 640 files) hold no okrsky document of 2017, 2019 or 2020; the only one of the period is the 2018 obvody announcement (which lists the okrsky of 10 November 2018 only). These are the okrsky of the vote of 2018-11-10 (2018), the nearest in time with okrsky of its own that fit: 3 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2019-03-16 → 2018-11-10: 1: 994 → 932, 2: 895 → 878, 3: 537 → 537."
okrsky_date_approximate = "archived"
okrsky_date_seen = 2018-08-18
okrsky_date_basis = "The Internet Archive captured the town's announcement (which lists the three okrsky with their streets and polling stations) on 2018-08-18; it states the date of the council's obvody resolution (02.08.2018) but no date of the mayor's okrsky decision. (https://web.archive.org/web/20180818162153/http://rajecke-teplice.info/files/4046-Volebne-obvody-a-pocet-poslancov-MsZ-v-nich-VOLBY-DO-ORGANOV.pdf)"

