note = "The council obvody of the vote of 2018-11-10: they only place the okrsky. The announcement defines obvod 1 as okrsky 1 and 2 (the streets of the town Rajecké Teplice, listed by okrsok) and obvod 2 as okrsok 3, mestská časť Poluvsie: obvod 1 is the whole part Rajecké Teplice, obvod 2 the part Poluvsie."
