okrsky_note = "The okrsky of 24.02.2020 were set for the by-elections (voľba starostu) called by decision 334/2019 Z. z. for 4 April 2020; decision 57/2020 Z. z. of 25 March 2020, posted on the same Voľby page, moved the day of these same elections to 3 October 2020, so they are this vote's okrsky (no later okrsky document was posted for it). The document's preamble cites 166/2017 Z. z. by mistake. The live website answered HTTP 429 (rate limit), so the Internet Archive copies are listed. The register's addresses without a street (súpisné čísla only) are in no list of the document; they take the okrsok of the nearest placed address (fill_nearest)."
okrsky_supplemented = 2023-06-26
okrsky_supplemented_from = "document"
okrsky_supplement_basis = "The mayor's decision of 2023-06-26 (okrsky for the National Council election of 30 September 2023) lists Šúrska (Šúrska ulica) in okrsok 2, Senecká cesta in okrsok 3 and Na výslní in okrsok 4; they are taken from it, in its okrsky. The February 2020 decision names neither Šúrska nor Senecká cesta (26 addresses in today's register) and, unlike every other decision of 2017–2024, leaves out Na výslní (7 addresses), so it leaves them unplaced. (https://web.archive.org/web/20250529013302/https://www.ivankapridunaji.sk/download_file_f.php?id=1880454)"

