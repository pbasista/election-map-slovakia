okrsky_adopted_basis = "No document of 2024-06-08 setting the okrsky was found (okrsok-rules-4973): No okrsky decision for the EP election of 8.6.2024 among the posts or the scanned PDFs of Feb-May 2024 (the 10.1.2024 decision names only the presidential election). The Internet Archive (web.archive.org, incl. the CDX API) refused connections throughout (about 45 minutes, retried with pauses), so archived pages could not be checked. These are the okrsky of the vote of 2024-03-23 (2024-prezident), the nearest in time with okrsky of its own that fit: 2 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2024-06-08 → 2024-03-23: 1: 968 → 972, 2: 974 → 967."

