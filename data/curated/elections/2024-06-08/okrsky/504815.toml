okrsky_note = "Same okrsky as the National Council election 2023. Cubínkova, Teslíkova and Úprkova (okrsok 7) are not in the address register and are left out. 'mesto Skalica (občania s trvalým pobytom na adrese: mesto Skalica)' (okrsok 6) are voters registered without an address, not a rule. 'Skalica súpisné číslo' (okrsok 4) is a whole-part rule that takes only the addresses no street rule selects (the houses without a street). Pod Hájkom, Dr. Clementisa and Mallého are split by the listed numbers; numbers the lists leave out follow the rest of the street (Pod Hájkom) or their side of the street (inferred). Streets the document leaves out: Dr. G. Schaefflera, Marešova, Priemyselná, Rybničná are inferred into okrsok 7 by their neighbours; Pod mestskou zďou and Pod sklepami (2 addresses each, old town) take the nearest okrsok (fill_nearest)."
