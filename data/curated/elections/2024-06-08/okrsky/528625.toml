okrsky_adopted_basis = "No document of 2024-06-08 setting the okrsky was found (okrsok-rules-5204): No okrsky document of the 2024 European Parliament election found: the site has only the announcement of the election and the delegation/voter-pass e-mail (14.3.2024). The 'Určenie volebných okrskov a volebných miestností' of 11.1.2024 is titled for the presidential election 2024 only, so it is not this vote's. These are the okrsky of the vote of 2024-03-23 (2024-prezident), the nearest in time with okrsky of its own that fit: 2 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2024-06-08 → 2024-03-23: 1: 411 → 400, 2: 140 → 133."

