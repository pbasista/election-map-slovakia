obec = "528625"
name = "Nový Ruskov"
okrsky_date = 2024-01-11
okrsky_note = "The document gives each okrsok only its polling station: okrsok 1 Kultúrny dom Veľký Ruskov (Sv. Cyrila a Metoda 154/111, in part Veľký Ruskov), okrsok 2 Kultúrny dom Malý Ruskov (M. R. Štefánika 53/14, in part Malý Ruskov). The okrsky are as many as the parts and each station lies in another part, so each okrsok is given the part of its station; the voters on the roll (400 and 133) fit the parts' address counts (194 and 65). The municipality's 2022 okrsky document names them likewise 'Okrsok č. 1 – Veľký Ruskov', 'Okrsok č. 2 – Malý Ruskov'."
