obec = "528447"
name = "Kráľovský Chlmec"
okrsky_date = 2024-01-16
okrsky_fill = "nearest"
okrsky_note = "Paired ranges of one street (e.g. Hlavná 2-114, 1-43) are read as its even and odd sides. Ibrányiho 1-55 (okrsok 4) overlaps Ibrányiho 18-28 (okrsok 6): 18-28 go to okrsok 6. \"Bez ulice\" in okrsok 2 is the voters registered without an address, given no rule; the register's houses without a street in part Kráľovský Chlmec and the numbers the ranges leave out (gaps in Hlavná, L. Kossutha, Pri Štadióne, Ibrányiho 56-57) take the okrsok of the nearest placed address (fill_nearest). FEJSÉŠ (okrsok 3) is both the street Fejséš and the part Fejséš. \"Pri Štadióne 45 77\" (okrsok 7) read as 45-77; Pri Štadióne 41 and 43 (between 1-39 of okrsok 2 and 45-77 of okrsok 7) go by fill_nearest. Differs from the 2022 document used for the copy: Hlavná 140-156 and 63-97 in okrsok 2, L. Kossutha 71-133, Pri Štadióne 1-39."
okrsky_adopted = 2024-03-23
okrsky_adopted_basis = "No document of 2024-06-08 setting the okrsky was found (okrsok-rules-4729): No okrsky document of the 2024 EP election: the live EP 2024 page and its archived homepage copy (multipage editor-73-522) list the announcement, voter information, delegation e-mail, poster spaces, records and results, but no decision on the okrsky; the president 2024 decision (16.01.2024) is not valid for this vote. These are the okrsky of the vote of 2024-03-23 (2024-prezident), the nearest in time with okrsky of its own that fit: 7 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2024-06-08 → 2024-03-23: 1: 1,137 → 1,119, 2: 1,133 → 1,123, 3: 170 → 170, 4: 936 → 936, 5: 758 → 766, 6: 908 → 905, 7: 890 → 888."

