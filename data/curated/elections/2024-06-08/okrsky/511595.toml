obec = "511595"
name = "Málinec"
okrsky_date = 2024-01-18
okrsky_note = "The document divides by súpisné číslo (1–350 / 351–520) plus the parts Hámor, Dobrý Potok, Ipeľ, Vlčovo in okrsok 1. The numbers are applied to part Málinec; okrsok 2 is the rest (351–520 and anything else, incl. part Chladná Studňa, whose súpisné čísla lie above 350). Hámor is not a part in the register (left out)."
okrsky_adopted = 2024-03-23
okrsky_adopted_basis = "No document of 2024-06-08 setting the okrsky was found (okrsok-rules-5131): The website's media library holds okrsky notices only for 2022, NR SR 2023, presidential 2024 and the 2026 municipal elections. The 2023 referendum and EP 2024 posts (live and archived) carry only the call and the generic voter information; the 2026 referendum post has the call, voter info and results only; no okrsky document for 2017–2020 is on the site or in the Internet Archive (the 2020 category page lists only results). These are the okrsky of the vote of 2024-03-23 (2024-prezident), the nearest in time with okrsky of its own that fit: 2 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2024-06-08 → 2024-03-23: 1: 533 → 533, 2: 557 → 564."

