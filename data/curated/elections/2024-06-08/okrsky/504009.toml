# The okrsky of Sereď of the vote of 2024-03-23, data/curated/elections/2024-03-23/okrsky/504009.toml, standing in, by `ems job reuse`. Its header there:
#   Okrsky of Sereď, transcribed by an AI agent in job okrsok-rules-4032 from the documents below;
#   checked by `ems job ingest` against the address register. The document's
#   text per okrsok, verbatim:
#     okrsok 1: Dolnostredská, Kostolná, Mládežnícka, Mlynárska, Novomestská, Považský breh
#     okrsok 2: Cukrovarská, Kukučínova, Niklová, Školská
#     okrsok 3: D.Štúra, Fándlyho
#     okrsok 4: Amazonská, Bratislavská, Jarná, Južná, Kasárenská, Letná, Malý háj, Nový majer, Pažitná, Poľná, Pribinova, Priemyselná, Trnavská cesta, Vonkajší rad
#     okrsok 5: Garbiarska, Námestie slobody, Parková, Starý most, Šintavská
#     okrsok 6: Dolnomajerská, M.R. Štefánika, Námestie republiky a občania mesta, ktorí majú trvalý pobyt mesto Sereď bez určenia ulice
#     okrsok 7: A. Hlinku, Čepeňská 1211 – 1214, Kúpeľné námestie, Pekárska, Poštová, SNP, Spádová, Vinárska, Záhradná
#     okrsok 8: Jesenského, Komenského, Železničná
#     okrsok 9: Hornomajerská, Hviezdoslavova, Čepeňská - rodinné domy, Čepeňská 3047, 3081, 3735 a 4305, Fraňa Kráľa, Jilemnického, Krásna, Legionárska, Nová, Orechová, Priečna, Rovná, Slnečná, Slnečná II, Šulekovská, Vysoká
#     okrsok 10: Dlhá, Hrnčiarska, Ivana Krasku, Lipová, Ľ.Podjavorinskej, Malá ulička, Pivovarská, Pod hrádzou, Podzámska, Športová, Topoľová, Vojanská
#     okrsok 11: 8.mája, Dolnočepeňská, Družstevná, Kuzmányho, Matičná, Murgašova, Obežná, Sládkovičova, Stromová, Svätoplukova, Štefana Moyzesa
#     okrsok 12: Jasná, Jelšová, Krátka, Krížna, Lúčna, Mierová, Pionierska, Severná, Strednočepeňská, Tehelná, Vážska, Veterná
#     okrsok 13: Hornočepeňská, Konvalinková, Nezábudková, Tulipánová, Púpavová, Levanduľová, Ulica Za kaplnkou
obec = "504009"
name = "Sereď"
okrsky_fill = "nearest"
okrsky_note = "Two-column PDF read column by column. \"Čepeňská 1211 – 1214\" (okrsok 7) are súpisné čísla; the rest of Čepeňská is okrsok 9. Okrsok 6 also holds the residents without a street (not a rule). Streets the document names that the register lacks are left out: Južná, Tulipánová, Púpavová, Levanduľová, Ulica Za kaplnkou. The live file is gone; the Internet Archive copy (linked from the elections page archived 2024-02-09) is used."
okrsky_adopted = 2024-03-23
okrsky_adopted_basis = "No document of 2024-06-08 setting the okrsky was found (okrsok-rules-4657): The only archived capture of the EP 2024 elections page (2024-03-29) links the speaker's decision, voter information and the commissions notice, not yet the okrsky; the new website keeps only the 2026 elections' documents. These are the okrsky of the vote of 2024-03-23 (2024-prezident), the nearest in time with okrsky of its own that fit: 13 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2024-06-08 → 2024-03-23: 1: 1,033 → 1,042, 2: 1,157 → 1,153, 3: 1,064 → 1,059, 4: 1,059 → 1,062, 5: 1,022 → 1,012, 6: 1,259 → 1,251, 7: 1,044 → 1,041, 8: 865 → 873, 9: 1,099 → 1,091, 10: 1,128 → 1,125, 11: 920 → 934, 12: 659 → 647, 13: 423 → 420."
okrsky_date_approximate = "named"
okrsky_date_basis = "The document's heading names the presidential election of 23.03.2024; it states no decision date."

