#     okrsok 2: súpisné č. 701 - 1350
obec = "508055"
name = "Lozorno"
okrsky_date = 2024-01-25
okrsky_note = "The document splits the obec by súpisné číslo only (okrsok 1: 1-700, okrsok 2: 701-1350); the rules apply these to every address of the part Lozorno; súpisné čísla above 1350, if any, go to okrsok 2 as the continuation of its range."
okrsky_adopted = 2024-03-23
okrsky_adopted_basis = "No document of 2024-06-08 setting the okrsky was found (okrsok-rules-4848): No okrsky document for the European Parliament election 2024 (the live Voľby page has no okrsky document for it, only the minutes; none captured in the Internet Archive). The Internet Archive was reachable (after a short outage). Other votes' documents split the obec by súpisné číslo (2018: 1-600 / 601-; 2022-2026: 1-700 / 701-). These are the okrsky of the vote of 2024-03-23 (2024-prezident), the nearest in time with okrsky of its own that fit: 2 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2024-06-08 → 2024-03-23: 1: 1,357 → 1,358, 2: 1,201 → 1,205."

