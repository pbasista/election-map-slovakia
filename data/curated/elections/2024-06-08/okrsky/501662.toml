obec = "501662"
name = "Janíky"
okrsky_date = 2023-06-12
okrsky_note = "The mayor's document (12.06.2023) gives 2 okrsky with their polling stations only: č.01 Obecný dom, Horné Janíky 406; č.02 Kultúrny dom (address written as Horné Janíky č. 43). The municipality's notice for this election (in Hungarian) says the residents of Felsőjányok (Horné Janíky) and Búštelek vote in the Felsőjányok faluház (Obecný dom) and the residents of Alsójányok (Dolné Janíky) in the Alsójányok kultúrház (Kultúrny dom); hence okrsok 1 = Horné Janíky + Búštelek, okrsok 2 = Dolné Janíky, matching the voters (440/321) and the obvody (okrsok 1 in obvod 1 Horné Janíky + Búštelek, okrsok 2 in obvod 2 Dolné Janíky)."
okrsky_adopted = 2023-09-30
okrsky_adopted_basis = "No document of 2024-06-08 setting the okrsky was found (okrsok-rules-5152): Okrsky documents on janiky.sk exist only for the National Council election of 2023 (evt_file 3473 + notice 576sk); the sections for this vote (live and archived) hold no okrsky document, and a 2023 document is not valid for this vote. These are the okrsky of the vote of 2023-09-30 (2023-nrsr), the nearest in time with okrsky of its own that fit: 2 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2024-06-08 → 2023-09-30: 1: 441 → 440, 2: 319 → 321."

