okrsky_note = "Mayor's decision of 30.1.2024 (scanned, read from the page images), posted on the notice board 30.1.2024. Same okrsky as the 2022 copy. Register spellings: Kallsteinova = Kaltsteinova, SNP = Slov. Nár. Povstania; Generála Ludvíka Svobodu is in the register under both Generála Ludvíka Svobodu and Gen. Ludvíka Svobodu. Margity Czobleovej (okrsok 5) is not in the register and is left out. The register's addresses without a street in part Spišská Belá (súpisné numbers only) take the okrsok of the nearest address (fill_nearest); those in part Strážky go to okrsok 5 by an inferred part rule."
