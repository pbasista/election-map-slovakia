obec = "508110"
name = "Most pri Bratislave"
okrsky_date = 2023-06-20
okrsky_fill = "nearest"
okrsky_note = "The letter of 20. 06. 2023 (posted as \"Voľby NR SR 2023\") repeats by mistake the 2020 election day in its first sentence; its title, date and the 3 okrsky are those of the 2023 election. Streets as listed per okrsok. Ľ. Podjavorinskej is not in the address register and is left out; \"Oblasť Zelená voda\" (okrsok 3, a recreation area) is no street and its addresses, Technická (not listed) and addresses without a street go by fill_nearest."
okrsky_adopted = 2023-09-30
okrsky_adopted_basis = "No document of 2024-06-08 setting the okrsky was found (okrsok-rules-4756): The municipality's elections section lists an okrsky announcement only for the NR SR election 2023; none of the EP election 2024 (the 2017 entry has only candidate lists). Internet Archive offline. These are the okrsky of the vote of 2023-09-30 (2023-nrsr), the nearest in time with okrsky of its own that fit: 3 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2024-06-08 → 2023-09-30: 1: 1,147 → 1,096, 2: 1,057 → 1,032, 3: 1,043 → 1,006."

