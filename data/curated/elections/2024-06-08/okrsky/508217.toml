okrsky_adopted_basis = "No document of 2024-06-08 setting the okrsky was found (okrsok-rules-4635): The city's current website keeps only the 2022 and 2026 elections; the Internet Archive kept the old website's okrsky decisions for the presidential and EP elections of 2019, the NR SR election 2020 and the presidential election 2024, but none for this vote. These are the okrsky of the vote of 2024-03-23 (2024-prezident), the nearest in time with okrsky of its own that fit: 17 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2024-06-08 → 2024-03-23: 1: 962 → 980, 2: 1,003 → 989, 3: 837 → 833, 4: 939 → 965, 5: 818 → 813, 6: 157 → 163, 7: 1,049 → 1,059, 8: 918 → 900, 9: 921 → 929, 10: 973 → 975, 11: 1,026 → 1,032, 12: 970 → 975, 13: 984 → 988, 14: 863 → 872, 15: 918 → 923, 16: 948 → 956, 17: 1,094 → 1,110."

