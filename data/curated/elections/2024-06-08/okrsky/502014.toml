name = "Vydrany"
okrsky_date = 2024-01-11
okrsky_fill = "nearest"
okrsky_note = "The mayor's decision of 11.01.2024 sets the 2 okrsky with their polling stations; the list posted on the notice board on 21.2.2024 (scan, read from the page images) gives each okrsok's house (súpisné) numbers; the village has no streets in the register. Houses in neither list take the okrsok of the nearest listed house (fill_nearest). Compared with the list of the National Council election 2023, okrsok 1 adds 54, 561, 713 and drops 717, 721, 742, 746, 750; okrsok 2 adds 615, 634."
okrsky_adopted = 2024-03-23
okrsky_adopted_basis = "No document of 2024-06-08 setting the okrsky was found (okrsok-rules-4962): The mayor's decision of 15.03.2024 for the European Parliament election (Utvorenie volebných okrskov a určenie volebných miestností) sets 2 okrsky but gives only their polling stations (Kultúrny dom č. 534, Budova základných škôl č. 613), not their houses; no house list for this vote is on the website (the presidential election's list was posted 21.2.2024 and taken down 8.3.2024) or in the Internet Archive. The register has one part only, so the okrsky cannot be drawn from the polling stations. These are the okrsky of the vote of 2024-03-23 (2024-prezident), the nearest in time with okrsky of its own that fit: 2 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2024-06-08 → 2024-03-23: 1: 824 → 834, 2: 729 → 734."

