obec = "518018"
name = "Štiavnik"
okrsky_date = 2022-11-09
okrsky_fill = "nearest"
okrsky_note = "Each okrsok is given by súpisné čísla, one numbering across all parts of the obec, so each range is applied in every part. 'A novostavby v tom obvode' (new houses, súpisné above 1055) are placed by fill_nearest."
okrsky_adopted = 2023-01-21
okrsky_adopted_basis = "No document of 2024-06-08 setting the okrsky was found (okrsok-rules-4813): The mayor's announcement (volebne-okrsky-a-zapisovatelky.pdf, 22.02.2024) names only the five polling stations, not which houses vote in each okrsok; with 5 okrsky and 4 parts no rules can be written from it. These are the okrsky of the vote of 2023-01-21 (2023-referendum), the nearest in time with okrsky of its own that fit: 5 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2024-06-08 → 2023-01-21: 1: 731 → 724, 2: 585 → 595, 3: 470 → 472, 4: 962 → 976, 5: 417 → 411."

