obec = "509876"
name = "Nižná"
okrsky_date = 2023-06-26
okrsky_fill = "nearest"
okrsky_note = "Whole streets per okrsok; the register streets the document does not name (Samota Hldočín, Samota-mlyn) and houses without a street are placed by fill_nearest. Okrsok 4 (Úrad obce v Zemianskej Dedine) is the part Zemianská Dedina."
okrsky_adopted = 2023-09-30
okrsky_adopted_basis = "No document of 2024-06-08 setting the okrsky was found (okrsok-rules-4867): The mayor's decision gives only the 4 okrsky's polling stations (MŠ Orličie, Dom kultúry, Základná škola, Úrad obce Zemianska Dedina), not their streets; 3 of the okrsky share the part Nižná, so they cannot be drawn from it. (Decision of 29. februára 2024 for the EP election.). These are the okrsky of the vote of 2023-09-30 (2023-nrsr), the nearest in time with okrsky of its own that fit: 4 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2024-06-08 → 2023-09-30: 1: 954 → 914, 2: 1,042 → 1,018, 3: 1,026 → 978, 4: 189 → 197."

