obec = "523925"
name = "Svit"
okrsky_fill = "nearest"
okrsky_note = "Streets per okrsok with their orientačné numbers as the list gives them (ranges include both parities; numbers in slashes or brackets are added). '0/0 bezdomovci (Hviezdoslavova 32, 33)' means voters registered without an address and gets no rule. fill_nearest covers the register's addresses without a street (most houses in Svit lack a street address) and numbers the list leaves out."
