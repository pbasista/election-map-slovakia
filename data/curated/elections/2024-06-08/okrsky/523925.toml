okrsky_adopted_basis = "No document of 2024-06-08 setting the okrsky was found (okrsok-rules-4699): No document of this vote that assigns streets to okrsky found. The town's notices for 2018 (dokumenty/lbok/20180912-urcenie-okrskov.pdf), 2020 (mini22sk_4), NRSR 2023 (337sk_3) and EP 2024 (file_storage 1432) name only the okrsky and their polling stations; for 2017, EP 2019 and the referendums of 2023 and 2026 neither the live site (svit.sk) nor the Internet Archive's index of svit.sk has an okrsky notice. Street lists were found only for the presidential elections of 2019 and 2024. These are the okrsky of the vote of 2024-03-23 (2024-prezident), the nearest in time with okrsky of its own that fit: 7 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2024-06-08 → 2024-03-23: 1: 841 → 836, 2: 987 → 1,001, 3: 881 → 857, 4: 854 → 865, 5: 905 → 910, 6: 1,080 → 1,078, 7: 732 → 722."
okrsky_date_approximate = "named"
okrsky_date_basis = "The document's heading names the presidential election of 23 March 2024; it states no date of its own."

