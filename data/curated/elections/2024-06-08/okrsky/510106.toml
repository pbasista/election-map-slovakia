obec = "510106"
name = "Trstená"
okrsky_date = 2024-01-29
okrsky_fill = "nearest"
okrsky_note = "Okrsok 1 is given by the súpisné čísla of its apartment blocks and the street Západ. Left out: \"Hornooravská nemocnica s poliklinikou\" (a hospital, not a street), \"Pri Kovalinci\" (not in the address register), \"Trstená 0\" (voters registered without an address). Brezovická cesta (named in no okrsok) and the houses without a street are placed by fill_nearest."
okrsky_adopted = 2024-03-23
okrsky_adopted_basis = "No document of 2024-06-08 setting the okrsky was found (okrsok-rules-4738): Trstená's pages 'Voľby do VÚC 2017' and 'Voľby do Európskeho parlamentu 2024' (trstena.sk) link no okrsky document (the other votes' pages do). The host rate-limits (HTTP 429); the Internet Archive refused connections (offline) during the search. These are the okrsky of the vote of 2024-03-23 (2024-prezident), the nearest in time with okrsky of its own that fit: 6 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2024-06-08 → 2024-03-23: 1: 1,588 → 1,574, 2: 823 → 839, 3: 822 → 817, 4: 600 → 592, 5: 1,428 → 1,393, 6: 252 → 250."

