obec = "515850"
name = "Veľký Krtíš"
okrsky_date = 2022-11-25
okrsky_fill = "nearest"
okrsky_note = "The mayor's decision of 25.11.2022 sets 10 okrsky (the COVID-19 special okrsok 11 is not in it). 'Veľký Krtíš' in okrsok 10 means voters registered without an address (not placed). fill_nearest places the houses without a street (súpisné only), the numbers the document's ranges miss (e.g. Lučenská 44, 50–58, 68, 88–94, 100, P.O.Hviezdoslava 18, 51, 53) and J.A.Komenského, which no okrsok names."
okrsky_adopted = 2023-01-21
okrsky_adopted_basis = "No document of 2024-03-23 setting the okrsky was found (okrsok-rules-4083): No document of the presidential election 2024 found. The Internet Archive captured the city's page only on 2024-01-10 (announcement and voter information only); PDFs captured in January-February 2024 are other notices. The city's Voľby page now shows only the 2026 votes (for the referendum of 2026 only the commissions' zápisnice); the old per-vote pages are gone (404) and the site search finds no okrsky document. The 2017 decision (12 okrsky, 30.08.2017) and the 2022 referendum decision exist but are other votes' documents. These are the okrsky of the vote of 2023-01-21 (2023-referendum), the nearest in time with okrsky of its own that fit: 10 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2024-03-23 → 2023-01-21: 1: 568 → 605, 2: 865 → 917, 3: 823 → 862, 4: 1,005 → 769, 5: 779 → 796, 6: 806 → 1,153, 7: 884 → 913, 8: 837 → 890, 9: 842 → 902, 10: 1,204 → 1,207. Of these, okrsok 6 (806 → 1,153) differs by more than 25% (2024-03-23 → 2023-01-21), allowed in an obec of 10 okrsky: of 10 or more, one okrsok, or 5% of them, may differ while the layout holds."
okrsky_adopted_outliers = [[6, 806, 1153]]

