okrsky_adopted_basis = "No document of 2024-03-23 setting the okrsky was found (okrsok-rules-4465): The site's search and notice board (items 150–821 checked) show okrsky documents only for 2022, referendum 2023, NR SR 2023, EP 2024 and referendum 2026; none for this vote (the presidential 2024 item has only the minutes). Internet Archive (CDX API) refused connections / 503 on retries, so archived pages could not be checked. These are the okrsky of the vote of 2024-06-08 (2024-ep), the nearest in time with okrsky of its own that fit: 2 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2024-03-23 → 2024-06-08: 1: 918 → 915, 2: 981 → 991."

