obec = "526592"
name = "Hrabušice"
okrsky_date = 2024-03-05
okrsky_fill = "nearest"
okrsky_note = "Scanned PDF (Internet Archive capture of 2024-05-18), read from the image. 'oprávnených voličov prihlásených na Obec Hrabušice' (okrsok 1) are voters registered without an address. The register streets Hágy and Sokol, which the document does not name, and the addresses without a street are placed by fill_nearest."
okrsky_adopted = 2024-06-08
okrsky_adopted_basis = "No document of 2024-03-23 setting the okrsky was found (okrsok-rules-4469): The presidential election 2024 page (captured 2024-01-10; now 404) linked only the decision calling the election with voter information; no okrsky document for this vote was captured or is on the notice board. These are the okrsky of the vote of 2024-06-08 (2024-ep), the nearest in time with okrsky of its own that fit: 2 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2024-03-23 → 2024-06-08: 1: 1,004 → 1,041, 2: 854 → 876."

