obec = "508209"
name = "Rovinka"
okrsky_fill = "nearest"
okrsky_note = "Okrsok 1 also holds 'občania s trvalým pobytom na obci, pri jazere' (residents registered only to the municipality; the lake area), which names no register street; fill_nearest places the houses without a street name (súpisné číslo only) by their nearest neighbours. Streets the document names but the register lacks are left out: Levanduľová, Medovková."
okrsky_adopted = 2024-06-08
okrsky_adopted_basis = "No document of 2024-03-23 setting the okrsky was found (okrsok-rules-4066): The municipality's page 'Voľby prezidenta SR 2024' (archived 2024-03-03) links 'Voľby-prezidenta-slovenskej-republiky-2024_okrsky-a-volebné-miestnosti.pdf', but the old website is gone and the Internet Archive has no capture of that PDF (its list of wp-content/uploads/2024/02 has none); the new website obecrovinka.sk carries no copy. These are the okrsky of the vote of 2024-06-08 (2024-ep), the nearest in time with okrsky of its own that fit: 4 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2024-03-23 → 2024-06-08: 1: 1,140 → 1,147, 2: 1,110 → 1,081, 3: 1,030 → 1,028, 4: 1,143 → 1,136."
okrsky_date_approximate = "posted"
okrsky_date_seen = 2024-03-05
okrsky_date_basis = "The municipality's page linking 'Voľby do EÚ 2024 – rozdelenie do okrskov' carries the posting date 5. marca 2024; the document names the EP elections of 8 June 2024 and states no decision date. The PDF is archived as moved to the new website (files/2024-11-15-…). (https://web.archive.org/web/20241014011728/https://obecrovinka.sk/volby-do-europskeho-parlamentu-2024-informacie-pre-volicov-rozdelenie-do-okrskov/)"

