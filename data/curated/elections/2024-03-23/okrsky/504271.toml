okrsky_adopted_basis = "No document of 2024-03-23 setting the okrsky was found (okrsok-rules-4301): The presidential election 2024 page lists only voter information, the call and the e-mail address notice; no okrsky document. The Internet Archive was offline (connection refused, retried with pauses), so archived pages could not be checked. These are the okrsky of the vote of 2024-06-08 (2024-ep), the nearest in time with okrsky of its own that fit: 2 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2024-03-23 → 2024-06-08: 1: 896 → 971, 2: 972 → 956."
