obec = "507555"
name = "Smolenice"
okrsky_date = 2022-11-09
okrsky_fill = "nearest"
okrsky_note = "These okrsky were transcribed for the elections of 2022-10-29 from the municipality's document for the referendum of 2023-01-21: they are the referendum's own. No document of the elections found (neither on the 2022 elections page nor in the archived 2022 uploads/notice board of smolenice.com); the referendum's document. 'Obec Smolenice' in okrsok 1 means voters registered only on the obec (no address). Zajačia lies in the register part Smolenická Nová Ves but the document puts it in okrsok 1; kept as written. Addresses without a street (súpisné only) are placed by fill_nearest."
okrsky_adopted = 2023-01-21
okrsky_adopted_basis = "No document of 2024-03-23 setting the okrsky was found (okrsok-rules-4192): No okrsky document for this vote: the website's elections pages (and their Internet Archive captures, old and new site) list for it only voters' information, voting-card forms, e-mail notices and results. These are the okrsky of the vote of 2023-01-21 (2023-referendum), the nearest in time with okrsky of its own that fit: 3 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2024-03-23 → 2023-01-21: 1: 1,091 → 1,043, 2: 1,056 → 1,093, 3: 549 → 511."

