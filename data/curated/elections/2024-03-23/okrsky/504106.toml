# The okrsky of Trstice of the vote of 2022-10-29, data/curated/elections/2022-10-29/okrsky/504106.toml, standing in, by `ems job reuse`. Its header there:
#   Okrsky of Trstice, transcribed by an AI agent in job okrsok-rules-738 from the documents below;
#   checked by `ems job ingest` against the address register. The document's
#   text per okrsok, verbatim:
#     okrsok 1: Okrsok č. 1 - Obecný úrad, pre voličov s trvalým pobytom od súp. č. 1 – 450
#     okrsok 2: Okrsok č. 2 - Kultúrny dom, pre voličov s trvalým pobytom od súp. č. 451 – 900. Do tohto okrsku boli zaradení i občania, ktorým boli zrušené trvalé pobyty.
#     okrsok 3: Okrsok č. 3 - Základná škola, pre voličov s trvalým pobytom od súp. č. 901 – 1500
obec = "504106"
name = "Trstice"
okrsky_date = 2022-10-06
okrsky_note = "Scanned, undated announcement; date = its posting date on the official notice board ('Vyvesené: 6. 10. 2022', also shown as 06.okt 2022 in the archived 2022 notice-board page, snapshot 20221024203507). The okrsky are ranges of súpisné čísla (1-450, 451-900, 901-1500). Okrsok 2 also holds the citizens whose permanent residence was cancelled (registered only to the obec), which has no address of its own."
okrsky_adopted = 2022-10-29
okrsky_adopted_basis = "No document of 2024-03-23 setting the okrsky was found (okrsok-rules-4198): The mayor's 'Oznámenie o utvorení volebných okrskov v obci Trstice pre voľby prezidenta Slovenskej republiky v roku 2024' (notice-board item 275, dated 30.1.2024, https://www.trstice.sk/e_download.php?file=/data/uredni_deska/obsah275_1.pdf) lists only the 3 okrsky with their polling stations (Okrsok č. 1 Obecný úrad č. 667, č. 2 Komunitný dom č. 1322, č. 3 Základná škola č. 647), no house numbers or territory. Trstice has a single part and no streets (all addresses are súpisné čísla), so a list of polling stations alone cannot be turned into rules (3 okrsky, 1 part). Every item of the official notice board (úradná tabuľa, items 1–444, 2016–2026, incl. the items migrated from the old Joomla site) was listed by id and every election item opened; the Internet Archive (CDX of trstice.sk, old site trstice.sk/sk/aktuality/…) was searched for election pages and radio announcements (hlásenie miestneho rozhlasu) around the vote; the IA was slow and often refused connections, but the pages listed in tried were retrieved. These are the okrsky of the vote of 2022-10-29 (2022), the nearest in time with okrsky of its own that fit: 3 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2024-03-23 → 2022-10-29: 1: 996 → 1,014, 2: 985 → 1,030, 3: 1,225 → 1,203."

