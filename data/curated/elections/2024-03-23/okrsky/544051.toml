obec = "544051"
name = "Vranov nad Topľou"
okrsky_date = 2023-06-23
okrsky_fill = "nearest"
okrsky_note = "The live file is gone (404); the Internet Archive's copy of 2023-07-11 is used, linked from the archived news page 'Volebné okrsky v meste Vranov nad Topľou'. House numbers in the document are súpisné čísla (they match the register's súpisné čísla of these streets). 'Vranov 0' in okrsok 11 means voters registered without a house number and has no address rule. Súpisné čísla of split streets that the document lists in no okrsok (e.g. some on Čemernianska, Mlynská, Staničná, Námestie slobody, Okulka, Dlhá, Juh, Lúčna, M. R. Štefánika, Duklianskych hrdinov, Sídlisko 1.mája) and addresses without a street take the okrsok of the nearest placed address (fill_nearest)."
okrsky_adopted = 2023-09-30
okrsky_adopted_basis = "No document of 2024-03-23 setting the okrsky was found (okrsok-rules-4037): The archived 2024 presidential page (2024-01-15) links only voter information. The vote pages under Úradná tabuľa » Voľby a referendá now hold only results; the announcements published before the vote (on the home-page election sections and news) were removed, and the Internet Archive keeps no okrsky document of this vote (its CDX of vranov.sk download.php files has only the NR SR 2023 okrsky announcement). These are the okrsky of the vote of 2023-09-30 (2023-nrsr), the nearest in time with okrsky of its own that fit: 19 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2024-03-23 → 2023-09-30: 1: 567 → 559, 2: 846 → 847, 3: 947 → 940, 4: 790 → 795, 5: 871 → 868, 6: 1,019 → 1,022, 7: 942 → 948, 8: 848 → 845, 9: 1,108 → 1,082, 10: 934 → 914, 11: 1,475 → 1,442, 12: 838 → 859, 13: 803 → 790, 14: 895 → 876, 15: 782 → 774, 16: 684 → 711, 17: 876 → 860, 18: 646 → 657, 19: 707 → 710."

