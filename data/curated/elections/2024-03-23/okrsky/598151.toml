obec = "598151"
name = "Košice-Sever"
okrsky_date = 2024-02-27
okrsky_fill = "nearest"
okrsky_note = "'MČ Košice - Sever' in okrsok 9 means voters registered only at the district (no address); no rule. Placed by fill_nearest: Námestie Jána Mathého (not named), the even numbers of Letná, Komenského numbers outside 35-73 odd / 44-60 even, Hlinkova, Národná trieda, Slovenskej jednoty, Rampová and Czambelova numbers outside the listed ranges, and addresses without a street. Differs from the 2023 document: Na stráni moved to okrsok 16, Cyklistická to okrsok 17."
okrsky_adopted = 2024-06-08
okrsky_adopted_basis = "No document of 2024-03-23 setting the okrsky was found (okrsok-rules-4008): No okrsky document for the presidential election 2024 found: the archived 'Voľby prezidenta SR' page (2024-06-12) still shows the 2019 documents, the live elections page lists only OVK minutes and e-mail notices, the notice-board archive has no 2024 okrsky item, and the Internet Archive holds the 2023 (21.06.2023) and EP 2024 (27.2.2024) okrsky documents but none for this vote. These are the okrsky of the vote of 2024-06-08 (2024-ep), the nearest in time with okrsky of its own that fit: 18 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2024-03-23 → 2024-06-08: 1: 845 → 838, 2: 1,031 → 1,029, 3: 910 → 882, 4: 879 → 872, 5: 875 → 885, 6: 756 → 761, 7: 731 → 751, 8: 590 → 582, 9: 1,598 → 1,605, 10: 770 → 786, 11: 851 → 830, 12: 927 → 910, 13: 799 → 788, 14: 595 → 593, 15: 644 → 630, 16: 861 → 870, 17: 854 → 857, 18: 834 → 829."

