okrsky_adopted_basis = "No document of 2024-03-23 setting the okrsky was found (okrsok-rules-4333): Found in the Internet Archive: https://web.archive.org/web/20240716040523/https://www.velkeripnany.sk/data/news_files/velkeripnany.sk/76354/urcenie-okrskov.pdf; https://web.archive.org/web/20240229135716/https://www.velkeripnany.sk/novinka/76354/volby-prezidenta-sr (same three okrsky as NR SR 2023: okrsok 1 Topoľčianska, Piešťanská, Obsolovská, Nitrianska, Školská, Malinová, Muškátová, Nábrežná, Mlynská; okrsok 2 Hlohovecká, Kút, Majerská, Mládežnícka, Nová, Poštová, Vieska, Vinohradská, Studená dolina, Orechová; okrsok 3 Hlavná, Okružná, Staničná, Družstevná, Pri zvonici), but the Archive kept refusing connections when the ingest fetched them for over 15 minutes; reported not_found so it can be retried. These are the okrsky of the vote of 2023-09-30 (2023-nrsr), the nearest in time with okrsky of its own that fit: 3 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2024-03-23 → 2023-09-30: 1: 746 → 743, 2: 674 → 679, 3: 277 → 274."
