okrsky_adopted_basis = "No document of 2024-03-23 setting the okrsky was found (okrsok-rules-4375): The presidential election 2024 page links no okrsky document (only results, minutes, forms); the site's full-text search finds okrsky documents of 2022, 2023 (NR SR), the European Parliament 2024 (8 June 2024, file 635) and the 2026 votes, but none for the presidential election. The Internet Archive has no 2023-2024 captures of mestotlmace.sk. The EP 2024 document (same four okrsky as 2022) is another vote's and is not used. These are the okrsky of the vote of 2024-06-08 (2024-ep), the nearest in time with okrsky of its own that fit: 4 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2024-03-23 → 2024-06-08: 1: 791 → 799, 2: 873 → 856, 3: 837 → 826, 4: 489 → 488."

