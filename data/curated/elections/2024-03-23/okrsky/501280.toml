okrsky_note = "The primátor's decision of 24. 1. 2024 sets the 4 okrsky and polling stations for the voľby prezidenta SR of 23 March 2024; the attached table 'Volebné okrsky s vymedzením ich územného obvodu' lists the streets per okrsok (as in 2023, plus Konvalinková ulica in okrsok 3). Aňala, Aňalské záhrady and Sady are parts of the town (part rules). Novozámocká cesta 76-91 and the register streets the table does not name (Fialková ulica, Kúpeľná, Nezábudková ulica, Orgovánová ulica, Priemyselná ulica), as well as the addresses without a street in the part Nesvady, are placed by fill_nearest. 'Bez TP' (voters without a permanent address) in okrsok 1 holds no addresses and is left out. The okrsky copied here from 2022 (rule set of 2022-10-29, job okrsok-rules-659) misread the 2022 table's columns (it put Parková, Piesková 1-16, Slnečná, Športová, Tulipánová, Turecká, Úzka, Vápenná, Vinohradnícka and Potočná, Sady, Sládkovičova, Studená, Taránska, Tatranská, Vodná, Záhradná in okrsok 1, and Kvetná, Lúčna, Malá, nám. 1. mája, Nitriansky rad, Palárikova, Pekárenská, Pettemská, Poľná in okrsok 2); this vote's table, read from the rendered page, has them in okrsky 2 and 3 as given here (the 2022 table, file 302sk_7, has the same columns)."

