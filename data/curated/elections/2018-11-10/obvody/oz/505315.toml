adopted_basis = "No document of 2018-11-10 setting the obvody was found (obvod-rules-068): The archived 2018 elections page links 'Oznámenie o určení počtu poslancov a o utvorení volebných obvodov' (id=1005227) and 'Určenie počtu poslancov a utvorenie volebných obvodov' (id=1045954), but neither PDF was archived and both now return 404; the live elections page starts with 2019. These are the council obvody of the vote of 2022-10-29 (2022), the nearest in time with a rule set of its own of the same obvody and seats. Voters on the roll per obvod (ŠÚ SR), 2018-11-10 → 2022-10-29: 1: 3,906 → 3,815, 2: 3,076 → 2,847, 3: 2,363 → 2,211, 4: 1,435 → 1,374, 5: 1,390 → 1,388, 6: 4,172 → 3,853, 7: 1,856 → 1,812, 8: 376 → 408, 9: 390 → 384."

