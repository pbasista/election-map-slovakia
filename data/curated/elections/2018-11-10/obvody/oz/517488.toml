# The council obvody of Divina of the vote of 2026-10-24, data/curated/elections/2026-10-24/obvody/oz/517488.toml, standing in, by `ems job reuse`. Its header there:
#   Council obvody of Divina (517488), Žilina.
#   Estimated by hand: the documents below give the obvody's names and seats
#   but not which addresses are in which (see the note).
#     obvod 1: Divina – dolný koniec
#     obvod 2: Divina – horný koniec
#     obvod 3: Divina – Lúky
obec = "517488"
name = "Divina"
date = 2026-06-15
fill = "nearest"
note = "Estimated: uznesenie č. 50/2026 and the Oznámenie name obvod 1 'Divina – dolný koniec' (3 seats), 2 'Divina – horný koniec' (4) and 3 'Divina – Lúky' (2) without listing houses. Obvod 3 is the part Lúky. The Divina stream flows south towards the Váh (367 m at the village centre, 531 m up the valley), so the lower end is the south around the centre and the upper end the valley to the north; the part Divina is split at the nearer of two points, in the only gap between the built-up stretches, at the junction with the road to Lúky (291 and 321 addresses with a point; the seats would give about 262 and 350). Addresses without a point take the obvod most of their part got."
estimated = true
adopted = 2026-10-24
adopted_basis = "No document of 2018-11-10 setting the obvody was found (obvod-rules-156): Divina's okrsky 1 and 2 split the part Divina (whose houses have súpisné čísla only) into 'dolný koniec' and 'horný koniec'; the documents the municipality publishes (2022 resolution 40/2022 and announcement, 2026 Oznámenie, divina.sk) name the okrsky/obvody without listing houses, so no rules can be written; no document of this vote listing houses was found on divina.sk. The Internet Archive refused connections (offline) during the search. These are the council obvody of the vote of 2026-10-24 (2026), the nearest in time with a rule set of its own of the same obvody and seats. Voters on the roll per obvod (ŠÚ SR), 2018-11-10 → 2026-10-24: 1: 780 → 743, 2: 880 → 849, 3: 345 → 357."
okrsky_adopted = 2026-10-24
okrsky_adopted_basis = "ŠÚ SR counted one okrsok per obvod in 2018-11-10, so each is drawn as its obvod."

