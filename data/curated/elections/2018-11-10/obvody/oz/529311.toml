obec = "529311"
name = "Bratislava-Podunajské Biskupice"
date = 2022-06-28
fill = "nearest"
note = "Streets per obvod from the announcement. Akvamarínová and Ulica akad. mal. Jozefa Nagya have no addresses in the register and are left out. Unlisted register streets Osada pri tehelni and Štátne lesy, and house numbers of split streets not covered by the listed ranges (e.g. Podzáhradná 7, 9, odd >51; Vrakunská 9-15, 25-27, 33), are placed by fill_nearest."
adopted = 2022-10-29
adopted_basis = "No document of 2018-11-10 setting the obvody was found (obvod-rules-040): The archived 2018 elections page (19 Sept 2018) links 'Volebné obvody a počty poslancov' (files/documents/miestny-urad/volbyobce2018/volobvody.pdf), but the Internet Archive has no capture of that PDF (only later 302/404 responses) and the live file is gone (404). The council's 2018 resolutions are not online (council materials on the website start in 2024). The Internet Archive was intermittently offline during the search. These are the council obvody of the vote of 2022-10-29 (2022), the nearest in time with a rule set of its own of the same obvody and seats. Voters on the roll per obvod (ŠÚ SR), 2018-11-10 → 2022-10-29: 1: 6,967 → 6,939, 2: 8,229 → 7,826, 3: 4,831 → 4,821."

