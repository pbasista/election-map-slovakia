okrsky_date_basis = "The mayor's document of 02.08.2018 names the elections ('pre voľby do orgánov samosprávy mesta v roku 2018'); it sets the obvody, each of which is one okrsok in the Statistical Office's results, so it is the only 2018 source of the okrsky's streets; no separate okrsky notice of 2018 with its own date was found."

