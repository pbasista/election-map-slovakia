okrsky_note = "The town's 2018 elections page (live) links only the obvody document and the results; no mayor's okrsky notice of 2018 is on the website, and the Internet Archive has no capture of the site between July and November 2018 with election material. Each of the 8 obvody holds exactly one okrsok in the Statistical Office's results (obvod n = okrsok n), so the obvody document gives each okrsok's streets; every okrsok is alone in its obvod and has rules []. The 2019 okrsky document (download_file_f.php?id=1082825) lists the same 8 areas as okrsky 1-8."
