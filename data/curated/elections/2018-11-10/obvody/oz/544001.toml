date = 2018-08-02
note = "Scanned collection of the 2018 resolutions, read by OCR (no diacritics in the OCR; names restored). Resolution 21/2018 (3+3 seats) was not adopted (3 for, 3 against); resolution 22/2018 of 2.8.2018 was adopted: obvod Zemplínsky Klečenov 3 seats, obvod Úpor 4 seats, 7 in total. The resolution lists Klečenov first, but the candidate lists and results number the 4-seat obvod (Úpor) 1 and the 3-seat obvod (Zemplínsky Klečenov) 2, so they are numbered by their seats here. Each obvod is a whole part of the municipality."
okrsky_date = 2022-06-22
