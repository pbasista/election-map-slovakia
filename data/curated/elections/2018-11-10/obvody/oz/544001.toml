okrsky_adopted_basis = "No document of 2018-11-10 setting the okrsky was found (okrsok-rules-5917): No 2018 okrsky document found. The live site lists elections only from 2022 on and its notice-board archive starts in 2021. The Internet Archive keeps the 2018 site (homepage 2018-08-31, notices of September 2018 such as the e-mail address for commission delegations and the candidate list, and every PDF of /files/2018-*), but none of them is the mayor's utvorenie volebných okrskov for 10 November 2018; the elections page /-volby as archived in 2019 holds only 2019 files. The council minutes of 2.8.2018 (scan, OCR) and resolution 22/2018 set only the two obvody (Úpor 4 seats, Zemplínsky Klečenov 3 seats) and do not mention okrsky. Okrsky documents exist only from 2023 on (files/2023-01-11-…, 2024-01-18-… Určenie volebných okrskov a volebných miestností). Web search found nothing else. These are the okrsky of the vote of 2022-10-29 (2022), the nearest in time with okrsky of its own that fit: 2 okrsky. The voters on the roll per okrsok are not known for both votes, so whether the layout changed is not known either."

