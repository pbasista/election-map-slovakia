obec = "524140"
name = "Prešov"
date = 2018-06-27
fill = "nearest"
note = "The resolution lists each obvod's streets, splitting some streets by house numbers or 'časť ulice' (Pražská); the rules are written from the 2018 okrsky decision (Príloha č. 1: streets and orientačné numbers per okrsok), grouped into obvody by the okrsky the Statistical Office counted in each obvod (1–19, 20–26, 27–35, 36–46, 47–56, 57–67, 68–80), which gives the same streets per obvod with exact house-number splits. A street within one obvod is a whole-street rule; a street split between obvody gets the listed numbers in the obvody where the okrsky list them and the rest goes to the obvod whose okrsok names it without numbers. Streets not in the register are left out (Koceľova, Pribinova, Rastislavova, Gorazdova, Jána Lazoríka, Michala Bosáka, Tarjányiho, Pražská, Liesková, Gerlachovská, Račia, Riečna, Rybníčky, Priemyselná, Ku Škáre, Remscheidská, Dlhá, Tulipánová); unlisted numbers and addresses without a street are placed by fill_nearest."
okrsky_date = 2018-09-03
okrsky_fill = "nearest"
okrsky_note = "The mayor's decision of 3 September 2018 (scanned pages 1-3) creates 80 okrsky and names their polling stations; its Príloha č. 1 (text pages) lists each okrsok's streets with orientačné numbers where a street is split. A street named in one okrsok is a whole-street rule; a street split between okrsky gets the listed numbers, and an okrsok naming it without numbers takes the rest. Heading lines that wrap the polling station's address (Pod Kalváriou 36, hrdinov 3, Sládkovičova 4, 49) are not streets. 'bez ulice' in okrsok 38 = voters registered without an address: no rule. 'Štefana Náhalku' is the register's Ulica Štefana Náhalku. Streets the document names but the register lacks are left out: Koceľova, Pribinova, Rastislavova, Gorazdova, Jána Lazoríka, Michala Bosáka, Tarjányiho, Pražská, Liesková, Gerlachovská, Račia, Riečna, Rybníčky, Priemyselná, Ku Škáre, Remscheidská, Dlhá, Tulipánová. fill_nearest places streets the document does not name (Hrušková, Slivková, Na Tablách), unlisted house numbers of split streets, and addresses without a street."

