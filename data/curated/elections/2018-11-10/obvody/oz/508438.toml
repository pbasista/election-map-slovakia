name = "Banská Bystrica"
date = 2018-06-26
fill = "nearest"
note = "The announcement (council resolution 1107/2018-MsZ of 26 June 2018) names each obvod's city parts (e.g. '2 - Východ: Majer, Senica, Šalková, Uhlisko'); the mayor's okrsky document of 10 Sept 2018 lists the okrsky with their streets under each volebný obvod (okrsky 1-11 in obvod 1, 12-17 in 2, 18-39 in 3, 40-45 in 4, 46-62 in 5, 63-70 in 6, 71-77 in 7, as ŠÚ SR counts them), so the rules are the streets of those okrsky; streets split between obvody (Rudlovská cesta, Nám. Ľ. Štúra, Sládkovičova) keep the okrsky document's house numbers, read as even/odd sides where it gives an even and an odd range. 'Banská Bystrica' among the streets of okrsok 7 means voters with no address and has no rule. fill_nearest places the houses without a street name (other than the súpisné numbers the document lists), the register's streets the document does not name (Borová ulica, Gerberová ulica, Havranské, Kremeňová ulica, Ladislava Hudeca, Priemyselná ulica, Prvosienková ulica, Strieborné námestie, Technická ulica, Vajanského námestie, Zvončeková ulica), and house numbers outside the listed ranges (Rudlovská cesta, Nám. Ľ. Štúra, Sládkovičova)."
okrsky_date = 2018-09-10
okrsky_fill = "nearest"
okrsky_note = "Transcribed from the mayor's document of 10 Sept 2018 (posted 11 Sept 2018), which lists the okrsky with their streets under each volebný obvod (okrsky 1-11 obvod 1, 12-17 obvod 2, 18-39 obvod 3, 40-45 obvod 4, 46-62 obvod 5, 63-70 obvod 6, 71-77 obvod 7); a scan, text read from the page images (the '14.' before 'Sládkovičova 50-96' is okrsok 74 misread). Where a street is split by an even-number range and an odd-number range (e.g. 'Trieda SNP 2-38, 7-31'), or where a plain reading of two okrsky's ranges would overlap, the ranges are read as even/odd sides (parity); other ranges are read as all numbers. 'Banská Bystrica' among the streets of okrsok 7 means voters registered with no address, so it has no rule. fill_nearest is set: it places the houses without a street name (súpisné numbers only, other than those the document lists), the register's streets the document does not name (Borová ulica, Gerberová ulica, Havranské, Kremeňová ulica, Ladislava Hudeca, Priemyselná ulica, Prvosienková ulica, Strieborné námestie, Technická ulica, Vajanského námestie, Zvončeková ulica), and the house numbers the document's ranges leave out (notably most of Zvolenská cesta, of which the document lists only 2, 4, 5, 6, 19, 33 and 71, and numbers outside the listed ranges on Sládkovičova, Tatranská, Rudohorská, Javornícka, Poľná, Nám. Ľ. Štúra, Bernolákova, 9.mája, Rudlovská cesta, Mládežnícka, Tulská and Moskovská), each within its obvod."

