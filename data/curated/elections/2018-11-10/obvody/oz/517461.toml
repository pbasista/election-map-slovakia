obec = "517461"
name = "Bytča"
date = 2018-06-22
note = "Uznesenie MsZ č. 103/2018 of 22.6.2018 (archived 13.7.2018; the old website is gone) defines the obvody by mestské časti; all register streets lie in part Veľká Bytča. The PDF's text layer drops the letter Š in \"Pšurnovice\". The draft resolution on the 2018 elections board (Urcenie_poctu_poslancov.pdf) names the same obvody by katastrálne územia (obvod 6: k.ú. Mikšová)."
okrsky_date = 2018-07-12
okrsky_fill = "nearest"
okrsky_note = "Written differently from the register: Dukelská = Dukelska, Hlinícka = Hlinická, Kvetná = Kvetna (spelling variants); E.Lániho, S.Bíroša, Fr.Kráľa, E.Geromettu, Krag.Martýrov, Námestie SR are abbreviations. Janka Kráľa numbers outside 1–9 and 11–17 (e.g. 10) and the register's addresses without a street in part Veľká Bytča are placed by fill_nearest. The PDF was captured by the Internet Archive on 2018-11-23; it is dated 12.7.2018 and names the 2018 municipal elections."
okrsky_supplemented = 2023-09-30
okrsky_supplemented_from = "election"
okrsky_supplement_basis = "The 2018 document does not name the newer streets Broskyňová, Čerešňová, Jabloňová, Marhuľová, Morušová and Višňová ulica (a new development by Brezová/Gaštanová); the 2023 rule set (document of 13.6.2023, otherwise the same okrsky street for street) puts them in okrsok 5 with Brezová and Gaštanová, copied here."

