obec = "507032"
name = "Hlohovec"
date = 2018-06-28
fill = "nearest"
note = "Obvody and seats per resolution no. 56 of 28 June 2018 and its annex. 'Hlohovec 0 (Mesto Hlohovec)' in obvod 1 means voters registered without an address (residence cancelled), not register houses. Vajanského is not in the register (left out). The lokality by súpisné číslo (Svinná hora 4208, Obora 4213 in obvod 3; Ivarnoky 3859, Štrkovka 3867 in obvod 6) and the other addresses without a street (parts Hlohovec, Šulekovo) are placed by fill_nearest, since a part+súpisné rule would also catch street houses with the same súpisné číslo; also Nábrežie A. Hlinku numbers the resolution assigns to no obvod."
supplemented = 2022-10-29
supplemented_from = "election"
supplement_basis = "The 2018 resolution names neither Šumperská ulica nor Teplá izba, streets of the register (Šumperská a new street near Kukučínova/Nitrianska, Teplá izba near Palárikova); the rule set of the elections of 29 October 2022 has both in obvod 2, which holds all their neighbouring streets in 2018 too, so they are taken from it."
okrsky_date = 2018-09-11
okrsky_fill = "nearest"
okrsky_note = "'Mesto Hlohovec' in okrsok 1 means voters whose permanent residence was cancelled (registered without an address), not register houses. Vajanského (okrsok 2) is not in the address register (left out). The lokality given by súpisné číslo (Svinná hora 4208, Obora 4213, Ivarnoky 3859, Štrkovka 3867) and the other register addresses without a street (parts Hlohovec, Šulekovo), and the numbers of split streets the document lists in no okrsok (Vinohradská 5, 7, 12; Závalie and Podzámska numbers not listed), are placed by fill_nearest, since a part+súpisné rule would also catch street houses with the same súpisné číslo."
okrsky_supplemented = 2020-02-29
okrsky_supplemented_from = "election"
okrsky_supplement_basis = "The 2018 document names neither Teplá izba nor Šumperská ulica, streets of the register in obvod 2; the rule set of 2020-02-29 (document of 29. 11. 2019 with otherwise the same okrsky) puts Teplá izba in okrsok 4 and Šumperská ulica in okrsok 5, so they are taken from it."

