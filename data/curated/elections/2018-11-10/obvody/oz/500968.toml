obec = "500968"
name = "Zlaté Moravce"
date = 2018-06-20
fill = "nearest"
note = "Krížna and Poštová are named but not in the register, left out. Hviezdoslavova (2-30 / 32-86/D) and 1. mája are split as written; their other numbers and the houses without a street in part Zlaté Moravce are placed by fill_nearest."
supplemented = 2022-10-29
supplemented_from = "election"
supplement_basis = "The 2018 announcement does not name Metodova ulica, Vionská ulica and Športová ulica (register streets, probably newer); they are placed in obvod 1 as the 2022 rule set has them."
okrsky_date = 2018-09-06
okrsky_fill = "nearest"
okrsky_note = "The document (mayor's notice of 06.09.2018, linked from the city's 'Komunálne voľby 2018' page) groups the okrsky under obvody I–IV: 1–4, 5–9, 10, 11. Krížna and Poštová are named but not in the register, left out. 'Voliči s trvalým pobytom Zlaté Moravce sú zapísaní vo volebnom okrsku č. 2' are voters registered without an address (not placed). 1.mája and Hviezdoslavova are split between obvody by house numbers; within each obvod each lies in a single okrsok, so whole-street rules (the obvod limits them). Houses without a street in part Zlaté Moravce are placed by fill_nearest. The PDF text layer garbles a few letters (Cajkovského, Soltésovej); text given as the document reads."
okrsky_supplemented = 2022-10-29
okrsky_supplemented_from = "election"
okrsky_supplement_basis = "The 2018 document does not name Metodova ulica, Vionská ulica and Športová ulica (register streets, probably newer); they are placed as the 2022 rule set has them (Metodova in okrsok 3, Vionská and Športová in okrsok 4), all within obvod 1 as the 2018 obvod rules put them."

