obec = "500011"
name = "Nitra"
date = 2018-08-06
note = "Resolution 237/2018-MZ of 06.08.2018 sets 31 councillors in 7 obvody defined by mestské časti (transcribed as part rules, as for 2022); the announcement of 07.08.2018 lists each obvod's streets, with Novozámocká and other split streets by house numbers, consistent with the parts."
okrsky_date = 2018-07-17
okrsky_fill = "nearest"
okrsky_note = "The mayor's Informácia of 17. 7. 2018 lists, per obvod, each okrsok's streets and, for streets split between okrsky, their house numbers (read as orientačné čísla). Streets named in one okrsok only are taken whole. Streets the document names that the register lacks (left out): Cyrilo-metodské námestie, Griesbachova, Hrabová, Ku Skládke, Mandľová, Námestie Kráľovnej pokoja, Pod Dubinou, Pri dríku, Prvosienková, Račia ulica, Starý rínok, Ulica Ľuda Ondrejova, Vlašská, Štrková. Register streets the document does not name (Cez panské, Fabiánova ulica, Hájová ulica, Horné lúky, Ipeľská ulica, Medovková ulica, Pod šípkami, Pri Brezovom háji, Repíková ulica, Slnečnicová ulica, Turzova ulica, Ulica Jána Gustiniho, Ulica poľovníkov, Ulica sv. Huberta), house numbers of split streets not listed, and addresses without a street go by fill_nearest. Okrsok 6 also lists 'bez ulice' (residents without an address), left out of its rules. Number groups the PDF's text layer splits ('5 2', '23 3') are rejoined."

