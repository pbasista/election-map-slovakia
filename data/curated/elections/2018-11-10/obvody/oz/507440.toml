name = "Piešťany"
date_approximate = "named"
date_basis = "the announcement, signed by the mayor on 16.07.2018, names the elections of 10 November 2018; it gives the resolution MsZ č. 109/2018 A/ without its date"
fill = "nearest"
note = "The announcement (16.07.2018) of resolution MsZ č. 109/2018 A/ lists each obvod's okrsky with their streets; it does not state the resolution's date, so date is left out. Two versions were posted; the later one (…obvodov1.pdf) adds Bratislavská 177 to okrsok 22, used here. Streets split between okrsky of the same obvod (A. Hlinku, Valová, Štefánikova, Pod Párovcami, Teplická, Žilinská cesta in obvod 1; Mateja Bela, Adama Trajana in obvod 2) are whole in their obvod; Bratislavská and Vrbovská cesta are split: obvod 1 has the numbers of okrsky 13 and 14, obvod 2 the rest. Names not in the register left out: Nový dvor, Kúpeľný ostrov, Starohradská, Mariánske námestie, Nábr. Kolomana Fodora, Jantárová ulica, Ulica J. Sibelia. fill_nearest places the addresses without a street (Kocurice and elsewhere). Lietavská, in none of the okrsky listed, is placed by fill_nearest."
okrsky_date = 2018-07-16
okrsky_fill = "nearest"
okrsky_note = "The city posted no separate okrsky list for 2018 (the 2018 election files 147sk_44–57 in the Internet Archive are other notices); the mayor's announcement of 16.07.2018 on the obvody (later version …obvodov1.pdf, which adds Bratislavská 177 to okrsok 22) lists every okrsok with its polling station and streets. A. Hlinku is split by súpisné numbers as listed (by: supisne); its other houses and the addresses without a street are placed by fill_nearest. Valová č. 835/6 is orientačné 6. Vrbovská cesta odd: 1–115 in okrsok 14, \"od 115\" in okrsok 26, so 115 stays in 14 and 26 takes 117 on. Bratislavská and Vrbovská cesta numbers the document gives no okrsok (e.g. Bratislavská above 177 or 175) and Lietavská (in no okrsok) are placed by fill_nearest. Names in the document not in the address register, left out: Nový dvor, Kúpeľný ostrov, Starohradská, Mariánske námestie, Nábr. Kolomana Fodora, Jantárová ulica, Ulica J. Sibelia."

