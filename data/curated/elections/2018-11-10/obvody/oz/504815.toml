fill = "nearest"
note = "The document gives each obvod's okrsky with their streets and seats (4, 4, 3, 4, 4). Mallého is split by sides: odd numbers in okrsok 5 (obvod 3), even in okrsok 7 (obvod 4). 'Skalica súpisné číslo' (okrsok 4) is a whole-part rule in obvod 2 taking only addresses no street rule selects; 'mesto Skalica (občania s trvalým pobytom na adrese: mesto Skalica)' are voters without an address, not a rule. Streets the document leaves out: Dr. G. Schaefflera, Marešova, Priemyselná, Rybničná inferred into obvod 4 (by D. Jurkoviča, Bernolákova, Čulenova, okrsok 7); Pod mestskou zďou and Pod sklepami (2 addresses each) take the nearest obvod (fill_nearest)."
supplemented = 2022-10-29
supplemented_from = "election"
supplement_basis = "The 2018 document leaves out Antona Srholca (new street by Janšákova) and Pri pálenici; the rule set of 2022 places them in okrsok 4 and okrsok 11, which here are in obvod 2 and obvod 5."
okrsky_fill = "nearest"
okrsky_note = "The document lists each obvod's okrsky with their streets and house numbers. Split streets: Pod Hájkom (okrsok 3: 3-35, 40; okrsok 4: 36, 36A; its unlisted numbers follow the rest of the street in okrsok 3, inferred); Dr. Clementisa (odd okrsok 5, even okrsok 6, given by side so its unlisted numbers follow their side); Mallého lies by sides in two obvody (odd obvod 3, even obvod 4), so within each obvod it is a whole street (okrsok 5, okrsok 7). 'Skalica súpisné číslo' (okrsok 4) is a part rule taking the addresses of obvod 2 no street rule selects (this includes Pod mestskou zďou and Pod sklepami, 2 addresses each, which the obvody place in obvod 2). 'mesto Skalica (občania s trvalým pobytom na adrese: mesto Skalica)' (okrsok 6) are voters without an address, not a rule. Streets the document leaves out: Dr. G. Schaefflera, Marešova, Priemyselná, Rybničná inferred into okrsok 7 by their neighbours. 'Pplk.Pľjušťa' is the register's 'Pplk. Pľjušťa'. Houses without a street in the other obvody take the nearest address's okrsok (fill_nearest)."
okrsky_date_approximate = "named"
okrsky_date_basis = "The document's heading names the elections of the town council (Mestské zastupiteľstvo v Skalici) for the term 2018–2022; it is undated."
okrsky_supplemented = 2022-10-29
okrsky_supplemented_from = "election"
okrsky_supplement_basis = "The 2018 document leaves out Antona Srholca (a new street by Janšákova) and Pri pálenici; the okrsky of 29 October 2022, whose lists otherwise repeat the 2018 ones word for word, put Antona Srholca in okrsok 4 and Pri pálenici in okrsok 11, which here lie in obvod 2 and obvod 5."

