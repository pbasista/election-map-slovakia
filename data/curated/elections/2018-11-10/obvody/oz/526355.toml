obec = "526355"
name = "Spišská Nová Ves"
date = 2018-07-19
fill = "nearest"
note = "Scanned announcement, read from the page images. Kysucká, named in obvod 1, has no addresses in the register and is left out. The voters registered only to the town (\"Spišská Nová Ves\" in obvod 2) are not register addresses and get no rule. Odorínska cesta and Šafárikovo námestie, named neither here nor in the 2022 rules, are placed by fill_nearest."
supplemented = 2022-10-29
supplemented_from = "election"
supplement_basis = "The 2018 announcement does not name the register streets Červená, Gerlachovská ulica, Jarková, Jazdecká cesta, Košiarna, Smreková (newer streets in the south) and Kasárenská ulica; they are placed as in the 2022 rule set (data/curated/elections/2022-10-29/obvody/oz/526355.toml): the first six in obvod 1, Kasárenská ulica in obvod 2."
okrsky_date = 2018-09-10
okrsky_note = "The mayor's announcement of 10. 09. 2018 (scan, read from the page images) lists okrsky 1-17 under 'Volebný obvod č. 1' and 18-29 under 'Volebný obvod č. 2' with their polling stations only; it names no streets. The 2018 elections page (archived 2018-10-23) links no other okrsky document (no list of streets per okrsok, unlike 2017); the only other okrsok-specific document is the notice for voters registered only to the town ('Spišská Nová Ves, 0/0'), who vote in okrsok 21 (obvod 2). So obvody are given without okrsky rules."

