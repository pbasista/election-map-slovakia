note = "Scanned resolution read from the page image. Obvody are súpisné-číslo ranges for the whole obec; the resolution does not name the parts, so each range is applied in both parts (Jarovnice, Močidľany), the súpisné čísla being numbered across the obec. Obvod 2 is given as 325- (minus the four numbers of obvod 1) so higher numbers also fall there."
okrsky_date = 2018-07-25
okrsky_note = "Council resolution 370/2018 of 25.7.2018 (point 3): 'Počet volebných okrskov – 3 okrsky: 1 okrsok vo volebnom obvode č. 1, 2 okrsky vo volebnom obvode č. 2'; the minutes of that session repeat it (obvod 1: 1270 voters, one okrsok; obvod 2: 2168 voters, two okrsky) but do not say which súpisné čísla of obvod 2 vote in which okrsok. The resolution does not number the okrsky; they are numbered in the order of the obvody (okrsok 1 in obvod 1, okrsky 2 and 3 in obvod 2), as the municipality's later okrsky document numbers them from the lowest súpisné čísla up. No 2018 document of the mayor creating the okrsky (with súpisné čísla) is on the 2018 elections page (archived 2019-04-30) or among the archived /files/ of 2018; the Internet Archive has no capture of the site from mid-2018. The only okrsky document found is that of 19.11.2019 for the NR SR election of 2020 (okrsok 1: s.č. 0–309, 2: 310–419, 3: 420–600), which does not match the 2018 obvody (obvod 1 = s.č. 0–324 plus 425, 428, 481, 542) and so was not used. Hence obvody without okrsky rules."

