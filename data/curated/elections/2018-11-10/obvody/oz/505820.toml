obec = "505820"
name = "Trenčín"
date = 2018-07-04
fill = "nearest"
note = "Council resolution 1509 of 04.07.2018 (25 councillors in 4 obvody) as the mayor's announcement of 02.08.2018 quotes it. Jaselská, Šťastná and Ku Štvrtiam (obvod 1) have no addresses in the register and are left out. Addresses without a street (about 490, in every part, e.g. Kubrica, Biskupice) are placed by fill_nearest, as are any house numbers the document leaves out. Sadová is listed under Stred mesta (obvod 1) here although the okrsky document puts it in okrsok 41; the obvody document is followed."
supplemented = 2022-10-29
supplemented_from = "election"
supplement_basis = "The 2018 announcement does not name Odevná (Zámostie), Tramínová, Rizlingová, Rulandská (Zlatovce), Na pažiti, Pavla Ondráška and Pod privádzačom (Záblatie), streets built or named after it; the rule set of the 2022 election (data/curated/elections/2022-10-29/obvody/oz/505820.toml) puts each of them, as a whole street, in obvod 4 (VMČ Západ: Zámostie, Zlatovce, Istebník, Orechové, Záblatie), where the 2018 document puts all the surrounding streets."
okrsky_date = 2018-08-15
okrsky_fill = "nearest"
okrsky_note = "The mayor's decision č. 8/2018 (effective 15.08.2018, the only date it states) forms the okrsky; the separate list 'Volebné okrsky a volebné miestnosti' for 10 November 2018 is identical and also groups the okrsky into obvody 1 (1-11), 2 (12-25), 3 (26-41), 4 (42-50). Same okrsky as the documents of 2017 and 2019. Named in the document but without addresses in the register, left out: Jaselská, Ku štvrtiam, Šťastná. Spelling: 'Pod driením' is the register's Pod drienim, 'Brančíková' is Brančikova, 'Hanzlíkovská' is Hanzlikovská. Contradiction: the document lists Sadová in okrsok 41 (obvod 3), but the obvody resolution puts it in obvod 1; following the obvod it is placed in okrsok 1 (inferred). Addresses without a street (about 490, in every part) and house numbers outside every range the document gives for a split street are placed by fill_nearest."
okrsky_supplemented = 2023-09-30
okrsky_supplemented_from = "election"
okrsky_supplement_basis = "The 2018 document does not name Mládežnícka (Sihoť I), Odevná (Zámostie), Tramínová, Rizlingová, Rulandská (Zlatovce), Pavla Ondráška, Na pažiti and Pod privádzačom (Záblatie), streets built or named later. The rule set of the National Council election of 2023-09-30 (data/curated/elections/2023-09-30/okrsky/505820.toml, from the city's document for that vote) places each as a whole street: Mládežnícka with Nábrežná, Švermova, Študentská, Komenského, Smetanova (its okrsok 26, here okrsok 26); Odevná with Veľkomoravská, Zlatovská (its 42, here 42); Tramínová, Rizlingová, Rulandská with Hlavná, Hroznová, Jána Prháčka (its 49, here okrsok 49, all of Zlatovce); Pavla Ondráška, Na pažiti, Pod privádzačom with Záblatská, Dolné Pažite (its 51, here okrsok 50, Záblatie). Each is copied into the okrsok that holds those same neighbouring streets here."

