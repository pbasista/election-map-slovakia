name = "Bernolákovo"
date = 2018-08-13
fill = "nearest"
note = "Scanned announcement read from the rendered pages. Streets named but not in the register (left out): Plemenárska, Roľnícka, Senecká cesta, Snežienková, Čučoriedková. 'Záhradkárska osada Tabaková / Trnavská' (obvod 3, garden colonies without a street) and other houses without a street are placed by fill_nearest, as are numbers of the split streets outside the ranges."
supplemented = 2019-01-29
supplemented_from = "document"
supplement_basis = "The 2018 announcement splits Poštová, Trnavská and Hlboká between obvody by street crossings (Dukelská, Senecká cesta, Hlavná, the railway crossing, Nevädzová), which the address register cannot express; the mayor's okrsky document of 29.1.2019 gives the same split by orientačné ranges (okrsky 1-2 = obvod 1, 3-4 = obvod 2, 5-6 = obvod 3), taken for these three streets. (https://data.moderneobce.sk/data/uploads/bernolakovo.sk/volebne-okrsky_(1).pdf)"
okrsky_date = 2018-09-07
okrsky_fill = "nearest"
okrsky_note = "Scanned notice of the mayor of 7.9.2018, read from the rendered pages (archived copy; the 2018 elections page on the current site links the item 'Utvorenie-volebnych-okrskov-a-urcenie-volebnych-miestnosti' to a wrong file, the notice on accepting candidate lists). The split streets Poštová (okrsky 1 and 4), Trnavská (2 and 5) and Hlboká (4 and 5) each lie in one okrsok within each obvod, so they are given as whole streets: the obvody already split them. Streets the notice names but the register lacks (left out): Plemenárska, Senecká cesta, Roľnícka, Snežienková, Čučoriedková. 'Gaštanová' is the register's 'Gaštanová alej', 'Vršky' its 'Vŕšky'. Ampérova (3 addresses, obvod 2), the garden colonies (Záhradkárska osada Tabaková / Trnavská, okrsok 5) and other houses without a street take the okrsok of the nearest address in their obvod (fill_nearest)."
okrsky_supplemented = 2022-03-19
okrsky_supplemented_from = "election"
okrsky_supplement_basis = "The 2018 notice does not name the streets Hurbanova, Brečtanová, Hornádska, Hronská, Ipeľská, Kysucká, Moravská, Oravská, Vážska (obvod 1) and Kondrótova (obvod 3); the okrsky of 19 March 2022, whose okrsky 1, 2 and 5 repeat the 2018 lists, put Hurbanova in okrsok 1, the other eight in okrsok 2 and Kondrótova in okrsok 5; these streets are taken from that rule set."

