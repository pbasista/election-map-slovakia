okrsky_adopted_basis = "No document of 2018-11-10 setting the okrsky was found (okrsok-rules-5846): No 2018 okrsky document found. www.roznava.sk refused every connection from here (connection refused on ports 80 and 443, repeatedly over ~30 minutes), so the live site could only be seen through the Internet Archive (itself intermittently offline with HTTP 503). The city's 2018 elections page, archived on 2018-08-30, 2018-09-12, 2018-10-13, 2018-11-14 and 2018-12-16, links only the obvody notice of 03.08.2018, the voter information (generic), minimum signatures, delegation of members, candidate lists, poster rules and the decision of the NR SR chairman, but no notice of the okrsky and polling stations; no such PDF appears among the archived uploads of 2018-2019. The city chronicle of 2018 (archived copy truncated) is not the okrsky decision. The 2017 (VÚC) and 2020/2023 documents list okrsky that the obvody notice of 2018 groups in the same way (obvod 1: okrsky 1-7, 9, 17, 18; obvod 2: 8, 10-16), but the prompt allows another vote's document only to fill in a 2018 one. These are the okrsky of the vote of 2022-10-29 (2022), the nearest in time with okrsky of its own that fit: 18 okrsky, those ŠÚ SR counted in each council obvod (nearer, not taken: 2017-11-04: okrsky of the whole obec, the council then elected in several obvody; 2020-02-29: okrsky of the whole obec, the council then elected in several obvody). Voters on the roll per okrsok (ŠÚ SR), 2018-11-10 → 2022-10-29: 1: 998 → 965, 2: 1,020 → 980, 3: 780 → 763, 4: 904 → 887, 5: 807 → 716, 6: 890 → 848, 7: 946 → 902, 8: 732 → 694, 9: 1,014 → 1,024, 10: 672 → 662, 11: 649 → 643, 12: 1,057 → 1,029, 13: 921 → 858, 14: 1,027 → 986, 15: 910 → 859, 16: 881 → 843, 17: 463 → 470, 18: 400 → 403."

