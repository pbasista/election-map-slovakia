obec = "503011"
name = "Nové Zámky"
date = 2018-08-01
fill = "nearest"
note = "Resolution 336/010818 of 1 August 2018 sets 7 obvody and their seats; the \"Informácia\" lists each obvod's okrsky with their streets (the same streets as the 2018 okrsky document). Streets the documents name but the address register lacks, left out: Sihoť sv. Alžbety, Veľká Ragoňa, Zemiansky priechod. Okrsok 22 (obvod 5) also takes \"občania s trvalým pobytom Nové Zámky\" (voters without an address), no rule. fill_nearest places: Bratislavská cesta and Ulica Piritovská alej (not named; the 2022 rule set does not place Piritovská alej either); house numbers outside the documents' ranges: Cyrilometódska 1, 3, 13; G. Bethlena 2, 2A, 2B, 2C, 2D, 54, 56, 58, 73, 79; M. R. Štefánika 82; Nábrežná 1, 24, 50, 52, 54, 107 (G. Bethlena \"2E-50 (párne)\" read as 2E and 4–50); and the addresses without a street name."
supplemented = 2022-10-29
supplemented_from = "election"
supplement_basis = "The 2018 documents do not name the newer streets Bazová ulica (obvod 1), Mesačná ulica (obvod 1), Medová ulica (obvod 1), Ulica pod hviezdami (obvod 1), Ulica západ slnka (obvod 1), Športová (obvod 4); they are placed as the rule set of the municipal elections of 29 October 2022 (same 7 obvody of the same okrsky) places them, copied exactly. The register now has addresses on these streets (mostly new houses) that the 2018 documents predate."
okrsky_date = 2018-08-14
okrsky_fill = "nearest"
okrsky_note = "The mayor's notice of 14 August 2018 (signed by the first deputy mayor) lists the 37 okrsky with their streets; the obvody Informácia lists the same streets per okrsok. Streets the document names but the address register lacks, left out: Sihoť sv. Alžbety, Veľká Ragoňa, Zemiansky priechod. Okrsok 22 also takes \"občania s trvalým pobytom Nové Zámky\" (voters without an address), which needs no rule. fill_nearest places streets the document does not name: Bratislavská cesta, Ulica Piritovská alej (named in the 2019 document in okrsok 5, not in the 2018 one); house numbers outside the document's ranges: Cyrilometódska 1, 3, 13; G. Bethlena 2, 2A-2D, 54, 56, 58, 73, 79 (\"2E-50 (párne)\" read as 2E and 4-50); M. R. Štefánika 82; Nábrežná 1, 24, 50, 52, 54, 107; the addresses without a street name. Spelling differences: \"J Simora\", \"Nám hrdinov\", \"Björnsonova\", \"F. Rákocziho\" are the register's J. Simora, Nám. hrdinov, Bjőrnsonova, F. Rákócziho."
okrsky_supplemented = 2022-10-29
okrsky_supplemented_from = "election"
okrsky_supplement_basis = "The 2018 document does not name the newer streets Bazová ulica (okrsok 3), Mesačná ulica (okrsok 1), Medová ulica, Ulica pod hviezdami, Ulica západ slnka (okrsok 5) and Športová (okrsok 23); the register now has (mostly new) addresses on them that the document predates. They are placed as the rule set of the municipal elections of 29 October 2022 places them (same obvody of the same okrsky; the 2022 okrsky documents put them in okrsky 3, 1, 5 and 23 as numbered in 2018), copied exactly."

