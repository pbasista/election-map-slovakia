obec = "501433"
name = "Dunajská Streda"
date = 2017-05-16
fill = "nearest"
note = "The resolution's announcement lists each obvod by its okrsky with their streets and blocks (súpisné). Split streets within an obvod use the listed súpisné numbers; Jilemnického: súp. 203–338 in obvod 4 (okrsok 18), the rest (201) in obvod 2. Ulica Gyulu Szabóa: section in part Dunajská Streda in obvod 3 (okrsok 11) and part Malé Blahovo in obvod 3 too. 'Mesto – Dunajská Streda' means voters registered only to the town. Register streets not named (newer streets) and addresses without a street are placed by fill_nearest."
okrsky_date = 2018-09-06
okrsky_fill = "nearest"
okrsky_note = "Transcribed from the mayor's okrsky document of 06.09.2018: streets per okrsok, blocks of flats by súpisné číslo; okrsky 1-4 obvod 1, 5-10 obvod 2, 11-14 obvod 3, 15-18 obvod 4. Streets split between okrsky (námestie SNP, Boriny, Jantárová cesta, Nová Ves, Námestie priateľstva, Jilemnického) take the listed súpisné numbers (by supisne) and the rest of the street goes to the okrsok listing its family houses or the main part (SNP 193–198, Boriny 1360–1364, Jantárová cesta without numbers, Nová Ves 2220–2441, Námestie priateľstva 2164–5090, Jilemnického 201). Nová Ves 5995 is listed in both okrsok 15 and 16: placed in 15. 'Mesto – Dunajská Streda' means voters registered only to the town (no addresses). Hlavná: the document names 'Hlavná ulica bytové domy 46, 47' only in okrsok 6, the whole street is placed there. Ulica kráľa Mateja is not in the register. Streets the document does not name (Bažantia, Cesta siedmich vojvodcov, Ulica vojvodcu Árpáda, Berehovská, Sentianska, Námestie Jehudu Aszáda, Ulica logistického parku and other newer streets) and addresses without a street take the okrsok of the nearest placed address in their obvod (fill_nearest); Bažantia, Cesta siedmich vojvodcov and Ulica vojvodcu Árpáda, which the 2019 document puts in okrsok 17 (obvod 4), are in obvod 2 under the 2018 obvod rules."
okrsky_supplemented = 2019-03-16
okrsky_supplemented_from = "election"
okrsky_supplement_basis = "The 2018 document does not name Ulica Lászlóa Telekiho, Ulica Hermana Steinera and Ulica Györgya Tölgyessyho (new streets); the document of the presidential election of 2019-03-16, otherwise the same okrsky, puts Telekiho in okrsok 5, Steinera and Tölgyessyho in okrsok 16; these rules are copied from that election's rule set in this repository."

