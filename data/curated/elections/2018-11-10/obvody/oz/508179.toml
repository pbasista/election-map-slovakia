note = "MsZ resolution 136/2018 of 16.08.2018 sets the 5 obvody with 7, 2, 7, 7, 2 seats 'v zmysle prílohy č. 1'; the annex (in the council material, signed by the mayor 16.8.2018, and published on the city's 2018 elections page stary.pezinok.sk/?yggid=1019) lists each obvod's okrsky with their streets. This replaces the earlier transcription from the city's older standing page (?yggid=671), which differs: the 2018 document adds Svätojurská ulica (obvod 1), Obchodná (obvod 4), and Najmarova, Jamnických, Žarnovických, dona Sandtnera 9-37 odd and 16-26 even (obvod 3; Jamnických no longer in obvod 5), and writes Natalin dvor for Talihov dvor. Ranges: Bratislavská 1-87 odd, 2-102 even (obvod 1), 108-130 even (obvod 4); L. Novomeského 36-64 and 1-27 odd, 2-34 even (obvod 3); dona Sandtnera 1, 2, 5, 7 (obvod 2). Talihov dvor is placed in obvod 1 by inference (the register has no Natalin dvor, named in its place). Names the register lacks, left out: Fortna, Ulica gen. Goliana, Sasinkova, SOŠ PZ, Panský chodník, Vinohradnícka cesta. 'Pezinok' / 'občania, ktorí majú trvalý pobyt iba Pezinok' (obvod 1) means voters without an address. fill_nearest covers the addresses without a street, Ulica Alfonza Šilhára (not named) and numbers of split streets the document does not list (Bratislavská, dona Sandtnera)."
okrsky_date = 2018-08-16
okrsky_fill = "nearest"
okrsky_note = "The city's 2018 elections page (stary.pezinok.sk/?yggid=1019, linked from the news of 24.07.2018) publishes the obvody and okrsky that MsZ resolution 136/2018 of 16.08.2018 set (annex 1, signed by the mayor 16.8.2018 in the council material). Ranges: L. Novomeského 36-64 (okrsok 8) as a plain range, 1-27 odd and 2-34 even (okrsok 12); dona Sandtnera 9-37 odd and 16-26 even (okrsok 8); Bratislavská 1-87 odd, 2-102 even (okrsok 1), 108-130 even (okrsok 17). 'Natalin dvor' is not in the register: Talihov dvor is placed in okrsok 3 by inference (see rule). Names the document gives but the register lacks, left out: Fortna, Ulica gen. Goliana, Sasinkova, SOŠ PZ, Panský chodník, Vinohradnícka cesta. 'Pezinok' residents without an address (okrsok 1) need no rule. fill_nearest places the addresses without a street and the numbers of split streets the document does not list. Spellings: Jilemického, Šafarikova, Šancova, Saulakova, M.R. Štefánika, Št.Polkorába, Okružná are the register's Jilemnického, Šafárikova, Šancová, Saulaková, M. R. Štefánika, Št. Polkorába, Okružná ulica."

