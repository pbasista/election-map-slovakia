obec = "514462"
name = "Rimavská Sobota"
date = 2018-06-26
fill = "nearest"
note = "The announcement (10.7.2018) of the council's resolution č. 70/2018 of 26.6.2018: 21 councillors in 5 obvody (4, 4, 4, 6, 3). 'bez ulice' at the head of obvod 1 means citizens registered only at the town (no house): no rule. Names the document lists that the address register lacks are left out: Valachova pustatina (1), Šamarianka, Šári pustatina, Šütó pustatina (2), Mestská záhrada, Amfiteáter (3). fill_nearest places the register's addresses without a street in the part Rimavská Sobota (spread over the town; the other parts are placed by the part rules) and house numbers of split streets the document leaves out (Kirejevská 24 and other unlisted numbers). Salvova 1, Jánošíkova 1-3 and the odd and high numbers of P. Hostinského are placed by inferred rules by their neighbours (as in the city's okrsky list of 06.09.2018, download_file_f.php?id=1013924)."
okrsky_date = 2018-09-06
okrsky_fill = "nearest"
okrsky_note = "The city's 'Zoznam ulíc a okrskov' for the municipal elections of 10.11.2018 (dated 06.09.2018, linked from the city's page 'Komunálne voľby 2018'); no separate decision of the mayor is published, so `date` is the list's date. The okrsky of each obvod follow from the obvody (obvod 1: okrsky 1-6, 2: 7-11, 3: 12-16, 4: 17-22, 5: 23-27). Numbers under a street are orientačné, under 'časť obce' súpisné. 'bez ulice' (okrsok 1) means voters registered only at the town: no rule. Šamarianka (okrsok 9) is not in the address register and is left out. The list puts 'časť obce Nižná Pokoradz 86' in okrsok 3 (obvod 1), but the obvody put the whole part Nižná Pokoradz in obvod 2: a contradiction, the obvod is followed (okrsok 10). Streets the list numbers but puts in only one okrsok of their obvod (Jánošíkova, Kirejevská, P. Hostinského) are taken whole within the obvod. fill_nearest places what the list leaves out: Salvova (1 address), Cintorínska and Potravinárska (obvod 2, not in the list), unlisted numbers of split streets (Rožňavská, Malohontská, Sídlisko Rimava, Športová, J. Bodona, L. Svobodu, L. Novomeského, Rybárska, Dr. V. Clementisa) and the houses without a street in the part Rimavská Sobota."
okrsky_supplemented = 2019-01-28
okrsky_supplemented_from = "document"
okrsky_supplement_basis = "The 2018 list does not name Tormáš (one house, súpisné číslo 4428, obvod 1); the city's list of 28.01.2019 for the presidential election puts 'časť obce Rimavská Sobota … 4428' in okrsok 3 with the same streets as the 2018 list's okrsok 3, so that house is placed in okrsok 3 from it. (https://web.archive.org/web/20190920140045/https://www.rimavskasobota.sk/download_file_f.php?id=1082430)"

