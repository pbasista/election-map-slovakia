okrsky_adopted_basis = "No document of 2018-11-10 setting the okrsky was found (okrsok-rules-5873): No 2018 okrsky document found. The council resolution 956/2018-27/XXXII of 28.6.2018 sets only the 2 obvody (Veľký Šariš, Kanaš), not the okrsky or their streets. The city's 2018 elections page as archived on 6.9.2018 lists eight items (zapisovateľ MVK, e-mail for delegating, počet obyvateľov, plagáty, informácie pre voliča/kandidátov/strany, počet poslancov, obvody, rozsah funkcie primátora) but none on the okrsky; its item pages and attachments were never archived, and on the live site the 2018 items have expired (old URLs redirect to the module's current list). The archived notice board of 11.9.2018 has no okrsky notice, and no velkysaris.sk PDF of mid-2018 is in the Internet Archive. The Internet Archive was intermittently offline (HTTP 503) during the search. The later documents (2023: 6 okrsky, Kanaš alone in okrsok 6) differ from 2018's 5 okrsky, so they were not used. These are the okrsky of the vote of 2022-10-29 (2022), the nearest in time with okrsky of its own that fit: 5 okrsky, those ŠÚ SR counted in each council obvod. Voters on the roll per okrsok (ŠÚ SR), 2018-11-10 → 2022-10-29: 1: 965 → 1,062, 2: 941 → 1,017, 3: 949 → 1,052, 4: 970 → 972, 5: 893 → 1,035."

