supplement_basis = "The 2018 announcement names no Tatranská, Viničná or Ulica Štefana Zamkovského (streets with 5, 2 and 1 addresses in the register, probably named or built after 2018). The rule set of the 2022 elections in this repository places Tatranská ulica and Viničná ulica in obvod 1 (okrsky 2 and 3) and Ulica Štefana Zamkovského in obvod 2 (okrsok 9); those three street rules are copied from it."
okrsky_date = 2018-09-07
okrsky_fill = "nearest"
okrsky_note = "The deputy mayor's decision of 07. 09. 2018 (linked from the city's page of elections before 2022 under the 2018 municipal elections, citing the decision 203/2018 calling them) lists the streets of the 11 okrsky; its okrsky are word for word those of 2017. Register names carry \"ulica\"/\"Ulica\", which the document leaves out. \"Za sedriou\" = register \"Za sédriou\" (accent left out); \"M. R. Štefánika\" = Ulica Milana Rastislava Štefánika; \"Nový dvor\" = Nový Dvor. \"Levoča s. č. …\" are houses without a street in part Levoča, by súpisné číslo. The other addresses of part Levoča without a street (houses numbered only by súpisné číslo, which the document does not list) are placed by fill_nearest. Tatranská, Viničná and Ulica Štefana Zamkovského are not in the 2018 document; placed from the 2022 document (supplement). The obvody announcement also names Levoča s. č. 2001 in obvod 2, which the okrsky document does not; it is placed by fill_nearest."
okrsky_supplemented = 2022-11-09
okrsky_supplemented_from = "document"
okrsky_supplement_basis = "The 2018 document names no Tatranská, Viničná or Ulica Štefana Zamkovského (streets with 5, 2 and 1 addresses in today's register, apparently named after it). The mayor's okrsky document of 09. 11. 2022 (referendum 2023), which otherwise repeats these okrsky, places Tatranská in okrsok 2, Viničná in okrsok 3 and Ulica Štefana Zamkovského in okrsok 9; those three street rules are taken from it. (https://www.levoca.sk/wp-content/uploads/2022/11/Referendum-2023-utvorenie-volebnych-okrskov-a-urcenie-volebnych-miestnosti-09.11.2022.pdf) (https://www.levoca.sk/wp-content/uploads/2022/11/Referendum-2023-utvorenie-volebnych-okrskov-a-urcenie-volebnych-miestnosti-09.11.2022.pdf)"

