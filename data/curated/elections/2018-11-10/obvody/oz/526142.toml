okrsky_note = "The city's 'Zoznam ulíc a okrskov' for the 2018 municipal elections (dated 20.08.2018, linked from the city's page 'Voľby do orgánov samosprávy obcí v roku 2018') lists the streets of each okrsok by obvod. Split streets (Komenského, A. Hlinku, Terézie Vansovej, Tomášikova, Okružná, Štúrova, Prvého slovenského gymnázia) are listed as súpisné/orientačné pairs; the rules use the orientačné numbers. 'časť obce Revúca' with numbers = houses without a street in part Revúca, by súpisné číslo. 'bez ulice' (okrsky 4 and 7) means voters registered without an address and is left out of the rules. fill_nearest places the numbers of split streets the list does not name and the other houses without a street in part Revúca. The date is the date printed on the list (no separate decision of the mayor was found). The Internet Archive's CDX API did not answer."
