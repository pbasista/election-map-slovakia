obec = "517674"
name = "Kolárovice"
date = 2026-06-01
note = "Document is a clearly legible scan (announcement signed 26. 06. 2026) citing uznesenie č. 142/2026 of 01. 06. 2026. Obvod 1 'centrum obce + (lokality Potoky a Boldov)' is transcribed as the register part Kolárovice; Potoky and Boldov are not separate parts in the register, so they are taken to lie within part Kolárovice. Obvod 2 lists the other six parts exactly."
adopted = 2026-10-24
adopted_basis = "No document of 2018-11-10 setting the obvody was found (obvod-rules-143): The council's resolution no. 188 of 11.6.2018 (Uznesenie OZ 11.6.2018, and the minutes) only sets 2 obvody with 6 and 3 seats, without saying which parts of the municipality form them; the 2018 elections page and okrsky document are no longer on the website (it shows only the 2026 elections). The Internet Archive refused every connection (CDX and snapshots) for over 30 minutes, so no archived pages of earlier votes could be checked. These are the council obvody of the vote of 2026-10-24 (2026), the nearest in time with a rule set of its own of the same obvody and seats. The voters on the roll per obvod are not known for both votes, so whether the layout changed is not known either."
okrsky_note = "Undated okrsky announcement signed by the mayor; okrsok 1 = obvod 1 (centrum), okrsok 2 = obvod 2 (same six parts)."
okrsky_adopted = 2026-10-24
okrsky_adopted_basis = "The okrsky of the same rule set: 2 okrsky, those ŠÚ SR counted in each obvod. The voters on the roll per okrsok are not known for both votes, so whether the layout changed is not known either."

