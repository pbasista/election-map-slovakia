obec = "529338"
name = "Bratislava-Vrakuňa"
date = 2018-06-26
fill = "nearest"
note = "Resolution 397/XXIV/2018 sets the obvody by okrsky (1-3, 4-11, 12-13, 14-19); the streets per obvod and okrsok are in the council material of the same meeting (bod 7). Streets the document names but the register lacks are left out: Hlohová, Pod gaštanmi, Amarelková, Horcová, Irisová, Kalinová, Magnóliová, Maková, Osiková, Palinová. \"občania s trvalým pobytom mestská časť Bratislava-Vrakuňa\" means voters without an address, not a rule. Placed by fill_nearest: Gagarinova 29 (a Ružinov street not named), Rajecká numbers beyond the listed ranges (wholly obvod 2 anyway), and register addresses without a street (gardens, súpisné only). Skoroceľová = Skorocelová, Tymianová = Tymiánová, Kaméliova = Kaméliová (spelling)."
supplemented = 2022-10-29
supplemented_from = "election"
supplement_basis = "Medovková (24 addresses), which the 2018 material does not name, is placed in obvod 1 as the rule set of 2022-10-29 has it; the 2018 lists predate or forgot the street."
okrsky_date = 2018-06-26
okrsky_fill = "nearest"
okrsky_note = "The okrsky per obvod with their streets are in the council material of 26.06.2018 (bod 7, 'Rozdelenie okrskov'), the obvody set by resolution 397/XXIV/2018 of the same day; voter counts after each street are left out of the text. Streets named but missing from the register are left out: Hlohová, Pod gaštanmi, Amarelková, Horcová, Irisová, Kalinová, Magnóliová, Maková, Osiková, Palinová. 'Obyvatelia s trvalým pobytom v MČ Vrakuňa' (okrsok 1) are voters without an address, not a rule. Skoroceľová = Skorocelová, Tymianová = Tymiánová (spelling). Placed by fill_nearest: Medovková (not named), Rajecká numbers beyond the listed ranges go by parity, Gagarinova 29 and register addresses without a street (gardens, súpisné only). Okrsky 10/11: the material (pdf pp. 89-90) gives okrsok 10 'Rajecká 1-15 nepár' with 1,001 voters and okrsok 11 'Rajecká 2-42 párne' with 826, ŠÚ SR counts 452 and 1,340. Its voter figures contradict its own street lists: the register has 8 odd Rajecká addresses (1-15, four blocks of two entrances, súp. 8690-8693) against 23 even ones (2-44, súp. 8681-8687 with three entrances each, 14145, 8847, 20080), so the odd side cannot hold more voters than the even side; a swapped label does not fit either (it would give okrsok 10, with 452 voters, the 23 even addresses). The street lists fit ŠÚ SR's 452:1,340 (8:23 addresses), the 2019 and 2020 documents keep the same split (okrsok 10 odd 1-15, 11 even 2-40; ŠÚ SR 452/1,320 and 437/1,274), and the 2022 rule set has Rajecká odd 1-15 with Poľnohospodárska and even 2-40 alone. So the okrsky follow the material's street lists (10 odd, 11 even) and its per-okrsok voter figures are taken as a counting error."

