okrsky_note = "Numbers after the slash (súpisné/orientačné) are the orientačné numbers used in the rules. 9. mája, Podhorská, Železničná (rodinné domy and the listed blocks), Školská, Fučíkova, 13. januára and Slobody each lie in a single okrsok, so they are whole-street rules; only Sklárska is split by its blocks (1-24 and 36-49 okrsok 4, 25-33 okrsok 2, 52-62 okrsok 5). 'obyvatelia s trvalým pobytom: Poltár - mesto' (okrsok 2) means voters registered without an address, no rule. fill_nearest places Sklárska numbers the document does not list (34-35, 50-51, 63-) and the houses without a street in the part Poltár. Okrsky 6 (Zelené) and 7 (Slaná Lehota) are each a whole obvod."
