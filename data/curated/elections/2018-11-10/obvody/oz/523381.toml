obec = "523381"
name = "Poprad"
date = 2018-06-14
fill = "nearest"
note = "The resolution (Uznesenie č. 173/2018 of the council session of 14 June 2018, signed 19 June 2018, archived on the 2018 elections page) names neighbourhoods and parts. The city's \"Zoznam ulíc a okrskov\" of 04.09.2018 for the same elections groups its okrsky under \"Obvod č. 1 Centrum, sídlisko Západ, Veľká, Spišská Sobota, Matejovce, Stráže\" (okrsky 1-19) and \"Obvod č. 2 Juh I, II, III, V, VI, Kvetnica\" (okrsky 20-40), as ŠÚ SR counts them; obvod 1 takes the parts Veľká, Spišská Sobota, Matejovce, Stráže pod Tatrami and the Poprad-part streets of okrsky 1-19, obvod 2 the part Kvetnica and the streets of okrsky 20-27. No street is split between the two obvody. fill_nearest places Halatova and the Poprad-part addresses of Svitská cesta and Teplická cesta (not in the list), and addresses without a street in the Poprad part."
supplemented = 2022-10-29
supplemented_from = "election"
supplement_basis = "The only archived copy of the 2018 okrsky list is cut off after 1 MiB (page 10, okrsok 27), so the streets of okrsky 28-40 (all in obvod 2, which the resolution calls JUH I-VI and Kvetnica) are missing; the streets of obvod 2 of the 2022 rule set that the 2018 copy does not reach (Tajovského, Svätoplukova, Moyzesova, Jarná, Záborského, Jesenná, MPČĽ, Dlhé hony, Novomeského, Suchoňova, Tolstého, Zimná, Podjavorinskej, Šoltésovej, Rastislavova, Letná, Uherova, Dubová, Jedľová) are taken from it into obvod 2."
okrsky_date = 2018-09-04
okrsky_fill = "nearest"
okrsky_note = "The city's scanned \"Zoznam ulíc a okrskov pre Voľby do orgánov samosprávy obcí v roku 2018\" (Dátum konania 10.11.2018; each page dated 04.09.2018), archived 2019-08-20; its pages are CCITT images (inverted, rotated), read visually; each okrsok's per-street voter counts add up to the printed totals. The archived copy is truncated at 1 MiB after page 11 (okrsok 33); okrsky 34-40 are supplemented from the 2022 list (see supplement). The list gives each okrsok its streets, with the house numbers (orientačné) where a street is split between okrsky; Rázusova \"súp. č. 3824\" is a súpisné rule. \"bez ulice\" in okrsok 1 means voters registered only to the town: no rule. Spelling: \"29.augusta\", \"J.Tranovského\", \"Slov.Nár.Povstania\", \"Ul.mládeže\" are the register's abbreviated names; \"Boženy Nemcovej\" is Boženy Němcovej. fill_nearest places the streets the list does not name (Halatova, Potočná, Priemyselná ulica, Radničná, Richarda Bekessa, Scholtzova, Sobotská, Svitská cesta, Teplická cesta, Trhová; some likely newer than 2018), house numbers of split streets the list does not name (houses without voters), and addresses without a street."
okrsky_supplemented = 2022-11-09
okrsky_supplemented_from = "document"
okrsky_supplement_basis = "The only copy of the city's scanned 2018 list, captured by the Internet Archive on 2019-08-20, is cut off at 1 MiB: it holds pages 1-11 with okrsky 1-33 and lacks the pages of okrsky 34-40 (all in obvod 2: the rest of JUH and Kvetnica). The streets of obvod 2 that the 2018 pages do not reach (Jesenná, MPČĽ, Dlhé hony, Novomeského, Suchoňova, Tolstého, Zimná, Podjavorinskej, Šoltésovej, Rastislavova, Letná, Uherova, Dubová, Jedľová, Kvetnica) are placed in okrsky 34-40 as the city's list of 09.11.2022 for the referendum of 21.01.2023 places them (copied from this repository's rule set of 2023-01-21); okrsky 1-33 keep the 2018 list's streets and houses, which match that later list in structure. (https://www.poprad.sk/download.dat?id=21CFE0F179D4489EBFB2D856B4AA639D-DCF7416821E12F7A7878FB00A3C0122A)"

