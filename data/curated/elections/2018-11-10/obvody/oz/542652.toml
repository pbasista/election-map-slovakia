obec = "542652"
name = "Bánovce nad Bebravou"
date = 2018-06-20
fill = "nearest"
note = "The city's 2018 elections page states the council's resolution č. 712 of 20.06.2018 (9 obvody, seats 2-3-2-2-6-1-1-1-1) and links the page describing the obvody by their okrsky and streets (that page itself shows 'Aktualizované 19.1.2015', i.e. the composition was kept from 2014). The text per obvod is the linked page's. Hrežďovská (register part Dolné Ozorovce) is split by súpisné čísla as the document lists them (obvod 7: 1109, 1178, 1206, 1207, 1222, 1229, 1242, 1281, 1293; obvod 8: 797-802, 1090, 1223); its other houses, Duklianska (1 address, named in no obvod) and addresses without a street take the obvod of the nearest listed address (fill_nearest). 'Vodná nádrž' (obvod 4) is not in the register. 'Malé Chlievany' among the streets of obvod 7 is the part of that name."
okrsky_fill = "nearest"
okrsky_note = "The okrsky page lists the streets of each okrsok, okrsky 1-18 in obvody 1-9 as the resolution. Register names differ from the document: 'Partizánska cesta' is the register's Partizánska (the only Partizánska street, obvod 2); 'Na vŕštek' is Na Vrštek (diacritics); 'Matice slovenskej' is the register's 'Matice  slovenskej' (double space). 'Vodná nádrž' (okrsok 7) is not in the register and is left out. Duklianska (1 address, the school with the polling station of okrsky 3 and 4, named in no okrsok), Hrežďovská houses and addresses without a street in the multi-okrsok obvody take the okrsok of the nearest placed address (fill_nearest)."
okrsky_date_approximate = "archived"
okrsky_date_seen = 2018-09-29
okrsky_date_basis = "The Internet Archive captured the city's 2018 elections page on 2018-09-29 linking the page 'Popis volebných obvodov, okrskov a poslancov ... pre voľby do orgánov samosprávy obcí v roku 2018' (the okrsky page, captured 2018-11-16, itself shows 'Aktualizované 19.1.2015'); no mayor's decision date is stated. (https://web.archive.org/web/20180929101834/http://www.banovce.sk:80/volby-do-organov-samospravy-mesta-2018.phtml?id5=31565)"

