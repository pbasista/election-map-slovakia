okrsky_date_approximate = "named"
okrsky_date_basis = "The section 'Utvorenie volebných okrskov a určenie volebných miestností' on the city's page of the 2022 elections creates the okrsky 'pre voľby do orgánov samosprávy obcí a voľby do orgánov samosprávnych krajov' under the decision of the Speaker of the National Council No. 209 of 8.6.2022 (the one calling the elections of 29 October 2022, which the same page names). The section states no date or posting date of its own: the page item says 'Zverejnené 14.6.2022, Aktualizované 30.10.2022', and in its reverse-chronological sections the okrsky sit above the delegation notice dated 4. 8. 2022. The Internet Archive has no snapshot of the page (the homepage snapshot of 2022-10-01 only links it)."

