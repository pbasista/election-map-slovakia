obec = "529320"
name = "Bratislava-Ružinov"
date = 2018-06-26
fill = "nearest"
note = "The announcement (resolution 638/XXXVIII/2018 of 26. 6. 2018, announced 1. 8. 2018) names the 9 obvody and their seats; its annex (a scan) lists per obvod its okrsky and per okrsok the streets and house numbers. The scan was read by OCR and checked against the pages; it repeats the district's list of okrsky and streets of the 2017 regional elections word for word except Vavrínová 4A added in VO 35, so the text is given with the diacritics of that list. A street whose listed numbers all lie in one obvod is taken whole; a street split between obvody by its listed numbers. Duplicates kept in the first obvod: Prievozská 10 (VO 9 and VO 20), Prešovská 40C (VO 17 and VO 50). Entries \"Ružinov <číslo>\"/\"Záhrada <číslo>\" and Vlčie hrdlo/Na piesku numbers above 1000 are súpisné čísla of buildings without a street; only those identifying one register address without a street are rules. \"Nové záhrady (osada)\" (VO 44) is no rule; \"Hrušovská/Strojnícka (bez čísla)\" is the one Hrušovská address. Palkovičova \"1 6, 18\" (VO 14) read as 16, 18; Bulharská \"16\" (VO 68). fill_nearest places unlisted house numbers of split streets, streets the annex omits and other addresses without a street. Plátenícka, Súkenícka, Trnavská, Černicová are the register's Plátennícka, Súkennícka, Trnavská cesta, Stará Černicová."
okrsky_date = 2018-08-01
okrsky_fill = "nearest"
okrsky_note = "The annex of the mayor's announcement of 1 August 2018 (a scan), \"Zoznam volebných obvodov, okrskov, miestností a ulíc v MČ Bratislava-Ružinov\", lists per obvod its okrsky and per okrsok the streets and house numbers. It repeats the district's list of the 2017 regional elections word for word except Vavrínová 4A added in VO 35 (Vavrínová is whole in VO 35 anyway), so the rules are those of that list as transcribed for 2017, and the text is given with that list's diacritics. date is the day of the mayor's announcement whose annex sets out the okrsky. The list gives each okrsok its streets with house numbers; a street the list places in one okrsok only is taken whole, a street split among okrsky by its listed numbers. fill_nearest places what the list does not name: unlisted house numbers of split streets, streets the list omits and addresses without a street not listed by súpisné číslo. Duplicates in the list kept in the first okrsok only: Prievozská 10 (VO 9 and 20, kept in 9), Prešovská 40C (VO 17 and 50, kept in 17), Kašmírska 9 (VO 68 and 70, kept in 68), all within one obvod each. \"Ružinov <číslo>\" and \"Záhrada <číslo>\" entries and Vlčie hrdlo/Na piesku numbers above 1000 are súpisné čísla of buildings without a street; only those that identify one register address without a street are written as rules (part Bratislava-Ružinov by súpisné číslo), the rest (a súpisné číslo also borne by a street address, or unknown to the register) is left to fill_nearest. \"Nové záhrady (osada)\" (VO 44) is not a rule (the Nové záhrady streets are listed by number in VO 45 and 46). The PDF's text layer splits some numbers, read from the page as: Palkovičova \"1 6, 18\" (VO 14) = 16, 18; Bulharská \"1 6\" (VO 68) = 16; Kovorobotnícka \"12-1 4\" = 12-14; Za tehelňou \"5 - 1 0\" = 5-10; Krásna \"35 37\" = 35, 37. Written names Plátenícka, Súkenícka, Trnavská, Černicová are the register's Plátennícka, Súkennícka, Trnavská cesta, Stará Černicová."

