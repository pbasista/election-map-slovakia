# The okrsky of Imeľ of the vote of 2022-10-29, data/curated/elections/2022-10-29/okrsky/501166.toml, standing in, by `ems job reuse`. Its header there:
#   Okrsky of Imeľ, transcribed by an AI agent in job okrsok-rules-845 from the documents below;
#   checked by `ems job ingest` against the address register. The document's
#   text per okrsok, verbatim:
#     okrsok 1: Čísla domov od : 1 - 450
#     okrsok 2: Čísla domov od:451 - 960
obec = "501166"
name = "Imeľ"
okrsky_date = 2022-11-10
okrsky_fill = "nearest"
okrsky_note = "no document of the elections found (the 2022 elections page, live and archived, lists no okrsky document); the referendum's document 'Volebné okrsky v obci Imeľ' (undated DOCX; the referendum page states 'Zverejnené 10.11.2022', used as date). Okrsky by house numbers (čísla domov, read as súpisné): 1–450 and 451–960; fill_nearest places any house numbered above 960."
okrsky_adopted = 2022-10-29
okrsky_adopted_basis = "No document of 2018-11-10 setting the okrsky was found (okrsok-rules-778): No okrsky document for the municipal elections of 10 November 2018 found. obecimel.sk has no 2018 elections page (live or archived); the Internet Archive's CDX of obecimel.sk lists no okrsky file or election page of 2018, and its only 2018 capture of the notice board (2018-04-04) predates the okrsky decision. These are the okrsky of the vote of 2022-10-29 (2022), the nearest in time with okrsky of its own that fit: 2 okrsky. The voters on the roll per okrsok are not known for both votes, so whether the layout changed is not known either."

