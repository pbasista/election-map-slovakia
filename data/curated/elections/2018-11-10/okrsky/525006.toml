obec = "525006"
name = "Pečovská Nová Ves"
okrsky_fill = "nearest"
okrsky_note = "The okrsky are split by the main road I/68 (ulica Hlavná): right side heading Sabinov→Lipany (north-east) okrsok 1, left side okrsok 2. Streets placed by their OpenStreetMap position relative to Hlavná (all inferred). Left to fill_nearest (nearest address): Hlavná and the addresses without a street. The document states no decision date; it is known from the Internet Archive's capture of the old WordPress site."
okrsky_adopted = 2019-03-16
okrsky_adopted_basis = "No document of 2018-11-10 setting the okrsky was found (okrsok-rules-829): The live site keeps election documents only from 2024 on. The archived elections page of the old site (captures 2018-09-04, 2018-11-19) lists for the municipal elections of 2018 only information for voters, the proclamation, population count, the number of councillors, the MVK recorder, e-mail address, candidate lists and results; the only okrsky document it links is the 2017 one (in the section for the regional elections 2017). The Internet Archive's CDX lists no 2018 okrsky document. These are the okrsky of the vote of 2019-03-16 (2019-prezident), the nearest in time with okrsky of its own that fit: 2 okrsky. The voters on the roll per okrsok are not known for both votes, so whether the layout changed is not known either."
okrsky_date_approximate = "named"
okrsky_date_basis = "The document names the presidential election of 16 March 2019 (second round 30 March 2019); it is undated."

