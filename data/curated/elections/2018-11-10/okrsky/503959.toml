#     okrsok 1: Do volebného okrsku č. 1 patria domy od s. č 1 po s. č. 590 a občania s trvalým pobytom „Obec Pata“ (bez adresy)
#     okrsok 2: Do volebného okrsku č. 2 patria domy od s. č. 591 po s. č. 1242
obec = "503959"
name = "Pata"
okrsky_date = 2022-08-04
okrsky_note = "The okrsky are split by súpisné číslo: 1–590 and 591–1242 (the rule for okrsok 2 is open-ended). Okrsok 1 also holds the voters registered only to 'Obec Pata' (bez adresy), who have no address in the register."
okrsky_adopted = 2022-10-29
okrsky_adopted_basis = "No document of 2018-11-10 setting the okrsky was found (okrsok-rules-713): No okrsky notice for this vote: the live election pages (2024 presidential and EP) and every archived elections page of obecpata.sk (2018–2024, captured before the votes) carry only the announcement and voter information, no 'oznámenie o vytvorení volebných okrskov'; the site publishes the okrsky (by súpisné číslo) only on the 2022 and 2026 pages. Another vote's notice is not this vote's. These are the okrsky of the vote of 2022-10-29 (2022), the nearest in time with okrsky of its own that fit: 2 okrsky. The voters on the roll per okrsok are not known for both votes, so whether the layout changed is not known either."

