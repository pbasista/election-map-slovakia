obec = "523241"
name = "Zalužice"
okrsky_note = "Two okrsky and two parts, each polling station in another part: each okrsok is given the part of its station (inferred)."
okrsky_adopted = 2019-03-16
okrsky_adopted_basis = "No document of 2018-11-10 setting the okrsky was found (okrsok-rules-951): No okrsky document or notice naming the okrsky of the municipal elections 2018 was found on the website or in the Internet Archive (the archived 2018 and EP 2019 notices are post-election reports). Only the 2019 presidential notice names the two polling stations. These are the okrsky of the vote of 2019-03-16 (2019-prezident), the nearest in time with okrsky of its own that fit: 2 okrsky. The voters on the roll per okrsok are not known for both votes, so whether the layout changed is not known either."
okrsky_date_approximate = "named"
okrsky_date_basis = "The notice names the presidential election of 16 and 30 March 2019; it states no decision date (the Internet Archive captured it only on 2019-07-20)."

