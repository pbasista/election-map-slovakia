okrsky_adopted_basis = "No document of 2018-11-10 setting the okrsky was found (okrsok-rules-955): The archived 2018 municipal elections post (2018-08-30) links only candidacy information, voting-rights information and the delegation e-mail address; no okrsky document of 2018 is archived or live. These are the okrsky of the vote of 2022-10-29 (2022), the nearest in time with okrsky of its own that fit: 3 okrsky. The voters on the roll per okrsok are not known for both votes, so whether the layout changed is not known either."
