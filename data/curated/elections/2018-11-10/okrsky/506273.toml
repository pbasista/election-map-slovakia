name = "Motešice"
okrsky_note = "No document of the elections found (the 2022 elections page, archived 2023-02-02, has only the obvod/poslanci notice, the MVK clerk and the candidates); the referendum's document. It names one part per okrsok (with the polling station there), matching the Statistical Office's 3 okrsky and their voters (475/134/51)."
