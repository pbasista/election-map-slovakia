obec = "502413"
name = "Kalná nad Hronom"
okrsky_date = 2022-07-28
okrsky_fill = "nearest"
okrsky_note = "Okrsky set 28.07.2022 (both polling stations at Nitrianska 6). The register's addresses without a street (in the part Kalná and Kalnica, numbered by súpisné číslo) and Nádražná (not in the document) are placed by fill_nearest. The referendum 2023 document has a single okrsok and was not used. The part Mochovce is put in okrsok 2 by inference (see its rule)."
okrsky_adopted = 2022-10-29
okrsky_adopted_basis = "No document of 2018-11-10 setting the okrsky was found (okrsok-rules-786): The archived 2018 elections page of kalna.eu (captures 2018-09-22 and 2018-11-23) lists no okrsky document with streets. Its only okrsky source, the council's Uznesenie č. 8/VIII./2018/OZ of 28.06.2018, sets one obvod and 'dve volebné okrsky č. 1 a č. 2' with one polling station (Nitrianska 6) but does not say which streets vote in which okrsok; the other files (voter information, population count, forms, candidate lists) say nothing on okrsky. The later documents (2022, 2023–2024) split the streets differently from each other (Školská and Viničná move from okrsok 2 to 1), so the 2018 split cannot be inferred. Live site has no 2018 pages. These are the okrsky of the vote of 2022-10-29 (2022), the nearest in time with okrsky of its own that fit: 2 okrsky. The voters on the roll per okrsok are not known for both votes, so whether the layout changed is not known either."

