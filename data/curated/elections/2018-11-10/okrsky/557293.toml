# The okrsky of Vlkanová of the vote of 2024-06-08, data/curated/elections/2024-06-08/okrsky/557293.toml, standing in, by `ems job reuse`. Its header there:
#   Okrsky of Vlkanová, transcribed by an AI agent in job okrsok-rules-5151 from the documents below;
#   checked by `ems job ingest` against the address register. The document's
#   text per okrsok, verbatim:
#     okrsok 1: Okrsok č.1 zahŕňa územie ulíc Ľaliová a Továrenská
#     okrsok 2: Okrsok č. 2 zahŕňa územie ulíc Matuškova, Peťovská, Vlkanovská a obec Vlkanová
obec = "557293"
name = "Vlkanová"
okrsky_date = 2024-03-05
okrsky_note = "'a obec Vlkanová' in okrsok 2 (addresses without a street) is written as a part rule; okrsok 1's street rules are more specific and win. Same okrsky as the 2026 document."
okrsky_adopted = 2024-06-08
okrsky_adopted_basis = "No document of 2018-11-10 setting the okrsky was found (okrsok-rules-934): The 2018 'Určenie volebného okrsku, volebnej miestnosti a zapisovateľa' (10.09.2018, archived) names okrsky 1 and 2 with the same polling room (Spoločenská sála Obecného úradu) and no streets; the municipality has one part, so no rules can be derived. These are the okrsky of the vote of 2024-06-08 (2024-ep), the nearest in time with okrsky of its own that fit: 2 okrsky. The voters on the roll per okrsok are not known for both votes, so whether the layout changed is not known either."

