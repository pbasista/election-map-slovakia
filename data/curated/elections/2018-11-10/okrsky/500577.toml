obec = "500577"
name = "Mojmírovce"
okrsky_note = "The obec's notice on the time and place of the 2017 regional elections lists the streets of each of the 3 okrsky (all at Základná škola, Školská ulica 897/8). 'Občania prihlásení na Obec' (residents registered only to the municipality) vote in okrsok 2."
okrsky_adopted = 2017-11-04
okrsky_adopted_basis = "No document of 2018-11-10 setting the okrsky was found (okrsok-rules-729): The notice board as archived on 2018-10-19 lists 'Utvorenie volebných okrskov a určenie volebných miestností' (zverejnené 10.9.2018) with the PDF download_file_f.php?id=1015796 and a detail page, but the Internet Archive never captured either, and the old website (WEBY GROUP CMS) has been replaced (mojmirovce.sk now runs a new CMS without the old files). No other 2018 document lists the okrsky. These are the okrsky of the vote of 2017-11-04 (2017), the nearest in time with okrsky of its own that fit: 3 okrsky. The voters on the roll per okrsok are not known for both votes, so whether the layout changed is not known either."
okrsky_date_approximate = "archived"
okrsky_date_seen = 2017-10-11
okrsky_date_basis = "the Internet Archive captured the municipality's 'Voľby 2017' page with the okrsky on 2017-10-11 (the page says the notice was published 27.9.2017); the notice names the elections of 4 November 2017 but states no decision date (https://web.archive.org/web/20171011224840/http://www.mojmirovce.sk/volby-2017.html)"

