# The okrsky of Veľké Uherce of the vote of 2022-10-29, data/curated/elections/2022-10-29/okrsky/505722.toml, standing in, by `ems job reuse`. Its header there:
#   Okrsky of Veľké Uherce, transcribed by an AI agent in job okrsok-rules-842 from the documents below;
#   checked by `ems job ingest` against the address register. The document's
#   text per okrsok, verbatim:
#     okrsok 1: súpisné čísla 4 - 299
#     okrsok 2: súpisné čísla 300 -1130
obec = "505722"
name = "Veľké Uherce"
okrsky_date = 2022-08-08
okrsky_fill = "nearest"
okrsky_note = "The document is undated; date is its publication date on the obec's 2022 elections page (\"Zverejnené 8.8.2022\"). Okrsky split by súpisné čísla: 1: 4–299, 2: 300–1130; any address outside these ranges takes the nearest okrsok (fill_nearest)."
okrsky_adopted = 2022-10-29
okrsky_adopted_basis = "No document of 2018-11-10 setting the okrsky was found (okrsok-rules-775): The 2018 document \"Vytvorenie volebných okrskov a určenie volebných miestností\" (7.9.2018) names only the two polling stations (both in the obecný úrad, Veľké Uherce 360), not which houses vote in each okrsok; the municipality has a single part, so the okrsky cannot be inferred from the stations. These are the okrsky of the vote of 2022-10-29 (2022), the nearest in time with okrsky of its own that fit: 2 okrsky. The voters on the roll per okrsok are not known for both votes, so whether the layout changed is not known either."

