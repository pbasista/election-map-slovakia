obec = "518662"
name = "Očová"
okrsky_date = 2022-11-11
okrsky_note = "No usable document of the elections found: the 2022 elections page (komunalne-volby-2022.html, 5.8.2022) gives only the three polling stations; the referendum's document (on the referendum 2023 page, published 11.11.2022, updated 6.12.2022) lists the streets. Okrsok 3 (Holcov Majer, Obchoditá) fits its 124 voters. Okrsok 1 includes 'Kalinovce, Bugárovo, Trnavy, Breziny' (settlements, not streets in the register) and 'bez označenia ulíc' (houses without street): the register's addresses without a street are given to okrsok 1 by its rest rule, as the document places these unnamed-street settlements there."
okrsky_adopted = 2022-10-29
okrsky_adopted_basis = "No document of 2018-11-10 setting the okrsky was found (okrsok-rules-622): No document assigning streets to okrsky for this vote: ocova.sk's elections pages (Voľby a referendum: 2018, EP 2019, NRSR 2020, NRSR 2023, local 2025, referendum 2026) and the Internet Archive's captures (2019 elections pages and files) hold only general voter information, e-mail addresses, results and, for 2025 and the referendum 2026, decisions naming the three polling stations without streets; there is no page for the 2017 regional, 2019 presidential or 2024 EP elections. These are the okrsky of the vote of 2022-10-29 (2022), the nearest in time with okrsky of its own that fit: 3 okrsky. The voters on the roll per okrsok are not known for both votes, so whether the layout changed is not known either."

