# The okrsky of Východná of the vote of 2022-10-29, data/curated/elections/2022-10-29/okrsky/511170.toml, standing in, by `ems job reuse`. Its header there:
#   Okrsky of Východná, transcribed by an AI agent in job okrsok-rules-857 from the documents below;
#   checked by `ems job ingest` against the address register. The document's
#   text per okrsok, verbatim:
#     okrsok 1: od čísla domu 1 po číslo domu 433
#     okrsok 2: od čísla domu 434 po číslo domu 1900 - Svarín a Čierny Váh
obec = "511170"
name = "Východná"
okrsky_date = 2022-11-10
okrsky_note = "No document of the elections giving the okrsky found: the elections notice of 2022 (Volebné okrsky.pdf, vyvesené 14. 7. 2022) only says there are two okrsky (malá and veľká zasadačka obecného úradu) without their extent; this is the referendum's document. It is undated; date is its posting on the notice board (vyvesené 10. 11. 2022). House numbers (súpisné, no streets in the register): okrsok 1 houses 1-433, okrsok 2 houses 434-1900 and the settlements Svarín and Čierny Váh (not parts in the register, numbered within Východná), given as the rest."
okrsky_adopted = 2022-10-29
okrsky_adopted_basis = "No document of 2018-11-10 setting the okrsky was found (okrsok-rules-788): The notice board (live since 2017) and its full-text search show okrsky notices only for the referendum of 2023 and the presidential and EP elections of 2024 (okrsok 1 houses 1–433, okrsok 2 houses 434 and up with Svarín and Čierny Váh); for this vote only the okrsky commissions' minutes or nothing are published. These are the okrsky of the vote of 2022-10-29 (2022), the nearest in time with okrsky of its own that fit: 2 okrsky. Voters on the roll per okrsok (ŠÚ SR), 2018-11-10 → 2022-10-29: 1: 874 → 858, 2: 940 → 941."

