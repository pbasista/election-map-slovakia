okrsky_adopted_basis = "No document of 2018-11-10 setting the okrsky was found (okrsok-rules-676): The current website has pages only for the 2026 votes. The 2017 okrsky PDF (Volebneokrskyavolebnemiestnostizv.28.8.2017.pdf) linked from the archived 2017 elections page is gone live (404) and not in the Internet Archive; the archived 2019 'okrsky podľa ulíc' pages keep no text or attachment (the EP 2019 file download_file_f.php?id=1088171 is 404 live and not archived); no okrsky document for 2018, 2020, 2023 or 2024 was found live or archived. The Internet Archive was intermittently unreachable (retried). These are the okrsky of the vote of 2026-07-04 (2026-referendum), the nearest in time with okrsky of its own that fit: 3 okrsky. The voters on the roll per okrsok are not known for both votes, so whether the layout changed is not known either."

