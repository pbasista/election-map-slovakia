okrsky_adopted = 2023-09-30
okrsky_adopted_basis = "No document of 2018-11-10 setting the okrsky was found (okrsok-rules-853): No okrsky document of the municipal elections of 10 November 2018 is available. The current website (radosovce.sk, rebuilt 2023) keeps only documents from 2023 on; the old site's static mirror radosovce.obecnyarchiv.sk has no 2018 election page (its 'volby-2022' page was reused for the 2023 referendum). The old site's elections page of 2018 (www.radosovce.sk/obec/volby/, linked from the homepage captured 2018-08-11 and 2018-09-04) was never captured by the Internet Archive, and no 2018 election PDF is in its CDX index. Later documents (2023–2026) give 2 okrsky: Radošovce súp. č. 1–316; Vieska súp. č. 1–202 and Radošovce súp. č. 317–475. These are the okrsky of the vote of 2023-09-30 (2023-nrsr), the nearest in time with okrsky of its own that fit: 2 okrsky. The voters on the roll per okrsok are not known for both votes, so whether the layout changed is not known either."
okrsky_date_approximate = "posted"
