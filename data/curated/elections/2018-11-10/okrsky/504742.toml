okrsky_date_basis = "The municipality's document page https://radosovce.sk/dokument/utvorenie-volebnych-okrskov/ states 'Zverejnené 28. júna 2023', before the vote; the document itself names the National Council election of 30 September 2023 but states no decision date. (https://radosovce.sk/dokument/utvorenie-volebnych-okrskov/)"

