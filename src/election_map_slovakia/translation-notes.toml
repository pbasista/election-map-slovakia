# The note of the two kinds of controversy (the entry below), then what this
# string is: keep the two alike.
[[note]]
keys = ["research.affairs_summary"]
text = """\
  research findings come in two kinds of controversy: serious ones ('affairs': \
  charges, court decisions against the candidate, matters an authority \
  established), marked in red, and 'allegations and disputes' (unproven or \
  denied claims, cases that ended in the candidate's favour, lesser matters), \
  marked in amber; keep the two names the same wherever they appear; name the \
  first with the plain word for controversies (Slovak: 'Závažné \
  kontroverzie'), not one that suggests a case on its way to court (as Slovak \
  and Czech 'kauza'), as not all of them are; and never name the second with \
  the word for criminal charges (as Slovak 'obvinenie'), which belong to the \
  first (Slovak: 'Podozrenia a spory'). This one is the one-line summary, in \
  red at the top of the candidate card, of the notice research.affairs_alert, \
  which unfolds under it; cut short where the line is too narrow, so short"""

# The two kinds of controversy research reports, named alike in every string
# that mentions them.
[[note]]
keys = [
  "research.kind.",
  "research.affairs_",
  "research.disputes_",
  "filter.affairs",
  "filter.disputes",
]
text = """\
  research findings come in two kinds of controversy: serious ones ('affairs': \
  charges, court decisions against the candidate, matters an authority \
  established), marked in red, and 'allegations and disputes' (unproven or \
  denied claims, cases that ended in the candidate's favour, lesser matters), \
  marked in amber; keep the two names the same wherever they appear; name the \
  first with the plain word for controversies (Slovak: 'Závažné \
  kontroverzie'), not one that suggests a case on its way to court (as Slovak \
  and Czech 'kauza'), as not all of them are; and never name the second with \
  the word for criminal charges (as Slovak 'obvinenie'), which belong to the \
  first (Slovak: 'Podozrenia a spory')"""

