# What the translation jobs tell of the UI strings (web/i18n/en.json) besides
# their text, read by translate.ui_item alone: the `note` of a string's item
# (where it appears, what its placeholders are) and, for a string in a tight
# place, its `max_length`, which ingest holds the translation to. Kept out of
# the Python source because the keys of the published parts count that source
# (lock.py): no part shows them, so a new or reworded one deploys nothing.
#
# A UI string's note is the `text` of the first entry, in the order of this
# file, one of whose `keys` is the string's key or, ending in "." or "_", a
# prefix of it; its maximum length that of the first such key of
# [max_length] (never below the English text's own length).

[max_length]
"map.obvod" = 12
"card.back" = 16
"panel.close" = 16
"candidate.age" = 16
"nav.language" = 20
"theme.light" = 20
"theme.dark" = 20
